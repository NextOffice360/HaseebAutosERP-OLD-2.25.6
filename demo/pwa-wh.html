  function scanWithExternal(onResult){
    try{
      var live = (state.data && state.data.config && state.data.config.scannerLiveUrl) || '';
      if(live){
        var ret = location.href.split('?')[0].split('#')[0];
        var nonce = Math.random().toString(36).slice(2,9);
        var url = live + (live.indexOf('?')>-1 ? '&' : '?') + 'ret=' + encodeURIComponent(ret) + '&n=' + nonce + '&t=' + Date.now();
        var w = window.open(url, '_blank');
        if(w){
          var handler = function(ev){
            try{
              if(!ev || !ev.data || ev.data.type!=='HASEEB_QR_RESULT' || ev.data.nonce!==nonce) return;
              window.removeEventListener('message', handler);
              var code = String(ev.data.code||ev.data.text||'').trim();
              if(code){ haptic(true); onResult(code); }
            }catch(e){}
          };
          window.addEventListener('message', handler);
          setTimeout(function(){ window.removeEventListener('message', handler); }, 120000);
          return true;
        }
      }
    }catch(e){}
    return false;
  }

  // Bulk picker — DEDICATED Bulk Add Modal (conflict-free, per spec)
  // Opens a modal with its own scan field + search + checkbox list + bulk collection.
  // Scan NEVER touches the search input or the product dropdown; field auto-clears after every scan.
  /* ═══════════════════════════════════════════════════════════════════════
     PWA.attachScan(input, cfg) — v2.24.3 — HARDWARE scanner support (HID wedge).
     ---------------------------------------------------------------------------
     Masla: PWA screens (Field order, Warehouse, Salesman stock) camera se scan
     kar leti thin, magar asli HANDHELD SCANNER (keyboard wedge) sirf text type
     kar deta tha — Enter par kuch nahi hota tha. Main app (UI2.attachScan) ise
     handle karta hai; ab PWA bhi wahi behaviour deta hai:

       Enter  → exact item hit → cfg.onHit(item) + field CLEAR + refocus
                            → multi hit  → cfg.onMulti?/toast, field rehta hai (chunne ke liye)
                            → miss       → warn toast + field CLEAR (agla scan ready)
       input  → scan-shaped payload 280ms mein settle → wahi upar wala flow
       (poora payload = 8+ digits ya CODE-1234 jaisa)

     cfg: { find(code) → array, onHit(item), onMulti(list), label }
     ═══════════════════════════════════════════════════════════════════════ */
  function attachScan(input, cfg){
    cfg = cfg || {};
    var SCANSHAPE = /^(\d{8,14}|[A-Za-z]{1,4}[-.]?\d{3,})$/;
    var deb = null;
    function act(code){
      var clean = String(code || '').trim();
      if(!clean) return false;
      var list = (cfg.find ? cfg.find(clean) : []) || [];
      if(list.length === 1){
        if(cfg.onHit) cfg.onHit(list[0], clean);
        return true;
      }
      if(list.length > 1){
        if(cfg.onMulti) cfg.onMulti(list, clean);
        else PWA.toast(list.length + ' matches — list se chunein', 'warn');
        try { input.focus(); } catch(e){}
        return false;
      }
      PWA.toast((cfg.label || 'Code') + ' not found: ' + clean, 'warn');
      input.value = ''; try { input.focus(); } catch(e){}
      return false;
    }
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        var v = String(input.value || '').trim();
        if(!v) return;
        e.preventDefault(); clearTimeout(deb);
        act(v);
      }
    });
    input.addEventListener('input', function(){
      clearTimeout(deb);
      var v = String(input.value || '').trim();
      /* HID wedge: poora code-shaped payload settle hone par (Enter ke baghair bhi) */
      if(SCANSHAPE.test(v)){
        deb = setTimeout(function(){ if(String(input.value || '').trim() === v) act(v); }, 280);
      }
    });
    input.dataset.scanAware = '1';
    return input;
  }

          el('small',{text: (it.code||'') + (it.barcode? ' · '+it.barcode : '') + ' · stock ' + (it.stock!==undefined?it.stock:'?')})
        ]));
        row.appendChild(el('span',{class:'badge '+(on?'ok':''), text: on ? '✓ ×'+picked[String(it.id)].qty : (money(it.retail||it.price||0))}));
        list.appendChild(row);
      });
    }
    addBtn.addEventListener('click', function(){
      var keys = Object.keys(picked);
      if(!keys.length){ toast('Koi item select nahi — scan ya tick karein','warn'); return; }
      var vals = keys.map(function(k){ return { item: picked[k].item, qty: Math.max(1, Number(picked[k].qty)||1) }; });
      close(); haptic(true);
      if(typeof onAdd==='function') onAdd(vals);
    });
    sIn.addEventListener('input', render);
    sIn.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault();   // Enter in SEARCH must never hijack scanning; just keep list
        var first = list.querySelector('.bulk-item'); if(first) first.click();
      }
    });
    render(); updateHead(); renderSel();
    setTimeout(function(){ try{ scanIn.focus(); }catch(e){} }, 80);
  }
  // ===== CUSTOMER PICKER — shared autocomplete (fixes datalist re-click bug) =====
  function createCustomerField(opts){
    opts = opts || {};
    var customers = opts.customers || [];
    var placeholder = opts.placeholder || 'Customer naam';
    var initial = opts.value || '';
    var onSelect = opts.onSelect || function(){};
    var labelTxt = opts.label || 'Customer';
    var wrap = el('div', {class:'f cust-field'});
    var label = el('label', {text: labelTxt});
    var inputWrap = el('div', {class:'cust-input-wrap'});
    var input = el('input', {type:'text', placeholder: placeholder, value: initial, autocomplete:'off', 'aria-label': labelTxt, 'aria-autocomplete':'list', 'aria-expanded':'false'});
    var clearBtn = el('button', {class:'cust-clear', type:'button', title:'Clear', 'aria-label':'Clear customer'}, '✕');
    inputWrap.appendChild(input);
    inputWrap.appendChild(clearBtn);
    var dd = el('div', {class:'cust-dropdown', role:'listbox'});
    var hint = el('div', {class:'cust-hint muted', id: (opts.hintId||'')});
    if(opts.hintText) hint.textContent = opts.hintText;
    wrap.appendChild(label);
    wrap.appendChild(inputWrap);
    wrap.appendChild(dd);
    if(hint) wrap.appendChild(hint);
    var selectedId = opts.selectedId || '';
    var isOpen = false;
    var closeTimer = null;
    function setSelected(customer){
      if(customer){
        selectedId = customer.id;
        input.value = customer.name;
        input.setAttribute('aria-expanded','false');
      } else {
        selectedId = '';
      }
      onSelect(customer, input.value.trim());
    }
    function filterList(q){
      q = String(q||'').trim().toLowerCase();
      var list = customers;
      if(q){
        list = customers.filter(function(c){ return c.name.toLowerCase().indexOf(q)>-1 || String(c.phone||'').indexOf(q)>-1; });
      }
      return list.slice(0, 20);
    }
    function renderDropdown(){
      var q = String(input.value||'').trim().toLowerCase();
      var list = filterList(input.value);
      dd.innerHTML = '';
      if(!list.length){
        // no match — offer to create new
        if(q){
          var addRow = el('div', {class:'cust-add-row', text: '＋ Naya customer: \"' + input.value.trim() + '\"'});
          addRow.onclick = function(){ setSelected(null); closeDd(); };
          dd.appendChild(addRow);
        } else {
          dd.appendChild(el('div', {class:'empty', style:'padding:12px', text:'Koi customer nahi'}));
        }
      } else {
        list.forEach(function(c){
          var isSel = c.id===selectedId;
          var bal = Number(c.bal||0);
          var row = el('div', {class:'cust-opt'+(isSel?' on':''), role:'option', 'aria-selected': isSel?'true':'false'});
          row.appendChild(el('div', {class:'ico', text:'👤'}));
          var tx = el('div', {class:'tx'});
          tx.appendChild(el('b', {text: c.name}));
          tx.appendChild(el('small', {text: (c.phone? c.phone+' · ':'') + (bal? 'Due '+money(bal):'No dues') + (c.priceTier? ' · '+c.priceTier:'' )}));
          row.appendChild(tx);
          row.appendChild(el('span', {class:'badge '+(bal>0?'warn':''), text: c.priceTier||'RETAIL'}));
          row.addEventListener('click', function(e){ e.stopPropagation(); setSelected(c); closeDd(); input.focus(); });
          // touch feedback
          row.addEventListener('mousedown', function(e){ e.preventDefault(); });
          dd.appendChild(row);
        });
        if(q && !list.some(function(c){ return c.name.toLowerCase()===q; })){
          var addRow2 = el('div', {class:'cust-add-row', text: '＋ Naya: \"' + input.value.trim() + '\" ke naam se'});
          addRow2.onclick = function(){ setSelected(null); closeDd(); };
          dd.appendChild(addRow2);
        }
      }
    }
    function openDd(){
      if(isOpen) return;
      isOpen = true;
      renderDropdown();
      dd.classList.add('show');
      input.setAttribute('aria-expanded','true');
      // FIX: dropdown clipped by .card{overflow:hidden} — use fixed positioning aligned to input
      try{
        var rect = inputWrap.getBoundingClientRect();
        if(rect && rect.width){
          dd.classList.add('as-fixed');
          dd.style.top = (rect.bottom + 6) + 'px';
          dd.style.left = rect.left + 'px';
          dd.style.width = rect.width + 'px';
          // keep within viewport vertically
          var vh = window.innerHeight || 600;
          var maxH = Math.min(260, vh - rect.bottom - 20);
          if(maxH < 120) maxH = 120;
          dd.style.maxHeight = maxH + 'px';
        }
      }catch(e){}
    }
    function closeDd(){
      isOpen = false;
      dd.classList.remove('show');
      dd.classList.remove('as-fixed');
      dd.style.top=''; dd.style.left=''; dd.style.width=''; dd.style.maxHeight='';
      input.setAttribute('aria-expanded','false');
    }
    function refreshHint(){
      // caller updates hint via onSelect, nothing to do here
    }
    // events
    input.addEventListener('focus', function(){ openDd(); renderDropdown(); });
    input.addEventListener('click', function(){ openDd(); renderDropdown(); });
    input.addEventListener('input', function(){
      selectedId = '';
      // find exact match
      var exact = customers.filter(function(c){ return c.name.toLowerCase()===String(input.value).trim().toLowerCase(); })[0];
      if(exact) selectedId = exact.id;
      onSelect(exact||null, input.value.trim());
      openDd();
      renderDropdown();
    });
    input.addEventListener('keydown', function(e){
      if(e.key==='Escape'){ closeDd(); input.blur(); }
      if(e.key==='Enter'){ // keep dropdown open but allow selection via first match
        // if dropdown shows one exact, select it
      }
    });
    clearBtn.addEventListener('click', function(e){
      e.stopPropagation();
      input.value = '';
      selectedId='';
      onSelect(null, '');
      renderDropdown();
      openDd();
      input.focus();
      haptic(true);
    });
    // click outside to close
    document.addEventListener('click', function(e){
      if(!wrap.contains(e.target)) closeDd();
    });
    window.addEventListener('resize', function(){ if(isOpen) openDd(); });
    window.addEventListener('scroll', function(){ if(isOpen) openDd(); }, true);
    // allow external updates
    function setCustomers(newList){
      customers = newList || [];
      renderDropdown();
    }
    function setValue(name, id){
      input.value = name||'';
      selectedId = id||'';
      renderDropdown();
    }
    function getValue(){ return { name: input.value.trim(), id: selectedId, input: input }; }
    // initial render if value preset
    if(initial){
      var m = customers.filter(function(c){ return c.name.toLowerCase()===String(initial).trim().toLowerCase(); })[0];
      if(m) selectedId = m.id;
    }
    renderDropdown();
    return { wrap: wrap, field: wrap, input: input, dropdown: dd, hint: hint, clearBtn: clearBtn, setCustomers: setCustomers, setValue: setValue, getValue: getValue, open: openDd, close: closeDd };
  }
  function attachCustomerAutocomplete(input, customers, onPick){
    // legacy helper — wraps existing input
    var cf = createCustomerField({ customers: customers, value: input.value, placeholder: input.placeholder, label: '', onSelect: onPick });
    // replace input in DOM with new field's input
    try{ input.parentNode.replaceChild(cf.wrap, input); }catch(e){}
    return cf;
  }

  /* v2.28.0 (W5 · spec §9) — field-level visibility PWA mein bhi (desktop App.field ka mirror).
     Permissions bootstrap (S.perms) se aati hain; data asal mein backend se strip hota hai. */
  var FIELD_PERMS = { cost:'field.cost.view', margin:'field.margin.view', contact:'field.contact.view',
    finance:'field.finance.view', supplier:'field.supplier.view', notes:'field.notes.view' };
  function permsList() {
    /* bootstrap ki permissions (state.data.perms) — screens ka apna S alag hota hai */
    try { return (state && state.data && state.data.perms) || []; } catch (e) { return []; }
  }
  function can(perm) {
    var p = permsList();
    if (p.indexOf('*') > -1) return true;
    if (p.indexOf(perm) > -1) return true;
    var parts = String(perm || '').split('.');
    for (var i = parts.length - 1; i > 0; i--) {
      if (p.indexOf(parts.slice(0, i).join('.') + '.*') > -1) return true;
    }
    return false;
  }
  function field(family) {
    var k = FIELD_PERMS[family];
    if (!k) return true;
    if (!state || !state.data) return true;   /* boot se pehle koi flash na ho */
    return can(k);
  }

  /* v2.28.0 (W5) — shared DOM pass: har screen ke [data-family] nodes par lagta hai.
     Screens sirf attribute lagate hain; faisla ek jagah (PWA.field) hota hai. */
  function applyFields(root) {
    var host = root || document, changed = 0;
    var nodes = host.querySelectorAll ? host.querySelectorAll('[data-family]') : [];
    for (var i = 0; i < nodes.length; i++) {
      var el0 = nodes[i], fam = el0.getAttribute && el0.getAttribute('data-family');
      if (fam && !field(fam)) { el0.hidden = true; el0.setAttribute('aria-hidden', 'true'); changed++; }
    }
    return changed;
  }

  return {
    can: can, field: field, applyFields: applyFields,
    boot: boot, call: call, api: call, toast: toast, el: el, $: $, money: money, haptic:haptic, confirm: confirm,
    fmtDT: fmtDT,
    run: run, runStats: runStats, get _features() { return _features; },
    fail: fail, errBox: errBox, errKind: errKind, errText: errText, errStats: errStats,
    layerVisible: layerVisible, layerReport: layerReport, sweepStale: sweepStale,
    shared: shared, sharedInvalidate: sharedInvalidate, sharedStats: sharedStats, invalidateFor: invalidateFor,
    attachScan: attachScan, sync: sync, logout: logout, updateNet: updateNet, install:install, shareApp:shareApp, requestNotif:requestNotif, toggleTheme:toggleTheme, scanWithCamera:scanWithCamera, openBulkPicker:openBulkPicker, createCustomerField:createCustomerField, attachCustomerAutocomplete:attachCustomerAutocomplete,
    get state() { return state; },
    get data() { return state.data; },
    get cart() { return state.cart; },
    set cart(v) { state.cart = v; },
    queuedCount: queuedCount, reload: function () { load(state.tabs || [], state.renderTab); }
  };
})();

function HA_applyExtraMeta(obj) {
  try {
    if (!obj || !document || !document.head) return;
    Object.keys(obj).forEach(function (k) {
      if (!k || obj[k] === null || obj[k] === undefined) return;
      var m = document.querySelector('meta[name=\"' + k + '\"]');
      if (!m) {
        m = document.createElement('meta');
        m.setAttribute('name', k);
        document.head.appendChild(m);
      }
      m.setAttribute('content', String(obj[k]));
    });
  } catch (e) { }
}

  <style>

                  total: (p.items || []).reduce(function (a, l) { return a + l.qty * l.price; }, 0) });
    },

    'pwa.sm.collect': function (p) { return ok({ ok: true, result: { voucherNo: 'RV-0' + (++SEQ), amount: p.amount } }); },
    'pwa.pos.sell': function (p) { return ok({ ok: true, id: 'SAL-POS-' + (++SEQ), invoiceNo: 'POS-0' + (++SEQ), total: (p.items||[]).reduce(function(a,l){return a+l.qty*l.price;},0) }); },
    /* v2.27.0 — asli backend ke routes (Code.gs: parties.balance / parties.customerHistory)
       demo mein bhi mojood, warna PWA ki balance/history lines chup chaap gayab rehti thin. */
    'parties.balance': function (p) {
      var id = (p && (p.id || p.partyId)) || '';

    },
    'parties.customerHistory': function (p) {

  function api(req) {
    window.__API_CALLS__ = (window.__API_CALLS__ || 0) + 1;
    window.__LAST_REQ__ = req;
    var h = HANDLERS[req.action];
    if (!h) return fail('Demo mein ye action nahi hai: ' + req.action);
    try { return h(req.payload || {}); } catch (e) { return fail(e.message); }
  }

  /* PWA.call() google.script.run dhoondhta hai — wahi faraham karte hain */
  window.google = window.google || {};
  window.google.script = window.google.script || {};
  /* handlers closure mein — `this` par depend nahi (apply/call se bhi chalega) */
  var _ok = null, _err = null;
  var runner = {
    withSuccessHandler: function (fn) { _ok = fn; return runner; },
    withFailureHandler: function (fn) { _err = fn; return runner; },
    api: function (req) {
      setTimeout(function () {
        var r = api(req);
        if (r.ok && _ok) _ok(r);
        else if (!r.ok && _err) _err(new Error(r.error.message));
      }, 120);
    }
  };
  window.google.script.run = runner;

<body>

<div class="pwa-top">
  <div class="ttl" id="pwaTitle">🏬 Warehouse</div>
  <div class="net" id="pwaNet">● Online</div>
</div>

<div class="pwa-wrap"><div id="pwaBody"></div></div>
<div class="pwa-bar" id="pwaBar"></div>

<script>
/* ==========================================================================
   §10 — WAREHOUSE PWA — v2.22 ENTERPRISE FLOW
   Receive = PO select → auto-load expected → count actual → match & confirm GRN
   Count   = Sheet select → load audit lines → fill counted → variance → save in parts
   Put-away & Transfer = existing polished
   ========================================================================== */
(function () {
  var TABS = [
    { id: 'receive', label: 'Receive', icon: '📥' },
    { id: 'putaway', label: 'Put-away', icon: '📦' },
    { id: 'count', label: 'Count', icon: '🔢' },
    { id: 'transfer', label: 'Transfer', icon: '🔄' }
  ];
  var S = { q: '', cart: [], binId: '', sheetId: '', fromBin: '', toBin: '', supplierId: '', lotNo: '', expiry: '', selectedPoId: '', poCache: {}, countCache: {}, countFilter: '' };

  function items() { return (PWA.data && PWA.data.items) || []; }
  function find(q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return [];
    return items().filter(function (i) {
      return i.name.toLowerCase().indexOf(q) > -1 || i.code.toLowerCase().indexOf(q) > -1 ||
        String(i.barcode || '').toLowerCase() === q || String(i.barcode||'').toLowerCase().indexOf(q)>-1;
    }).slice(0, 40);
  }
  function redraw() { render(PWA.state.tab); }
  function money(v){ return PWA.money(v); }

  /* local storage for count partial audit (resume next day) */
  function countStoreKey(sheetId){ return 'ha_wh_count_'+sheetId; }
  function getLocalCounts(sheetId){
    try{ var v = localStorage.getItem(countStoreKey(sheetId)); return v? JSON.parse(v): {}; }catch(e){ return {}; }
  }
  function setLocalCount(sheetId, itemId, qty){
    try{
      var m = getLocalCounts(sheetId);
      if(qty===''||qty===null||qty===undefined) delete m[itemId]; else m[itemId]=Number(qty);
      localStorage.setItem(countStoreKey(sheetId), JSON.stringify(m));
    }catch(e){}
  }
  function clearLocalCounts(sheetId){ try{ localStorage.removeItem(countStoreKey(sheetId)); }catch(e){} }

  /* ----------------------------- shared pieces ---------------------------- */
  function scannerBox(onPick) {
    var input = PWA.el('input', {
      type: 'search', placeholder: '🔎 Scan karein ya naam / code likhein…',
      'aria-label':'Item search',
      oninput: function () { S.q = input.value; renderHits(onPick); }
    });
    /* v2.24.3 — handheld scanner support (camera path jaisa hi) */
    if(PWA.attachScan) PWA.attachScan(input, {
      label: 'Item',
      find: function(code){ return find(code); },
      onHit: function(it, code){ onPick(it); input.value=''; S.q=''; try{ hits.innerHTML=''; }catch(e){} input.focus(); PWA.toast('📷 ' + it.code + ' — ' + it.name, 'ok'); },
      onMulti: function(list, code){ PWA.toast(list.length + ' matches — list se chunein', 'warn'); }
    });
    var scanBtn = PWA.el('button', { class:'btn sm', type:'button', onclick:function(){
      if(PWA.scanWithCamera) PWA.scanWithCamera(function(code){
        var clean=String(code||'').trim();
        if(!clean) return;
        input.value=clean; S.q=clean; renderHits(onPick);
        var lst=find(clean);
        if(lst.length===1){ onPick(lst[0]); input.value=''; S.q=''; hits.innerHTML=''; input.focus(); }
        else if(lst.length>1){ PWA.toast(lst.length+' matches — list se chunein','warn'); input.focus(); input.select(); }
        else { PWA.toast('Code not found: '+clean,'warn'); input.value=''; S.q=''; hits.innerHTML=''; input.focus(); }
      });
      else {
        var c=prompt('Barcode / code scan karein',''); if(c){ input.value=c; S.q=c; renderHits(onPick); }
      }
    }}, '📷 Scan');
    var bulkBtn = PWA.el('button', { class:'btn sm ghost', type:'button', onclick:function(){
      if(PWA.openBulkPicker) PWA.openBulkPicker({ items: items(), title:'Bulk add — Warehouse', onAdd:function(picks){
        if(PWA.state.tab==='putaway' && !S.binId) return PWA.toast('Pehle bin chunein','warn');
        if(PWA.state.tab==='transfer' && (!S.fromBin||!S.toBin)) return PWA.toast('Pehle dono bins chunein','warn');
        picks.forEach(function(p){
          var ex=S.cart.filter(function(l){return l.itemId===p.item.id;})[0];
          if(ex) ex.qty += p.qty; else S.cart.push({ itemId:p.item.id, code:p.item.code, name:p.item.name, qty:p.qty, cost:p.item.cost, barcode:p.item.barcode });
        }); redraw();
        PWA.toast('✅ '+picks.length+' items added','ok'); PWA.haptic(true);
      }});
    }}, '☑ Bulk');
    var hits = PWA.el('div', { id: 'pwaHits' });
    function renderHits(cb) {
      hits.innerHTML = '';
      var list = find(S.q);
      if (!S.q) return;
      if (!list.length) { hits.appendChild(PWA.el('div', { class: 'empty' }, 'Koi item nahi mila — code ya naam check karein')); return; }
      list.forEach(function (i) {
        hits.appendChild(PWA.el('div', {
          class: 'task', onclick: function () { cb(i); input.value = ''; S.q = ''; hits.innerHTML = ''; }
        }, [
          PWA.el('div', { class: 'ico', text: '📦' }),
          PWA.el('div', { class: 'tx' }, [
            PWA.el('b', { text: i.name }),
            PWA.el('small', { text: i.code + ' · stock ' + i.stock + ' · ' + money(i.cost) + (i.barcode? ' · '+i.barcode:'') })
          ]),
          PWA.el('span', { class:'badge', text: i.stock<=5 ? 'LOW' : '' })
        ]));
      });
    }
    var row = PWA.el('div', { class:'f' }, [
      PWA.el('label',{text:'Item — barcode scan ya search'} ),
      PWA.el('div',{style:'display:flex;gap:8px'}, [ PWA.el('div',{style:'flex:1'}, input), scanBtn, bulkBtn ])
    ]);
    return PWA.el('div', { class: 'card' }, [ row, hits, PWA.el('div',{class:'pull-hint'}, 'Tip: Enter dabayein to pehla item auto-add') ]);
  }

  function cartView(editableCost) {
    var host = PWA.el('div', { class: 'card' });
    host.appendChild(PWA.el('h3', { text: 'GRN Lines (' + S.cart.length + ')' }));
    if (!S.cart.length) { host.appendChild(PWA.el('div', { class: 'empty' }, [PWA.el('span',{class:'big',text:'📭'}), PWA.el('div',{text:'Abhi kuch nahi — PO load karein ya scan karein'}) ])); return host; }
    var totalQty=0, totalVal=0;
    S.cart.forEach(function (l, idx) {
      totalQty+=Number(l.qty||0); totalVal+=Number(l.qty||0)*Number(l.cost||0);
      var poQty = l.poQty!==undefined? ' · PO '+l.poQty : '';
      var pending = l.pendingQty!==undefined? ' · pending '+l.pendingQty : '';
      host.appendChild(PWA.el('div', { class: 'line' }, [
        PWA.el('div', { class: 'nm' }, [
          PWA.el('b', { text: l.name }),
          PWA.el('small', { text: l.code + (editableCost ? ' · cost ' + money(l.cost) : '') + poQty + pending + (l.barcode?' · '+l.barcode:'') })
        ]),
        PWA.el('div', { class: 'qty' }, [
          PWA.el('button', { text: '−', 'aria-label':'Kam karein', onclick: function () { l.qty = Math.max(0, l.qty - 1); if (!l.qty) S.cart.splice(idx, 1); redraw(); } }),
          PWA.el('span', { text: String(l.qty) }),
          PWA.el('button', { text: '＋', 'aria-label':'Zyada karein', onclick: function () { l.qty += 1; redraw(); } }),
          PWA.el('button', { class:'btn sm ghost', text:'✕', onclick:function(){ S.cart.splice(idx,1); redraw(); } })
        ])
      ]));
    });
    host.appendChild(PWA.el('div',{class:'right muted', style:'font-size:12px;margin-top:8px'}, totalQty+' pcs · '+money(totalVal)+(S.selectedPoId? ' · PO match':'') ));
    return host;
  }

  function kpiBar(){
    var tasks = (PWA.data && PWA.data.tasks) || [];
    var bins = (PWA.data && PWA.data.bins) || [];
    var itemsCount = (PWA.data && PWA.data.items) ? PWA.data.items.length : 0;
    var low = items().filter(function(i){ return Number(i.stock)<=5 && Number(i.stock)>0; }).length;
    var out = items().filter(function(i){ return Number(i.stock)<=0; }).length;
    var audit = PWA.data && PWA.data.audit;
    var acc = audit ? (audit.accuracy||0)+'%' : '—';
    var box = PWA.el('div',{class:'kpi-grid'}, [
      PWA.el('div',{class:'kpi'}, [PWA.el('b',{text:String(tasks.filter(function(t){ return t.kind==='RECEIVE'}).length)}), PWA.el('small',{text:'Pending PO'})]),
      PWA.el('div',{class:'kpi'}, [PWA.el('b',{text:String(tasks.filter(function(t){ return t.kind==='COUNT'}).length)}), PWA.el('small',{text:'Open counts'})]),
      PWA.el('div',{class:'kpi'}, [PWA.el('b',{text:String(bins.length)}), PWA.el('small',{text:'Bins'})]),
      PWA.el('div',{class:'kpi'}, [PWA.el('b',{text: audit? acc : (low+out>0 ? low+'/'+out : String(itemsCount))}), PWA.el('small',{text: audit? 'Accuracy' : (low+out>0 ? 'Low / Out' : 'SKUs')})])
    ]);
    return box;
  }

  /* ------------------------------- TABS ---------------------------------- */
  function render(tab) {
    var body = PWA.$('#pwaBody'); body.innerHTML = '';
    PWA.state.tab = tab;
    body.appendChild(kpiBar());
    if (tab === 'receive') return viewReceive(body);
    if (tab === 'putaway') return viewPutaway(body);
    if (tab === 'count') return viewCount(body);
    if (tab === 'transfer') return viewTransfer(body);
  }

  /* ---- 1) RECEIVE (GRN) — PO → auto-load → verify → confirm ---- */
  function viewReceive(body) {
    var tasks = (PWA.data && PWA.data.tasks || []).filter(function (t) { return t.kind === 'RECEIVE'; });
    // PO selector card
    if (tasks.length) {
      var c = PWA.el('div', { class: 'card' });
      c.appendChild(PWA.el('h3', { text: 'PO select karein — auto-load for GRN' }));
      c.appendChild(PWA.el('div',{class:'muted', style:'font-size:11px;margin-bottom:8px'}, 'PO chunein → expected items GRN cart mein auto-load. Phir actual counted qty match karke GRN confirm karein.'));
      tasks.slice(0, 8).forEach(function (t) {
        var isSel = S.selectedPoId===t.refId;
        var row = PWA.el('div', { class: 'task'+(isSel?' on':''), style: isSel? 'border-color:var(--accent);background:rgba(245,158,11,.10)':'' });
        row.appendChild(PWA.el('div', { class: 'ico', text: '📥' }));
        row.appendChild(PWA.el('div', { class: 'tx' }, [
          PWA.el('b', { text: t.title }),
          PWA.el('small', { text: t.meta })
        ]));
        row.appendChild(PWA.el('span', { class: 'badge ok', text: isSel? '✓ PO':'PO' }));
        var btn = PWA.el('button', {class:'btn sm '+(isSel?'primary':'ghost'), text: isSel? 'Loaded':'Load'});
        btn.onclick = function(e){ e.stopPropagation(); selectPo(t.refId); };
        row.appendChild(btn);
        row.onclick = function(){ selectPo(t.refId); };
        c.appendChild(row);
      });
      if(tasks.length>8) c.appendChild(PWA.el('div',{class:'muted', style:'font-size:11px;text-align:center;margin-top:6px'}, '+ '+(tasks.length-8)+' more in ERP'));
      if(S.selectedPoId){
        c.appendChild(PWA.el('div',{style:'display:flex;gap:8px;margin-top:8px'},[
          PWA.el('button',{class:'btn sm ghost', onclick:function(){ S.selectedPoId=''; S.cart=[]; redraw(); }}, '✕ Clear PO'),
          PWA.el('button',{class:'btn sm', onclick:function(){ loadPoIntoCart(S.selectedPoId); }}, '↻ Reload PO items')
        ]));
      }
      body.appendChild(c);
    } else {
      body.appendChild(PWA.el('div',{class:'card'},[PWA.el('div',{class:'empty'},[PWA.el('span',{class:'big',text:'📥'}),PWA.el('div',{text:'Koi pending PO nahi'}),PWA.el('small',{text:'ERP ▸ Purchase ▸ PO se naya PO banayein'})])]));
    }

    // PO detail preview if selected
    if(S.selectedPoId){
      var po = getPoDetail(S.selectedPoId);
      if(po){
        var pc = PWA.el('div',{class:'card'});
        pc.appendChild(PWA.el('h3',{text:'PO — '+ (po.poNo||S.selectedPoId) + ' · '+ (po.supplier && po.supplier.name || po.supplierName||'')}));
        pc.appendChild(PWA.el('div',{class:'muted', style:'font-size:12px'}, 'Date: '+(po.date||'')+' · Status: '+(po.status||'')+' · Supplier: '+((po.supplier&&po.supplier.name)||po.supplierName||'')+' · Items: '+((po.items||[]).length)));
        var tbl = PWA.el('table',{class:'po-table'});
        var thead = PWA.el('thead');
        thead.appendChild(PWA.el('tr',{},[PWA.el('th',{text:'#'}),PWA.el('th',{text:'Item'}),PWA.el('th',{text:'Ordered'}),PWA.el('th',{text:'Pending'}),PWA.el('th',{text:'Rate'}),PWA.el('th',{text:'Load qty'})]));
        tbl.appendChild(thead);
        var tbody = PWA.el('tbody');
        (po.items||[]).forEach(function(it, idx){
          var pend = (it.pendingQty!==undefined? it.pendingQty : Math.max(0, Number(it.qty)-Number(it.receivedQty||0)));
          var isInCart = S.cart.some(function(l){return l.itemId===it.itemId;});
          var tr = PWA.el('tr',{class: isInCart?'on':''});
          tr.appendChild(PWA.el('td',{text:String(idx+1)}));
          tr.appendChild(PWA.el('td',{},[PWA.el('b',{text:it.name}), PWA.el('small',{text:it.code})]));
          tr.appendChild(PWA.el('td',{text:String(it.qty)}));
          tr.appendChild(PWA.el('td',{html:'<b style="color:var(--warn)">'+pend+'</b>'}));
          tr.appendChild(PWA.el('td',{text: money(it.rate||it.cost||0)}));
          var qtyIn = PWA.el('input',{type:'number', value:String(pend), min:'0', style:'width:64px;min-height:32px;padding:4px;border-radius:8px;border:1px solid var(--line);text-align:center;font-weight:800'});
          qtyIn.oninput = function(){ /* live update cart if already loaded */ var ex=S.cart.filter(function(l){return l.itemId===it.itemId;})[0]; if(ex) ex.qty=Math.max(0, Number(qtyIn.value)||0); };
          var addBtn = PWA.el('button',{class:'btn sm '+(isInCart?'ghost':'primary'), text: isInCart?'✓':'Add'});
          addBtn.onclick = function(){
            var q = Math.max(0, Number(qtyIn.value)||0);
            if(q<=0) return PWA.toast('Qty >0 karein','warn');
            var ex=S.cart.filter(function(l){return l.itemId===it.itemId;})[0];
            if(ex) ex.qty = q;
            else S.cart.push({ itemId:it.itemId, code:it.code, name:it.name, qty:q, cost:Number(it.rate||it.cost||0), poQty:Number(it.qty), pendingQty:pend, barcode: '' });
            PWA.toast('Added '+it.code,'ok'); redraw();
          };
          tr.appendChild(PWA.el('td',{},[ PWA.el('div',{style:'display:flex;gap:4px;align-items:center'},[qtyIn, addBtn]) ]));
          tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);
        pc.appendChild(tbl);
        pc.appendChild(PWA.el('div',{style:'display:flex;gap:8px;margin-top:10px'},[
          PWA.el('button',{class:'btn primary', onclick:function(){ loadPoIntoCart(S.selectedPoId); }}, '⬇ Load all pending into GRN cart'),
          PWA.el('button',{class:'btn ghost', onclick:function(){ S.cart=S.cart.filter(function(l){ return !(po.items||[]).some(function(it){return it.itemId===l.itemId;}); }); redraw(); }}, 'Clear PO items')
        ]));
        body.appendChild(pc);
      } else {
        body.appendChild(PWA.el('div',{class:'card'},[PWA.el('div',{class:'muted', style:'font-size:12px'}, 'PO detail load ho raha hai…'), PWA.el('button',{class:'btn sm', onclick:function(){ fetchPoDetail(S.selectedPoId, function(){ redraw(); }); }}, '↻ Retry')]));
        fetchPoDetail(S.selectedPoId, function(){ redraw(); });
      }
    }

    body.appendChild(scannerBox(function (i) {
      // PO selected → only allow items from PO, warn otherwise
      if(S.selectedPoId){
        var po = getPoDetail(S.selectedPoId);
        var inPo = po && (po.items||[]).some(function(it){ return it.itemId===i.id; });
        if(!inPo){
          PWA.toast('Ye item PO mein nahi — phir bhi add kar rahe hain','warn');
        }
      }
      var ex = S.cart.filter(function (l) { return l.itemId === i.id; })[0];
      if (ex) ex.qty += 1;
      else {
        var poItem = null;
        if(S.selectedPoId){ var po2=getPoDetail(S.selectedPoId); if(po2) poItem=(po2.items||[]).filter(function(it){return it.itemId===i.id;})[0]; }
        S.cart.push({ itemId: i.id, code: i.code, name: i.name, qty: 1, cost: poItem? Number(poItem.rate||poItem.cost||i.cost): i.cost, poQty: poItem? Number(poItem.qty): undefined, pendingQty: poItem? Math.max(0, Number(poItem.qty)-Number(poItem.receivedQty||0)): undefined, barcode: i.barcode });
      }
      redraw();
      PWA.haptic(true);

    c.appendChild(PWA.el('div',{class:'audit-grid'},[
      PWA.el('div',{class:'audit-box'},[PWA.el('b',{text:String(a.sheets||0)}), PWA.el('small',{text:'Sheets'})]),
      PWA.el('div',{class:'audit-box'},[PWA.el('b',{text:String(a.counted||0)+'/'+String(a.lines||0)}), PWA.el('small',{text:'Counted'})]),
      PWA.el('div',{class:'audit-box'},[PWA.el('b',{text: (a.accuracy||0)+'%'}), PWA.el('small',{text:'Accuracy'})])
    ]));
    c.appendChild(PWA.el('div',{style:'display:flex;gap:6px;flex-wrap:wrap;font-size:11px;margin-top:6px'},[
      PWA.el('span',{class:'pill', text:'Over '+String(a.over||0)}),
      PWA.el('span',{class:'pill', text:'Short '+String(a.short||0)}),
      PWA.el('span',{class:'pill', text:'Var '+money(a.varianceValue||0)}),
      PWA.el('span',{class:'pill', text: String(a.posted||0)+' posted · '+String(a.open||0)+' open'})
    ]));
    if(a.sheetsList && a.sheetsList.length){
      c.appendChild(PWA.el('div',{class:'muted', style:'font-size:11px;margin-top:8px'}, 'Recent sheets: '+a.sheetsList.slice(0,3).map(function(s){return s.sheetNo+' ('+s.status+')';}).join(' · ')));
    }
    return c;
  }
  function stockAuditList(rows, title){
    var c = PWA.el('div',{class:'card'});
    c.appendChild(PWA.el('h3',{text: title+' ('+rows.length+')'}));
    c.appendChild(PWA.el('div',{class:'muted', style:'font-size:11px'}, 'Existing stock by bin — audit ke liye reference'));
    var host = PWA.el('div');
    rows.slice(0,20).forEach(function(r){
      host.appendChild(PWA.el('div',{class:'task'},[
        PWA.el('div',{class:'ico', text:'📦'}),
        PWA.el('div',{class:'tx'},[PWA.el('b',{text:r.code+' · '+r.name}), PWA.el('small',{text:'Bin '+(r.binCode||'—')+' · qty '+r.qty})]),
        PWA.el('span',{class:'badge', text: money(r.value||r.qty*r.avgCost)})
      ]));
    });
    if(rows.length>20) host.appendChild(PWA.el('div',{class:'muted', style:'font-size:11px;text-align:center;margin-top:6px'}, '+ '+(rows.length-20)+' more'));
    c.appendChild(host);
    return c;
  }

  /* ---- 4) TRANSFER ---- */
  function viewTransfer(body) {
    var bins = (PWA.data && PWA.data.bins) || [];
    function mk(label, onch) {
      var s = PWA.el('select', { onchange: function () { onch(s.value); }, 'aria-label':label },
        [PWA.el('option', { value: '' }, label)].concat(bins.map(function (b) {
          return PWA.el('option', { value: b.id }, b.name);
        })));
      return s;
    }
    var fromSel = mk('From…', function (v) { S.fromBin = v; });
    var toSel = mk('To…', function (v) { S.toBin = v; });
    if(S.fromBin) fromSel.value=S.fromBin;
    if(S.toBin) toSel.value=S.toBin;
    body.appendChild(PWA.el('div', { class: 'card' }, [
      PWA.el('h3',{text:'Bin transfer'}),
      PWA.el('div', { class: 'row2' }, [
        PWA.el('div', { class: 'f' }, [PWA.el('label', { text: 'From bin' }), fromSel]),
        PWA.el('div', { class: 'f' }, [PWA.el('label', { text: 'To bin' }), toSel])
      ]),
      PWA.el('button',{class:'btn sm ghost', onclick:function(){ var a=S.fromBin; S.fromBin=S.toBin; S.toBin=a; var fv=fromSel.value, tv=toSel.value; fromSel.value=tv; toSel.value=fv; }}, '⇄ Swap bins')
    ]));

    body.appendChild(scannerBox(function (i) {
      S.cart.push({ itemId: i.id, code: i.code, name: i.name, qty: 1, barcode:i.barcode }); redraw();
    }));
    body.appendChild(cartView());

    body.appendChild(PWA.el('button', {
      class: 'btn primary block big', onclick: async function () {
        if (!S.fromBin || !S.toBin) return PWA.toast('Dono bins chunein', 'warn');
        if (S.fromBin === S.toBin) return PWA.toast('From aur To alag hone chahiye', 'warn');
        if (!S.cart.length) return PWA.toast('Item add karein', 'warn');
        try {
          for (var k = 0; k < S.cart.length; k++) {
            await PWA.call('pwa.wh.transfer',
              { itemId: S.cart[k].itemId, fromBinId: S.fromBin, toBinId: S.toBin, qty: S.cart[k].qty });
          }
          PWA.toast('✅ Transfer ho gaya', 'ok'); S.cart = []; redraw();
        } catch (e) { PWA.toast(e.message, 'err'); }
      }
    }, '🔄 Transfer karein'));
  }

  PWA.onSynced = function () { PWA.reload(); };
  PWA.boot('wh', TABS, render);
})();
</script>
