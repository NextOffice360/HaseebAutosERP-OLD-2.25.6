<script>
/* ==========================================================================
   HASEEB AUTOS — SETTINGS & CONFIGURATION
   Har label / module / field / tab / price-tier / workflow / permission /
   print-template / number-format yahan se change hota hai — kuch bhi hardcoded
   nahi. Tabs → sub-tabs → sub-sub-tabs (Config.defs() schema se auto-build).
   ========================================================================== */
(function () {
'use strict';

/* ============================================================================
   v2.30.0 (N2) — Settings ka ASLI "Save all"
   ----------------------------------------------------------------------------
   Sirf wohi keys jati hain jo user ne ASAL mein badli (dirty) — sub-tabs ka
   stash bhi shamil. Isi wajah se purani settings kabhi default par reset nahi
   hoti. Ye function hi page bridge hai, is liye header ka shared Save all aur
   page ka Save all button bilkul ek jaisa kaam karte hain.
   Fail par error UPAR jata hai (engine Retry dikhata hai, dirty wahin rehta hai).
   ========================================================================== */
async function configSaveAllNow() {
  const pack = UI2.dirtyPayload();
  if (!pack.count) { UI.toast('Koi unsaved tabdeeli nahi — sab mehfooz hai', 'warn'); return { saved: 0 }; }
  await API.call('config.save', { values: pack.values });
  UI2.clearAllDirty();
  UI.toast(pack.count + ' settings save ho gayin (' + pack.forms + ' section)', 'ok', 3600);
  App._noDirtyGuard = true;
  try { await Promise.all([API.pullSettings(), loadDefs()]); } finally { App._noDirtyGuard = false; }
  try { applyTheme(); } catch (e) { }
  App._noDirtyGuard = true;
  try { App.refresh(); } finally { App._noDirtyGuard = false; }
  return { saved: pack.count };
}

let DEFS = [];
function loadDefs() {
  return API.call('config.defs', {}, { offlineFallback: () => [] })
    .then(d => { DEFS = d || []; window.DEFS = DEFS; return DEFS; })
    .catch(() => (DEFS = [], window.DEFS = DEFS));
}

App.registerScreen('settings', {
  title: 'Settings & Configuration', icon: '⚙', perm: 'settings.manage',
  subtitle: 'App ka har feature yahan se control hota hai',
  actions() {
    /* v2.30.0 (N2) — is page ka page-level save bridge: header ka shared
       "Save all" aur ye page action DONO isi ek function ko call karte hain
       (do parallel logic nahi — jo bhi save hota hai, dono se same hota hai). */
    App.setSaveBridge({ label: 'Settings', run: () => configSaveAllNow() });
    return [
      /* v2.30.0 (N2) — ASLI Save All: page ke saare dirty fields (sab sub-tabs +
         notifications/other forms) ek hi save mein. Pehle ye sirf toast tha. */
      { label: 'Save all', icon: '💾', cls: 'ok', onClick: (ev) => UI.run(ev.currentTarget || ev.target,
        () => configSaveAllNow(), { write: true, writeLabel: 'settings save all' }) },
      { label: 'Reload', icon: '↻', onClick: () => { loadDefs().then(() => App.refresh()); API.pullSettings(); } }
    ];
  },
  render(body) {
    const host = h('div'); body.appendChild(host);
    loadDefs().then(() => {
      const tabs = [
        /* labels/icons Config.defs() se aate hain — yahan kuch hardcode nahi */
        /* v2.6 §10/§11/§13 — 'pwa' group: mobile apps yahan se on/off */
        ...['business', 'pos', 'pwa', 'inventory', 'trade', 'modules', 'automation', 'security', 'backend'].map(id =>
          ({ id: id, label: defLabel(id), icon: defIcon(id), tint: defTint(id), render: c => renderGroup(c, id) })),
        { id: 'customFields', label: 'Custom fields', icon: 'sliders', tint: '#5c7cfa', render: renderCustomFields },
        { id: 'menu', label: 'Menu builder', icon: 'files', tint: '#c9a227', render: renderMenu },
        { id: 'templates', label: 'Print templates', icon: 'printer', tint: '#557a95', render: renderTemplates },
        { id: 'lists', label: 'Lists & catalogs', icon: 'clipboard', tint: '#8a8f5a', render: renderLists },
        { id: 'data', label: 'Data & tools', icon: 'toolbox', tint: '#a05a7a', render: renderData }
      ];
      UI2.tabs(host, { level: 1, active: App.params && App.params.tab, tabs,
        onChange: (id) => { if (id === 'business') setTimeout(businessLogoBar, 60); } });
      /* v2.6 QA — Business Profile par logo upload ka block (pehle sirf URL paste tha) */
      setTimeout(() => { if ((App.params && App.params.tab) === 'business') businessLogoBar(); }, 80);
    });
  }
});

/**
 * Config.defs() se group label (settings-driven, fallback sirf defs na milne par).
 *
 * BUG (v2.6 QA): ye `window.DEFS` parh rahe thay, jabke `let DEFS = []` ek
 * module-local variable hai — `window.DEFS` kabhi set hi nahi hota. Nateeja:
 * Settings ke 8 tabs hamesha fallback dikhate thay  →  "⚙business" (lowercase,
 * ghalat icon) "🏪 Business Profile" ki jagah. Ab dono jagah sync hain.
 */
function _defs() {
  if (Array.isArray(window.DEFS) && window.DEFS.length) return window.DEFS;
  if (typeof DEFS !== 'undefined' && Array.isArray(DEFS) && DEFS.length) return DEFS;
  return [];
}
function defLabel(id, fallback) {
  const g = _defs().find(x => x.id === id);
  return (g && g.label) || fallback || _titleCase(id);
}
function defIcon(id, fallback) {
  const g = _defs().find(x => x.id === id);
  return (g && g.icon) || fallback || '⚙';
}
/* v2.30.0 (N6) — har settings area ka apna halka rang (sirf icon par, tabs par nahi).
   Rang backend se (Config.gs group ka `tint`) — yahan koi duplicate list nahi. */
function defTint(id, fallback) {
  const g = _defs().find(x => x.id === id);
  return (g && g.tint) || fallback || '';
}
/** Fallback ke liye bhi kam se kam saaf-shuda label: 'customFields' → 'Custom Fields' */
function _titleCase(id) {
  return String(id || '').replace(/([A-Z])/g, ' $1')
    .replace(/^./, c => c.toUpperCase()).trim();
}


/* ============================================================================
   LOGO UPLOAD (v2.6 QA) — "shop ka Logo add karnay ki bhi option nahi hay"
   ----------------------------------------------------------------------------
   Pehle sirf `logoUrl` text field tha (URL paste karna parta tha).
   Ab: 📁 File chunein ya 📷 Camera — Drive par save, URL setting mein.
   ========================================================================== */
function businessLogoBar() {
  try {
    const host = document.querySelector('#view .tabbody, #view');
    if (!host || host.querySelector('[data-logo-bar]')) return;
    const st = App.state.settings || {};
    const cur = st.logoUrl || '';
    const status = h('div', { class: 'hint', style: { minHeight: '18px' } }, '');
    const pick = h('input', { type: 'file', accept: 'image/*', style: { display: 'none' } });
    const cam = h('input', { type: 'file', accept: 'image/*', capture: 'environment', style: { display: 'none' } });

    async function go(file) {
      status.textContent = '⏳ Upload ho raha hai…';
      try {
        const dataUrl = await _shrinkImage(file, 512);      /* logo chhota hi kafi hai */
        const r = await API.call('media.uploadLogo', { data: dataUrl, mime: 'image/jpeg' });
        App.state.settings.logoUrl = r.url;
        status.textContent = '✅ Logo lag gaya';
        UI.toast('Logo upload ho gaya ✅', 'ok');
        const img = host.querySelector('[data-logo-img]');
        if (img) img.src = r.url;
      } catch (e) {
        status.textContent = '❌ ' + (e.message || 'Upload fail');
        UI.toast(e.message || 'Upload fail', 'err');
      }
      pick.value = ''; cam.value = '';
    }
    pick.onchange = () => pick.files && pick.files[0] && go(pick.files[0]);
    cam.onchange = () => cam.files && cam.files[0] && go(cam.files[0]);

    const bar = h('div', { 'data-logo-bar': '1', class: 'ui2-block', style: { marginBottom: '12px' } },
      UI2.section('🏪 Shop logo (receipt + login screen)', null, 'fin'),
      h('div', { style: { display: 'flex', gap: '14px', alignItems: 'center', flexWrap: 'wrap' } },
        cur
          ? h('img', { 'data-logo-img': '1', src: cur, alt: 'Shop logo', loading: 'lazy', decoding: 'async',
              style: { width: '76px', height: '76px', objectFit: 'contain', borderRadius: '12px',
                       border: '1px solid var(--line)', background: 'var(--panel-2)', padding: '5px' } })
          : h('div', { class: 'empty', style: { minWidth: '76px', textAlign: 'center' } }, '🖼 Koi logo nahi'),
        h('div', { class: 'row', style: { gap: '8px', flexWrap: 'wrap' } },
          h('button', { class: 'btn sm sec', onclick: () => pick.click() }, '📁 File se logo'),
          h('button', { class: 'btn sm sec', onclick: () => cam.click() }, '📷 Camera se'),
          pick, cam),
        status));
    host.insertBefore(bar, host.firstChild);
  } catch (e) { /* Settings mein logo block na lag sake to baqi UI chalte rahe */ }
}


/* fields → aik ya zyada UI2.form, har "sec" ke liye colour-coded block.
   `sec` na ho to bilkul purana (pehle jaisa) behaviour — koi farq nahi. */
function buildSections(fields) {
  if (!fields.some(x => x.sec)) return UI2.form({ fields: fields, values: {} });

  /* lagataar ek hi section wali fields ko aik chunk me joro */
  const chunks = [];
  fields.forEach(x => {
    const t = x.sec ? (x.sec.title || '') : '';
    const tone = x.sec ? (x.sec.tone || 'info') : '';
    let c = chunks[chunks.length - 1];
    if (!c || c.title !== t) { c = { title: t, tone: tone, fields: [] }; chunks.push(c); }
    c.fields.push(x);
  });

  const parts = chunks.map(ch => {
    const form = UI2.form({ fields: ch.fields, values: {} });
    const box = h('div', { class: 'ui2-block' });
    /* v2.6 QA — section heading English + Urdu tooltip (Bilingual.gs) */
    if (ch.title) box.appendChild(UI2.section(ch.title, null, ch.tone,
      { urSec: (ch.fields[0] && ch.fields[0].sec && ch.fields[0].sec.urSec) || '' }));
    box.appendChild(form.el);
    return { box: box, form: form };
  });

  const el = h('div', { class: 'cfg-secs' });
  parts.forEach(pn => el.appendChild(pn.box));
  /* v2.30.0 (N1/N2) — ASLI ROOT CAUSE:
     Pehle ye wrapper sirf {el, values} return karta tha. Us par `changed` na
     hone ki wajah se sub-tab ka Save POORE sub-tab ki values bhej deta tha —
     aur jo setting UI mein render nahi hui / purani legacy value thi, wo
     default par RESET ho jati thi (user ka asli bug). Ab wrapper har child form
     ka poora API delegate karta hai, is liye Save/SAVE ALL sirf dirty keys
     bhejte hain. */
  const api = {
    el: el,
    _parts: parts,
    values: (opts) => parts.reduce((acc, pn) => Object.assign(acc, pn.form.values(opts)), {}),
    changed: () => parts.reduce((acc, pn) => Object.assign(acc, (pn.form.changed ? pn.form.changed() : {})), {}),
    dirtyKeys: () => parts.reduce((acc, pn) => acc.concat(pn.form.dirtyKeys ? pn.form.dirtyKeys() : []), []),
    isDirty: (k) => parts.some(pn => pn.form.isDirty && pn.form.isDirty(k)),
    markDirty: (k) => {
      for (let i = 0; i < parts.length; i++) {
        const fm = parts[i].form;
        if (fm.refs && fm.refs[k] !== undefined && fm.markDirty) return fm.markDirty(k);
      }
      return false;
    },
    clearDirty: () => parts.forEach(pn => { try { pn.form.clearDirty && pn.form.clearDirty(); } catch (e) { } }),
    set: (k, v, quiet) => {
      for (let i = 0; i < parts.length; i++) {
        const fm = parts[i].form;
        if (fm.refs && fm.refs[k] !== undefined) return fm.set(k, v, quiet);
      }
      return false;
    },
    field: (k) => {
      for (let i = 0; i < parts.length; i++) {
        const fm = parts[i].form;
        const fld = fm.field ? fm.field(k) : (fm.refs ? fm.refs[k] : null);
        if (fld) return fld;
      }
      return null;
    },
    show: (k, on) => {
      for (let i = 0; i < parts.length; i++) {
        const fm = parts[i].form;
        if (fm.refs && fm.refs[k] !== undefined && fm.show) return fm.show(k, on);
      }
      return false;
    },
    setOptions: (k, opts) => {
      for (let i = 0; i < parts.length; i++) {
        const fm = parts[i].form;
        if (fm.refs && fm.refs[k] !== undefined && fm.setOptions) return fm.setOptions(k, opts);
      }
      return false;
    }
  };
  UI2._forms = UI2._forms || [];
  UI2._forms.push(api);
  if (UI2._forms.length > 60) UI2._forms.splice(0, UI2._forms.length - 60);
  return api;
}

/* ============================ CONFIG GROUPS ================================ */
function renderGroup(c, groupId) {
  const g = DEFS.find(x => x.id === groupId);
  if (!g) { c.appendChild(h('div', { class: 'empty' }, 'Schema load nahi hua — backend deploy check karein')); return; }
  const host = h('div'); c.appendChild(host);
  if (groupId === 'backend') {
    // top diagnostics/status card for Backend & Integrations
    try { c.insertBefore(backendDiagnosticsCard(), c.firstChild); } catch(e) {}
  }
  UI2.tabs(host, {
    level: 2,
    tabs: g.sub.map(s => ({
      id: s.id, label: s.label, icon: s.icon || '▸', tint: g.tint || '',
      render: cc => renderSub(cc, groupId, s)
    }))
  });
  if (groupId === 'backend') {
    // bottom helper for static/self-hosted local URL (not sheet-stored)
    try {
      const extra = backendLocalCard();
      // after tabs have rendered, append after host
      setTimeout(()=>{ if(extra && extra.parentNode!==c) c.appendChild(extra); }, 400);
    } catch(e) {}
  }
}

function renderSub(c, groupId, sub) {
  const current = App.state.settings || {};
  const fields = sub.fields.map(f => Object.assign({}, f, { value: current[f.key] !== undefined ? current[f.key] : f.def }));

  /* ======================================================================
     v2.6 QA — SETTINGS SECTIONS (structure / separator / colour-coded blocks)
     ----------------------------------------------------------------------
     Masla: bade sub-tabs (masalan "AI assistant") me 20+ fields aik flat
     lambi list thi — koi heading, koi separator, koi rang nahi. User ne
     kaha: "properly structured nahi".

     Hal (generic, sab sub-tabs ke liye): field definition me `sec` do —
       { key:'aiEnabled', sec:{title:'Agent', tone:'info'} }
     Rendering khud unhen colour-coded section blocks me baant degi.
     Jis field par `sec` nahi, woh pehle se mutabiq block me rahegi.
     ====================================================================== */
  const f = buildSections(fields);

  const wrap = h('div', { class: 'cfg-sub' });
  wrap.appendChild(f.el);

  /* ---- as-you-type filter: bade settings tabs mein field dhoondhna ---- */
  if (fields.length > 5) {
    const search = h('input', { class: 'f-input', type: 'search',
      placeholder: '🔍 ' + sub.label + ' mein setting dhoondhein…', 'aria-label': 'Search settings' });
    const hitCount = h('span', { class: 'pm-count' }, '');
    wrap.insertBefore(h('div', { class: 'cfg-search' }, search, hitCount), wrap.firstChild);
    const rowOf = el => el.closest('.field, .f-row, .form-row') || el;
    search.oninput = () => {
      const q = search.value.trim().toLowerCase();
      let n = 0;
      /* v2.6: ab fields section blocks ke andar hain — poori gahrai se dhoondo */
      Array.from(f.el.querySelectorAll('.field, .f-row, .form-row, .full')).forEach(child => {
        const isField = child.classList && (child.classList.contains('field') || child.classList.contains('f-row') ||
          child.classList.contains('form-row') || child.classList.contains('full'));
        if (!isField) return;
        const txt = (child.textContent || '').toLowerCase();
        const on = !q || txt.indexOf(q) > -1;
        child.style.display = on ? '' : 'none';
        child.classList.toggle('cfg-hit', !!q && on);
        if (on) n++;
      });
      hitCount.textContent = q ? n + ' / ' + fields.length + ' settings' : '';
    };
  }

  /* ---- dirty tracking ---- */
  const dirty = h('span', { class: 'cfg-dirty', style: { display: 'none' } }, 'Unsaved changes');
  f.el.addEventListener('input', () => { dirty.style.display = ''; }, true);
  f.el.addEventListener('change', () => { dirty.style.display = ''; }, true);

  /* v2.25.9 W2.T2 — manual 'Saving…' + disabled hack hata diya: busy/dup-block
     shared UI.run deta hai. */
  /* v2.30.0 (N1) — ROOT CAUSE FIX: pehle poore sub-tab ke saare fields bhejta tha.
     Ab sirf wohi keys jati hain jo user ne ASAL mein badli (dirty) — warna
     render/stale/legacy farq ki wajah se purani settings default par reset ho jati thin. */
  const saveBtn = h('button', { class: 'btn ok', onclick: () => UI.run(saveBtn, async () => {
      const payload = f.changed ? f.changed() : f.values();
      if (!Object.keys(payload).length) { UI.toast('Koi tabdeeli nahi — sab pehle se save hai', 'warn'); return; }
      try {
        await API.call('config.save', { values: payload });
        UI.toast(Object.keys(payload).length + ' setting save ho gayi ✅', 'ok');
        dirty.style.display = 'none';
        if (f.clearDirty) f.clearDirty();
        App._noDirtyGuard = true;
        try { await Promise.all([API.pullSettings(), loadDefs()]); } finally { App._noDirtyGuard = false; }
        applyTheme();
        App._noDirtyGuard = true;
        try { App.refresh(); } finally { App._noDirtyGuard = false; }
      } catch (e) {
        UI.toast('Save nahi hua: ' + (e.message || ''), 'err', 5000);
        UI2.retryToast && UI2.retryToast('Save nahi hua', e.message, () => {
          try { saveBtn.click(); } catch (err) { }
        });
      }
  }, { write: true, writeLabel: 'settings save' }) }, '💾 Save ' + sub.label);

  c.appendChild(wrap);
  c.appendChild(h('div', { class: 'cfg-bar' },
    saveBtn,
    h('button', { class: 'btn sec', onclick: () => UI2.confirm('Is tab ke defaults restore karein?', async () => {
      await API.call('config.resetGroup', { group: groupId });
      await API.pullSettings(); UI.toast('Defaults restored', 'ok'); App.refresh();
    }, true) }, '↺ Reset tab'),
    h('button', { class: 'btn ghost', onclick: () => {
      const box = h('pre', { style: { fontSize: 'var(--fs-xs)', whiteSpace: 'pre-wrap' } },
        JSON.stringify(sub.fields.map(x => ({ key: x.key, label: x.label, type: x.type })), null, 1));
      UI2.modal({ title: 'Keys — ' + sub.label, size: 'sm', body: box, actions: [{ label: 'Close', onClick: cc => cc() }] });
    /* "{ }" emoji nahi hai (ui-polish gate buttons mein emoji mana karta hai) */
    } }, '{ } Keys'),
    /* v2.8.5 — status + count ab aik .cfg-meta group mein: daayein taraf,
       actions se alag. Pehle ye khule text ki tarah bikhre hue the
       ("Save AI assistant↺ Reset tab{ } Keys 24 settings"). */
    h('span', { class: 'cfg-meta' }, dirty,
      h('span', { class: 'pm-count' }, fields.length + ' settings'))));


  if (groupId === 'modules' && sub.id === 'modules') {
    c.appendChild(UI2.section('Module enable/disable matrix'));
    c.appendChild(modulesMatrix());
  }
  if (groupId === 'automation' && sub.id === 'jobs') {
    c.appendChild(UI2.section('Scheduler — abhi kya installed hai'));
    c.appendChild(jobsPanel());
  }
  /* v2.3: comms / import / migration quick actions */
  if (groupId === 'automation' && sub.id === 'comms') {
    c.appendChild(UI2.section('Comms quick actions',
      [h('button', { class: 'btn sm', onclick: () => window.Share && Share.outbox() }, '📤 Outbox / bheje gaye messages'),
       h('button', { class: 'btn sm sec', onclick: () => window.Migration2 && Migration2.open() }, '☁ Migration')]));
    c.appendChild(commsStatusCard());
  }
  if (groupId === 'automation' && sub.id === 'priceimport') {
    c.appendChild(UI2.section('Supplier price list',
      [h('button', { class: 'btn sm', onclick: () => window.PriceList && PriceList.open() }, '📥 Import price list'),
       h('button', { class: 'btn sm sec', onclick: () => priceImportHistory() }, '🗂 Import history')]));
  }
  if (groupId === 'automation' && sub.id === 'migration') {
    c.appendChild(UI2.section('Sheets → Firebase',
      [h('button', { class: 'btn sm', onclick: () => window.Migration2 && Migration2.open() }, '☁ Migration dashboard'),
       h('button', { class: 'btn sm sec', onclick: async () => {
         const p = await API.call('migration.plan');
         const md = window.Migration2 ? Migration2.markdown(p) : JSON.stringify(p, null, 2);
         navigator.clipboard && navigator.clipboard.writeText(md); UI.toast('Plan copy ho gaya', 'ok');
       } }, '📋 Copy plan (MD)')]));
    c.appendChild(migrationStatusCard());
  }
  if (groupId === 'automation' && sub.id === 'ai') {
    /* v2.10 — AI ka apna tab; yahan sirf bridge (Test + link) */
    c.appendChild(UI2.section('AI agent',
      [h('button', { class: 'btn sm', onclick: () => window.AIConfig && AIConfig.openModal() }, 'Open AI Agent tab'),
       h('button', { class: 'btn sm sec', onclick: async () => {
         const r = await API.call('ai.test', {}, { offlineFallback: () => ({ ok: false, message: 'offline' }) });
         UI.toast((r.ok ? '' : 'Warning: ') + (r.message || ''), r.ok ? 'ok' : 'warn', 3200);
       } }, 'Test connection')]));
    if (window.AIConfig) c.appendChild(AIConfig.panel(h('div')));
  }
  if (groupId === 'trade' && sub.id === 'loyalty') {
    c.appendChild(UI2.section('Loyalty',
      [h('button', { class: 'btn sm sec', onclick: () => loyaltyTopCustomers() }, '⭐ Top customers by points')]));
  }
}

/* ==================== v2.3 helper cards (Comms / Migration) =============== */
function commsStatusCard() {
  const host = h('div', { class: 'card' }, h('div', { class: 'card-body tight' }, 'Load ho raha hai…'));
  (async () => {
    let p = {};
    try { p = await API.call('comms.providers', {}, { offlineFallback: () => ({}) }) || {}; } catch (e) { }
    const wa = p.whatsapp || {}, sms = p.sms || {}, em = p.email || {};
    host.querySelector('.card-body').innerHTML = '';
    host.querySelector('.card-body').append(
      h('div', { class: 'list-item' }, h('div', { class: 'li-main' }, h('b', null, 'WhatsApp'),
        h('span', null, (wa.provider || 'LINK') + ' · ' + (wa.ready ? 'ready' : 'config missing')))),
      h('div', { class: 'list-item' }, h('div', { class: 'li-main' }, h('b', null, 'SMS'),
        h('span', null, (sms.provider || 'NONE') + ' · ' + (sms.ready ? 'ready' : 'off')))),
      h('div', { class: 'list-item' }, h('div', { class: 'li-main' }, h('b', null, 'Email'),
        h('span', null, (em.provider || 'APPS_SCRIPT') + ' · ready'))),
      h('div', { class: 'sub', style: { padding: '6px 8px', fontSize: 'var(--fs-xs)' } },
        'Free mode (LINK): koi API key nahi — wa.me link se WhatsApp khul jata hai. ' +
        'Automated sending chahiye to META Cloud API ya Twilio keys daalein.'));
  })();
  return host;
}

function migrationStatusCard() {
  const host = h('div', { class: 'card' }, h('div', { class: 'card-body tight' }, 'Load ho raha hai…'));
  (async () => {
    let a = {};
    try { a = await API.call('migration.assess', {}, { offlineFallback: () => ({}) }) || {}; } catch (e) { }
    const t = a.totals || {};
    host.querySelector('.card-body').innerHTML = '';

async function reorder(rows, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= rows.length) return;
  const a = rows[i], b = rows[j];
  const tmp = a.sortOrder; a.sortOrder = b.sortOrder; b.sortOrder = tmp;
  await API.call('config.menu.save', { item: a });
  await API.call('config.menu.save', { item: b });
}

function listForm(e, row, after) {
  const vals = row || {};
  const extra = [];
  if (e.entity === 'units') extra.push({ key: 'baseUnit', label: 'Base unit' }, { key: 'conversion', label: 'Conversion', type: 'number' });
  if (e.entity === 'taxes') extra.push({ key: 'rate', label: 'Rate %', type: 'number' }, { key: 'type', label: 'Type', type: 'select', options: ['PCT', 'FLAT'] });
  if (e.entity === 'warehouses') extra.push({ key: 'locationId', label: 'Branch', type: 'select', options: App.state.locations.map(l => ({ value: l.id, label: l.name })) }, { key: 'isDefault', label: 'Default', type: 'switch' });
  if (e.entity === 'categories') extra.push({ key: 'parentId', label: 'Parent category code' }, { key: 'imageUrl', label: 'Image URL' });
  const f = UI2.form({
    values: Object.assign({ active: 'true' }, vals),
    fields: [{ key: 'code', label: 'Code' }, { key: 'name', label: 'Name' }].concat(extra)
      .concat([{ key: 'sortOrder', label: 'Sort order', type: 'number' }, { key: 'active', label: 'Active', type: 'switch' }])
  });
  UI2.modal({
    title: row ? '✏ ' + (row.name || row.code) : '＋ ' + e.label, size: 'sm', body: f.el,
    actions: [{ label: 'Save', cls: 'ok', onClick: async close => {
      const v = f.values();
      if (!v.name) return UI.toast('Name zaroori hai', 'err');
      if (row) v.id = row.id;
      await API.call('config.list.save', { entity: e.entity, record: v });
      UI.toast('Saved ✅', 'ok'); close(); after && after();
    } }]
  });
}

function renderBackupRestore(c) {
  c.appendChild(h('div', { class: 'card' }, h('div', { class: 'card-body' },
    h('h4', { style: { margin: '0 0 8px' } }, '⬇⬆ Configuration backup / restore'),

    h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginTop: '10px' } },

        const dump = {
          exportedAt: new Date().toISOString(), version: '2.0',
          settings: await API.call('config.all', {}),
          customFields: await API.call('config.fields.list', {}),
          menu: await API.call('config.menu', {}),
          templates: await API.call('config.templates', {}),
          lists: {}
        };
        /* W7 (v2.26.0) — 5 sequential calls ki jagah ek parallel batch (independent reads).
           Naapa hua asar: export ka waqt ~5x round-trip se ~1x (demo mein bhi 5 calls -> 5 parallel). */
        const _ents = ['categories', 'brands', 'units', 'taxes', 'warehouses'];
        const _got = await API.parallel(_ents.map(e => ({ action: 'config.list', payload: { entity: e } })), 5);
        _ents.forEach((e, i) => { if (_got[i] && !_got[i].__err) dump.lists[e] = _got[i]; });
        downloadCsv(JSON.stringify(dump, null, 2), 'haseeb-autos-config-' +
          new Date().toISOString().slice(0, 10) + '.json');
        UI.toast('Config exported ⬇', 'ok');
      } }, '⬇ Export JSON'),
      h('button', { class: 'btn sec', onclick: () => {
        const ta = h('textarea', { class: 'f-input', rows: 8, style: { fontFamily: 'monospace', fontSize: 'var(--fs-xs)' },
          placeholder: 'Yahan config JSON paste karein' });
        UI2.modal({
          title: '⬆ Import configuration', size: 'md', body: ta,
          actions: [{ label: 'Import', cls: 'ok', onClick: async close => {
            let dump;
            try { dump = JSON.parse(ta.value); } catch (e) { return UI.toast('JSON ghalat hai', 'err'); }
            try {
              if (dump.settings) await API.call('config.save', { values: dump.settings });
              /* W7 (v2.26.0) — ASLI BUG + N+1: pehle `forEach(async …)` fire-and-forget tha, is liye
                 import "mukammal" batata tha jab ke likhai abhi chal rahi hoti thi (aur fail bhi
                 chup-chaap hoti thi). Ab: sab writes AWAIT hoti hain, 6 ke parallel batches mein,
                 aur natija (kamyab/fail) gina kar user ko batate hain. */
              const jobs = []
                .concat((dump.customFields || []).map(f => ({ label: 'field ' + (f.key || f.label || ''), fn: () => API.call('config.fields.save', { field: f }) })))
                .concat((dump.templates || []).map(t => ({ label: 'template ' + (t.name || ''), fn: () => API.call('config.templates.save', { template: t }) })))
                .concat((dump.menu || []).map(i => ({ label: 'menu ' + (i.label || i.id || ''), fn: () => API.call('config.menu.save', { item: i }) })))
                .concat(Object.keys(dump.lists || {}).reduce((acc, e) => acc.concat((dump.lists[e] || []).map(r =>
                  ({ label: e + ' ' + (r.name || r.id || ''), fn: () => API.call('config.list.save', { entity: e, record: r }) }))), []));
              let impOk = 0; const impErr = [];
              for (let s0 = 0; s0 < jobs.length; s0 += 6) {
                const slice = jobs.slice(s0, s0 + 6);
                const res = await API.parallel(slice.map(j => j.fn), 6);
                res.forEach((r, i2) => { if (r && r.__err) impErr.push(slice[i2].label + ' — ' + r.__err); else impOk++; });
              }
              if (impErr.length) UI.toast(impOk + ' cheezein import huin, ' + impErr.length + ' fail: ' + impErr.slice(0, 3).join(' · '), 'err');
              else UI.toast(impOk + ' cheezein import ho gayeen ✅', 'ok');
              await API.pullSettings(); close(); App.refresh();
            } catch (e) { UI.toast(e.message, 'err'); }
          } }]
        });
      } }, '⬆ Import JSON')))));
}

  const host = h('div', { class:'card', style:{marginTop:'14px'} },
    h('div', {class:'card-head'}, h('h4', null, '💻 Local / Self-hosted backend (this browser)')),
    h('div', {class:'card-body'},
      h('div', {class:'muted', style:{fontSize:'var(--fs-xs)', marginBottom:'10px'}}, note),
      h('div', {class:'f-col', style:{marginBottom:'10px'}}, h('label', null, 'Backend URL (GAS exec)'), urlInput, h('div', {class:'hint'}, 'Leave empty to use GAS auto URL. For Netlify/GitHub Pages/local PC, paste your deployed exec URL here.')),
      h('div', {class:'f-col', style:{marginBottom:'10px'}}, h('label', null, 'Integration API key (this browser only)'), keyInput, h('div', {class:'hint'}, 'If Settings → External frontends requires API key, store it here (localStorage, not Sheet). Masked on save.')),
      h('div', {style:{display:'flex', gap:'8px', flexWrap:'wrap'}},
        h('button', {class:'btn sm', onclick: async()=>{
          const u=urlInput.value.trim();
          const k=keyInput.value.trim();
          try {
            if (u) { Backend.setUrl(u); } else { Backend.clearUrl(); }
            if (k) { try{ localStorage.setItem('ha_integrationKey', k); Store.set('integrationKey', k);}catch(e){} } else { try{ localStorage.removeItem('ha_integrationKey'); Store.del('integrationKey'); }catch(e){} }
            status.textContent='✅ Saved locally — testing…';
            status.style.color='var(--ok, #15803d)';
            try { const r=await Backend.test(u||Backend.getUrl()); status.textContent='✅ Connected: ' + (r.version||'pong'); UI.toast('Backend reachable ✅','ok'); } catch(e){ status.textContent='⚠ Saved but ping failed: ' + e.message; status.style.color='var(--err, #b91c1c)'; UI.toast(e.message,'warn'); }
          } catch(e){ status.textContent='❌ ' + e.message; UI.toast(e.message,'err'); }
        }}, '💾 Save locally'),
        h('button', {class:'btn sm sec', onclick: async()=>{
          const u=urlInput.value.trim() || Backend.getUrl();
          if(!u) return UI.toast('No URL to test','warn');
          status.textContent='⏳ Testing…';
          try{ const r=await Backend.test(u); status.textContent='✅ Ping OK — ' + (r.version||'ok'); UI.toast('Ping OK','ok'); } catch(e){ status.textContent='❌ ' + e.message; UI.toast(e.message,'err'); }
        }}, '↗ Test ping'),
        h('button', {class:'btn sm ghost', onclick:()=>{
          urlInput.value=''; keyInput.value=''; Backend.clearUrl(); try{ localStorage.removeItem('ha_integrationKey'); Store.del('integrationKey'); }catch(e){}
          status.textContent='Cleared — will use GAS auto URL.';
          UI.toast('Local backend cleared','ok');
        }}, '🧹 Clear'),
      ),
      status,
      h('div', {class:'hint', style:{marginTop:'10px', background:'var(--warn-bg, #fffbeb)', padding:'8px', borderRadius:'8px', fontSize:'11px'}},
        'Offline vs remote: if backend unreachable, POS queues bills locally (📴) and syncs when net returns. Queue status shown in header. Self-hosted PC without internet: keep offline queue ON and sync later when online.')
    )
  );
  return host;
}

/* ===================== THEME FROM SETTINGS/* ===================== THEME FROM SETTINGS (no hardcode) ================== */
function applyTheme() {
  const s = App.state.settings || {};
  const root = document.documentElement.style;
  if (s.themePrimary) root.setProperty('--brand', s.themePrimary);
  if (s.themeAccent) root.setProperty('--accent', s.themeAccent);
  if (s.themeRadius) root.setProperty('--r-l', s.themeRadius + 'px');
  const size = s.fontSize || 'medium';
  const map = { small: '13.5px', medium: '14.5px', large: '16px', xl: '17.5px' };
  document.body.style.fontSize = map[size] || '14.5px';
  if (s.themeMode === 'light') document.body.classList.remove('dark');
  if (s.themeMode === 'dark') document.body.classList.add('dark');
  if (s.density) document.body.classList.toggle('compact', s.density === 'compact');
}

window.__applyTheme = applyTheme;
})();
</script>
