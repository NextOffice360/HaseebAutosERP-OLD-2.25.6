<!--
  ==========================================================================
  Pwa_Shell.html — v2.19 INDUSTRY PWA POLISH
  Shared mobile shell: CSS + JS bridge. All dedicated PWAs include this
  one file — single source for look / feel & offline logic.

  Industry-standard enhancements (v2.19):
   • Installable   — beforeinstallprompt, Install CTA, manifest shortcuts,
                     data-URI manifest + apple-touch-icon, favicon
   • Offline-first — localStorage queue + background sync + persistent
                     offline banner + retry + last-sync stamp
   • Cached shell  — SW registration on static/demo hosts (Apps Script
                     cannot host SW on script.google.com, queue covers it)
   • Push ready    — Notification.requestPermission helper (opt-in chip)
   • Thumb-first   — bottom bar ≥56px, top bar sticky, safe-area, no h-scroll
   • Modern clean  — glass cards, soft shadows, skeleton shimmer,
                     tabular nums, system-ui font, dark / light / auto
   • A11y & i18n   — focus-visible, aria-live toasts, EN + Roman Urdu,
                     16px inputs (no iOS zoom), prefers-reduced-motion
  ==========================================================================
-->
<style>
  :root{
    --bg:#0b1220; --card:#131c2e; --card2:#0f1729; --card3:#1a2742;
    --ink:#e8eefc; --muted:#93a3c4; --muted2:#6b7fa3;
    --line:#22304d; --line2:#2a3a5c;
    --accent:#f59e0b; --accent-ink:#1a1206;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --info:#38bdf8;
    --r:14px; --r-sm:10px; --r-lg:18px;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    --shadow:0 10px 30px rgba(0,0,0,.30), 0 1px 0 rgba(255,255,255,.04) inset;
    --shadow2:0 4px 16px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6fb; --card:#ffffff; --card2:#eef2f9; --card3:#e4eaf6; --ink:#0b1220; --muted:#5a6b8c; --muted2:#7a8bae; --line:#dbe2ef; --line2:#cbd6ec; --accent:#c2410c; --accent-ink:#ffffff; --shadow:0 10px 30px rgba(18,24,60,.08), 0 1px 0 rgba(255,255,255,.9) inset; --shadow2:0 4px 14px rgba(18,24,60,.08); }
  }
  /* manual override via data-theme */
  html[data-theme="light"]{ --bg:#f4f6fb; --card:#ffffff; --card2:#eef2f9; --card3:#e4eaf6; --ink:#0b1220; --muted:#5a6b8c; --muted2:#7a8bae; --line:#dbe2ef; --line2:#cbd6ec; --accent:#c2410c; --accent-ink:#ffffff; }
  html[data-theme="dark"]{ --bg:#0b1220; --card:#131c2e; --card2:#0f1729; --card3:#1a2742; --ink:#e8eefc; --muted:#93a3c4; --muted2:#6b7fa3; --line:#22304d; --line2:#2a3a5c; --accent:#f59e0b; --accent-ink:#1a1206; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;overflow-x:hidden;height:100%;min-height:100vh;min-height:100dvh}
  body{
    background:radial-gradient(900px 500px at 70% -10%, rgba(245,158,11,.10), transparent 60%), var(--bg);
    color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-bottom:calc(76px + var(--safe-b)); -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  /* ---------- top bar ---------- */
  .pwa-top{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:calc(10px + var(--safe-t)) 12px 10px;
    background:rgba(15,23,41,.88); backdrop-filter:saturate(1.2) blur(10px);
    border-bottom:1px solid var(--line);
  }
  html[data-theme="light"] .pwa-top{ background:rgba(255,255,255,.88) }
  @media (prefers-color-scheme: light){ html:not([data-theme]) .pwa-top{background:rgba(255,255,255,.88)} }
  .pwa-top .ttl{font-weight:800;font-size:16px;letter-spacing:.2px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .pwa-top .ttl small{font-weight:600;font-size:11px;color:var(--muted);letter-spacing:.3px}
  .pwa-top .net{font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);flex:0 0 auto;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;min-height:28px}
  .pwa-top .net.on{color:var(--ok);border-color:var(--ok);background:rgba(34,197,94,.10)}
  .pwa-top .net.off{color:var(--warn);border-color:var(--warn);background:rgba(245,158,11,.10)}
  .pwa-top .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}

  /* offline banner */
  .pwa-offline{
    display:none;align-items:center;gap:10px;padding:10px 12px;margin:0 auto;max-width:720px;
    background:linear-gradient(135deg, #7c2d12, #c2410c);color:#fff;font-size:13px;font-weight:600;
  }
  .pwa-offline.show{display:flex}
  .pwa-offline button{margin-left:auto;background:#fff;color:#7c2d12;border:0;padding:6px 12px;border-radius:999px;font-weight:800;cursor:pointer}

  /* install banner */
  .pwa-install{
    display:none;align-items:center;gap:12px;padding:12px;margin:12px auto;max-width:720px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);
  }
  .pwa-install.show{display:flex}
  .pwa-install .tx{flex:1}
  .pwa-install .tx b{display:block;font-size:14px}
  .pwa-install .tx small{color:var(--muted);font-size:12px}

  /* ---------- layout ---------- */
  .pwa-wrap{padding:12px 12px 4px;max-width:720px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:12px;margin-bottom:12px;box-shadow:var(--shadow2)}
  .card h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .card h3 .act{margin-left:auto;font-size:11px;font-weight:700;color:var(--info);cursor:pointer}

  /* ---------- inputs ---------- */
  .f{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;min-width:0}
  .f label{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .f input,.f select,.f textarea{
    min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);width:100%;font-size:16px; /* 16px = iOS zoom nahi hota */
    transition:border-color .15s, box-shadow .15s;
  }
  .f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.18)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:420px){ .row2{grid-template-columns:1fr} }

  /* ---------- buttons ---------- */
  .btn{min-height:48px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);
    background:var(--card2);font-weight:700;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;gap:8px;transition:transform .06s, filter .15s}
  .btn:active{transform:scale(.97)}
  .btn:hover{filter:brightness(1.06)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.ok{background:var(--ok);color:#04120a;border-color:var(--ok)}
  .btn.ghost{background:transparent}
  .btn.block{width:100%}
  .btn[disabled]{opacity:.45;pointer-events:none}
  .btn.big{min-height:56px;font-size:17px;border-radius:14px}
  .btn.sm{min-height:38px;padding:8px 12px;font-size:13px;border-radius:10px}

  /* ---------- chips ---------- */
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;min-height:32px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--card2);cursor:pointer}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

  /* ---------- list / task cards ---------- */
  .task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);
    border-radius:12px;background:var(--card2);margin-bottom:8px;min-height:56px;cursor:pointer;
    transition:border-color .15s, background .15s}
  .task:hover{border-color:var(--line2);background:var(--card3)}
  .task:active{transform:scale(.99)}
  .task .ico{font-size:22px;flex:0 0 auto;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;background:var(--card);border-radius:10px;border:1px solid var(--line)}
  .task .tx{flex:1;min-width:0}
  .task .tx b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .tx small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;
    background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .badge.ok{background:rgba(34,197,94,.12);color:var(--ok);border-color:rgba(34,197,94,.30)}
  html[data-theme="light"] .badge.ok{color:#0e5a2a;background:#dcfce7;border-color:#86efac}
  @media (prefers-color-scheme: light){ html:not([data-theme]) .badge.ok{color:#0e5a2a;background:#dcfce7;border-color:#86efac} }
  .badge.warn{background:rgba(245,158,11,.12);color:var(--warn);border-color:rgba(245,158,11,.30)}

  /* ---------- cart lines ---------- */
  .line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:0}
  .line .nm{flex:1;min-width:0}
  .line .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .line .nm small{color:var(--muted);font-size:12px}
  .qty{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .qty button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);font-size:18px;font-weight:800;line-height:1;cursor:pointer}
  .qty button:active{transform:scale(.92)}
  .qty span{min-width:38px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

  /* ---------- KPI mini ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  @media(min-width:520px){ .kpi-grid{grid-template-columns:repeat(4,1fr)} }
  .kpi{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center}
  .kpi b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
  .kpi small{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}

  /* ---------- bottom bar (thumb) ---------- */
  .pwa-bar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:6px;
    padding:8px 8px calc(8px + var(--safe-b));background:var(--card2);
    border-top:1px solid var(--line); backdrop-filter:saturate(1.2) blur(12px);
  }
  .pwa-bar .b{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;border:0;background:transparent;color:var(--muted);
    font-size:11px;font-weight:800;border-radius:12px;cursor:pointer;position:relative}
  .pwa-bar .b i{font-style:normal;font-size:20px;line-height:1}
  .pwa-bar .b.on{color:var(--accent);background:var(--card);box-shadow:var(--shadow2)}
  .pwa-bar .b .dot{position:absolute;top:6px;right:22px;width:8px;height:8px;border-radius:50%;background:var(--err);display:none}
  .pwa-bar .b.has-dot .dot{display:block}

  /* ---------- misc ---------- */
  .empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}
  .empty .big{font-size:30px;display:block;margin-bottom:8px}
  .skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--card2),var(--line),var(--card2));
    background-size:200% 100%;animation:sk 1.1s infinite;margin:8px 0}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .toast{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--safe-b));z-index:60;
    background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:700;
    font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(10px);
    transition:.18s;pointer-events:none;max-width:720px;margin:0 auto}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.ok{background:var(--ok);color:#04120a}
  .toast.err{background:var(--err);color:#fff}
  .toast.warn{background:var(--warn);color:#1a1206}
  /* v2.30.3 (W9) — shared confirm overlay */
  .pwa-cf{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:flex;
    align-items:center;justify-content:center;padding:16px}
  .pwa-cf-box{background:var(--card,#fff);color:var(--ink,#111);border-radius:14px;
    padding:16px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .pwa-cf-msg{font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:14px;white-space:pre-wrap}
  .pwa-cf-row{display:flex;gap:8px;justify-content:flex-end}
  .pwa-cf-row .btn{min-height:44px;min-width:64px}

  .hidden{display:none !important}
  .right{text-align:right}
  .muted{color:var(--muted)}
  .money{font-variant-numeric:tabular-nums;font-weight:800}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800;
    background:var(--card);border:1px solid var(--line)}
  /* scan button */
  .scan-btn{position:relative;overflow:hidden}
  .scan-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
  /* pull hint */
  .pull-hint{text-align:center;font-size:11px;color:var(--muted);padding:6px 0}
  /* ===== ENTERPRISE POLISH v2.20 ===== */
  .pwa-top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg, rgba(245,158,11,.0), rgba(245,158,11,.35), rgba(245,158,11,.0))}
  .card{position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);pointer-events:none}
  .card:has(.cust-field){overflow:visible}
  .card:has(.cust-field)::before{display:none}
  html[data-theme="light"] .card::before{background:linear-gradient(90deg, transparent, rgba(0,0,0,.04), transparent)}
  .kpi{transition:transform .12s, box-shadow .15s}
  .kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.14)}
  .pwa-bar .b{transition:all .15s}
  .pwa-bar .b.on{box-shadow:0 4px 14px rgba(245,158,11,.18);transform:translateY(-1px)}
  /* bulk picker */
  .bulk-picker{position:fixed;inset:0;z-index:65;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(4px)}
  .bulk-box{background:var(--card);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .bulk-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--card2)}
  .bulk-head b{flex:1}
  .bulk-search{padding:10px 12px;border-bottom:1px solid var(--line)}
  .bulk-search input{width:100%;min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:15px}
  .bulk-list{flex:1;overflow:auto;padding:8px 12px}
  .bulk-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card2);cursor:pointer}
  .bulk-item.on{border-color:var(--accent);background:rgba(245,158,11,.10)}
  .bulk-item input[type=checkbox]{width:18px;height:18px}
  .bulk-item .tx{flex:1;min-width:0}
  .bulk-item .tx b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bulk-item .tx small{font-size:11px;color:var(--muted)}
  .bulk-actions{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--card2)}
  .bulk-actions .btn{flex:1}
  /* scan CTA */
  .scan-cta{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid var(--accent);background:rgba(245,158,11,.12);color:var(--accent);font-weight:800;font-size:13px;cursor:pointer}
  .scan-cta:hover{filter:brightness(1.08)}
  /* ===== ENTERPRISE PREMIUM v2.21 — dedicated apps modern system ===== */
  :root{ --accent-grad: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%); --ok-grad: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); --card-elev:0 12px 40px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.06) inset; --r-xl:20px }
  @media (prefers-color-scheme: light){ :root{ --accent-grad: linear-gradient(135deg, #c2410c 0%, #9a3412 100%); --ok-grad: linear-gradient(135deg, #15803d 0%, #14532d 100%); } }
  html[data-theme="light"]{ --accent-grad: linear-gradient(135deg, #c2410c 0%, #9a3412 100%); --ok-grad: linear-gradient(135deg, #15803d 0%, #14532d 100%); }
  html[data-theme="dark"]{ --accent-grad: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%); --ok-grad: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
  body{ background: radial-gradient(1100px 600px at 20% -12%, rgba(245,158,11,.14), transparent 55%), radial-gradient(800px 500px at 95% 0%, rgba(56,189,248,.10), transparent 50%), var(--bg); }
  .pwa-top{ min-height:56px; background: linear-gradient(180deg, rgba(19,28,46,.96), rgba(15,23,41,.88)); backdrop-filter: saturate(1.3) blur(16px); border-bottom:1px solid rgba(255,255,255,.08); box-shadow:0 4px 20px rgba(0,0,0,.18); }
  html[data-theme="light"] .pwa-top{ background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,250,252,.88)); border-bottom:1px solid rgba(0,0,0,.06); box-shadow:0 4px 20px rgba(15,23,42,.08); }
  .pwa-top .ttl{ font-size:17px; letter-spacing:.3px; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .pwa-top .pwa-acts, .pwa-top .net, .pwa-top .icon-btn{flex:0 0 auto}
  @media (max-width:480px){ .pwa-top{padding:8px; gap:6px} .pwa-top .ttl{font-size:13px} .pwa-top .net{font-size:11px; padding:4px 8px} .pwa-top .icon-btn{width:32px; height:32px; font-size:13px} }
  @media (max-width:360px){ .pwa-top .ttl small{display:none} .pwa-top .net{padding:4px 6px; max-width:84px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap} }
  .pwa-top .ttl small{ background:var(--card); border:1px solid var(--line); padding:2px 7px; border-radius:999px; font-size:11px; }
  .card{ border-radius:16px; box-shadow:var(--card-elev); border:1px solid var(--line); background: linear-gradient(180deg, var(--card), var(--card2)); }
  .card h3{ font-size:11px; letter-spacing:.7px; color:var(--muted); border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:12px; }
  .kpi{ border-radius:16px; background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%); box-shadow:var(--card-elev); border:1px solid var(--line); position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; inset:0 0 auto 0; height:2px; background:var(--accent-grad); opacity:.9; }
  .kpi b{ font-size:20px; font-weight:900; letter-spacing:-.3px; }
  .task{ border-radius:14px; background: linear-gradient(180deg, var(--card2), var(--card)); box-shadow:0 4px 14px rgba(0,0,0,.10); border:1px solid var(--line); }
  .task .ico{ background: linear-gradient(135deg, var(--card), var(--card3)); border:1px solid var(--line); box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .pwa-bar{ background:rgba(15,23,41,.92); backdrop-filter:saturate(1.4) blur(20px); border-top:1px solid rgba(255,255,255,.08); box-shadow:0 -8px 32px rgba(0,0,0,.22); padding:8px 10px calc(10px + var(--safe-b)); gap:8px; }
  html[data-theme="light"] .pwa-bar{ background:rgba(255,255,255,.92); border-top:1px solid rgba(0,0,0,.06); box-shadow:0 -8px 32px rgba(15,23,42,.12); }
  .pwa-bar .b{ border-radius:14px; min-height:56px; font-size:11px; letter-spacing:.4px; }

  // camera barcode helper — enterprise: external PWA scanner → BarcodeDetector → file fallback
  function scanWithExternal(onResult){
    try{
      var live = (state.data && state.data.config && state.data.config.scannerLiveUrl) || '';
      if(live){
        var ret = location.href.split('?')[0].split('#')[0];
        var nonce = Math.random().toString(36).slice(2,9);
        var url = live + (live.indexOf('?')>-1 ? '&' : '?') + 'ret=' + encodeURIComponent(ret) + '&n=' + nonce + '&t=' + Date.now();
        var w = window.open(url, '_blank');
        if(w){
          var handler = function(ev){
            try{
              if(!ev || !ev.data || ev.data.type!=='HASEEB_QR_RESULT' || ev.data.nonce!==nonce) return;
              window.removeEventListener('message', handler);
              var code = String(ev.data.code||ev.data.text||'').trim();
              if(code){ haptic(true); onResult(code); }
            }catch(e){}
          };
          window.addEventListener('message', handler);
          setTimeout(function(){ window.removeEventListener('message', handler); }, 120000);
          return true;
        }
      }
    }catch(e){}
    return false;
  }

  // Bulk picker — DEDICATED Bulk Add Modal (conflict-free, per spec)
  // Opens a modal with its own scan field + search + checkbox list + bulk collection.
  // Scan NEVER touches the search input or the product dropdown; field auto-clears after every scan.
  /* ═══════════════════════════════════════════════════════════════════════
     PWA.attachScan(input, cfg) — v2.24.3 — HARDWARE scanner support (HID wedge).
     ---------------------------------------------------------------------------
     Masla: PWA screens (Field order, Warehouse, Salesman stock) camera se scan
     kar leti thin, magar asli HANDHELD SCANNER (keyboard wedge) sirf text type
     kar deta tha — Enter par kuch nahi hota tha. Main app (UI2.attachScan) ise
     handle karta hai; ab PWA bhi wahi behaviour deta hai:

       Enter  → exact item hit → cfg.onHit(item) + field CLEAR + refocus
                            → multi hit  → cfg.onMulti?/toast, field rehta hai (chunne ke liye)
                            → miss       → warn toast + field CLEAR (agla scan ready)
       input  → scan-shaped payload 280ms mein settle → wahi upar wala flow
       (poora payload = 8+ digits ya CODE-1234 jaisa)

     cfg: { find(code) → array, onHit(item), onMulti(list), label }
     ═══════════════════════════════════════════════════════════════════════ */
  function attachScan(input, cfg){
    cfg = cfg || {};
    var SCANSHAPE = /^(\d{8,14}|[A-Za-z]{1,4}[-.]?\d{3,})$/;
    var deb = null;
    function act(code){
      var clean = String(code || '').trim();
      if(!clean) return false;
      var list = (cfg.find ? cfg.find(clean) : []) || [];
      if(list.length === 1){
        if(cfg.onHit) cfg.onHit(list[0], clean);
        return true;
      }
      if(list.length > 1){
        if(cfg.onMulti) cfg.onMulti(list, clean);
        else PWA.toast(list.length + ' matches — list se chunein', 'warn');
        try { input.focus(); } catch(e){}
        return false;
      }
      PWA.toast((cfg.label || 'Code') + ' not found: ' + clean, 'warn');
      input.value = ''; try { input.focus(); } catch(e){}
      return false;
    }
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        var v = String(input.value || '').trim();
        if(!v) return;
        e.preventDefault(); clearTimeout(deb);
        act(v);
      }
    });
    input.addEventListener('input', function(){
      clearTimeout(deb);
      var v = String(input.value || '').trim();
      /* HID wedge: poora code-shaped payload settle hone par (Enter ke baghair bhi) */
      if(SCANSHAPE.test(v)){
        deb = setTimeout(function(){ if(String(input.value || '').trim() === v) act(v); }, 280);
      }
    });
    input.dataset.scanAware = '1';
    return input;
  }

      if(typeof onAdd==='function') onAdd(vals);
    });
    sIn.addEventListener('input', render);
    sIn.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault();   // Enter in SEARCH must never hijack scanning; just keep list
        var first = list.querySelector('.bulk-item'); if(first) first.click();
      }
    });
    render(); updateHead(); renderSel();
    setTimeout(function(){ try{ scanIn.focus(); }catch(e){} }, 80);
  }
  // ===== CUSTOMER PICKER — shared autocomplete (fixes datalist re-click bug) =====
  function createCustomerField(opts){
    opts = opts || {};
    var customers = opts.customers || [];
    var placeholder = opts.placeholder || 'Customer naam';
    var initial = opts.value || '';
    var onSelect = opts.onSelect || function(){};
    var labelTxt = opts.label || 'Customer';
    var wrap = el('div', {class:'f cust-field'});
    var label = el('label', {text: labelTxt});
    var inputWrap = el('div', {class:'cust-input-wrap'});
    var input = el('input', {type:'text', placeholder: placeholder, value: initial, autocomplete:'off', 'aria-label': labelTxt, 'aria-autocomplete':'list', 'aria-expanded':'false'});
    var clearBtn = el('button', {class:'cust-clear', type:'button', title:'Clear', 'aria-label':'Clear customer'}, '✕');
    inputWrap.appendChild(input);
    inputWrap.appendChild(clearBtn);
    var dd = el('div', {class:'cust-dropdown', role:'listbox'});
    var hint = el('div', {class:'cust-hint muted', id: (opts.hintId||'')});
    if(opts.hintText) hint.textContent = opts.hintText;
    wrap.appendChild(label);
    wrap.appendChild(inputWrap);
    wrap.appendChild(dd);
    if(hint) wrap.appendChild(hint);
    var selectedId = opts.selectedId || '';
    var isOpen = false;
    var closeTimer = null;
    function setSelected(customer){
      if(customer){
        selectedId = customer.id;
        input.value = customer.name;
        input.setAttribute('aria-expanded','false');
      } else {
        selectedId = '';
      }
      onSelect(customer, input.value.trim());
    }
    function filterList(q){
      q = String(q||'').trim().toLowerCase();
      var list = customers;
      if(q){
        list = customers.filter(function(c){ return c.name.toLowerCase().indexOf(q)>-1 || String(c.phone||'').indexOf(q)>-1; });
      }
      return list.slice(0, 20);
    }
    function renderDropdown(){
      var q = String(input.value||'').trim().toLowerCase();
      var list = filterList(input.value);
      dd.innerHTML = '';
      if(!list.length){
        // no match — offer to create new
        if(q){
          var addRow = el('div', {class:'cust-add-row', text: '＋ Naya customer: \"' + input.value.trim() + '\"'});
          addRow.onclick = function(){ setSelected(null); closeDd(); };
          dd.appendChild(addRow);
        } else {
          dd.appendChild(el('div', {class:'empty', style:'padding:12px', text:'Koi customer nahi'}));
        }
      } else {
        list.forEach(function(c){
          var isSel = c.id===selectedId;
          var bal = Number(c.bal||0);
          var row = el('div', {class:'cust-opt'+(isSel?' on':''), role:'option', 'aria-selected': isSel?'true':'false'});
          row.appendChild(el('div', {class:'ico', text:'👤'}));
          var tx = el('div', {class:'tx'});
          tx.appendChild(el('b', {text: c.name}));
          tx.appendChild(el('small', {text: (c.phone? c.phone+' · ':'') + (bal? 'Due '+money(bal):'No dues') + (c.priceTier? ' · '+c.priceTier:'' )}));
          row.appendChild(tx);
          row.appendChild(el('span', {class:'badge '+(bal>0?'warn':''), text: c.priceTier||'RETAIL'}));
          row.addEventListener('click', function(e){ e.stopPropagation(); setSelected(c); closeDd(); input.focus(); });
          // touch feedback
          row.addEventListener('mousedown', function(e){ e.preventDefault(); });
          dd.appendChild(row);
        });
        if(q && !list.some(function(c){ return c.name.toLowerCase()===q; })){
          var addRow2 = el('div', {class:'cust-add-row', text: '＋ Naya: \"' + input.value.trim() + '\" ke naam se'});
          addRow2.onclick = function(){ setSelected(null); closeDd(); };
          dd.appendChild(addRow2);
        }
      }
    }
    function openDd(){
      if(isOpen) return;
      isOpen = true;
      renderDropdown();
      dd.classList.add('show');
      input.setAttribute('aria-expanded','true');
      // FIX: dropdown clipped by .card{overflow:hidden} — use fixed positioning aligned to input
      try{
        var rect = inputWrap.getBoundingClientRect();
        if(rect && rect.width){
          dd.classList.add('as-fixed');
          dd.style.top = (rect.bottom + 6) + 'px';
          dd.style.left = rect.left + 'px';
          dd.style.width = rect.width + 'px';
          // keep within viewport vertically
          var vh = window.innerHeight || 600;
          var maxH = Math.min(260, vh - rect.bottom - 20);
          if(maxH < 120) maxH = 120;
          dd.style.maxHeight = maxH + 'px';
        }
      }catch(e){}
    }
    function closeDd(){
      isOpen = false;
      dd.classList.remove('show');
      dd.classList.remove('as-fixed');
      dd.style.top=''; dd.style.left=''; dd.style.width=''; dd.style.maxHeight='';
      input.setAttribute('aria-expanded','false');
    }
    function refreshHint(){
      // caller updates hint via onSelect, nothing to do here
    }
    // events
    input.addEventListener('focus', function(){ openDd(); renderDropdown(); });
    input.addEventListener('click', function(){ openDd(); renderDropdown(); });
    input.addEventListener('input', function(){
      selectedId = '';
      // find exact match
      var exact = customers.filter(function(c){ return c.name.toLowerCase()===String(input.value).trim().toLowerCase(); })[0];
      if(exact) selectedId = exact.id;
      onSelect(exact||null, input.value.trim());
      openDd();
      renderDropdown();
    });
    input.addEventListener('keydown', function(e){
      if(e.key==='Escape'){ closeDd(); input.blur(); }
      if(e.key==='Enter'){ // keep dropdown open but allow selection via first match
        // if dropdown shows one exact, select it
      }
    });
    clearBtn.addEventListener('click', function(e){
      e.stopPropagation();
      input.value = '';
      selectedId='';
      onSelect(null, '');
      renderDropdown();
      openDd();
      input.focus();
      haptic(true);
    });
    // click outside to close
    document.addEventListener('click', function(e){
      if(!wrap.contains(e.target)) closeDd();
    });
    window.addEventListener('resize', function(){ if(isOpen) openDd(); });
    window.addEventListener('scroll', function(){ if(isOpen) openDd(); }, true);
    // allow external updates
    function setCustomers(newList){
      customers = newList || [];
      renderDropdown();
    }
    function setValue(name, id){
      input.value = name||'';
      selectedId = id||'';
      renderDropdown();
    }
    function getValue(){ return { name: input.value.trim(), id: selectedId, input: input }; }
    // initial render if value preset
    if(initial){
      var m = customers.filter(function(c){ return c.name.toLowerCase()===String(initial).trim().toLowerCase(); })[0];
      if(m) selectedId = m.id;
    }
    renderDropdown();
    return { wrap: wrap, field: wrap, input: input, dropdown: dd, hint: hint, clearBtn: clearBtn, setCustomers: setCustomers, setValue: setValue, getValue: getValue, open: openDd, close: closeDd };
  }
  function attachCustomerAutocomplete(input, customers, onPick){
    // legacy helper — wraps existing input
    var cf = createCustomerField({ customers: customers, value: input.value, placeholder: input.placeholder, label: '', onSelect: onPick });
    // replace input in DOM with new field's input
    try{ input.parentNode.replaceChild(cf.wrap, input); }catch(e){}
    return cf;
  }

  /* v2.28.0 (W5 · spec §9) — field-level visibility PWA mein bhi (desktop App.field ka mirror).
     Permissions bootstrap (S.perms) se aati hain; data asal mein backend se strip hota hai. */
  var FIELD_PERMS = { cost:'field.cost.view', margin:'field.margin.view', contact:'field.contact.view',

    try { return (state && state.data && state.data.perms) || []; } catch (e) { return []; }
  }
  function can(perm) {
    var p = permsList();
    if (p.indexOf('*') > -1) return true;
    if (p.indexOf(perm) > -1) return true;
    var parts = String(perm || '').split('.');
    for (var i = parts.length - 1; i > 0; i--) {
      if (p.indexOf(parts.slice(0, i).join('.') + '.*') > -1) return true;
    }
    return false;
  }
  function field(family) {
    var k = FIELD_PERMS[family];
    if (!k) return true;
    if (!state || !state.data) return true;   /* boot se pehle koi flash na ho */
    return can(k);
  }

  /* v2.28.0 (W5) — shared DOM pass: har screen ke [data-family] nodes par lagta hai.
     Screens sirf attribute lagate hain; faisla ek jagah (PWA.field) hota hai. */
  function applyFields(root) {
    var host = root || document, changed = 0;
    var nodes = host.querySelectorAll ? host.querySelectorAll('[data-family]') : [];
    for (var i = 0; i < nodes.length; i++) {
      var el0 = nodes[i], fam = el0.getAttribute && el0.getAttribute('data-family');
      if (fam && !field(fam)) { el0.hidden = true; el0.setAttribute('aria-hidden', 'true'); changed++; }
    }
    return changed;
  }

  return {
    can: can, field: field, applyFields: applyFields,
    boot: boot, call: call, api: call, toast: toast, el: el, $: $, money: money, haptic:haptic, confirm: confirm,
    fmtDT: fmtDT,
    run: run, runStats: runStats, get _features() { return _features; },
    fail: fail, errBox: errBox, errKind: errKind, errText: errText, errStats: errStats,
    layerVisible: layerVisible, layerReport: layerReport, sweepStale: sweepStale,
    shared: shared, sharedInvalidate: sharedInvalidate, sharedStats: sharedStats, invalidateFor: invalidateFor,
    attachScan: attachScan, sync: sync, logout: logout, updateNet: updateNet, install:install, shareApp:shareApp, requestNotif:requestNotif, toggleTheme:toggleTheme, scanWithCamera:scanWithCamera, openBulkPicker:openBulkPicker, createCustomerField:createCustomerField, attachCustomerAutocomplete:attachCustomerAutocomplete,
    get state() { return state; },
    get data() { return state.data; },
    get cart() { return state.cart; },
    set cart(v) { state.cart = v; },
    queuedCount: queuedCount, reload: function () { load(state.tabs || [], state.renderTab); }
  };
})();

function HA_applyExtraMeta(obj) {
  try {
    if (!obj || !document || !document.head) return;
    Object.keys(obj).forEach(function (k) {
      if (!k || obj[k] === null || obj[k] === undefined) return;
      var m = document.querySelector('meta[name=\"' + k + '\"]');
      if (!m) {
        m = document.createElement('meta');
        m.setAttribute('name', k);
        document.head.appendChild(m);
      }
      m.setAttribute('content', String(obj[k]));
    });
  } catch (e) { }
}
