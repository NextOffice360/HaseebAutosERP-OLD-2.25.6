<style>
/* ==========================================================================
   HASEEB AUTOS — DESIGN SYSTEM
   Modern, fast, mobile-first. No external fonts/CDN (offline safe).
   ========================================================================== */

:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "Noto Nastaliq Urdu", "Noto Sans", sans-serif;
  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-xl: 22px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;

  /* ======================================================================
     TYPE SCALE (v2.6 §1) — ek hi jagah se poori app ki typography.
     36 ad-hoc px sizes (3.4px se 26px) ki jagah 8-step responsive scale.
     Floor 12px: koi bhi padhne wala text 12px se chhota nahi.
     NOTE: chart/gauge ke andar ke font-size SVG user-units hain (viewBox
     scale hota hai) — wo is scale ka hissa nahi (wahan 3.4px asal mein
     bara nazar aata hai).
     ====================================================================== */
  /* v2.6 QA — user: "small text read karnay main difficulty hoti hay".
     Sara scale 1 step upar (responsive: mobile par --fs-* wahi ratio rakhta hai).
     Pehle body 14px tha (POS/ERP ke liye chhota) — ab 15px, headings 18px. */
  /* v2.6 QA (round 2) — napne par pata chala: dashboard ke 122/211 aur POS ke
     261/460 text 14px se CHHOTA tha (yalni aadha se zyada). Is liye poora scale
     ek aur step upar. Ab koi bhi padhne wala text 14px se kam nahi. */
  /* ----------------------------------------------------------------------
     v2.7 TYPOGRAPHY SCALE — professional ERP density
     ----------------------------------------------------------------------
     Masla: pichhla scale (14/15/16/17/19/22/26/30px) bohot bada tha —
     table cells 15px par 2456 jagah, KPI 26px, page title 26px. Dense ERP
     screens mein text charts/donuts se takra raha tha aur jagah zaya hoti thi.

     Naya scale do cheezon par mabni hai:
       · CHART / dense micro text  → 9.2–9.6px  (user ki guidance: compact,
         phir bhi padhne layak — chart labels kabhi arc se nahi takrayenge)
       · UI text                   → 10.8–15px  (WCAG-AA readability qaim)
     Har token ka matlab likha hai taake agla insaan andaza na lagaye.
     ---------------------------------------------------------------------- */
  /* v2.8 TYPOGRAPHY AUDIT — research-based (WCAG AA + Apple HIG + Material 3)
     ------------------------------------------------------------------
     Research (2024-2026): body floor 16px (Google/WCAG best practice),
     WCAG line-height ≥1.5×, letter-spacing ≥0.12×, 4.5:1 contrast normal text
     (3:1 large), Apple HIG Body 17pt / Dynamic Type, Material 3 Expressive
     roles (display/headline/title/body/label). E-commerce mobile needs
     ≥14.5px body for scan-ability, ≥12px for captions (never <12px), and
     headings hierarchy 800→700 with tight letter-spacing.
     Previous scale (10.8–12.8 body) was too thin/light on mobile — headings
     not strong, small text 10.8 thin → readability fail.
     New: system-font (SF Pro / Roboto / Segoe UI), responsive clamp headings,
     tabular-nums for financial figures, weight ≥500 for small text.
  */
  --fs-3xs: 10px;    /* chart micro — never <10, still compact */
  --fs-2xs: 11px;    /* chart labels/axis — min readable on mobile */
  --fs-xs:  12px;    /* badges/hints/table-headers — WCAG floor 12px, w500 */
  --fs-sm:  13.5px;  /* table cells/dense — 13.5 readable, 500-600 weight */
  --fs-md:  14.8px;  /* body/inputs/buttons — default, line-height 1.6 */
  --fs-lg:  15.8px;  /* field labels/emphasized — 500-600 */
  --fs-xl:  18px;    /* section headings — 700, clamp mobile */
  --fs-2xl: 22px;    /* page titles — 800, clamp */
  --fs-3xl: 26px;    /* KPI values — 800 tabular */
  --fs-4xl: 32px;    /* hero — 800 */

  /* SEMANTIC COLOR (§17) — decorative nahi, maqsd ke sath */
  --c-fin:#0369a1;      --c-fin-soft:#e6f4fd;   /* financial / money */
  --c-inv:#7e22ce;      --c-inv-soft:#f3e8ff;   /* inventory / stock */
  --c-pending:#a16207;  --c-pending-soft:#fef4e2;
  --c-done:#15803d;     --c-done-soft:#e8f7ee;

  --bg:#f4f6fb; --bg-2:#eef2f9; --panel:#ffffff; --panel-2:#f8fafc;
  --ink:#0f172a; --ink-2:#334155; --muted:#556274; --muted-2:#5f6d80;
  --line:#e5e9f0; --line-2:#eef2f7;

  --brand:#ff6a00; --brand-2:#ff8c3a; --brand-ink:#ffffff; --brand-soft:#fff2e6;
  /* WCAG AA: brand jab TEXT ho to --brand-text (5.5:1 on #fff), jab SOLID button ho to
     --brand-strong (safed text ke sath 5.1:1) — plain #ff6a00 sirf 2.9:1 tha. */
  --brand-text:#b7410e; --brand-strong:#c2410c;
  /* solid (bharay hue) buttons par kaunsa ink: light theme me safed, dark me gehra */
  --on-brand:#ffffff; --on-ok:#ffffff; --on-err:#ffffff;
  --navy:#0b1220; --navy-2:#131c2e;
  --ok:#15803d; --ok-soft:#e8f7ee; --warn:#a16207; --warn-soft:#fef4e2;
  --err:#b91c1c; --err-soft:#fdecec; --info:#0369a1; --info-soft:#e6f4fd;

  --shadow-1: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --shadow-2: 0 4px 12px rgba(16,24,40,.08), 0 2px 4px rgba(16,24,40,.04);
  --shadow-3: 0 18px 40px rgba(16,24,40,.16);
  --sb-w: 256px; --sb-collapsed-w: 64px; --tb-h: 60px;
  --t: 160ms cubic-bezier(.4,0,.2,1);
  --sb-bg: #0b1220;
  --sb-bg-2: #0f1b33;
  /* v2.9.2 — aliases for legacy tokens (--surface/--border/--text/--pri) used across
     App_Salesman, App_Masters, Pwa shells — ensure dark adapt. */
  --surface: var(--panel);
  --surface-2: var(--panel-2);
  --border: var(--line);
  --text: var(--ink);
  --pri: #2563eb;
  --pri-soft: #dbeafe;
}


/* ===== v2.8 RESPONSIVE TYPOGRAPHY — clamp for headings, 200% zoom safe ===== */
.page-head h2{font-size:clamp(20px,2.2vw,24px); font-weight:800; line-height:1.25; letter-spacing:-0.02em;}
.page-head .sub{font-size:var(--fs-sm); font-weight:500; line-height:1.5; color:var(--muted); }
.card-head h3{font-size:clamp(14px,1.6vw,16px); font-weight:700; line-height:1.35; letter-spacing:0.01em;}
.card-head .actions .btn{font-size:var(--fs-sm); font-weight:600;}
.sec-title,.sec-head h3{font-size:var(--fs-xl); font-weight:700; line-height:1.35;}
.kpi .k-value{font-size:var(--fs-3xl); font-weight:800; line-height:1.2; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;}
.kpi .k-label{font-size:var(--fs-xs); font-weight:700; letter-spacing:0.08em; text-transform:uppercase; line-height:1.4;}
table.tbl th, table.tbl2 th{font-size:var(--fs-xs); font-weight:700; letter-spacing:0.06em; line-height:1.4;}
table.tbl td, table.tbl2 td{font-size:var(--fs-sm); font-weight:500; line-height:1.5;}
.badge{font-size:var(--fs-xs); font-weight:700; letter-spacing:0.02em; line-height:1.3;}
.btn{font-size:var(--fs-md); font-weight:600; line-height:1.3; letter-spacing:0.01em;}
.f-col label{font-size:var(--fs-sm); font-weight:600; letter-spacing:0.02em; line-height:1.4; color:var(--ink-2);}
.f-input{font-size:var(--fs-md); font-weight:500; line-height:1.5;}
/* numbers / financial figures — always tabular, medium weight min 600 */
.num, .tot-row, .ps-row b, .kpi .k-value, .cart2-row .cr-amt{font-variant-numeric:tabular-nums; font-weight:700;}
/* small/supporting text — never thin, weight ≥500, line-height 1.5, contrast ≥4.5:1 */
.hint, .f-hint, .cell-sub, .cb-bal, .pc-code, .cr-meta, .gs-item .t span{font-size:var(--fs-xs); font-weight:500; line-height:1.5;}
/* prevent truncation where it hides useful info — wrap instead */
.pc-name, .cr-name, .li-main b, .gs-item .t b, .page-head h2, .card-head h3{
  white-space:normal; overflow-wrap:anywhere; word-break:break-word; hyphens:auto;
}
/* but keep single-line ellipsis only where intentional (sidebar) */
.sb-name span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}


[data-theme="dark"]{
  --bg:#070b14; --bg-2:#0b1220; --panel:#0f172a; --panel-2:#131c2e;
  --ink:#e6edf3; --ink-2:#cbd5e1; --muted:#a3b1c6; --muted-2:#8b98ad;
  --line:#1e293b; --line-2:#172033;
  --brand:#ff8c3a; --brand-soft:#3a2410; --brand-text:#ff9f6b; --brand-strong:#c2410c;
  /* dark me bright ok/err fill par safed text 2.3:1 hi tha — is liye gehra ink */
  --on-brand:#ffffff; --on-ok:#052e16; --on-err:#1a0303;
  --ok:#22c55e; --ok-soft:#0f2a19; --warn:#f59e0b; --warn-soft:#2d2008;
  --err:#ef4444; --err-soft:#2c1113; --info:#38bdf8; --info-soft:#0b2531;
  /* semantic — dark equivalents */
  --c-fin:#38bdf8;      --c-fin-soft:#0b2531;
  --c-inv:#c084fc;      --c-inv-soft:#22103a;
  --c-pending:#f59e0b;  --c-pending-soft:#2d2008;
  --c-done:#22c55e;     --c-done-soft:#0f2a19;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 6px 18px rgba(0,0,0,.35);
  --shadow-3: 0 20px 50px rgba(0,0,0,.55);
  /* aliases inherit via var(--panel) but explicitly pin dark values for components that used #fff fallback */
  --surface: #0f172a;
  --surface-2: #131c2e;
  --border: #1e293b;
  --text: #e6edf3;
  --pri: #60a5fa;
  --pri-soft: #1e2e4a;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* v2.8.2 — MOBILE BLANK-PAGE FIX
   Apps Script app ko sandboxed <iframe> mein serve karta hai. Mobile browsers
   (khaas kar iOS Safari) us iframe ki height collapse kar dete hain, aur
   `height:100%` us sookhe parent par 0px ban jata hai → SAFAID KHAALI PAGE.
   `min-height:100vh` iframe ko majboor karta hai ke poori screen le.
   (overflow:hidden jaan boojh kar hai — "koi bottom scroll nahi" requirement) */
html,body{height:100%; min-height:100vh; min-height:100dvh}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size: var(--fs-md); line-height:1.6; -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; overflow:hidden;
  letter-spacing:0.01em; /* WCAG text-spacing 0.12× support via relative */
}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--brand-text); text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px; border:3px solid transparent; background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2); background-clip:content-box}
[hidden]{display:none !important}

/* ============================== BOOT ============================== */
/* v2.7 — indeterminate top progress bar.
   Pehle har API call par poora #boot overlay flash hota tha (7 nav → 7 flash).
   Ye patli bar upar rehti hai: screen block nahi hoti, layout nahi hilta. */
#haTopBar{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;pointer-events:none;
  opacity:0;transition:opacity .18s ease;overflow:hidden;background:transparent}
#haTopBar::after{content:'';position:absolute;top:0;left:0;height:100%;width:34%;
  border-radius:0 99px 99px 0;
  background:linear-gradient(90deg,var(--brand) 0%, #ff3d00 100%);
  box-shadow:0 0 10px rgba(255,106,0,.55);transform:translateX(-110%)}
#haTopBar.on{opacity:1}
#haTopBar.on::after{animation:haTopSlide 1.05s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes haTopSlide{0%{transform:translateX(-110%)}100%{transform:translateX(420%)}}

.boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:radial-gradient(1200px 600px at 50% -10%, #1b2a4a 0%, var(--navy) 60%);color:#fff}
.boot-card{text-align:center;animation:fadeUp .5s ease both}
.boot-logo{width:74px;height:74px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;
  font-weight:900;font-size: var(--fs-4xl);letter-spacing:1px;color:#fff;
  background:linear-gradient(135deg,var(--brand) 0%, #ff3d00 100%);box-shadow:0 12px 30px rgba(255,106,0,.35)}
.boot-name{font-size: var(--fs-4xl);font-weight:800;letter-spacing:.3px}
.boot-sub{opacity:.7;margin-top:6px;font-size: var(--fs-sm)}
.boot-bar{margin:18px auto 0;width:220px;height:4px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.boot-bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--brand);animation:slide 1.1s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================== LOGIN ============================= */
.login-root{position:fixed;inset:0;z-index:150;display:grid;grid-template-columns:1.15fr 1fr;
  background:var(--bg)}
.login-hero{position:relative;overflow:hidden;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,#12203c 0%, #0b1220 55%, #2a1206 100%)}
.login-hero:before{content:"";position:absolute;inset:0;
  background:radial-gradient(600px 300px at 20% 20%, rgba(255,106,0,.35), transparent 60%),
             radial-gradient(500px 300px at 80% 80%, rgba(2,132,199,.25), transparent 60%)}
.login-hero > *{position:relative;z-index:1}
.lh-brand{display:flex;align-items:center;gap:12px}
.lh-logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:900;
  background:linear-gradient(135deg,var(--brand),#ff3d00);box-shadow:0 8px 20px rgba(255,106,0,.35)}
.lh-title{font-size: var(--fs-3xl);font-weight:800;line-height:1.15}
.lh-title em{display:block;font-style:normal;font-size: var(--fs-xs);opacity:.65;font-weight:500;letter-spacing:1.5px;text-transform:uppercase}
.lh-quote{font-size: var(--fs-4xl);font-weight:700;line-height:1.3;max-width:520px}
.lh-points{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.lh-points span{display:flex;align-items:center;gap:10px;opacity:.85;font-size: var(--fs-md)}
.lh-points i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;
  background:rgba(255,255,255,.12);font-size: var(--fs-sm)}
.lh-foot{font-size: var(--fs-xs);opacity:.5}
.login-panel{display:grid;place-items:center;padding:32px}
.login-box{width:100%;max-width:390px;animation:fadeUp .45s ease both}
.login-box h1{font-size: var(--fs-4xl);margin:0 0 6px}
.login-box p.sub{margin:0 0 26px;color:var(--muted);font-size: var(--fs-md)}
.field{margin-bottom:16px}
.field label{display:block;font-size: var(--fs-xs);font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}
.field .wrap{position:relative}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-m);
  background:var(--panel);outline:none;transition:var(--t);font-size: var(--fs-md)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,106,0,.13)}
.field .hint{font-size: var(--fs-xs);color:var(--muted-2);margin-top:5px}
.login-err{background:var(--err-soft);color:var(--err);border:1px solid rgba(220,38,38,.25);
  padding:10px 12px;border-radius:var(--r-m);font-size: var(--fs-sm);margin-bottom:14px;display:flex;gap:8px}
.demo-creds{margin-top:18px;padding:12px;border:1px dashed var(--line);border-radius:var(--r-m);background:var(--panel-2)}
.demo-creds b{font-size: var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.demo-creds .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;
  font-size: var(--fs-xs);transition:var(--t);user-select:none}
.chip:hover{border-color:var(--brand-text);color:var(--brand-text)}

/* ============================== BUTTONS =========================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;
  background:var(--brand-strong);color:var(--on-brand);border-radius:var(--r-m);cursor:pointer;font-weight:600;
  font-size: var(--fs-md);transition:var(--t);white-space:nowrap;line-height:1.3;
  /* v2.6 QA (round 2) — MEASURED data (tools/_probe): "⏸ Hold" text 39px tha magar
     button 87px → 48px sirf background (55% khaali jagah). Padding 16px→13px aur
     height fix kar di gayi. Ab background text ke qareeb rahega. */
  padding:8px 13px;min-height:38px;
  /* v2.6 QA — emoji icon (⏸ 🗑 💵) apne glyph metrics se LINE BOX barha deta hai
     (measured: min-height 38px hone ke bawajood height 54px). Emoji ko apni
     line-height do, taake button ki height hamesha wahi rahe. */
  line-height:1.15;
  align-self:flex-start;justify-self:start;width:fit-content;max-width:100%}
/* button ke ANDAR emoji/text node ki height control (text node ko span nahi kiya
   ja sakta, is liye font-size + line-height se qaboo) */
.btn{overflow:visible}
/* jahan button ko poori chaurai par chahiye (form actions, modal footer) */
.modal-foot .btn,.form-actions .btn,.btn.block{align-self:stretch;justify-self:stretch;width:auto}
/* ── v2.6 QA (round 2): EK hi button ki 4 alag height (34/44/56/72px) — user:
   "style css messing, not buttons are aligned". Ab har variant ki FIXED height. ── */
.btn{min-height:38px}
.btn.sm{min-height:32px;padding:5px 10px;font-size: var(--fs-sm);border-radius:var(--r-s);gap:6px}
.btn.lg{min-height:48px;padding:12px 18px;font-size: var(--fs-lg);border-radius:var(--r-l)}
/* POS / touch grids: baray tap targets chahiye (industry: >=44px) — magar SAB BARABAR */
.pay-pad .btn,.pay-grid .btn,.qty-pad button{min-height:46px;padding:9px 12px}
/* koi bhi grid/flex button khinch kar 72px na ho jaye */
/* v2.25.0 (req 6) — lambe naam wale chips: text kat-ta tha (mobile overlay audit:
   "CLIPPED text"). Wrap modifier — 44px tap target barqarar, text poori nazar aaye. */
.btn.wrap{white-space:normal; height:auto; min-height:44px; line-height:1.3; text-align:left; max-width:100%; overflow-wrap:anywhere}
.grid .btn,.row .btn,.filters .btn,.card-head .btn,.sec-actions .btn{align-self:center}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;filter:none}
.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{border-color:var(--brand-text);color:var(--brand-text)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--bg-2)}
.btn.danger{background:var(--err);color:var(--on-err)}
.btn.ok{background:var(--ok);color:var(--on-ok)}
/* v2.30.0 (N2) — app-wide SAVE ALL button (header). Sirf tab dikhta hai jab
   page par asli unsaved tabdeeli ho; count badge ke sath. Tap target bada,
   mobile par label chhota na ho is liye nowrap + min-height. */
.sa-btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px}
.sa-btn[hidden]{display:none}
.sa-btn .sa-n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  padding:0 6px;border-radius:10px;background:rgba(0,0,0,.22);font-size:var(--fs-xs);font-weight:700;line-height:1}
.sa-btn .sa-n:empty{display:none}
/* v2.30.0 (N7) — honest capability card (AI screen) */
#aiCapCard{margin-top:12px}
#aiCapCard .cap-h{display:block;margin:10px 0 4px;font-size:var(--fs-sm)}
.cap-list{margin:0;padding-inline-start:20px}
.cap-list li{font-size:var(--fs-xs);line-height:1.6;color:var(--muted)}
.cap-list.ok li::marker{color:var(--ok)}
.cap-list.no li::marker{color:var(--warn)}
@media (max-width:520px){.sa-btn{padding:8px 10px}.sa-btn .sa-lbl{display:none}}
.btn.block{width:100%}
.btn .k{font-size: var(--fs-xs);opacity:.75;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:1px 4px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size: var(--fs-xl);transition:var(--t)}
.icon-btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.icon-btn .badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:auto;min-height:19px;
  padding:1px 5px;border-radius:99px;background:var(--err);color:#fff;font-size: var(--fs-xs);font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--panel);
  line-height:1.25;white-space:nowrap;overflow:visible}
/* ─────────────────────────────────────────────────────────────────────────
   v2.15 PREMIUM SIDEBAR — collapsed = icon-only (64px rail), expanded = full
   titles. Hover on collapsed shows icon tooltips + gentle flyout (premium).
   ───────────────────────────────────────────────────────────────────────── */
@media (min-width:901px){
  /* RAIL (partially collapsed) = SIRF icons, 64px, hover par bhi text nahi */
    .shell.collapsed .sidebar { position:absolute;left:0;top:0;bottom:0;width:var(--sb-collapsed-w);z-index:140;
    transition:width .22s cubic-bezier(.4,0,.2,1), box-shadow .22s ease, border-radius .22s ease;
    overflow:hidden; overflow-y:auto; scrollbar-width:none;
    border-right:1px solid rgba(255,255,255,.07);
    border-radius:0 14px 14px 0 }
  .shell.collapsed .sidebar::-webkit-scrollbar{display:none}
  .shell.collapsed .sidebar .sb-txt,
  .shell.collapsed .sidebar .sb-name,
  .shell.collapsed .sidebar .sb-user-meta,
  .shell.collapsed .sidebar .nav-item .nk,
  .shell.collapsed .sidebar .sb-group { display:none }
  .shell.collapsed .sb-brand{flex-direction:column;gap:8px;padding:12px 6px;justify-content:center}
  .shell.collapsed .sb-logo{width:34px;height:34px;border-radius:11px;font-size:13px}
  .shell.collapsed .sb-collapse{margin-left:0;width:24px;height:24px;font-size:12px;display:grid}
  .shell.collapsed .main{grid-column:2}
  /* rail tooltip — hover par icon ka naam (text show nahi hota) */
  .shell.collapsed .sidebar .nav-item{position:relative}
  .shell.collapsed .sidebar .nav-item:hover::after { content:attr(data-tip); position:absolute; left:calc(100% + 10px); top:50%; transform:translateY(-50%);
    background:#0f172a; color:#fff; font-size:12px; font-weight:600; letter-spacing:.2px;
    padding:7px 10px; border-radius:8px; white-space:nowrap; pointer-events:none;
    box-shadow:0 8px 22px rgba(2,6,23,.28); z-index:5; border:1px solid rgba(255,255,255,.08) }
  .shell.collapsed .sidebar .nav-item:hover::before { content:""; position:absolute; left:calc(100% + 4px); top:50%; transform:translateY(-50%) rotate(45deg);
    width:8px; height:8px; background:#0f172a; border-left:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08); z-index:5 }
}
/* v2.6 QA — 2-3 hisson ka number (100+, 999) kat raha tha: fixed height:17px +
   overflow chhupa deta tha. Ab height auto + overflow visible → number poora dikhega. */
.icon-btn .dot{position:absolute;bottom:-2px;right:-2px;font-size: var(--fs-xs);background:var(--brand);color:#fff;
  border-radius:99px;padding:1px 4px;font-weight:800;letter-spacing:.5px}

/* ============================== SHELL — PREMIUM ============================== */
.shell{display:grid;grid-template-columns:var(--sb-w) 1fr;height:100vh;height:100dvh;overflow:hidden;position:relative;
  background:var(--bg)}
.sidebar{
  background:linear-gradient(180deg, var(--sb-bg-2) 0%, var(--sb-bg) 62%, #0a1020 100%);
  color:#cbd5e1;display:flex;flex-direction:column;min-height:0;
  border-right:1px solid rgba(255,255,255,.07);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.04), 2px 0 18px rgba(2,6,23,.12);
  transition:width var(--t), transform var(--t), box-shadow var(--t)}
.sb-brand{display:flex;align-items:center;gap:12px;padding:16px 16px;border-bottom:1px solid rgba(255,255,255,.07);
  background:linear-gradient(180deg, rgba(255,255,255,.04), transparent)}
.sb-logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:var(--fs-lg);color:#fff;
  background:linear-gradient(135deg,var(--brand) 0%, #ff3d00 100%);box-shadow:0 8px 18px rgba(255,106,0,.32), 0 2px 6px rgba(0,0,0,.18);flex:0 0 auto;
  letter-spacing:.4px}
.sb-name{display:flex;flex-direction:column;line-height:1.2;overflow:hidden;min-width:0}
.sb-name strong{color:#fff;font-size:13.2px;letter-spacing:.1px;font-weight:800}
.sb-name span{font-size:11px;color:#8a9ab3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.sb-nav{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth}
.sb-nav::-webkit-scrollbar{width:5px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.sb-group{font-size:10.8px;text-transform:uppercase;letter-spacing:1.5px;color:#6b7a90;padding:16px 10px 7px;font-weight:800;
  display:flex;align-items:center;gap:8px}
.sb-group::after{content:"";flex:1;height:1px;background:linear-gradient(90deg, rgba(255,255,255,.08), transparent);margin-left:8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:12px;cursor:pointer;color:#a9b6c9;
  font-size:12.9px;font-weight:600;transition:all .16s cubic-bezier(.4,0,.2,1);border:1px solid transparent;position:relative;
  line-height:1.2}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(1px)}
.nav-item.active{background:linear-gradient(90deg, rgba(255,106,0,.20), rgba(255,106,0,.06));color:#fff;
  border-color:rgba(255,106,0,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 2px 10px rgba(255,106,0,.12)}
.nav-item.active:before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:0 3px 3px 0;background:var(--brand);
  box-shadow:0 0 8px rgba(255,106,0,.5)}
.nav-item .ni{width:30px;flex:0 0 30px;text-align:center;font-size:26px;line-height:1;display:grid;place-items:center;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.nav-item .nk{margin-left:auto;font-size:11px;opacity:.55;font-weight:700;min-width:18px;text-align:center;
  background:rgba(255,255,255,.08);border-radius:99px;padding:2px 6px}
/* v2.6 QA — SVG icon library (App_Icons.html). Emoji ki tarah size badalne ki
   zaroorat nahi: SVG har size par saaf rahta hai. Stroke = currentColor is
   liye light/dark theme ke sath rang khud badalta hai. */
.ha-ico{display:block;flex:0 0 auto;stroke:currentColor;opacity:.92}
.nav-item .ni .ha-ico{width:26px;height:26px}
.nav-item:hover .ni .ha-ico,.nav-item.active .ni .ha-ico{opacity:1}
.nav-item.active .ni .ha-ico{stroke:var(--brand)}
.sb-user .ha-ico,.icon-btn .ha-ico{width:20px;height:20px}
/* v2.6 QA — button / heading ke andar laga hua icon (.bi).
   Emoji ki jagah SVG hone se button ki lambai churayi DONO barabar rehni
   chahiye — is liye inline-grid + vertical center. */
.bi{display:inline-grid;place-items:center;flex:0 0 auto;vertical-align:-4px;
  line-height:0;stroke:currentColor}
.btn .bi{margin-right:1px}
.btn.sm .bi svg{width:16px;height:16px}
.sec-head .bi,.card-head .bi{vertical-align:-3px;margin-right:2px}
.empty .big .bi{display:block}
.sb-foot{padding:12px 10px;border-top:1px solid rgba(255,255,255,.07);background:linear-gradient(180deg, transparent, rgba(255,255,255,.02))}
.sb-user{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;cursor:pointer;
  padding:8px 10px;border-radius:12px;text-align:left;color:inherit;transition:all .15s ease}
.sb-user:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.08);transform:translateY(-1px)}
.avatar{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#334155,#475569);
  display:grid;place-items:center;font-weight:800;font-size:var(--fs-sm);color:#fff;flex:0 0 auto;
  box-shadow:0 2px 8px rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.10)}
.sb-user-meta{display:flex;flex-direction:column;line-height:1.25;overflow:hidden;min-width:0}
.sb-user-meta strong{font-size:12.5px;color:#fff;font-weight:700}
.sb-user-meta em{font-size:11px;font-style:normal;color:#8a9ab3;text-transform:uppercase;letter-spacing:.6px;font-weight:600}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.topbar{height:var(--tb-h);flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow-1);z-index:20;
  backdrop-filter:saturate(1.05)}
.sb-toggle{display:none}
/* W6.T3 — sidebar ke PRIMARY controls (☰ / ⇤) ka tap area ≥48px;
   glyph size wahi rehta hai, sirf hit box bara hota hai (mobile + desktop) */
.icon-btn.sb-toggle,.icon-btn.sb-rail{width:48px;height:48px;min-width:48px;min-height:48px;border-radius:13px;font-size:17px}
/* ── premium collapse — icon-only rail (72px) ── */
.shell{transition:grid-template-columns .22s cubic-bezier(.4,0,.2,1)}
.shell.collapsed{--sb-w:var(--sb-collapsed-w)}
.shell.collapsed .sb-name{opacity:0;pointer-events:none;max-width:0;overflow:hidden}
.shell.collapsed .sb-user-meta{opacity:0;pointer-events:none;max-width:0;overflow:hidden}
.shell.collapsed .nav-item{justify-content:center;gap:0;padding:12px 0;border-radius:12px}
.shell.collapsed .nav-item .nk{display:none}
.shell.collapsed .nav-item .ni{width:auto;flex:0 0 auto;font-size:22px}
.shell.collapsed .sb-brand{justify-content:center;padding:14px 8px}
.shell.collapsed .sb-foot .sb-user{justify-content:center;padding:8px}
.shell.collapsed .sb-nav{padding:8px 6px;gap:4px}
.sb-collapse{margin-left:auto;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  color:#cbd5e1;width:48px;height:48px;min-width:48px;min-height:48px;border-radius:12px;cursor:pointer;font-size:14px;
  display:grid;place-items:center;flex:0 0 auto;transition:all .16s ease;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.sb-collapse:hover{background:rgba(255,255,255,.16);color:#fff;transform:translateY(-1px);border-color:rgba(255,255,255,.20)}
.shell.collapsed .sb-collapse{transform:rotate(180deg)}
/* desktop par ⇤ rail button, mobile par ☰ */
.sb-rail{display:inline-grid;place-items:center}
.fs-btn{display:inline-grid;place-items:center}
@media (max-width:900px){
  .sb-rail{display:none}
}
@media (max-width:900px){
  /* v2.25.8 — off-canvas drawer HAMESHA poora (icon+text); desktop ka rail
     state mobile par leak nahi karta (user req 14: "off-canvas behavior should
     not conflict with the desktop collapsed/expanded behavior") */
  .shell.collapsed{--sb-w:256px}
  .shell.collapsed .sb-name,.shell.collapsed .sb-user-meta,
  .shell.collapsed .nav-item .nk,.shell.collapsed .sb-group,.shell.collapsed .sb-txt{display:flex}
  .shell.collapsed .sb-name,.shell.collapsed .sb-user-meta{max-width:none;opacity:1;pointer-events:auto}
  .shell.collapsed .nav-item{justify-content:flex-start;gap:11px;padding:10px 11px}
  .shell.collapsed .nav-item .ni{width:30px;flex:0 0 30px;font-size:26px}
  .shell.collapsed .sb-brand{justify-content:flex-start;padding:16px 16px;flex-direction:row;gap:12px}
  .shell.collapsed .sb-logo{width:40px;height:40px;border-radius:13px;font-size:var(--fs-lg)}
  .shell.collapsed .sb-collapse{display:none}
  .shell.collapsed .sb-foot .sb-user{justify-content:flex-start;padding:8px 10px}
  .shell.collapsed .sb-nav{padding:14px 10px}
}
@media (max-width:700px){
  .fs-btn{display:none}
}
.branch-select{border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--panel-2);
  font-size:12.5px;font-weight:700;cursor:pointer;max-width:170px;box-shadow:var(--shadow-1);transition:all .15s ease}
.branch-select:hover{border-color:var(--brand);background:var(--panel)}
.branch-select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,106,0,.14)}
.global-search{position:relative;flex:1;max-width:520px}
.global-search input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:9px 12px 9px 36px;
  background:var(--panel-2);outline:none;transition:all .15s ease;font-size:12.8px;box-shadow:var(--shadow-1)}
.global-search input:focus{border-color:var(--brand);background:var(--panel);box-shadow:0 0 0 4px rgba(255,106,0,.12), var(--shadow-1)}
.global-search input::placeholder{color:var(--muted-2)}
.gs-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55;font-size:13px}
.gs-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--shadow-3);max-height:60vh;overflow:auto;z-index:60;padding:6px}
.gs-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.gs-item:hover,.gs-item.sel{background:var(--brand-soft)}
.gs-item .t{flex:1;min-width:0}
.gs-item .t b{display:block;font-size: var(--fs-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-item .t span{font-size: var(--fs-xs);color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:7px;margin-left:auto}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px;scroll-behavior:smooth;background:var(--bg)}
.view::-webkit-scrollbar{width:8px;height:8px}
.tabbar{display:none}

/* ============================== CARDS/GRID ======================== */
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{margin:0;font-size:21px;letter-spacing:-.4px;font-weight:800;line-height:1.2}
.page-head .sub{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.4}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* v2.6 QA — page-head actions row-flex hai: default `align-items:stretch` button ko
   VERTICALLY khinch deta tha (Clear 70px, Hold 54px — ek hi class ke alag size). */
.page-head .actions .btn{align-self:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-1);overflow:hidden;transition:box-shadow .16s ease}
.card:hover{box-shadow:var(--shadow-2)}
.card + .card{margin-top:16px}
.card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%)}
.card-head h3{margin:0;font-size:13.5px;font-weight:800;letter-spacing:.1px}
.card-head .actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-head .actions .btn{align-self:center}
.card-body{padding:16px}
.card-body.tight{padding:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2);
  background:var(--panel-2)}
.filters input,.filters select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);
  font-size: var(--fs-sm);outline:none;transition:var(--t)}
.filters input:focus,.filters select:focus{border-color:var(--brand)}
.filters .grow{flex:1;min-width:150px}
/* v2.6 QA — bada font lagu karne ke baad 390px par filter bar viewport se
   bahar (376px) chala gaya. Wajah: children shrink nahi karte the
   (min-width:150px). Ab chhoti screen par sab kuch wrap + shrink hoga. */
@media (max-width:700px){
  .filters{gap:6px;padding:10px 12px}
  .filters input,.filters select{flex:1 1 auto;min-width:0;max-width:100%}
  .filters button{flex:0 0 auto}
  .filters .grow{flex:1 1 100%;min-width:0}
  /* flex child tab tak nahi ghata jab tak min-width:0 na ho — isi liye
     "Today | 7 days | 30 days | 90 days" bar 3px bahar nikal raha tha */
  .filters > *{min-width:0}
  .filters .seg{min-width:0;flex:1 1 auto}
}

/* ============================== KPI =============================== */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;position:relative;
  overflow:hidden;box-shadow:var(--shadow-1)}
.kpi:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;
  background:var(--brand-soft);opacity:.6}
.kpi .k-label{font-size: var(--fs-xs);text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;position:relative}
.kpi .k-value{font-size: var(--fs-3xl);font-weight:800;letter-spacing:-.6px;margin-top:6px;position:relative;
  /* v2.6 QA — lambi tadaad (Rs 13,477,339) card se bahar kat rahi thi.
     --fs-4xl (28px, hero) ki jagah --fs-3xl (24px, KPI values) + wrap safety. */
  line-height:1.2;overflow-wrap:anywhere;word-break:break-word}
.kpi .k-exact{font-size:var(--fs-xs);line-height:1.45;color:var(--muted);overflow-wrap:anywhere;position:relative}
.kpi .k-sub{font-size: var(--fs-xs);color:var(--muted);margin-top:3px;position:relative;display:flex;align-items:center;gap:6px}
.kpi .k-ico{position:absolute;right:14px;top:14px;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  font-size:28px;background:var(--brand-soft);z-index:1}
.kpi.ok .k-ico{background:var(--ok-soft)} .kpi.warn .k-ico{background:var(--warn-soft)}
.kpi.err .k-ico{background:var(--err-soft)} .kpi.info .k-ico{background:var(--info-soft)}
.trend{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:8px}
.trend i{flex:1;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-radius:3px 3px 0 0;min-height:3px;
  transition:var(--t);opacity:.85}
.trend i:hover{opacity:1}

/* ============================== TABLE ============================= */
.table-wrap{overflow:auto;max-height:64vh}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size: var(--fs-sm)}
table.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-size: var(--fs-xs);text-transform:uppercase;
  letter-spacing:.7px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);
  cursor:pointer;white-space:nowrap;z-index:2}
table.tbl th.nos{cursor:default}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
table.tbl tbody tr{transition:var(--t)}
table.tbl tbody tr:hover{background:var(--panel-2)}
table.tbl tbody tr.clickable{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-empty{padding:40px 16px;text-align:center;color:var(--muted);font-size: var(--fs-md)}
.tbl-empty .big{font-size: var(--fs-4xl);display:block;margin-bottom:8px;opacity:.5}
.pager{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line-2);
  background:var(--panel-2);font-size: var(--fs-sm);color:var(--muted)}
.pager .sp{margin-left:auto;display:flex;gap:6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size: var(--fs-xs);font-weight:700;
  letter-spacing:.2px;background:var(--bg-2);color:var(--ink-2)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--err-soft);color:var(--err)} .badge.info{background:var(--info-soft);color:var(--info)}
.badge.brand{background:var(--brand-soft);color:var(--brand-text)}


/* ============================== FORMS ============================= */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
/* v2.6 QA — Purchase Order page: fields truncate/overlap ho rahe the.
   Multi-column grid se jaga bachti hai aur koi field nahi katti. */
.form-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.form-grid.c3 .span2{grid-column:span 2}
.form-grid.c3 .full{grid-column:1/-1}
@media (max-width:900px){
  .form-grid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form-grid.c3 .span2{grid-column:span 2}
}
@media (max-width:560px){
  .form-grid.c3{grid-template-columns:1fr}
  .form-grid.c3 .span2{grid-column:1/-1}
}
.form-grid .full{grid-column:1/-1}
.req:after{content:"*";color:var(--err);margin-left:3px}
/* ---- toggle switch (v2.5 professional) ---- */
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.switch i{width:44px;height:24px;flex:0 0 auto;border-radius:999px;background:#c8d0dc;position:relative;
  transition:background .22s cubic-bezier(.4,0,.2,1),box-shadow .22s ease;
  box-shadow:inset 0 1px 2px rgba(15,23,42,.20)}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.35),0 0 0 1px rgba(15,23,42,.06);
  transition:transform .22s cubic-bezier(.4,0,.2,1),width .16s ease}
.switch input:checked + i{background:var(--brand-strong);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.14),0 0 0 3px rgba(255,106,0,.16)}
.switch input:checked + i:after{transform:translateX(20px)}
.switch input:active + i:after{width:23px}
.switch input:focus-visible + i{outline:2px solid var(--brand);outline-offset:3px}
.switch input:disabled + i{opacity:.45;cursor:not-allowed}
.switch:hover i{filter:brightness(1.04)}
.sw-state{font-size: var(--fs-xs);font-weight:800;letter-spacing:.4px;color:var(--muted-2);min-width:22px}
.switch input:checked ~ .sw-state{color:var(--brand-text)}
/* v2.25.0 (req 6) — SHARED FIX: `.field label{display:block; font-size:fs-xs; color:muted}`
   ki specificity (.field label = 0,1,1) `.switch` (0,1,0) se ZIYADA thi — is liye
   jab bhi switch kisi `.field` ke andar aata tha (GRN: "On credit", "Update item cost",
   PO form, Settings ke kuch switches) to wo toot jata tha:
     · display:block → `<i>` track inline ho jata tha → width 0 → knob (absolute)
       label ke harf ke UPAR paint ho jata tha ("On [knob]edit (supplier udhaar)").
   Ab switch hamesha inline-flex rehta hai aur track block-level hai (fixed height). */
.field label.switch{display:inline-flex; font-size:var(--fs-sm); font-weight:600; color:var(--ink);
  margin-bottom:0; letter-spacing:normal; max-width:100%; flex-wrap:nowrap}
.field label.switch>span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.switch i{display:block}
/* settings row: label/hint left, control right (industry standard) */
.f-row-switch{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-height:48px}
.f-row-switch .frs-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.f-row-switch .frs-label{font-size: var(--fs-sm);font-weight:600;color:var(--ink)}
.f-row-switch .frs-text .f-hint{margin-top:0}
.f-row-switch .switch{flex:0 0 auto}
.f-row-switch:hover{border-color:var(--brand);background:var(--brand-soft)}
.switch.sm i{width:34px;height:19px}
.switch.sm i:after{width:15px;height:15px}
.switch.sm input:checked + i:after{transform:translateX(15px)}
.switch.lg i{width:56px;height:30px}
.switch.lg i:after{width:26px;height:26px}
.switch.lg input:checked + i:after{transform:translateX(26px)}
.switch.lg i:after{width:24px;height:24px}
.switch.lg input:checked + i:after{transform:translateX(26px)}

/* ---- settings: sticky save bar + search ---- */
.cfg-sub{position:relative}
/* v2.8.5 — cfg-bar ab "aik jholi" nahi: actions baayein, status+count daayein,
   har cheez apni jagah. Mobile par wrap ho to bhi saaf do rows. */
.cfg-bar{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;row-gap:8px;align-items:center;flex-wrap:wrap;
  padding:10px 12px;margin-top:14px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface);box-shadow:0 -4px 16px rgba(11,18,32,.10)}
.cfg-bar .sp{flex:1;min-width:4px}
.cfg-bar .btn{flex:0 0 auto;white-space:nowrap}
.cfg-meta{display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}
/* "24 settings" jaisa count ab nanga text nahi — aik saaf badge */
.cfg-bar .pm-count{background:var(--panel-2);border:1px solid var(--line);border-radius:99px;
  padding:4px 10px;font-weight:600;color:var(--muted);white-space:nowrap}
/* v2.8.5 — background tint hata diya: warn-on-tint contrast 3.48:1 ho jata tha
   (WCAG AA fail). Ab plain surface par warn text = pass. */
.cfg-dirty{font-size: var(--fs-xs);font-weight:700;color:var(--warn);display:inline-flex;align-items:center;gap:5px}
.cfg-dirty:before{content:"";width:7px;height:7px;border-radius:99px;background:var(--warn)}
.cfg-search{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cfg-search .f-input{max-width:340px}
.cfg-hit{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
@media (max-width:640px){
  .cfg-bar{position:sticky;bottom:0;border-radius:10px}
}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;
  max-width:100%}
/* v2.6 QA — 390px screen par "Users | Groups & Rights | Permissions" 366px
   ban raha tha aur viewport se bahar chala jata tha. Ab chhoti screen par
   aap horizontal scroll kar sakte hain (koi button nahi katega). */
@media (max-width:700px){
  .seg{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:0 0 auto;white-space:nowrap;padding:6px 10px}
}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size: var(--fs-sm);
  min-height:34px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:600;color:var(--muted);transition:var(--t)}
.seg button.on{background:var(--panel);color:var(--brand-text);box-shadow:var(--shadow-1)}

/* ============================== MODAL / DRAWER ==================== */
/* v2.16 — modal always above cart offcanvas (offcanvas 200 → modal 220), plus premium spacing */
.modal-scrim{position:fixed;inset:0;background:rgba(11,18,32,.58);backdrop-filter:blur(4px);z-index:220;
  display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s ease;
  overflow-y:auto;overscroll-behavior:contain}
/* mobile: modal upar se shuru ho (keyboard/badi body ke sath behtar) */
@media (max-width:760px){
  .modal-scrim{align-items:flex-start;padding:12px}
  .modal2{max-height:calc(100dvh - 24px)}
}
/* modal2 ko scrim ke andar center karein (margin auto + width) */
.modal2{margin:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border-radius:var(--r-xl);box-shadow:var(--shadow-3);width:100%;max-width:560px;
  max-height:88vh;display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:900px} .modal.narrow{max-width:420px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size: var(--fs-lg)}
.modal-head .x{margin-left:auto;border:0;background:var(--panel-2);width:34px;height:34px;border-radius:9px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size: var(--fs-lg)}
.modal-body{padding:18px;overflow:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);
  background:var(--panel-2);border-radius:0 0 var(--r-xl) var(--r-xl)}
.drawer{position:fixed;top:0;right:0;bottom:0;left:auto;width:min(520px,100%);background:var(--panel);z-index:110;max-width:100vw;
  box-shadow:var(--shadow-3);display:flex;flex-direction:column;animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.scrim{position:fixed;inset:0;background:rgba(11,18,32,.45);z-index:105;animation:fade .18s}

/* ============================== TOAST ============================= */
.toast-root{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:300;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:99px;font-size: var(--fs-sm);box-shadow:var(--shadow-3);
  display:flex;align-items:center;gap:9px;animation:toastIn .25s cubic-bezier(.2,.9,.3,1.2);max-width:92vw}
.toast.ok{background:#0f5132} .toast.err{background:#7f1d1d} .toast.warn{background:#7c4a03}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* v2.30.0 (N9) — sync status chip (header): pending count, fail par surkh pulse */
.sync-chip{color:var(--warn);font-weight:700;letter-spacing:.5px}
.sync-chip .sync-n{font-size:var(--fs-xs);margin-left:2px}
.sync-chip.has-fail{color:var(--err);animation:syncPulse 1.6s ease-in-out infinite}
@keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.sync-chip.has-fail{animation:none}}
/* v2.30.0 (N8) — notification service: progress spinner, count badge, sticky, mobile */
.toast.progress{background:#1e3a5f}
.toast .t-spin{width:16px;height:16px;flex:0 0 auto;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:tSpin .8s linear infinite}
@keyframes tSpin{to{transform:rotate(360deg)}}
.toast.sticky{border-left:4px solid #f0b429;padding-left:12px}
@media (max-width:600px){
  .toast-root{left:10px;right:10px;transform:none;bottom:12px;align-items:stretch}
  .toast{width:100%;max-width:none;border-radius:12px;padding:11px 12px}
}

/* ============================== POS =============================== */
.pos{display:grid;grid-template-columns:1fr 380px;gap:14px;height:100%;min-height:0}



   /* v2.7: 31.75px tha — 32px tap-target se kam */
.pos-searchbox .kbd{font-size: var(--fs-xs);border:1px solid var(--line);border-radius:5px;padding:2px 5px;color:var(--muted)}



.pos-card .pc-name{font-weight:600;font-size: var(--fs-sm);line-height:1.25;min-height:32px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* v2.6 QA — POS2 cards (.pcard) par naam 2 lines me kat jata tha
   ("FLAMINGO FOAM CLEANER MULTI…"). Ab 3 lines — saray lafz nazar aayenge. */
.pcard .pc-name{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  line-height:1.25;min-height:48px}
.pos-card .pc-code{font-size: var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.pos-card .pc-row{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.pos-card .pc-price{font-weight:800;color:var(--brand-text);font-size: var(--fs-md)}
.pos-card .pc-stk{font-size: var(--fs-xs);padding:2px 7px;border-radius:99px;background:var(--bg-2);color:var(--muted)}
.pos-card .pc-stk.low{background:var(--err-soft);color:var(--err)}
.pos-card .pc-stk.out{background:var(--err);color:#fff}
.cart{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);display:flex;flex-direction:column;
  min-height:0;overflow:hidden}



.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line-2);
  align-items:center}
.cart-row .cr-name{font-size: var(--fs-sm);font-weight:600;line-height:1.2}
.cart-row .cr-sub{font-size: var(--fs-xs);color:var(--muted);margin-top:2px}
.qty-ctl{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);
  box-shadow:0 1px 4px rgba(16,24,40,.06)}
.qty-ctl button{border:0;background:var(--panel-2);width:30px;height:32px;cursor:pointer;font-size:15px;line-height:1;font-weight:700;
  transition:all .13s ease}
.qty-ctl button:hover{background:var(--brand-strong);color:#fff}
.qty-ctl button:active{transform:scale(.96)}
.qty-ctl input{width:48px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
  padding:6px 2px;font-size:13px;background:transparent;outline:none;font-weight:700;font-variant-numeric:tabular-nums}
.cart-foot{border-top:1px solid var(--line);padding:12px 14px;background:var(--panel-2)}
.tot-row{display:flex;justify-content:space-between;font-size: var(--fs-sm);padding:3px 0;color:var(--ink-2)}
.tot-row.grand{font-size: var(--fs-3xl);font-weight:800;color:var(--ink);border-top:1px dashed var(--line);margin-top:7px;padding-top:9px}
.tot-row .disc{color:var(--err)}
.pay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}
.pay-grid .btn{padding:9px}
.cust-bar{display:flex;align-items:center;gap:10px;padding:11px 13px;background:linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-1);transition:all .15s ease}
.cust-bar:hover{border-color:var(--brand);box-shadow:var(--shadow-2);transform:translateY(-1px)}
.cust-bar .cb-name{font-weight:700;font-size:12.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:.1px}
.cust-bar .cb-bal{font-size:11px;color:var(--muted);margin-top:1px}

/* ============================== AI ================================ */
.ai-drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);z-index:120;
  box-shadow:var(--shadow-3);display:flex;flex-direction:column;animation:slideIn .22s ease}
.ai-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,rgba(255,106,0,.12),transparent)}
.ai-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),#ff3d00);color:#fff;font-size: var(--fs-lg)}
.ai-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size: var(--fs-md);line-height:1.5;animation:fadeUp .2s ease;
  white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--brand-strong);color:#fff;border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .tool{display:block;margin-top:8px;font-size: var(--fs-xs);opacity:.75;border-top:1px dashed currentColor;padding-top:6px}
.ai-chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 10px}
.ai-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel)}

.ai-input input:focus{border-color:var(--brand)}
.typing{display:flex;gap:4px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:99px;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s} .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ============================== MISC ============================== */
.empty{text-align:center;padding:46px 16px;color:var(--muted)}
.empty .big{font-size: var(--fs-4xl);display:block;margin-bottom:10px;opacity:.45}
.skel{background:linear-gradient(90deg,var(--panel-2) 25%,var(--line-2) 37%,var(--panel-2) 63%);
  background-size:400% 100%;animation:shimmer 1.3s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.mini-chart{display:flex;align-items:flex-end;gap:4px;height:120px;padding:6px 0}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.bar-wrap .bar{width:100%;background:linear-gradient(180deg,var(--brand-2),var(--brand));border-radius:6px 6px 0 0;
  min-height:4px;transition:var(--t)}
.bar-wrap:hover .bar{filter:brightness(1.1)}
.bar-wrap .lbl{font-size: var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.list-item:last-child{border-bottom:0}

.list-item .li-main span{font-size: var(--fs-xs);color:var(--muted)}

.offline-pill.on{background:var(--ok-soft);color:var(--ok)}

/* ============================== PRINT (receipt 80mm) ============== */
.print-root{position:absolute;left:-9999px}
@media print{
  body{overflow:visible;background:#fff}
  .shell,.toast-root,.modal-scrim,.drawer,.ai-drawer,.scrim{display:none !important}
  .print-root{position:static;left:0}
  .receipt{width:80mm;font-family:monospace;font-size:12px;color:#000;background:#fff;padding:4mm}
  .receipt h4{margin:0 0 2px;font-size:15px;text-align:center}
  .receipt .center{text-align:center}
  .receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
  .receipt table{width:100%;font-size:11.5px;border-collapse:collapse}
  .receipt td{padding:1px 0}
  .receipt .r{text-align:right}
  .receipt .b{font-weight:700}
  @page{margin:2mm}
}
.receipt{width:80mm;font-family:monospace;font-size:12px;color:#000;background:#fff;padding:6px}
