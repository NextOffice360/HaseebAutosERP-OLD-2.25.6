  .global-search input::placeholder{font-size:11px}
  .top-actions .icon-btn{width:34px; height:34px; font-size:15px}
  /* W6.T3 — visual chhota, HIT area 48px (tap rule) */
  .top-actions .icon-btn::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px}
  /* keep only first 4 essential icons visible; rest overflow hidden but accessible via horizontal swipe if needed */
  .top-actions{gap:3px}
}
@media (max-width:400px){
  .branch-pick{flex:0 1 86px}
  .branch-select{max-width:86px}
  .global-search{flex:0 1 42px; max-width:42px}
  .global-search input{padding-left:28px}
  .global-search input::placeholder{color:transparent}
  .global-search:focus-within{flex:1 1 auto; max-width:none; position:absolute; left:8px; right:8px; top:6px; z-index:25; box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .global-search:focus-within input::placeholder{color:var(--muted-2)}
  .top-actions .icon-btn:nth-child(n+4){display:none}
}

/* ==========================================================================
   v2 COMPONENTS — tabs (3 levels) · offcanvas · modal2 · smart table ·
   product cards · chips · forms · palette
   ========================================================================== */

/* ------------------------------- TABS ------------------------------------ */
.tabs{display:flex;flex-direction:column;min-height:0}

.tabbar-l1{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:12px;
  flex-wrap:wrap;overflow-x:auto;scrollbar-width:none}   /* wrap pehle — tab chhup kar scroll mein na jaye */
.tabbar-l1::-webkit-scrollbar{display:none}
.tabbar-l1 .tab{position:relative;border:0;background:transparent;padding:11px 15px;cursor:pointer;
  color:var(--muted);font-weight:600;font-size: var(--fs-md);display:flex;align-items:center;gap:8px;white-space:nowrap;
  border-radius:10px 10px 0 0;transition:var(--t)}
/* v2.6 QA — tab icons chhote thay (emoji text size par depend karte thay) */
.tabbar-l1 .tab .ti{font-size:22px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
.tabbar-l2 .tab .ti{font-size:20px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
/* v2.6 QA — level-3 (POS category) tabs ka koi rule hi nahi tha: icon 14px
   inherit ho raha tha jabke l1=22px, l2=20px. Ab sab aik hi tarteeb mein. */
.tabbar-l3 .tab .ti{font-size:18px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
.tabbar-l4 .tab .ti{font-size:17px;line-height:1;flex:0 0 auto;display:grid;place-items:center}
.tabbar-l1 .tab:hover{color:var(--ink);background:var(--panel-2)}
.tabbar-l1 .tab.on{color:var(--brand-text);background:var(--brand-soft)}
.tabbar-l1 .tab.on:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2.5px;
  background:var(--brand);border-radius:3px}
.tabbar-l2{display:flex;gap:3px;padding:3px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:12px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabbar-l2::-webkit-scrollbar{display:none}
.tabbar-l2 .tab{border:0;background:transparent;padding:7px 13px;border-radius:9px;cursor:pointer;font-size: var(--fs-sm);
  font-weight:600;color:var(--muted);white-space:nowrap;transition:var(--t)}
.tabbar-l2 .tab:hover{color:var(--ink)}
.tabbar-l2 .tab.on{background:var(--panel);color:var(--brand-text);box-shadow:var(--shadow-1)}
.tabbar-l3{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabbar-l3 .tab{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:99px;
  min-height:34px;display:inline-flex;align-items:center;gap:6px;
  cursor:pointer;font-size: var(--fs-xs);font-weight:600;color:var(--muted);transition:var(--t)}
.tabbar-l3 .tab:hover{border-color:var(--brand-text);color:var(--brand-text)}
.tabbar-l3 .tab.on{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}
.tbadge{background:var(--brand-strong);color:#fff;border-radius:99px;font-size: var(--fs-xs);padding:1px 5px;min-width:16px;text-align:center}
.tabpanel{animation:fadeUp .22s ease both}

/* ----------------------------- OFFCANVAS --------------------------------- */
.offcanvas{position:fixed;top:0;bottom:0;right:0;left:auto;max-width:100vw;width:min(560px,100vw);background:var(--panel);
  z-index:200;display:flex;flex-direction:column;box-shadow:var(--shadow-3);transform:translateX(102%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);max-width:100vw;overscroll-behavior:contain}
.offcanvas.open{transform:none;right:0}
.offcanvas.closing{transform:translateX(102%)}
.offcanvas.left{left:0;right:auto;transform:translateX(-102%)}
.offcanvas.left.open{transform:none;left:0}
.offcanvas.left.closing{transform:translateX(-102%)}
.offcanvas.sm{width:min(440px,100vw)} .offcanvas.md{width:min(640px,100vw)}
.offcanvas.lg{width:min(860px,100vw)} .offcanvas.xl{width:min(1120px,96vw)}
.oc-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
  background:var(--panel-2)}
.oc-head h3{margin:0;font-size: var(--fs-lg);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc-sub{font-size: var(--fs-xs);color:var(--muted);margin-top:2px}
.oc-actions{display:flex;gap:6px}
.oc-x{border:0;background:var(--line-2);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size: var(--fs-md);width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center}
.oc-x:hover{background:var(--err);color:#fff}
.oc-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.oc-foot{border-top:1px solid var(--line);padding:12px 16px;background:var(--panel-2);display:flex;gap:8px;
  justify-content:flex-end;flex-wrap:wrap}
.oc-scrim{animation:fade .18s}

/* ------------------------------- MODAL 2 --------------------------------- */
.modal2{background:var(--panel);border-radius:var(--r-xl);box-shadow:var(--shadow-3);width:100%;
  max-height:90vh;display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.modal2.sm{max-width:460px} .modal2.md{max-width:680px} .modal2.lg{max-width:960px}
.modal2.xl{max-width:1180px} .modal2.full{max-width:96vw;height:94vh}
.m-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.m-head h3{margin:0;font-size: var(--fs-lg);flex:1}
.m-sub{font-size: var(--fs-xs);color:var(--muted)}
.m-body{padding:16px;overflow:auto;flex:1}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);
  background:var(--panel-2);border-radius:0 0 var(--r-xl) var(--r-xl);flex-wrap:wrap}
/* v2.30.0 (N4/N5) — PAY MODAL: desktop par 2 columns (wide), narrow par single
   column. Har section min-width:0 rakhta hai taake kuch clip na ho, aur horizontal
   scroll kabhi na aaye. */
.pay-cols{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.pay-col{min-width:0;display:flex;flex-direction:column;gap:10px}
.pay-col>*{min-width:0}
@media (min-width:900px){
  .pay-cols{grid-template-columns:minmax(320px,0.95fr) minmax(380px,1.05fr);align-items:start}
}
/* mobile/tablet: modal poori chaurai, andar hi vertical scroll (kuch bahar na jaye) */
@media (max-width:640px){
  .modal2.lg,.modal2.xl{max-width:96vw}
  .modal2 .m-body{padding:12px}
  .pay-cols{gap:10px}
}

/* ---------------------------- SMART TABLE -------------------------------- */
.st2{border:1px solid var(--line);border-radius:var(--r-l);background:var(--panel);overflow:hidden;
  display:flex;flex-direction:column;min-height:0}
.st2-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);
  background:var(--panel-2);flex-wrap:wrap}
.st2-q{flex:1;min-width:170px;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;
  background:var(--panel);outline:none;font-size: var(--fs-sm)}
.st2-q:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,106,0,.12)}
.st2-f{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);
  font-size: var(--fs-sm);outline:none;max-width:170px}
.st2-right{margin-left:auto;display:flex;gap:6px}
.st2-body{overflow:auto;max-height:56vh;min-height:80px}
/* table ke andar ke inputs bhi 32px se kam na hon (touch-friendly) */
.st2-body input,.table-wrap input,table input{min-height:32px;box-sizing:border-box}
.st2.d-compact .st2-body{max-height:62vh}
.st2-foot{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);
  background:var(--panel-2);font-size: var(--fs-sm);color:var(--muted)}
.st2-foot .sp{margin-left:auto;display:flex;gap:6px}
table.tbl2{width:100%;border-collapse:separate;border-spacing:0;font-size: var(--fs-sm)}
table.tbl2 th{position:sticky;top:0;z-index:2;background:var(--panel-2);text-align:left;font-size: var(--fs-xs);
  text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:9px 11px;
  border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
table.tbl2 th.nos{cursor:default}
table.tbl2 th .sort{opacity:.4;font-size: var(--fs-xs);margin-left:4px}
table.tbl2 th.sorted{color:var(--brand)}
table.tbl2 th.sorted .sort{opacity:1}
table.tbl2 td{padding:8px 11px;border-bottom:1px solid var(--line-2);white-space:nowrap;max-width:280px;
  overflow:hidden;text-overflow:ellipsis}
.d-compact table.tbl2 td{padding:5px 11px}
.d-compact table.tbl2 th{padding:7px 11px}
table.tbl2 tbody tr:hover{background:var(--panel-2)}
table.tbl2 tbody tr.clickable{cursor:pointer}
table.tbl2 .num{text-align:right;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:8px;padding:6px 4px;font-size: var(--fs-sm);cursor:pointer}
.chk input{width:16px;height:16px}

/* --------------------------- CHIPS / FILTERS ----------------------------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip2{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 13px;font-size: var(--fs-sm);
  min-height:32px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:600;cursor:pointer;transition:var(--t);white-space:nowrap;color:var(--ink-2)}
.chip2:hover{border-color:var(--brand-text);color:var(--brand-text)}
.chip2.on{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff;box-shadow:0 4px 12px rgba(194,65,12,.26)}

/* ------------------------------- FORM 2 ---------------------------------- */
.form2{min-width:0}
.f-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.f-col{display:flex;flex-direction:column;gap:5px;min-width:0}
.f-col.full{grid-column:1/-1}
.f-col label{font-size: var(--fs-xs);font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.f-input{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel);
  outline:none;transition:var(--t);font-size: var(--fs-md);width:100%}
.f-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,106,0,.12)}
.f-color{height:38px;padding:3px}
.f-hint{font-size: var(--fs-xs);color:var(--muted-2)}
.sec-head{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec-head h4{margin:0;font-size: var(--fs-sm);text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.sec-actions{margin-left:auto;display:flex;gap:6px}
/* ─────────────────────────────────────────────────────────────────────────
   v2.6 QA — user: "jahan bhi sections hain un ko find karnay main proper
   structure, separator, color coded blocks honi chahiye".
   Pehle .sec-head sirf aik chhoti uppercase line thi — dhyaan hi nahi jata tha.
   Ab: left color bar + soft tinted background + neechay separator line.
   ───────────────────────────────────────────────────────────────────────── */
.sec-head{
  padding:9px 13px;
  background:linear-gradient(90deg, var(--bg-2), transparent 85%);
  border-left:4px solid var(--brand);
  border-radius:0 var(--r-s) var(--r-s) 0;
  border-bottom:1px solid var(--line);
}
.sec-head h4{color:var(--ink-2);font-weight:800;letter-spacing:.7px}
/* semantic color coding — har section type ka apna rang (§17: decorative nahi) */
.sec-head.fin  {border-left-color:var(--c-fin);    background:linear-gradient(90deg, var(--c-fin-soft), transparent 85%)}
.sec-head.inv  {border-left-color:var(--c-inv);    background:linear-gradient(90deg, var(--c-inv-soft), transparent 85%)}
.sec-head.ok   {border-left-color:var(--ok);       background:linear-gradient(90deg, var(--ok-soft), transparent 85%)}
.sec-head.warn {border-left-color:var(--warn);     background:linear-gradient(90deg, var(--warn-soft), transparent 85%)}
.sec-head.info {border-left-color:var(--info);     background:linear-gradient(90deg, var(--info-soft), transparent 85%)}
.sec-head.err  {border-left-color:var(--err);      background:linear-gradient(90deg, var(--err-soft), transparent 85%)}
/* v2.8.3 — section ki chhoti wazahat (kya hai / kaise kaam karta hai).
   .sec-head flex hai, is liye description hone par block bana dete hain aur
   title+actions ko apni row mein rakhte hain. */
.sec-head.has-desc{display:block}
.sec-head .sec-head-row{display:flex;align-items:center;gap:10px}
.sec-head .sec-desc{
  margin:5px 0 0; font-size:var(--fs-xs); line-height:1.6; color:var(--muted);
  font-weight:500; max-width:88ch;
}
/* group of related fields = color-coded block (§1: "cards/blocks so related
   information is visually grouped") */
.ui2-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
  padding:var(--sp-4);margin-bottom:var(--sp-4)}
.ui2-block + .ui2-block{margin-top:calc(-1 * var(--sp-2))}
.card + .card{margin-top:var(--sp-3)}

/* ---------------------------- PRODUCT CARDS ------------------------------ */
.pgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));overflow:auto;
  padding:4px 2px;align-content:start}
.pcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:0;cursor:pointer;transition:all .16s cubic-bezier(.4,0,.2,1);overflow:hidden;display:flex;flex-direction:column;
  min-height:124px;text-align:left;box-shadow:var(--shadow-1)}
.pcard:hover{border-color:var(--brand);transform:translateY(-3px);box-shadow:var(--shadow-2)}
.pcard:active{transform:scale(.985)}
/* 1:1 square thumb — image kabhi stretch/crop nahi hoti, har card barabar height */
.pcard .pc-img{aspect-ratio:1/1;width:100%;height:auto;min-height:0;background:var(--panel-2);display:grid;place-items:center;
  overflow:hidden;border-bottom:1px solid var(--line-2);position:relative}
.pcard .pc-img img{width:100%;height:100%;object-fit:contain;background:#fff}
.pcard .pc-img .pc-noimg{font-size: var(--fs-4xl);opacity:.28}
/* quick view */
.pcard .pc-sup{font-size: var(--fs-xs);color:var(--muted-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
/* hover quick-view popover (desktop) */
.pcard .pc-pop{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);
  width:214px;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 14px 34px rgba(15,23,42,.22);padding:9px 10px;text-align:left;pointer-events:none;
  opacity:0;animation:pcpop .16s ease forwards}
.pcard .pc-pop:after{content:"";position:absolute;left:50%;bottom:-6px;width:11px;height:11px;
  margin-left:-5.5px;background:var(--panel);border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);transform:rotate(45deg)}
@keyframes pcpop{to{opacity:1;transform:translateX(-50%) translateY(0)}}
.pc-pop .pop-t{font-size: var(--fs-xs);font-weight:800;line-height:1.25;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-pop .pop-r{display:flex;justify-content:space-between;gap:8px;font-size: var(--fs-xs);padding:1.5px 0}
.pc-pop .pop-r span{color:var(--muted-2)}
.pc-pop .pop-r b{font-variant-numeric:tabular-nums}
.pc-pop .pop-r b.bad{color:var(--err)}
.pc-pop .pop-r b.good{color:var(--ok)}
.pc-pop .pop-f{margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);
  font-size: var(--fs-xs);color:var(--muted-2)}
@media (hover:none){
  .pcard .pc-pop{display:none}
}
.pcard .pc-qv{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:8px;
  background:rgba(11,18,32,.62);color:#fff;display:grid;place-items:center;font-size: var(--fs-xs);font-weight:800;
  opacity:0;transition:var(--t);z-index:3;backdrop-filter:blur(2px)}
.pcard:hover .pc-qv,.pcard:focus-within .pc-qv{opacity:1}
.pcard .pc-qv:hover{background:var(--brand);transform:scale(1.08)}
@media (hover:none){
  .pcard .pc-qv{opacity:1}
}
/* quick view modal */
.qv{display:grid;grid-template-columns:150px 1fr;gap:14px}
.qv-img{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--border);background:#fff;overflow:hidden;
  display:grid;place-items:center}
.qv-img img{width:100%;height:100%;object-fit:contain}
.qv-img .pc-noimg{font-size: var(--fs-4xl);opacity:.25}
.qv-body{min-width:0}
.qv-title{font-size: var(--fs-xl);font-weight:800;margin:0 0 2px}
.qv-sub{font-size: var(--fs-xs);color:var(--muted);margin-bottom:10px}
.qv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-bottom:12px}
.qv-cell{border:1px solid var(--border);border-radius:10px;padding:7px 9px;background:var(--surface-2)}
.qv-cell b{display:block;font-size: var(--fs-md);font-weight:800}
.qv-cell span{font-size: var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.qv-sec{font-size: var(--fs-xs);font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  margin:12px 0 6px}
@media (max-width:520px){
  .qv{grid-template-columns:1fr}
  .qv-img{max-width:180px}
}
.pcard .pc-ph{font-size: var(--fs-4xl);opacity:.35}
.pcard .pc-body{padding:10px 11px;flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.pcard .pc-name{font-size:12.5px;font-weight:700;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:33px;letter-spacing:.1px}
.pcard .pc-code{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.pcard .pc-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px;padding-top:2px}
.pcard .pc-price{font-size:13px;font-weight:800;color:var(--brand-text);letter-spacing:-.1px}
.pcard .pc-stk{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--bg-2);color:var(--muted);
  font-weight:700;border:1px solid transparent}
.pcard .pc-stk.low{background:var(--warn-soft);color:var(--warn)}
.pcard .pc-stk.out{background:var(--err);color:#fff}
.pcard .pc-add{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:9px;background:var(--brand-strong);
  color:#fff;display:grid;place-items:center;font-size: var(--fs-lg);font-weight:700;opacity:0;transition:var(--t);
  box-shadow:var(--shadow-2)}
.pcard:hover .pc-add{opacity:1}
.pcard.fav:before{content:"★";position:absolute;left:6px;top:6px;color:#fbbf24;font-size: var(--fs-sm);z-index:1}.pcard .pc-fav{position:absolute;left:6px;top:6px;font-size: var(--fs-md);line-height:1;z-index:2;
  color:#fff;opacity:.95;padding:3px;border-radius:8px;background:rgba(15,23,42,.62);
  line-height:1;display:inline-flex;align-items:center;justify-content:center;min-width:24px;min-height:24px}
.pcard .pc-fav:hover{opacity:1;transform:scale(1.12)}
.pcard.oos{opacity:.62}
.pcard.oos .pc-price{opacity:.7}
.cart2-row.warn{background:var(--warn-soft);border-left:3px solid var(--warn)}
.pcard.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,106,0,.18)}

/* ------------------------------- PALETTE --------------------------------- */
.pal-q{width:100%;border:0;border-bottom:1px solid var(--line);padding:10px 2px;font-size: var(--fs-lg);outline:none;
  background:transparent}
.pal-list{margin-top:10px;max-height:52vh;overflow:auto}
.pal-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.pal-item.sel,.pal-item:hover{background:var(--brand-soft)}
.pal-item .pi{width:26px;height:26px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center}
.pal-item .pt{flex:1;min-width:0}
.pal-item .pt b{display:block;font-size: var(--fs-md)}
.pal-item .pt span{font-size: var(--fs-xs);color:var(--muted)}

/* ---------------------------- POS v2 — PREMIUM POLISH (simple, modern PWA) ------------------------------ */
.pos2{display:grid;grid-template-columns:1fr clamp(410px,32vw,520px);gap:14px;height:calc(100vh - var(--tb-h) - 74px);height:calc(100dvh - var(--tb-h) - 74px);min-height:440px}
.pos2-main{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.pos2-side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;box-shadow:var(--shadow-2);transition:box-shadow .18s ease}
.pos2-side:hover{box-shadow:var(--shadow-3)}
.pos2-search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--line);
  border-radius:14px;padding:10px 14px;transition:all .16s ease;flex-wrap:wrap;row-gap:8px;box-shadow:var(--shadow-1)}
.pos2-search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(255,106,0,.12), var(--shadow-2);background:#fff}
.pos2-search input{border:0;outline:none;flex:1;font-size:15px;background:transparent;
  padding:8px 0;min-height:36px;font-weight:500}
.pos2-search input::placeholder{color:var(--muted-2);font-weight:400}
.pos2-search > span:first-child{color:var(--ink) !important}
.pos2-search .kbd{color:var(--ink) !important;border-color:var(--line);background:var(--panel-2)}
.cat-rail{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-padding:6px}
.cat-rail::-webkit-scrollbar{display:none}


.cat-card.on{background:linear-gradient(135deg, var(--brand) 0%, #ff7a18 100%);border-color:var(--brand);color:#fff;
  box-shadow:0 6px 16px rgba(255,106,0,.28);transform:translateY(-1px)}


.pos2-gridwrap{flex:1;min-height:0;overflow:auto;padding:2px;scroll-behavior:smooth}
.pos2-count{font-size:11px;color:var(--muted-2);padding:6px 4px 0;text-align:right;font-variant-numeric:tabular-nums;
  letter-spacing:.2px}
/* ---------- anti-flicker: content fade-in (data load par flash nahi aata) ---------- */
@keyframes haFadeIn{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
.fade-in{animation:haFadeIn .16s ease both}
.tbl-wrap,.empty,.pager{animation:haFadeIn .15s ease both}
#view>.page-head,#view>.card,#view>div{animation:haFadeIn .14s ease both}
.skel{background:linear-gradient(90deg,var(--panel-2) 25%,var(--bg-2) 37%,var(--panel-2) 63%);
  background-size:400% 100%;animation:haSkel 1.2s ease-in-out infinite;border-radius:8px}
@keyframes haSkel{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){
  .fade-in,#view>.page-head,#view>.card,#view>div,.tbl-wrap,.empty,.pager,.skel{animation:none!important}
}
@media (max-width:640px){
  .pos2-count{font-size: var(--fs-xs);padding-right:4px}
}
.cart2-head{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%)}
/* v2.14.0 — POS mobile: cart summary bar (drawer trigger) + drawer close btn */
.pos2-cartbar{display:none;align-items:center;gap:10px;width:100%;margin-top:2px;min-height:52px;cursor:pointer;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));border:1px solid rgba(255,255,255,.14);border-radius:var(--r-l);
  background:#111827;color:#fff;font-weight:700;font-size:var(--fs-md);box-shadow:var(--shadow-2)}
.pos2-cartbar .pcb-total{margin-left:auto;font-variant-numeric:tabular-nums;font-size:var(--fs-lg);font-weight:800}
.pos2-cartbar .pcb-count{display:inline-block;min-width:20px;text-align:center;background:rgba(255,255,255,.18);border-radius:999px;padding:1px 8px;font-size:var(--fs-sm);font-weight:800;margin-right:4px}
.pos2-cartbar .pcb-go{font-size:var(--fs-sm);color:#fff;font-weight:600}


.cart2-body{flex:1;overflow:auto;min-height:0;scroll-behavior:smooth}
.cart2-row{display:grid;grid-template-columns:minmax(0,1fr) auto 76px 88px auto;column-gap:10px;row-gap:7px;
  padding:13px 12px 11px;border-bottom:1px solid var(--line-2);align-items:center;background:var(--panel);
  transition:background .14s ease, transform .14s ease}
.cart2-row:hover{background:var(--bg-2);transform:translateX(1px)}
.cart2-row + .cart2-row{border-top:1px solid transparent}
/* v2.16 — product name FULL horizontal row (premium, no squeeze), details on row 2 */
.cart2-row>.cr-info{grid-column:1 / -1;grid-row:1;min-width:0}
.cart2-row>.qty-ctl{grid-column:2;grid-row:2;justify-self:start}
.cart2-row>.cr-rate{grid-column:3;grid-row:2;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap;font-weight:600}
.cart2-row>.cr-amt{grid-column:4;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;grid-row:2;white-space:nowrap;font-size:13px;letter-spacing:-.1px}
.cart2-row>.cr-acts{grid-column:5;grid-row:2;display:flex;gap:4px;justify-content:flex-end;align-self:center}
.cart2-row.warn{background:var(--warn-soft);border-left:3px solid var(--warn)}
.cart2-row.warn>.cr-amt{color:var(--warn)}
.cart2-cols{display:grid;grid-template-columns:minmax(0,1fr) auto 76px 88px auto;column-gap:10px;padding:9px 12px;
  font-size:10.8px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);
  background:var(--panel-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;
  backdrop-filter:saturate(1.2)}
.cart2-cols>.cr-info{grid-column:1}.cart2-cols>.hc-qty{grid-column:2;text-align:center}
.cart2-cols>.cr-rate{grid-column:3;text-align:right}.cart2-cols>.cr-amt{grid-column:4;text-align:right}
.cart2-cols>.cr-acts{grid-column:5}
@media (max-width:560px){
  .cart2-row,.cart2-cols{grid-template-columns:minmax(0,1fr) auto 88px auto}
  .cart2-row>.cr-rate,.cart2-cols>.cr-rate{display:none}
  .cart2-row>.cr-amt,.cart2-cols>.cr-amt{grid-column:3;grid-row:2}
  .cart2-row>.cr-acts,.cart2-cols>.cr-acts{grid-column:4;grid-row:2}
  .cart2-row>.qty-ctl{grid-column:2;grid-row:2}
}
/* ── v2.16 premium cart toolbar — clean, aligned, compact (keep 32/38/46 btn heights only) ── */
.cart2-tools{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line-2);background:var(--panel);flex-wrap:wrap;row-gap:8px}
.cart2-tools .btn{border-radius:10px;font-weight:700;box-shadow:var(--shadow-1);font-size:12px;padding:6px 12px;gap:6px}
.cart2-tools .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-2)}
.cart2-tools .btn .ha-ico{width:14px;height:14px;stroke-width:2}
.pos2-bulk{display:inline-flex;align-items:center;gap:6px;margin-left:auto;border:1.5px dashed var(--brand-strong);background:var(--brand-soft);
  color:var(--brand-text);border-radius:999px;padding:7px 13px;min-height:34px;font-size:12px;font-weight:800;cursor:pointer;
  animation:pos2-bulk-pulse 1.6s infinite;box-shadow:var(--shadow-1)}
.pos2-bulk:hover{transform:translateY(-1px);box-shadow:var(--shadow-2);filter:brightness(1.03)}
.pos2-bulk[hidden]{display:none}
@keyframes pos2-bulk-pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,65,12,.18)}50%{box-shadow:0 0 0 6px rgba(194,65,12,0)}}
/* inline Add Product field — inside cart (desktop + drawer) */
.cart-inline-add{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--panel-2);align-items:center}
.cart-inline-add .f-input{flex:1;min-height:36px;border-radius:10px;font-size:12.8px}
.cart-inline-add .btn{font-weight:800;border-radius:10px;white-space:nowrap}
.pos2-picker{border-bottom:1px solid var(--line);background:var(--panel-2);padding:12px 12px;max-height:58%;overflow:auto;min-height:0}
.pos2-picker .gs-results{max-height:232px;position:static;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:10px;box-shadow:var(--shadow-2)}
.pos2-picker .ipk .st2-q{width:100%;border-radius:12px}
.cart2-row .cr-name{font-size:13.2px;font-weight:800;line-height:1.38;white-space:normal;letter-spacing:.12px;color:var(--ink);display:block;overflow:hidden;text-overflow:ellipsis}
.cart2-row .cr-meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
.cart2-row>.cr-info .cr-name{max-width:100%}
.cart2-row>.cr-info .cr-meta{max-width:100%}
.cart2-foot{border-top:1.5px solid var(--line);background:linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);padding:12px 12px;max-height:46%;overflow:auto}
/* v2.17 inline pay row — saves vertical space at bottom (4 buttons in one row, wrap on mobile) */
.pay-pad{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pay-pad .btn{flex:1 1 108px;min-width:108px;border-radius:12px;min-height:46px;font-weight:800;box-shadow:var(--shadow-1);font-size:13px;letter-spacing:.1px}
.pay-pad .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-2)}
.pay-pad .btn.ok{background:var(--ok);border-color:var(--ok)}
.pay-pad .btn.ok:hover{filter:brightness(1.07)}
@media(max-width:560px){
  .pay-pad .btn{flex:1 1 46%;min-width:46%}
}
.tot2{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--ink-2)}
.tot2.big{font-size:20px;font-weight:800;border-top:1.5px dashed var(--line);margin-top:10px;padding-top:10px;letter-spacing:-.2px;color:var(--ink)}
.tot2.big>span{font-variant-numeric:tabular-nums}
.qty-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.qty-pad button{padding:12px 0;font-size: var(--fs-xl);font-weight:700;border:1px solid var(--line);background:var(--panel);
  border-radius:11px;cursor:pointer}
.qty-pad button:hover{border-color:var(--brand);color:var(--brand)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:80;
  width:56px;height:56px;border-radius:50%;background:var(--brand-strong);color:#fff;border:0;font-size: var(--fs-4xl);
  box-shadow:0 10px 26px rgba(255,106,0,.4);cursor:pointer;display:none}
@media (max-width:900px){
  .pos2{grid-template-columns:1fr;height:calc(100vh - var(--tb-h) - 74px);height:calc(100dvh - var(--tb-h) - 74px);min-height:0}
  .pos2-side{display:none}
  /* cart sirf drawer mein — grid ab dhaki nahi hoti */
  .pos2-cartbar{display:flex;position:sticky;bottom:0;z-index:60}
  .f-grid{grid-template-columns:1fr}
  .st2-body{max-height:none}
  .offcanvas.xl,.offcanvas.lg{width:100vw}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(122px,1fr))}
}


/* ==========================================================================
   v2 DASHBOARDS — charts, insights, gauges, progress
   ========================================================================== */
.row{display:flex;align-items:center}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.gap-8{gap:8px}
.grid.g2-1{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.grid.g1-2{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}

.grid.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}

  .grid.g2-1,.grid.g1-2{grid-template-columns:1fr}

}

.chart-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.chart-donut{max-width:200px}
.chart-bars,.chart-area{width:100%;color:var(--ink)}
.chart-cap{font-size: var(--fs-xs);color:var(--muted);text-align:center;margin-top:4px}
.donut-val{font-size:15px;font-weight:800;fill:var(--ink)}
.donut-lab{font-size:8.5px;fill:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.bar-lab{font-size:3.4px;fill:var(--muted)}
.bar-val{font-size:3.6px;fill:var(--ink);font-weight:700}
.bars.horiz .bar-lab{font-size:6px}
.bars.horiz .bar-val{font-size:6.2px}
.spark{max-width:120px}

.legend{display:flex;flex-direction:column;gap:5px;width:100%;margin-top:6px}

.prog{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}

.insights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}

  background:var(--panel-2);align-items:flex-start}

.card-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}

/* ===================== PROFESSIONAL CHARTS (v2.2) ========================= */
.chart-wrap{width:100%;position:relative}
.chart-wrap.center{display:flex;justify-content:center;flex-direction:column;align-items:center}
/* v2.8.5 — gauge ki lambi sub line ab arc se bahar, neeche full-width caption.
   Readable font, wrap allowed, is liye kabhi truncate/overlap nahi. */
/* --muted (dark enough for WCAG AA 4.5:1), --muted-2 nahi (2.9:1 fail) */
.g-sub{font-size:var(--fs-xs);color:var(--muted,#64748b);text-align:center;
  line-height:1.3;margin-top:2px;max-width:100%;overflow-wrap:break-word}
.chart-svg{width:100%;height:auto;max-width:100%}
.chart-svg .bar-rect,.chart-svg .donut-seg,.chart-svg .g-val{cursor:pointer;
  transition:opacity .15s ease}
.chart-svg .bar-rect:hover{opacity:.82}
.chart-svg .donut-seg:hover{opacity:.85}
.chart-svg .ln-pt{cursor:pointer}
.chart-tip{position:fixed;z-index:9000;pointer-events:none;opacity:0;transform:translateY(3px);
  transition:opacity .12s ease;background:rgba(15,23,42,.96);color:#fff;font-size: var(--fs-xs);
  padding:7px 10px;border-radius:9px;box-shadow:0 10px 26px rgba(2,6,23,.32);max-width:260px;line-height:1.55}
.chart-tip.on{opacity:1;transform:none}
.chart-tip b{color:#fff}
.chart-legend{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.chart-legend.inline{flex-direction:row;flex-wrap:wrap;gap:10px}
.lg-row{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;min-height:32px;
  background:none;border:0;text-align:left;font:inherit;cursor:pointer;padding:3px 6px;border-radius:7px}
.lg-row:hover{background:var(--panel-2)}
.lg-row i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg-lab{font-size: var(--fs-xs);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-val{font-size: var(--fs-xs);font-variant-numeric:tabular-nums}
.lg-pct{font-size: var(--fs-xs);color:var(--muted-2);min-width:38px;text-align:right}
.lg-inline{display:inline-flex;align-items:center;gap:6px;font-size: var(--fs-xs);color:var(--muted)}
.lg-inline i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chart-empty{padding:22px;text-align:center;color:var(--muted-2);font-size: var(--fs-sm);
  border:1px dashed var(--line);border-radius:10px;background:var(--panel-2)}
.spark{display:inline-flex;vertical-align:middle}
.spark svg{width:96px;height:26px}
.spark-empty{color:var(--muted-2);font-size: var(--fs-xs)}
.prog-list{display:flex;flex-direction:column;gap:11px}
.prog-top{display:flex;justify-content:space-between;gap:10px;font-size: var(--fs-sm);margin-bottom:4px}
.prog-lab{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-val{color:var(--muted);font-variant-numeric:tabular-nums}
.prog-track{height:16px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.prog-fill{height:100%;border-radius:99px;display:flex;align-items:center;justify-content:flex-end;
  padding-right:7px;color:#fff;font-size: var(--fs-xs);font-weight:800;transition:width .5s cubic-bezier(.4,0,.2,1)}
.prog-sub{font-size: var(--fs-xs);color:var(--muted-2);margin-top:3px}
.heat-strip{display:flex;gap:2px;flex-wrap:wrap}
.heat-cell{width:14px;height:14px;border-radius:3px;display:inline-block}


@media print{
  .chart-tip{display:none}
}

.chart-seg{display:inline-flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:2px}
.cseg{border:0;background:none;font:inherit;font-size: var(--fs-xs);color:var(--muted);cursor:pointer;
  min-height:32px;display:inline-flex;align-items:center;
  padding:4px 10px;border-radius:7px}
.cseg:hover{color:var(--text)}
.cseg.on{background:var(--panel);color:var(--text);font-weight:700;box-shadow:var(--shadow-1)}

/* ==================== AI AGENT CONFIG PANEL (v2.2) ======================= */



.ai-pill.ok{background:#e6f7ee;color:#0a7d43}
.ai-pill.off{background:#f1f3f7;color:#64748b}
/* v2.6 QA — SETTINGS "zig-zag" ki ASLI WAJAH (root cause):
   Yahan `repeat(auto-fit, minmax(180px,1fr))` tha. `auto-fit` KHALI tracks hata
   deta hai — is liye jis section me jitne fields, utne COLUMNS ban jate the:
     4 fields → 4 columns (273px) | 3 → 3 (367px) | 2 → 2 (556px) | 1 → 1 (1122px)
   Har section ki chaurai alag → fields kabhi line-up nahi hote (user: "zig-zag").
   `auto-FILL` tracks barqarar rakhta hai: columns ab CONTAINER se bante hain,
   field-count se nahi — sab sections ek hi grid par align hote hain. */
.f-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px 14px}
.f-col{display:flex;flex-direction:column;gap:5px;min-width:0;font-size: var(--fs-xs);color:var(--muted)}
.f-col.full{grid-column:1/-1}
.f-col .f-input,.f-col textarea,.f-col select{font-size: var(--fs-sm);color:var(--text)}
/* v2.6 QA — hint ab DO ZABANON mein (English + Urdu). English pehle, Urdu us ke
   baad — dono alag line par, Urdu right-to-left. Tooltip mouse rakhne par. */
.f-hint.bi{display:flex;flex-direction:column;gap:1px;line-height:1.35}
.f-hint.bi .hi-en{color:var(--muted)}
.f-hint.bi .hi-ur{color:var(--muted-2);font-size:var(--fs-xs);opacity:.92}
.f-hint.bi .hi-ur:lang(ur){font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Nafees Web Naskh',serif}
.f-col label,.frs-label{cursor:help}

.key-row .f-input{flex:1;min-width:220px}
.ai-test{font-size: var(--fs-xs);margin-top:8px;min-height:18px}
/* v2.8.3 — AI Quick setup + section descriptions */








.preset{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;
  padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit}
.preset:hover{border-color:var(--brand,#ff6a00);background:var(--panel)}
.preset b{font-size: var(--fs-sm)}
.preset span{font-size: var(--fs-xs);color:var(--muted-2);line-height:1.45}


.ai-warn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size: var(--fs-xs);color:var(--muted);
  background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
.ai-warn:empty{display:none}

/* ---- chart sizing (professional, kabhi bada nahi) ---- */
.chart-donut-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.chart-donut-wrap .chart-svg{max-width:190px}
.chart-wrap .chart-svg{max-height:320px}
.card-body>.chart-wrap>.chart-svg{max-height:260px}

/* ---- v2.5: overlap-free HTML bar rows (charts) ---- */
.bars-html{display:flex;flex-direction:column;gap:6px;width:100%}
.bh-row{display:grid;grid-template-columns:minmax(84px,36%) 1fr auto;gap:10px;align-items:center}
.bh-row.clickable{cursor:pointer}
.bh-lab{font-size: var(--fs-xs);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bh-track{position:relative;height:16px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
.bh-fill{display:block;height:100%;border-radius:6px;transition:width .3s ease}
.bh-fill.neg{background:var(--err)!important}
.bh-val{font-size: var(--fs-xs);font-weight:800;font-variant-numeric:tabular-nums;min-width:62px;text-align:right;color:var(--text)}
@media (max-width:520px){
  .bh-row{grid-template-columns:minmax(70px,42%) 1fr auto;gap:7px}
  .bh-val{min-width:52px;font-size: var(--fs-xs)}
}
/* charts kabhi bade nahi — card ke andar compact rahein */
.chart-wrap .chart-svg{max-height:230px}
.card-body>.chart-wrap>.chart-svg{max-height:210px}
.chart-donut-wrap .chart-svg{max-width:170px}
.chart-svg text{font-family:inherit}
@media (max-width:760px){
  .chart-wrap .chart-svg{max-height:220px}
  .chart-legend{max-height:150px;overflow:auto}
}

/* ---- print preview: asli kaghaz jaisa preview — v3.0 fix: no truncation, correct @page, isolated doc ---- */
.pp-zoom{display:inline-flex;align-items:center;gap:5px;margin-left:auto}
.pp-zoom .sub{font-size: var(--fs-xs);color:var(--muted-2)}
.print-preview{
  background:#eef1f6;
  background-image:repeating-conic-gradient(#e9edf3 0% 25%, #f4f6fa 0% 50%);
  background-size:16px 16px;
  display:block;
  padding:18px;
  overflow:auto;
  max-height:68vh;
  min-height:220px;
  border:1px solid var(--line);
  border-radius:12px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
@media(max-width:700px){
  .print-preview{max-height:62vh; padding:12px;}
}
.pp-paper{
  transform-origin:top center;
  background:#fff;
  box-shadow:0 8px 26px rgba(15,23,42,.18);
  margin:0 auto;
  width:max-content;
  max-width:100%;
  transition:transform .14s ease;
}
.pp-paper .doc{margin:0 auto; break-inside:avoid; }
.print-preview .pp-paper{ zoom:var(--pp-zoom, 1); }
@supports not (zoom:1){
  .print-preview .pp-paper{zoom:unset;}
}
/* ---- PO / GRN line editor (professional, columns aligned) ---- */
.po-line-head,.po-line{display:grid;grid-template-columns:1fr 66px 72px 96px 92px 28px;
  gap:8px;align-items:center;padding:6px 8px;border-radius:9px}
.po-line-head{font-size: var(--fs-xs);text-transform:uppercase;letter-spacing:.5px;color:var(--muted-2);
  font-weight:800;border-bottom:1px solid var(--line);margin-bottom:2px;border-radius:0}
.po-line{border:1px solid var(--line);background:var(--panel-2);margin-bottom:6px}
.po-line .pl-name{min-width:0;display:flex;flex-direction:column;gap:3px}
.po-line .pl-name b{font-size: var(--fs-sm);font-weight:700;line-height:1.35;white-space:normal;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.po-line .pl-sub{font-size: var(--fs-xs);color:var(--muted-2);white-space:normal;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.po-line .pl-sub-row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
.po-line .pl-badge{font-size:10.8px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--panel);border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.po-line .pl-num,.po-line-head .plh-num{text-align:right;font-variant-numeric:tabular-nums;font-size: var(--fs-sm)}
.po-line-head .plh-name,.po-line .pl-name{text-align:left}
.po-line .pl-num.warn{color:var(--err);font-weight:800}
.po-line input.f-input{padding:5px 7px;font-size: var(--fs-sm)}
.po-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  border-top:2px solid var(--line);margin-top:8px;padding:8px 2px;font-weight:800}
.po-total span{font-size: var(--fs-xs);color:var(--muted);font-weight:600}
.po-total b{font-size: var(--fs-xl);font-variant-numeric:tabular-nums}
.po-meta .badge{padding:2px 8px;border-radius:999px;font-size: var(--fs-xs)}
@media (max-width:640px){
  .po-line-head{display:none}
  .po-line{grid-template-columns:1fr 72px 92px 28px;gap:6px}
  .po-line .pl-num:nth-of-type(1){display:none}
}
/* ---- v2.25.0 (req 2) GRN drawer — naya line grid + sections + live summary ----
   Purana grid inline hardcoded tha (head + row) aur 8 columns 520px drawer mein
   thes jate thay. Ab: mode class (.grn-po / .grn-direct) se columns, aur <=880px
   par har cell apne label ke saath stack hota hai (data-l se). */
.grn-wrap{display:flex;flex-direction:column;gap:4px}
.grn-wrap .sec-head{margin-top:6px}
.grn-po-pick .field{max-width:520px}
.grn-banner{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;
  border:1px solid var(--brand,var(--line));border-radius:12px;background:var(--brand-soft,rgba(255,106,0,.08))}
.grn-banner .gb-ico{font-size:18px}
.grn-banner .gb-tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.grn-banner .gb-tx b{font-size: var(--fs-sm)}
.grn-banner .gb-tx span{font-size: var(--fs-xs);color:var(--muted)}
.grn-lines{margin-top:10px}
.grn-line-head,.grn-line{display:grid;gap:8px;align-items:center}
.grn-line-head{padding:4px 10px 6px;font-size: var(--fs-xs);text-transform:uppercase;
  letter-spacing:.4px;color:var(--muted-2);border-bottom:1px solid var(--line)}
.grn-line{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
  padding:10px;margin-bottom:8px}
.grn-po .grn-line-head,.grn-po .grn-line{grid-template-columns:minmax(160px,1fr) 62px 62px 78px 74px 92px 96px 34px}
.grn-direct .grn-line-head,.grn-direct .grn-line{grid-template-columns:minmax(160px,1fr) 78px 92px 96px 34px}
.grn-line-head .gl-h{text-align:right}
.grn-line-head .gl-h.name{text-align:left}
.grn-line .pl-name{min-width:0;display:flex;flex-direction:column;gap:3px}
.grn-line .pl-name b{font-size: var(--fs-sm);font-weight:700;line-height:1.35;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.grn-line .gl-cell{display:flex;align-items:center;justify-content:flex-end;min-width:0}
.grn-line .gl-cell .badge{font-size:10.8px;white-space:nowrap}
.grn-line .gl-input{padding:6px 8px;font-size: var(--fs-sm);min-height:40px;text-align:right;width:100%}
.grn-line .gl-input:focus{position:relative;z-index:1}
.grn-line .gl-fill{align-self:flex-start;padding:2px 8px;font-size:10.8px;min-height:0}
.grn-line .gl-rm{width:34px;height:34px;border:0}
.grn-empty{display:flex;flex-direction:column;gap:2px;align-items:center;padding:18px 12px;
  border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.grn-empty b{font-size: var(--fs-sm);color:var(--text)}
.grn-empty span{font-size: var(--fs-xs)}
.grn-sum{position:sticky;bottom:0;z-index:2;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;
  justify-content:flex-end;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);box-shadow:0 -6px 18px rgba(0,0,0,.10)}
.grn-sum .gs-i{font-size: var(--fs-xs);color:var(--muted);background:var(--panel-2);
  border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.grn-sum .gs-i b{color:var(--text);font-variant-numeric:tabular-nums}
.grn-sum .gs-i.main{background:var(--brand-soft,rgba(255,106,0,.12));border-color:var(--brand,var(--line))}
.grn-sum .gs-i.main b{font-size: var(--fs-md)}
@media (max-width:880px){
  .grn-line-head{display:none}
  .grn-po .grn-line,.grn-direct .grn-line{grid-template-columns:1fr 1fr}
  .grn-line .pl-name{grid-column:1/-1}
  .grn-line .gl-cell{justify-content:space-between;gap:8px}
  .grn-line .gl-cell::before { content:attr(data-l);font-size: var(--fs-xs);color:var(--muted-2);
    text-transform:uppercase;letter-spacing:.4px;text-align:left }
  .grn-line .gl-rm{justify-self:end}
  .grn-sum{justify-content:flex-start}
}
/* ---- per-user rules editor (allow / deny / inherit) ---- */
.rules-editor{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);overflow:hidden}
.re-tools{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:2}
.re-tools .f-input{flex:1;min-width:140px}
.re-body{max-height:42vh;overflow:auto;padding:6px 8px}
.re-group{margin-bottom:6px}
.re-group-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size: var(--fs-xs);font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-2);
  padding:6px 4px;border-bottom:1px dashed var(--line)}
.re-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
  padding:5px 4px;border-radius:8px}
.re-row:hover{background:var(--brand-soft)}
.re-txt{min-width:0;display:flex;flex-direction:column}
.re-txt b{font-size: var(--fs-sm);font-weight:600}
.re-desc{font-size: var(--fs-xs);color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.re-role{font-size: var(--fs-xs);font-weight:800;padding:2px 7px;border-radius:99px;background:var(--bg-2);color:var(--muted)}
.re-role.on{background:var(--ok-soft);color:var(--ok)}
.re-role.off{background:var(--warn-soft);color:var(--warn)}
.re-box{min-width:74px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  font-size: var(--fs-xs);font-weight:800;cursor:pointer;color:var(--muted-2);transition:var(--t)}
.re-box.inherit{color:var(--muted)}
.re-box.allow{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.re-box.deny{background:var(--err-soft);border-color:var(--err);color:var(--err)}
.re-box:hover{filter:brightness(1.05)}
/* ---- expenses: approval strip ---- */
.exp-pending{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;
  border:1px solid var(--warn);background:var(--warn-soft);border-radius:11px;padding:8px 12px}
.exp-pending b{font-size: var(--fs-sm)}
.exp-pending span{font-weight:800;font-variant-numeric:tabular-nums}
.exp-pending .btn{margin-left:auto}
/* ---- party balance card ---- */
/* ---- POS: previous balance → closing (udhaar ka saaf hisaab) — compact polished grid ---- */

.cust-bal-grid{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;margin-top:4px}
.cust-bal-grid .cbg{flex:1 1 68px;min-width:68px;display:flex;flex-direction:column;gap:1px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.cust-bal-grid .cbg .lbl{font-size:8.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted-2);white-space:nowrap}
.cust-bal-grid .cbg .val{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.cust-bal-grid .cbg.prev .val{color:var(--muted)}
.cust-bal-grid .cbg.bill .val{color:var(--brand-text)}
.cust-bal-grid .cbg.close .val{color:var(--ok)}
.cust-bal-grid .cbg.close.warn .val{color:var(--warn)}
.cust-bal-grid .cbg.close.due .val{color:var(--err)}
.cb-phone{font-size:10.8px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-points{background:var(--brand-soft);border-radius:8px;padding:4px 8px;margin-top:2px;color:var(--brand-text)}
.ps-points b{color:var(--brand-text)}
.ps-ledger{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;
  background:var(--panel-2)}
.ps-ledger .ps-ld-title{font-size: var(--fs-xs);font-weight:800;letter-spacing:.4px;color:var(--muted-2);
  text-transform:uppercase;margin-bottom:5px}
.ps-ledger .ps-row{border-bottom:1px dotted var(--line);padding:2px 0}
.ps-ledger .ps-row:last-child{border-bottom:none}
.ps-ledger .ps-total.due b{color:var(--err)}
.party-bal{display:flex;flex-direction:column;gap:8px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px}
.party-bal.due{border-color:#f6c9c2;background:#fff5f3}
.party-bal.ok{border-color:#c7ecd8;background:#f2fbf6}
.pb-main{display:flex;flex-direction:column;gap:2px}
.pb-lab{font-size: var(--fs-xs);color:var(--muted-2);text-transform:uppercase;letter-spacing:.5px}
.pb-val{font-size: var(--fs-4xl);font-weight:800;letter-spacing:-.4px}
.pb-sub{font-size: var(--fs-xs);color:var(--muted)}
.pb-row.pb-total{border-top:1px solid var(--line);margin-top:2px;padding-top:5px;font-weight:800}
.pb-rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end}
.pb-row{display:flex;flex-direction:column;font-size: var(--fs-xs);color:var(--muted)}
.pb-row b{font-size: var(--fs-sm);color:var(--text)}

/* ---- payment detail fields (wallet / bank / cheque) — compact, no extra padding ---- */
.pay-field{display:flex;flex-direction:column;gap:2px;flex:1 1 132px;min-width:128px}
.pay-field.compact{flex:0 0 148px;min-width:120px;max-width:160px}
.pay-field.compact .f-input{width:148px;max-width:160px}
.pf-lab{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase;line-height:1.2}
.pf-err{font-size:9px;color:var(--err);line-height:1.2}
.pay-field .f-input{padding:7px 9px;font-size:12.2px;border-radius:9px}
.pay-field .f-input.err{border-color:var(--err);background:rgba(239,68,68,.05)}
.pay-extra{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:6px;margin:2px 0 6px}
.pay-extra:has(.pay-field.compact){display:flex;align-items:flex-end;gap:6px;grid-template-columns:none}
.pay-extra:has(.pay-field.compact) .pay-field{flex:0 0 148px}

/* ---- wallet gateway panel (EasyPaisa / JazzCash) ---- */
.wallet-panel{border:1px solid var(--border);border-radius:12px;padding:9px 10px;margin:2px 0 10px;background:var(--surface-2)}
.wallet-head{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:7px;font-size: var(--fs-sm)}
.wallet-keys{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.wallet-keys .f-input{flex:1 1 140px;min-width:130px}
.wallet-status{margin-top:2px}
.wallet-status .ws-row{display:flex;align-items:center;gap:8px;font-size: var(--fs-sm);margin-top:4px}
.wallet-note{border:1px dashed var(--border);border-radius:10px;padding:8px 10px;font-size: var(--fs-xs);background:var(--surface-2)}
.wallet-monitor .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---- payment modal: bill summary ---- */
.pay-summary{border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-bottom:10px;background:var(--surface-2)}
.ps-row{display:flex;justify-content:space-between;align-items:center;font-size: var(--fs-sm);color:var(--muted);padding:2px 0}
.ps-row b{color:var(--text);font-size: var(--fs-sm)}
.ps-total{border-top:1px dashed var(--border);margin-top:4px;padding-top:6px;font-size: var(--fs-sm)}
.ps-total b{font-size: var(--fs-xl);font-weight:800}

/* ---- warehouse count sheet ---- */
.cnt-prog{margin-bottom:8px}
.cp-bar{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.cp-fill{height:100%;background:linear-gradient(90deg,var(--brand),#22c55e);transition:width .25s ease}
.cp-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size: var(--fs-xs);color:var(--muted);margin-top:6px}

/* ---- v2.5: mobile order pad (takeorder) ---- */
#view.m-full{padding:0;margin:0;height:calc(100vh - var(--head-h, 54px));display:flex;flex-direction:column}
.mo{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--surface)}
.mo-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.mo-title{font-weight:800;font-size: var(--fs-lg)}
.mo-cust{width:calc(100% - 24px);margin:10px 12px 6px;padding:12px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);text-align:left;font-size: var(--fs-md);font-weight:600}
.mo-search{margin:0 12px;padding:13px;border-radius:12px;border:1.5px solid var(--line);font-size: var(--fs-lg)}
.mo-results{margin:6px 12px;max-height:26vh;overflow:auto;border:1px solid var(--border);border-radius:12px}
.mo-hit{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px 12px;border:0;
  border-bottom:1px solid var(--border);background:transparent;font-size: var(--fs-md)}
.mo-hit:active{background:var(--surface-2)}
.mo-cart{flex:1;min-height:0;overflow:auto;margin:8px 12px;border:1px solid var(--border);border-radius:12px}
.mo-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.mo-linfo{flex:1;min-width:0;font-size: var(--fs-sm)}
.mo-lqty{display:flex;align-items:center;gap:6px}
.qbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);font-size: var(--fs-2xl);font-weight:700}
.qval{min-width:34px;text-align:center;font-weight:700}
.mo-foot{border-top:1px solid var(--border);padding:10px 12px 14px;background:var(--surface-2)}
.mo-totals{margin-bottom:8px}
.mo-trow{display:flex;justify-content:space-between;font-size: var(--fs-sm);color:var(--muted);padding:1px 0}
.mo-trow b{color:var(--text);font-size: var(--fs-sm)}
.mo-grand b{font-size: var(--fs-2xl);font-weight:800}
.mo-inputs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.mo-inputs .f-input{flex:1 1 110px;min-width:104px}
.mo-submit{width:100%;padding:15px;border:0;border-radius:14px;background:var(--brand-strong);color:#fff;font-size: var(--fs-xl);font-weight:800}

/* ---- reorder ▸ orders verification ---- */
.ro-summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.chip2{font-size: var(--fs-xs);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 9px;color:var(--text)}
.po-meta{display:flex;gap:14px;flex-wrap:wrap;font-size: var(--fs-xs);color:var(--muted);margin-bottom:10px}

/* ---- Users & Security ▸ permission matrix ---- */
.perm-matrix{display:flex;flex-direction:column;gap:8px}
.pm-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pm-count{font-size: var(--fs-xs);color:var(--muted)}
.pm-row{display:grid;grid-template-columns:minmax(200px,1.6fr) repeat(9,minmax(38px,1fr));gap:4px;align-items:center;padding:5px 6px;border-radius:8px}
.pm-row:hover{background:var(--surface-2)}
.pm-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border);padding:6px}
.pm-head .pm-cell{font-size: var(--fs-xs);font-weight:700;color:var(--muted);text-align:center}
.pm-perm{min-width:0}
.pm-perm b{display:block;font-size: var(--fs-xs);font-weight:600}
.pm-desc{display:block;font-size: var(--fs-xs);color:var(--muted);line-height:1.25}
.pm-code{font-size: var(--fs-xs);color:var(--muted);opacity:.75}
.pm-cell{display:flex;justify-content:center}
.pm-box{width:26px;height:24px;border-radius:6px;border:1.5px solid var(--border);background:transparent;color:var(--ok);font-size: var(--fs-xs);font-weight:800;line-height:1;cursor:pointer;transition:all .12s}
.pm-box:hover:not(:disabled){border-color:var(--brand)}
.pm-box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pm-box.locked{opacity:.55;cursor:not-allowed}
.pm-group{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:8px}
.pm-group-head{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--surface-2);font-size: var(--fs-xs);font-weight:700}
.pm-group-count{font-size: var(--fs-xs);color:var(--muted);font-weight:600}
.pm-body{max-height:52vh;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:6px}
@media (max-width:820px){
  .pm-row{grid-template-columns:minmax(120px,1.3fr) repeat(9,minmax(30px,1fr));gap:2px}
  .pm-box{width:22px;height:21px;font-size: var(--fs-xs)}
  .pm-desc{display:none}
}

/* ---- Shop Open / Close (v2.5) ---- */
.shop-wrap{display:flex;flex-direction:column;gap:12px}
.shop-hero{border-radius:14px;overflow:hidden}
.shop-hero.open{border-color:var(--ok)}
.shop-hero.closed{border-color:var(--line)}
.shop-hero-top{display:flex;gap:14px;align-items:center;padding:16px;flex-wrap:wrap;
  background:linear-gradient(135deg,rgba(255,106,0,.08),transparent)}
.shop-hero.closed .shop-hero-top{background:linear-gradient(135deg,rgba(100,116,139,.10),transparent)}
.shop-badge.big{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size: var(--fs-4xl);
  background:var(--surface-2);border:1px solid var(--border);flex:0 0 auto}
.shop-badge.live{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.4);animation:shopPulse 2.4s ease-in-out infinite}
@keyframes shopPulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.28)}50%{box-shadow:0 0 0 9px rgba(16,185,129,0)}}
.shop-hero-txt{flex:1;min-width:200px}
.shop-hero-txt h3{margin:0 0 3px;font-size: var(--fs-2xl);display:flex;align-items:center;gap:8px}
.shop-hero-txt p{margin:0;font-size: var(--fs-sm);color:var(--muted)}
.live-dot{width:8px;height:8px;border-radius:99px;background:var(--ok);display:inline-block;
  animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.shop-hero-act{display:flex;gap:8px;flex-wrap:wrap}

/* header shop button state */
/* ---- shop open/close pill (header) ---- */
.shop-pill{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
  border-radius:999px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;
  font-size: var(--fs-sm);font-weight:800;color:var(--muted);transition:var(--t)}
.shop-pill .shop-ic{font-size: var(--fs-lg);line-height:1}
.shop-pill .shop-state{width:8px;height:8px;border-radius:99px;background:var(--err);
  box-shadow:0 0 0 2px var(--panel)}
.shop-pill:hover{border-color:var(--brand);color:var(--ink)}
.shop-pill.is-open{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.shop-pill.is-open .shop-state{background:var(--ok);animation:blink 1.6s ease-in-out infinite}
.shop-pill:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (max-width:760px){
  .shop-pill .shop-txt{display:none}
  .shop-pill{padding:0 9px}
}
/* quick dialog bits */
.shop-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.shop-sum{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel-2)}
.shop-sum .tot2.grand{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-size: var(--fs-md)}
.shop-sum .tot2.grand b{color:var(--brand)}
.shop-sum .tot2.ok b{color:var(--ok)}
.shop-sum .tot2.err b{color:var(--err)}

/* denomination counter */
.close-shop{display:flex;flex-direction:column;gap:10px}
.den-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;max-height:40vh;overflow:auto;
  border:1px solid var(--border);border-radius:10px;padding:8px}
.den-row{display:grid;grid-template-columns:52px 1fr 12px auto;gap:6px;align-items:center}
.den-row.coin .den-lab{color:var(--muted)}
.den-lab{font-size: var(--fs-xs);font-weight:700}
.den-in{text-align:right;padding:5px 8px}
.den-x{font-size: var(--fs-xs);color:var(--muted);text-align:center}
.den-sub{font-size: var(--fs-xs);font-weight:700;min-width:62px;text-align:right}
.tot2{display:flex;justify-content:space-between;font-size: var(--fs-sm);padding:6px 2px}
.tot2.big{font-size: var(--fs-xl);font-weight:800;border-top:1px solid var(--border);margin-top:4px}
.tot2.muted{color:var(--muted)}

/* ==========================================================================
   v2.5.1 — CASH BOOK (reports › Cash book)
   Opening + Cash in − Cash out = Closing — ek hi line mein, chip style.
   ========================================================================== */
.cb-eq {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  font-size: var(--fs-sm); padding: 9px 12px; border-radius: var(--r-m);
  border: 1px dashed var(--line); background: var(--surface-2);
}
.cb-eq > span { white-space: nowrap; }
.cb-eq .op { color: var(--muted); font-weight: 700; }
.cb-eq .cb-total { color: var(--brand); font-size: var(--fs-md); margin-left: auto; }
.cb-eq .ok { color: var(--ok); }
.cb-eq .err { color: var(--err); }
.cb-method { min-width: 150px; }
.cb-days table td:first-child, .cb-entries table td:first-child { white-space: nowrap; }

/* ==========================================================================
   v2.6 §1 / §2 / §17 — TYPOGRAPHY HIERARCHY · SECTION SYSTEM · COMPACT ROWS
   --------------------------------------------------------------------------
   Page title > section heading > sub-heading > label > value > helper >
   table header > badge — sab ek hi scale aur ek hi jagah se.
   ========================================================================== */
.page-title{font-size:var(--fs-2xl);font-weight:800;line-height:1.2;letter-spacing:-.01em;
  color:var(--ink);margin:0}
.sec-title,.sec-head h3{font-size:var(--fs-xl);font-weight:700;line-height:1.3;color:var(--ink);margin:0}

.t-label,.field-label{font-size:var(--fs-lg);font-weight:600;color:var(--ink-2)}




/* Section block — related information ek saath (card + heading + separator)
   ---------------------------------------------------------------------------
   v2.6 QA (root cause): ye `.sec` DEAD CSS tha — koi bhi element is class ko
   use hi nahi karta (grep: 0 istemal). Magar `.btn.sec` (120 secondary buttons)
   is selector se MATCH kar jata tha → section ki `padding:16px` button par lag
   jati thi (measured: btn sec ki height 51px, text se 42–52px zyada background).
   Is liye isay HATAYA gaya. Asli section block ab `.ui2-block` hai (upar). */
.ui2-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
  padding:var(--sp-4);margin-bottom:var(--sp-4)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  flex-wrap:wrap;padding-bottom:var(--sp-2);margin-bottom:var(--sp-3);
  border-bottom:1px solid var(--line)}
.sec-head .sec-sub{font-size:var(--fs-xs);color:var(--muted);font-weight:500}



@media (max-width:640px){
  .sec{padding:var(--sp-3)}
}

/* §2 — Compact key/value strip: "Supplier: X | Payable: Rs 0 | Terms: 30d" */
.kv-strip{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px var(--sp-3);
  padding:var(--sp-2) var(--sp-3);background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r-s);font-size:var(--fs-sm)}
.kv-strip .kv{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.kv-strip .kv + .kv{border-left:1px solid var(--line);padding-left:var(--sp-3)}
.kv-strip .k{font-size:var(--fs-xs);font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.03em}
.kv-strip .v{font-size:var(--fs-sm);font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums}
.kv-strip .v.ok{color:var(--ok)}      .kv-strip .v.warn{color:var(--warn)}
.kv-strip .v.err{color:var(--err)}    .kv-strip .v.fin{color:var(--c-fin)}
.kv-strip .v.inv{color:var(--c-inv)}  .kv-strip .v.pending{color:var(--c-pending)}
@media (max-width:640px){
  .kv-strip{gap:6px var(--sp-2)}
  .kv-strip .kv + .kv{border-left:0;padding-left:0}
}

/* §17 — semantic badges (financial / inventory / pending / completed) */
.badge.fin{background:var(--c-fin-soft);color:var(--c-fin);border-color:var(--c-fin-soft)}
.badge.inv{background:var(--c-inv-soft);color:var(--c-inv);border-color:var(--c-inv-soft)}
.badge.pending{background:var(--c-pending-soft);color:var(--c-pending);border-color:var(--c-pending-soft)}
.badge.done{background:var(--c-done-soft);color:var(--c-done);border-color:var(--c-done-soft)}

/* §16 — images lazy + capped, kabhi layout na bigaarein */
img{loading:lazy}


/* ===== v2.6 §3 — PO/GRN price comparison strip (§2: compact multi-column) =====
   Ek hi jagah "Previous: Rs 950 · Current: Rs 1,000 · Change: +Rs 50 (+5.26%)"
   Mobile par wrap ho jata hai, kabhi overlap nahi. */
.pl-price{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;margin-top:3px;
  font-size:var(--fs-xs);color:var(--muted);line-height:1.4}
.pl-price .pl-tag{padding:1px 7px;border-radius:999px;font-weight:600;
  background:var(--c-inv-soft);color:var(--c-inv);border:1px solid var(--line);white-space:nowrap}
.pl-price .pl-hint{font-style:italic;color:var(--muted)}
.pl-price .pl-chg{font-weight:700;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);white-space:nowrap}
.pl-price .pl-chg.up{color:var(--c-fin);background:var(--c-fin-soft)}
.pl-price .pl-chg.down{color:var(--ok);background:var(--ok-soft)}
.pl-price .pl-chg.flat{color:var(--muted);background:transparent}
/* line layout: strip ke sath bhi row seedhi rahe */
.po-line .pl-name{min-width:0;flex:1}
.po-line-head,.po-line{row-gap:2px}

/* v2.9 §6 — image lightbox (product image click → enlarge) */
.img-lightbox{position:fixed;inset:0;z-index:1200;background:rgba(15,23,42,.86);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;cursor:zoom-out}
.img-lightbox img{max-width:min(92vw,900px);max-height:80vh;border-radius:12px;background:#fff;
  box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:auto}
.img-lightbox .lb-cap{color:#e2e8f0;font-size:var(--fs-md);font-weight:700;text-align:center;
  max-width:90vw;overflow-wrap:anywhere}
.img-lightbox .lb-x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:10px;
  border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:15px;cursor:pointer}
.img-lightbox .lb-x:hover{background:rgba(255,255,255,.24)}

/* v2.9 §12 — salesman wasooli/routes helpers */
.count-pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;
  background:var(--surface-2,#f1f5f9);border:1px solid var(--line);font-size:var(--fs-xs);
  font-weight:700;color:var(--muted);white-space:nowrap}
.chk-grid{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);
  border-radius:9px;font-size:var(--fs-sm);cursor:pointer;user-select:none;background:var(--surface,#fff)}
.chk.on{border-color:var(--pri,#2563eb);background:rgba(37,99,235,.07);font-weight:700}
.chk input{accent-color:var(--pri,#2563eb);margin:0}
.cust-pick{max-height:220px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface,#fff)}
.cell-sub{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}

/* v2.9 §7/§8 — PO product picker (multi-select + pack units) */

.po-pick-head .chk.mini{padding:3px 8px;font-size:var(--fs-xs)}
.po-pick{display:flex;gap:6px;align-items:center;margin:2px 0 4px}
.po-addbar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--surface,#fff);border:1px solid var(--line);border-radius:10px;margin-top:6px;
  box-shadow:0 -6px 16px rgba(15,23,42,.06);font-size:var(--fs-sm)}
.gs-item.on{border-color:var(--pri,#2563eb);background:rgba(37,99,235,.06)}
.gs-item{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gs-item .t{min-width:0;flex:1 1 auto}
/* v2.10 — AI Agent tab */
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:900px){
  .ai-grid{grid-template-columns:1fr}
}
.ai-prov{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ai-provc{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;
  min-height:64px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:none;
  cursor:pointer;font-size:var(--fs-sm);color:inherit}
.ai-provc:hover{border-color:var(--pri,#2563eb)}
.ai-provc.on{border-color:var(--pri,#2563eb);background:rgba(37,99,235,.08)}
.ai-provc b{font-size:var(--fs-sm)}
.ai-provc span{font-size:var(--fs-xs);color:var(--muted);line-height:1.35}
.ai-provc-tag{font-weight:600}
.ai-keyrow{display:flex;gap:6px;align-items:center}
.ai-keyrow .f-input{flex:1;min-width:0}
.ai-field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){
  .ai-field2{grid-template-columns:1fr}
}
.ai-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
  background:rgba(148,163,184,.06)}
.ai-dirty{font-size:var(--fs-xs);color:var(--muted)}
.ai-dirty.on{color:var(--warn);font-weight:700}
.ai-warn{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:var(--fs-xs);line-height:1.45;
  border:1px solid var(--warn,#d97706);border-left-width:3px;background:rgba(217,119,6,.10)}

/* v2.13 — aligned provider workspace, scoped to independent AI setup */
.ai-hub { max-width:1360px; margin:0 auto; }

.ai-hub-head p { margin:0; color:var(--muted); font-size:13px; }

.ai-connect-action { padding:4px 20px 16px; }
.ai-hub .btn { min-height:36px; }
.ai-hub .link-btn { min-height:32px; color:var(--info); }
.ai-hub .chip { min-height:32px; }
.ai-hub .btn.ok { color:var(--on-ok); }
.ai-hub .ai-section { margin-bottom:16px; }
.ai-hub-layout > .ai-section { margin:0; }
.ai-hub .ai-section .card-head h3 { font-size:14px; }
.ai-hub .ai-section .card-body > .f-input { margin-bottom:14px; }
.ai-hub .ai-connection > .ai-section { margin:0; }
.ai-connect-action .btn { min-height:44px; width:100%; }
.ai-hub .f-input { min-height:40px; }
.ai-hub .f-hint { font-size:12px; line-height:1.6; overflow-wrap:anywhere; }
.ai-field-label { display:block; font-size:12px; font-weight:600; margin-bottom:6px; }
.ai-route-list { list-style:none; padding:0; margin:14px 0; counter-reset:route; }
.ai-route-list li { display:flex; gap:10px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
.ai-route-list li::before { counter-increment:route; content:counter(route,decimal-leading-zero); font-size:12px; color:var(--muted); }
.ai-route-list li > div:first-of-type { flex:1; min-width:0; }
.ai-route-list b,.ai-route-list span { display:block; }
.ai-route-list b { font-size:13px; }
.ai-route-actions { display:flex; gap:5px; }
.ai-route-actions .btn { min-width:34px; padding:4px 9px; }

.ai-test-time { padding:0 20px 16px; }
.ai-hub #aiTestHost:not(:empty) { padding:0 20px 12px; }
.ai-hub .ai-foot { margin-top:16px; }
@media(max-width:1100px) {
  .ai-hub .ai-prov{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:800px) {
  .ai-hub-layout{grid-template-columns:minmax(0,1fr);}
}

  .ai-hub .ai-prov{grid-template-columns:repeat(2,minmax(0,1fr));}
  .ai-hub-head h2{font-size:21px;}
  .ai-hub .ai-provc{padding:12px;}
  .ai-connection-title{padding:16px;}
  .ai-connect-action{padding:4px 16px 16px;}

}
