/* v2.5: party ka asli (fresh) balance — ledger se hisaab, list ke stale number se nahi */
async function partyBalance(type, id, fallback) {
  try {
    const r = await API.call('parties.balance', { partyType: type, id: id },
      { offlineFallback: () => null });
    if (r && typeof r.balance !== 'undefined') return Number(r.balance) || 0;
  } catch (e) { }
  return Number(fallback || 0);
}

function updateCustBar() {
  const n = document.getElementById('custName2'), b = document.getElementById('custBal2');
  if (!n) return;
  if (!S.customer) { n.textContent = 'Walk-in Customer'; b.textContent = 'Tap to select customer (F4)'; try { updateLoyaltyTeaser(null); } catch (e) {} return; }
  n.textContent = S.customer.name;
  const stale = Number(S.customer.balance ?? S.customer.bal ?? 0);
  const billRaw = (typeof grandTotal === 'function') ? Number(grandTotal() || 0) : 0;
  const bill = Math.max(0, billRaw);
  const write = prev => {
    const closing = Math.max(0, Number(prev || 0) + bill);
    const dueCls = closing > 0 ? (closing > 50000 ? ' due' : (closing > 5000 ? ' warn' : '')) : '';
    const limit = Number(S.customer.creditLimit ?? S.customer.limit ?? 0);
    const avail = limit ? Math.max(0, limit - Number(prev||0)) : null;
    const status = Number(prev||0)<=0? 'Clear' : (limit && Number(prev)>limit? 'OVER LIMIT' : (Number(prev)>limit*0.8? 'Near limit':'Due'));
    // rating: derive from overdue?
    b.innerHTML = '';
    if (S.customer.phone) b.appendChild(h('div', { class: 'cb-phone' }, '📞 ' + fmt.phone(S.customer.phone)));
    const grid = h('div', { class: 'cust-bal-grid' },
      h('div', { class: 'cbg prev' }, h('span', { class: 'lbl' }, 'Previous'), h('b', { class: 'val' }, fmt.money(prev))),
      h('div', { class: 'cbg bill' }, h('span', { class: 'lbl' }, 'This bill'), h('b', { class: 'val' }, fmt.money(bill))),
      h('div', { class: 'cbg close' + dueCls }, h('span', { class: 'lbl' }, 'Closing'), h('b', { class: 'val' }, fmt.money(closing))));
    b.appendChild(grid);
    // credit details row
    if (limit || avail!==null) {
      const creditRow = h('div', { class: 'cbg', style: { flex:'1 1 100%', flexDirection:'row', gap:'8px', justifyContent:'space-between', background:'var(--panel-2)', marginTop:'4px' } },
        h('span', { class: 'lbl', style:{fontSize:'var(--fs-2xs)'} }, 'Credit limit ' + fmt.money(limit) + (avail!==null? ' · Avail '+fmt.money(avail):'')),
        h('span', { class: 'lbl', style:{fontSize:'var(--fs-2xs)', color: status==='OVER LIMIT'? 'var(--err)': 'var(--muted)'} }, status));
      b.appendChild(creditRow);
    }
    // purchase history & rating placeholder: will be filled via async history
    var histEl = document.getElementById('posCustHist');
    if(!histEl){
      histEl = h('div', { id:'posCustHist', style:{fontSize:'var(--fs-2xs)', color:'var(--muted)', marginTop:'4px', display:'none'} });
      b.appendChild(histEl);
    }
    // fetch rating & history
    try{
      API.call('parties.customerHistory', {customerId: S.customer.id, limit:3}, {offlineFallback:()=>null}).then(function(hist){
        if(!hist||!hist.recentSales) return;
        histEl.style.display='block';
        var salesTxt = hist.recentSales.slice(0,2).map(function(s){ return s.invoiceNo+' '+fmt.money(s.total); }).join(' · ');
        var retTxt = hist.recentReturns && hist.recentReturns.length? ' · Returns '+hist.recentReturns.length : '';
        var rating = hist.credit? ' · Rating '+hist.credit.rating+'/5' + (hist.credit.overdueCount? ' ('+hist.credit.overdueCount+' overdue)':'' ) : '';
        histEl.textContent = (salesTxt? 'Last: '+salesTxt : 'No purchases') + retTxt + rating;
      }).catch(function(){});
    }catch(e){}
  };
  write(stale);
  partyBalance('CUSTOMER', S.customer.id, stale).then(write);
  try { updateLoyaltyTeaser(S.customer.id); } catch (e) {}
  // sync drawer customer bar if open
  try {
    if (POS2.drawerCust) {
      const nm = POS2.drawerCust.querySelector('#custNameM'); const bm = POS2.drawerCust.querySelector('#custBalM');
      if (nm) nm.textContent = S.customer.name;
      if (bm) { bm.innerHTML = ''; bm.appendChild(b.cloneNode(true)); }
    }
  } catch (e) {}
}
function updateLoyaltyTeaser(customerId) {
  try {
    const host = document.getElementById('posLoyaltyTeaser');
    const hostM = document.getElementById('posLoyaltyTeaserM');
    const apply = (sum, tot) => {
      [host, hostM].forEach(h => {
        if (!h) return;
        if (!sum || !sum.enabled || sum.points === undefined) { h.hidden = true; return; }
        const earn = Math.floor((tot || 0) / (Number(sum.perAmount) || 1000) * (Number(sum.points) || 1)) || 0;
        h.hidden = false;
        h.className = 'loy-teaser host';
        h.innerHTML = '';
        h.append(
          h('span', null, '⭐ Loyalty: ' + fmt.num(sum.points || 0) + ' pts ≈ ' + fmt.money(sum.value || 0)),
          (sum.usablePoints ? h('span', { class: 'badge ok', style: { fontSize: 'var(--fs-2xs)' } }, 'usable ' + sum.usablePoints + ' → ' + fmt.money(sum.usableValue || 0)) : ''),
          (earn ? h('span', { style: { color: 'var(--ok)', fontWeight: '700' } }, 'this bill +' + earn) : '')
        );
      });
    };
    if (!host && !hostM) return;
    if (!customerId) { if (host) { host.hidden = true; host.textContent=''; } if (hostM) { hostM.hidden=true; } return; }
    const tot = (typeof grandTotal === 'function') ? Number(grandTotal() || 0) : 0;
    API.call('loyalty.summary', { customerId: customerId, total: tot || 1000 }, { offlineFallback: () => ({ points: 0, usablePoints: 0, enabled: false }) })
      .then(sum => apply(sum, tot)).catch(() => { if (host) host.hidden=true; if (hostM) hostM.hidden=true; });
  } catch (e) {}
}

function applyCustomerPricing() {
  if (S.customer && S.customer.typeId) {
    const wholesale = /wholesale|corporate/i.test(S.customer.typeName || '');
    if (wholesale) {
      S.cart.forEach(l => {
        if (l.wholesale) { l.price = l.wholesale; l.lineTotal = l.qty * l.price - (l.discount || 0); }
      });
      renderCart(); renderTotals();
    }
  }
}

/* v2.16 — close any open cart drawer before payment modal (never behind offcanvas) */
function closeCartDrawerSync() {
  try {
    const oc = document.querySelector('.offcanvas');
    if (!oc) return false;
    // restore POS2 bodies from stored old
    if (POS2._offOld && POS2._offOld.b && POS2._offOld.f) {
      POS2.cartBody = POS2._offOld.b; POS2.cartFoot = POS2._offOld.f;
      const side = POS2.cartBody && POS2.cartBody.parentNode;
      if (side && POS2.cartTools) {
        try { side.insertBefore(POS2.cartTools, POS2.cartBody); } catch (e) { }
        if (POS2.pkHost && POS2._offOld.pkWasIn) try { side.insertBefore(POS2.pkHost, POS2.cartBody); } catch (e) { }
      }
      POS2.drawerCust = null; POS2._offOld = null;
    }
    oc.remove();
    document.querySelectorAll('.oc-scrim, .scrim').forEach(el => { try { el.remove(); } catch (e) { } });
    renderCart(); renderTotals(); updateCustBar();
    return true;
  } catch (e) { return false; }
}

/* =============================== PAYMENT ================================== */
async function pay(method) {
  if (!(await shopOpenOk())) { shopBlockedPopup(); return; }
  if (!S.cart.length) return UI.toast(T.t('pos.cartEmpty','Cart khali hai'), 'warn');
  // close drawer first so modal is on top (premium: no overlay behind)
  closeCartDrawerSync();
  try { const x = document.querySelector('.offcanvas .oc-x'); if (x) x.click(); } catch (e) { }
  const total = grandTotal();
  const methods = String(App.state.settings.paymentMethods || 'CASH,CARD,BANK,JAZZCASH,EASYPAISA,RAAST,CHEQUE,CREDIT,LOYALTY').split(',');
  const quick = String(App.state.settings.changeSuggestions || '500,1000,2000,5000').split(',').map(Number);
  /* v2.2/2.3: real payment methods (settings-driven, fee + fields ke sath) */
  let METHODS = methods.map(m => ({ id: m, label: m, fields: [] }));
  API.call('pay.methods.enabled', {}, { offlineFallback: () => null }).then(list => {
    if (list && list.length) {
      METHODS = list;
      if (loyaltyRow) loyaltyRow.style.display = METHODS.some(m => m.id === 'LOYALTY') ? '' : 'none';
      paint();
    }
  }).catch(() => { });

  let payments = [{ method: method === 'SPLIT' ? 'CASH' : method, amount: '' }];
  const rowsHost = h('div');
  const paidEl = h('div', { class: 'tot2', style: { fontWeight: '800' } });
  const dueEl = h('div', { class: 'tot2', style: { color: 'var(--err)' } });
  const chgEl = h('div', { class: 'tot2', style: { color: 'var(--ok)' } });

  /* v2.5: bill summary — cashier ko har number ek nazar mein nazar aaye */
  function U2round(v) { return Math.round(Number(v || 0) * 100) / 100; }
  const summaryEl = h('div', { class: 'pay-summary' });
  function paintSummary() {
    const sub = subTotal(), disc = Number(S.discount || 0), tax = totalTax();
    const rows = [
      ['Items', S.cart.reduce((a, l) => a + l.qty, 0) + ' units / ' + S.cart.length + ' lines'],
      ['Subtotal', fmt.money(sub)],
      ['Discount', disc ? '− ' + fmt.money(disc) : '—'],
      [String(App.state.settings.taxLabel || 'Tax'), fmt.money(tax)],
      ['Total', fmt.money(total)]
    ];
    /* v2.30.0 (N4) — redeem kiye gaye points bill summary mein saaf dikhein
       * (display-only line — paisa hamesha LOYALTY payment row se aata hai, yahan
       * sirf nazar aata hai, is liye double-counting ka koi sawal nahi). */
    const loyPtsRow = payments.filter(p => String(p.method || '').toUpperCase() === 'LOYALTY')
      .reduce((a, p) => a + (Number(p.points) || 0), 0);
    const loyValRow = payments.filter(p => String(p.method || '').toUpperCase() === 'LOYALTY')
      .reduce((a, p) => a + (Number(p.amount) || 0), 0);
    if (loyPtsRow > 0) rows.push(['POINTS', loyPtsRow + ' pts (\u2212 ' + fmt.money(loyValRow) + ')']);
    summaryEl.innerHTML = '';
    rows.forEach(([k, v], i) => summaryEl.appendChild(
      h('div', { class: 'ps-row' + (i === rows.length - 1 && k === 'Total' ? ' ps-total' : '') +
          (k === 'POINTS' ? ' ps-points' : '') },
        h('span', null, k), h('b', null, v))));
    if (S.customer) {
      const prev = Number(S.__prevBalance || 0);
      const paid = payments.reduce((a, p) => a + (Number(p.amount) || 0), 0);
      const amountOwed = U2round(prev + total);
      const closing = Math.max(0, U2round(amountOwed - paid));
      const change = Math.max(0, U2round(paid - amountOwed));
      const remaining = Math.max(0, U2round(total - Math.min(paid, total)));
      const cashPaid = payments.filter(p=>String(p.method||'').toUpperCase()!=='LOYALTY').reduce((a,p)=>a+(Number(p.amount)||0),0);
      const loyPaid = payments.filter(p=>String(p.method||'').toUpperCase()==='LOYALTY').reduce((a,p)=>a+(Number(p.amount)||0),0);
      const loyPtsSum = payments.filter(p=>String(p.method||'').toUpperCase()==='LOYALTY').reduce((a,p)=>a+(Number(p.points||0)),0);
      const limit = Number(S.customer.creditLimit ?? S.customer.limit ?? 0);
      const avail = limit? Math.max(0, limit - prev) : null;
      summaryEl.appendChild(h('div', { class: 'ps-ledger' },
        h('div', { class: 'ps-ld-title' }, '🧾 Account summary — ' + S.customer.name),
        h('div', { class: 'ps-row' }, h('span', null, 'Previous balance'), h('b', null, fmt.money(prev))),
        h('div', { class: 'ps-row' }, h('span', null, 'This invoice'), h('b', null, fmt.money(total))),
        h('div', { class: 'ps-row' }, h('span', null, 'Amount Paid'), h('b', { style: { color: 'var(--ok)' } }, fmt.money(paid))),
        ...(change>0.5 ? [h('div', { class: 'ps-row', style: { color: 'var(--ok)', fontWeight: '700' } }, h('span', null, 'Change'), h('b', null, fmt.money(change)))] : [h('div', { class: 'ps-row', style:{color:'var(--muted)', fontSize:'11px'} }, h('span', null, 'Remaining of invoice'), h('b', null, fmt.money(remaining)))]),
        ...(loyPaid ? [h('div', { class: 'ps-row', style: { color: 'var(--ok)', fontWeight: '800' } }, h('span', null, 'PAID BY Loyalty Points' + (loyPtsSum ? ' ('+fmt.num(loyPtsSum)+' pts)' : '')), h('b', null, fmt.money(loyPaid)))] : []),
        h('div', { class: 'ps-row ps-total' + (closing > 0.5 ? ' due' : '') },
          h('span', null, 'Closing balance'), h('b', { style: { color: closing>0.5 ? 'var(--err)' : 'var(--ok)' } }, fmt.money(closing))),
        ...(limit? [h('div', { class: 'ps-row', style:{fontSize:'11px', color:'var(--muted)'} }, h('span', null, 'Credit limit / Available'), h('b', null, fmt.money(limit)+(avail!==null? ' / '+fmt.money(avail):'')))] : [])));
    }
  }

  /* previous balance ledger se laayein (list ka number stale ho sakta hai) */
  S.__prevBalance = Number(S.customer ? (S.customer.balance ?? S.customer.bal ?? 0) : 0);
  if (S.customer) partyBalance('CUSTOMER', S.customer.id, S.__prevBalance).then(v => {
    S.__prevBalance = v; paintSummary();
  });

  let validationErrors = {};
  /* v2.30.0 (N4) — loyalty summary Complete tak carry (points cap/derive ke liye) */
  let loySum = null;
  function calc() {
    const paid = payments.reduce((a, p) => a + (Number(p.amount) || 0), 0);
    const prev = Number(S.__prevBalance||0);
    const amountOwed = U2round(prev + total);
    const closing = Math.max(0, U2round(amountOwed - paid));
    const chg = Math.max(0, U2round(paid - amountOwed));
    const invoiceDue = Math.max(0, U2round(total - Math.min(paid, total)));
    paidEl.innerHTML = '<span>Paid</span><span>' + fmt.money(paid) + '</span>';
    dueEl.innerHTML = closing > 0.5 ? T.t('pos.dueClosingHtml','<span>Current due (credit) — Closing</span><span>') + fmt.money(closing) + '</span>' : '<span>Current Due</span><span style="color:var(--ok)">0 (Clear)</span>';
    chgEl.innerHTML = chg > 0.5 ? '<span>Change</span><span>' + fmt.money(chg) + '</span>' : (invoiceDue>0.5? '<span>Remaining of invoice</span><span>'+fmt.money(invoiceDue)+'</span>' : '');
    return { paid, due: closing, closing, change: chg, invoiceDue };
  }

  function paint() {
    rowsHost.innerHTML = '';
    payments.forEach((p, i) => {
      p.__i = i;
      const mDef = METHODS.find(m => m.id === p.method) || { id: p.method, label: p.method, fields: [] };
      rowsHost.appendChild(h('div', { style: { display: 'flex', gap: '6px', marginBottom: '7px' } },
        h('select', { class: 'f-input', style: { flex: '1', minHeight: '44px', height: '44px' }, title: 'Payment method', 'aria-label': 'Payment method', onchange: e => { p.method = e.target.value; paint(); } },
          METHODS.map(m => h('option', { value: m.id, selected: p.method === m.id }, (m.icon ? m.icon + ' ' : '') + (m.label || m.id)))),
        (function () {
          const inp = h('input', { class: 'f-input', type: 'number', step: '0.01', value: (p.amount === '' || p.amount === undefined ? '' : p.amount),
            placeholder: 'Enter amount', inputMode: 'decimal',
            style: { width: '112px', minHeight: '44px', height: '44px', textAlign: 'right' }, 'aria-label': 'Amount for ' + (mDef.label || mDef.id) });
          inp.oninput = () => { p.amount = inp.value === '' ? '' : Number(inp.value || 0); calc(); paintSummary(); };
          // allow typing without clearing 0 — focus selects
          inp.onfocus = () => { try { inp.select(); } catch(e){} };
          return inp;
        })(),
        /* v2.5: baqi amount ek click mein is method par dal dein */
        h('button', { class: 'btn sm sec', style: { minHeight: '44px', minWidth: '52px' }, title: 'Baqi amount is method mein dal dein',
          onclick: () => {
            const others = payments.reduce((a, x, xi) => a + (xi === i ? 0 : (Number(x.amount) || 0)), 0);
            p.amount = Math.max(0, U2round(total - others)); paint(); calc(); paintSummary();
          } }, 'Fill'),
        h('button', { class: 'btn sm ok', style: { minHeight: '44px', minWidth: '88px' }, title: 'Exact amount — baqi baqi bill isi method se pay',
          onclick: () => {
            const others = payments.reduce((a, x, xi) => a + (xi === i ? 0 : (Number(x.amount) || 0)), 0);
            const remain = Math.max(0, U2round(total - others));
            p.amount = remain; paint(); calc(); paintSummary();
            UI.toast('Exact amount ' + fmt.money(remain) + ' set', 'ok', 1400);
          } }, 'Exact'),
        h('button', { class: 'btn sm danger', style: { minHeight: '44px', minWidth: '44px' }, title: 'Ye payment hata dein',
          onclick: () => { payments.splice(i, 1); paint(); calc(); } }, '✕')));

      /* v2.5: method ke asli fields (payer/receiver mobile, txn id, Raast, cheque…) */
      const extraHost = h('div');
      rowsHost.appendChild(extraHost);
      (async () => {
        const errs = (validationErrors[p.__i] || {}).errors || [];
        extraHost.appendChild(await PayUI.fields(mDef.id, p, errs));
      })();

      /* fee / FED / net / settlement preview */
      if (p.amount > 0 && mDef.id) rowsHost.appendChild(PayUI.feeLine(p.amount, mDef.id));

      /* v2.5: asli wallet gateway (EasyPaisa / JazzCash) — request + status poll */
      if (typeof WalletUI !== 'undefined' && WalletUI.isWallet(mDef.id)) {
        const wHost = h('div');
        rowsHost.appendChild(wHost);
        (async () => {
          wHost.appendChild(await WalletUI.panel({
            method: mDef.id, amount: p.amount, payment: p,
            refType: 'SALE', note: (S.customer && S.customer.name) ? ('POS ' + S.customer.name) : 'POS sale',
            onChange: () => { paint(); calc(); },
            onPaid: () => { paint(); calc(); }
          }));
        })();
      }
    });
    if (method === 'SPLIT') rowsHost.appendChild(h('button', { class: 'btn sm sec', onclick: () => { payments.push({ method: 'CARD', amount: '' }); paint(); } }, '+ Add method'));

    /* ---- loyalty points (v2.3) ---- */
    loyaltyRow.innerHTML = '';
    if (S.customer) {
      loyaltyRow.appendChild(h('div', { class: 'loy-box' },
        h('div', { class: 'loy-head' }, '⭐ Loyalty points'),
        h('div', { class: 'loy-body' }, 'Load ho raha hai…')));
      API.call('loyalty.summary', { customerId: S.customer.id, total: total },
        { offlineFallback: () => ({ points: 0, usablePoints: 0, rate: 1 }) })
        .then(sum => {
          loySum = sum || null;
          const body = loyaltyRow.querySelector('.loy-body');
          if (!body) return;
          body.innerHTML = '';
          if (!sum || !sum.enabled) { body.textContent = 'Loyalty off hai (Settings ▸ Trade ▸ Loyalty)'; return; }
          body.append(
            h('div', { class: 'loy-line' }, 'Balance: ' + (sum.points || 0) + ' points ≈ ' + fmt.money(sum.value || 0)),
            h('div', { class: 'loy-line sub' }, 'Is bill par max ' + (sum.usablePoints || 0) + ' points (' +
              fmt.money(sum.usableValue || 0) + ') use ho sakte hain'));
          const ptsInput = h('input', { class: 'f-input', type: 'number', min: '0',
            max: String(sum.usablePoints || 0), value: String(pointsInput.value||'0'), style: { width: '110px' }, 'aria-label': 'Redeem points' });
          /* v2.30.0 (N4) — dono inputs ek hi cap share karte hain (pehle ek taraf
             * clamp hota tha, doosra raw reh jata tha → sale mein galat points). */
          const capPts = () => Number(sum.usablePoints || 0);
          const clampBoth = (from) => {
            const max = capPts();
            let v = Number((from === 'pts' ? ptsInput : pointsInput).value || 0);
            if (v > max) {
              v = max;
              if (from === 'pts') { ptsInput.value = String(v); } else { pointsInput.value = String(v); }
              UI.toast('Is bill par max ' + fmt.num(max) + ' points redeem ho sakte hain', 'warn', 2600);
            }
            if (v < 0) v = 0;
            ptsInput.value = String(v); pointsInput.value = String(v);
          };
          ptsInput.addEventListener('input', () => clampBoth('pts'));
          pointsInput.addEventListener('input', () => clampBoth('row'));
          body.appendChild(h('div', { class: 'loy-actions' }, ptsInput,
            h('button', { class: 'btn sm ok', onclick: () => {
              const pts = Number(ptsInput.value || 0);
              if (pts <= 0) return UI.toast(T.t('pos.enterPoints','Points daalein'), 'warn');
              if (pts > (sum.usablePoints || 0)) return UI.toast(T.t('pos.pointsTooMany','Cannot use that many points'), 'err');
              const val = pts * (sum.rate || 1);
              const existing = payments.find(p => p.method === 'LOYALTY');
              if (existing) { existing.points = pts; existing.amount = Math.min(val, total); }
              else payments.push({ method: 'LOYALTY', amount: Math.min(val, total), points: pts });
              paint(); calc();
              UI.toast(pts + ' points redeem ho gaye (' + fmt.money(Math.min(val, total)) + ')', 'ok');
            } }, 'Redeem')));
          try {
            setPointsHint('1 point = ' + fmt.money(sum.rate || 1) + ' · balance ' + fmt.num(sum.points || 0) + ' pts' +
              (sum.usablePoints ? ' · is bill par max ' + fmt.num(sum.usablePoints) : ''));
          } catch (e) { }
        }).catch(() => { });
    }
    calc(); paintSummary();
    // sync footer and points — use closing = prev+total-paid
    try{
      const loyAmt = payments.filter(p=>String(p.method).toUpperCase()==='LOYALTY').reduce((a,p)=>a+Number(p.amount||0),0);
      const _prevF = Number(S.__prevBalance||0);
      const _paidF = payments.reduce((a,p)=>a+Number(p.amount||0),0);
      const dueVal = Math.max(0, U2round(_prevF + total - _paidF));
      const la=document.getElementById('payLoyAmt2'); if(la) la.textContent=fmt.money(loyAmt);
      const du=document.getElementById('payDue2'); if(du) du.textContent=fmt.money(dueVal);
      // points input sync: if loyalty exists, set pointsInput value
      const loy = payments.find(p=>String(p.method).toUpperCase()==='LOYALTY');
      if(loy && pointsInput && document.activeElement!==pointsInput) pointsInput.value = String(loy.points||0);
      // v2.30.0 (N4) — hint = loyalty ka sach (pehle yahan credit settlement likha tha)
      try {
        const loyRow = payments.find(p => String(p.method || '').toUpperCase() === 'LOYALTY');
        if (loyRow && Number(loyRow.points || 0) > 0) {
          setPointsHint(Number(loyRow.points) + ' points lagaye (\u2212 ' + fmt.money(Number(loyRow.amount || 0)) + ')');
        } else if (loySum && loySum.enabled) {
          setPointsHint('1 point = ' + fmt.money(loySum.rate || 1) + ' · balance ' + fmt.num(loySum.points || 0) + ' pts' +
            (loySum.usablePoints ? ' · is bill par max ' + fmt.num(loySum.usablePoints) : ''));
        } else if (!S.customer) {
          setPointsHint(T.t('pos.custForPoints','Select a customer — to redeem points'));
        } else {
          setPointsHint('Loyalty off hai (Settings \u25B8 Trade \u25B8 Loyalty)');
        }
      } catch (e) { }
    }catch(e){}
  }

  const quickHost = h('div', { class: 'chips', style: { marginTop: '8px' } },
    /* v2.5: exact amount, gol amount (round-up) aur settings wale notes */
    (function () {
      const rest = () => payments.slice(1).reduce((a, x) => a + (Number(x.amount) || 0), 0);
      const set = v => { payments[0].amount = Math.max(0, U2round(v - rest())); paint(); calc(); paintSummary(); };
      const chips = [h('button', { class: 'chip2', onclick: () => set(total) }, '💯 Exact ' + fmt.money(total))];
      [10, 100].forEach(step => {
        const v = Math.ceil(total / step) * step;
        if (v > total) chips.push(h('button', { class: 'chip2', onclick: () => set(v) },
          '⬆ ' + fmt.money(v) + ' (change ' + fmt.money(v - total) + ')'));
      });
      quick.filter(v => v > total).slice(0, 6).forEach(v => chips.push(
        h('button', { class: 'chip2', onclick: () => set(v) }, fmt.money(v))));
      return chips;
    })());

  const noteInput = h('input', { class: 'f-input', type: 'text', placeholder: 'Note (optional)', style: { marginTop: '10px', minHeight: '44px', height: '44px' } });
  const promisedInput = h('input', { class: 'f-input', type: 'date', placeholder: 'Select date', style: { marginTop: '6px', minHeight: '44px', height: '44px' } });
  /* v2.31.1 (r13) — credit terms ka istemal: customer ke creditDays se promised
     date ka DEFAULT (aaj + mohlat) — credit row par dueDate hamesha record ho */
  try {
    const _cc = S.customer || {};
    const _cDays = Number(_cc.creditDays !== undefined ? _cc.creditDays : (_cc.cd || 0));
    if (_cDays > 0 && !promisedInput.value) {
      promisedInput.value = new Date(Date.now() + 86400000 * _cDays).toISOString().slice(0, 10);
    }
  } catch (e) { }
  const pointsInput = h('input', { class: 'f-input', type: 'number', min: '0', step: '1', value: '', placeholder: '0', style: { width: '110px', minHeight: '44px', height: '44px', textAlign: 'center' }, 'aria-label': 'Points' });
  const loyaltyRow = h('div', { class: 'loy-row' });
  // promised date and points row setup
  const promisedWrap = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px', marginTop: '8px' } }, h('label', { style: { fontSize: '11px', letterSpacing: '.4px', fontWeight: '700', color: 'var(--muted)' } }, 'PROMISED PAYMENT DATE'), promisedInput);
  /* v2.30.0 (N4) — is row par pehle CREDIT settlement ka text chipka hua tha
     * ("Koi fee nahi - settlement <date>") jo points se bilkul be-taaluq tha.
     * Ab ye hint sirf loyalty ka sach batata hai (rate / balance / applied points). */
  const pointsHint = h('span', { class: 'muted points-hint', style: { fontSize: '11px', whiteSpace: 'nowrap' } },
    T.t('pos.custForPoints','Select a customer — to redeem points'));
  /* v2.30.0 (N4) — setter: paint() pehle chalta hai (const se pehle), is liye
     * seedha variable ke bajaye class se element dhoondo (koi TDZ crash nahi). */
  function setPointsHint(t) {
    try {
      const el = document.querySelector('.modal-scrim .modal2 .points-hint') ||
        document.querySelector('.modal2 .points-hint');
      if (el) el.textContent = String(t == null ? '' : t);
    } catch (e) { }
  }
  const pointsWrap = h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', marginTop: '8px', flexWrap: 'wrap' } },
    h('label', { style: { fontSize: '11px', fontWeight: '700', minWidth: '56px' } }, 'POINTS'), pointsInput, pointsHint);

  /* v2.30.0 (N4/N5) — desktop par WIDE modal + 2 hisse (left: bill summary +
     * quick chips + note · right: payment methods + POINTS + loyalty + footer).
     * 900px se neeche CSS khud single column kar deta hai (mobile responsive). */
  const payFoot = h('div', { class: 'pay-footer', style: { display: 'flex', justifyContent: 'space-between', gap: '10px', padding: '10px', border: '1.5px dashed var(--line)', borderRadius: '12px', background: 'var(--panel-2)', fontWeight: '800', fontSize: '13px', marginTop: '8px' } }, h('span', { style: { color: 'var(--ok)' } }, 'PAID BY Loyalty Points ', h('b', { id: 'payLoyAmt2' }, 'Rs 0')), h('span', { style: { color: 'var(--err)' } }, T.t('pos.currentDue','Current due (credit) '), h('b', { id: 'payDue2' }, 'Rs 0')));
  UI2.modal({
    title: 'Payment — ' + fmt.money(total),
    subtitle: (S.customer ? S.customer.name : 'Walk-in') + ' · ' + S.cart.reduce((a, l) => a + l.qty, 0) + ' items',
    size: 'xl',
    body: h('div', { class: 'pay-cols' },
      h('div', { class: 'pay-col pay-col-a' }, summaryEl, quickHost, noteInput),
      h('div', { class: 'pay-col pay-col-b' }, promisedWrap, rowsHost, pointsWrap, payFoot, paidEl, dueEl, chgEl, loyaltyRow)),
    actions: [
      { label: 'Cancel', cls: 'ghost', onClick: c => c() },
      { label: '✅ Complete', cls: 'ok', onClick: async c => {
        const { paid, due } = calc();
        const rows = payments.filter(p => Number(p.amount) > 0);
        // v2.16 payment logic: Cash must be full, Credit requires active account + limit
        let effectiveRows = rows.slice();
        // pure udhaar: CREDIT was 0 so filtered out — restore it
        if (!effectiveRows.length && method === 'CREDIT') effectiveRows = [{ method: 'CREDIT', amount: 0 }];
        // also keep CREDIT 0 if credit was selected but amount 0 (for dueDate)
        if (method === 'CREDIT' && !effectiveRows.some(p => p.method === 'CREDIT')) {
          const cred = payments.find(p => p.method === 'CREDIT');
          if (cred) effectiveRows.push({ method: 'CREDIT', amount: Number(cred.amount || 0), dueDate: cred.dueDate });
        }
        const effectiveDue = Math.max(0, total - effectiveRows.reduce((a, p) => a + Number(p.amount || 0), 0));
        const hasCredit = effectiveRows.some(p => p.method === 'CREDIT');
        const wantsCredit = hasCredit;
        // cash sale must pay full (when no credit)
        if (!wantsCredit && effectiveDue > 0.5) {
          if (method === 'CASH' || rows.some(p => p.method === 'CASH')) {
            return UI.toast(T.t('pos.cashFull','Cash sale: pay the full bill — remaining ') + fmt.money(effectiveDue) + ' due hai', 'err', 3200);
          }
        }
        if (wantsCredit) {
          if (!S.customer) return UI.toast(T.t('pos.creditNeedsCustomer','Select a customer for credit'), 'err');
          // active account check
          if (S.customer.active === false || String(S.customer.status || '').toLowerCase() === 'inactive' || String(S.customer.blocked || '').toLowerCase() === 'true') {
            return UI.toast(T.t('pos.customerBlocked','Customer account inactive/blocked — credit not allowed'), 'err', 3500);
          }
          let limit = Number(S.customer.creditLimit ?? S.customer.limit ?? S.customer.credit ?? App.state.settings.customerCreditLimit ?? App.state.settings.defaultCreditLimit ?? 0);
          let bal = Number(S.__prevBalance ?? S.customer.balance ?? S.customer.bal ?? 0);
          if (limit > 0) {
            const avail = Math.max(0, limit - bal);
            if (effectiveDue > avail + 0.5) {
              /* v2.31.3 (r15/F4) — OVERRIDE: pos.credit.override wala user confirm kar
                 ke aage barh sakta hai (backend phir bhi guard + Audit karta hai) */
              let _ov = false;
              if (App.can && App.can('pos.credit.override')) {
                try { _ov = await UI2.confirm(T.t('pos.overrideAsk','Credit limit exceeded — override kar ke sale karein?'), null, true); } catch (e) { _ov = false; }
              }
              if (!_ov) {
                return UI.toast(T.t('pos.limitExceeded','Credit limit exceeded — limit ') + fmt.money(limit) + ', previous ' + fmt.money(bal) + ', available ' + fmt.money(avail) + T.t('pos.billCreditTail',', this bill credit ') + fmt.money(effectiveDue), 'err', 5000);
              }
              S.__creditOverride = true;
            }
            // partial payment info: remaining credit after sale
            const remain = Math.max(0, avail - effectiveDue);
            if (effectiveDue > 0.5 && Number(paid || 0) > 0) {
              UI.toast('Partial payment: paid ' + fmt.money(paid) + T.t('pos.creditTail',', credit ') + fmt.money(effectiveDue) + ' · credit baqi ' + fmt.money(remain), 'ok', 3500);
            }
          }
        } else {
          // non-credit sale: must be fully paid (no due)
          if (effectiveDue > 0.5) {
            return UI.toast(T.t('pos.fullPayReq','Full payment required — remaining ') + fmt.money(effectiveDue) + T.t('pos.payOptionsTail',' (pay via Cash or Card, or select Credit)'), 'err', 3200);
          }
        }
        if (!effectiveRows.length && !wantsCredit) return UI.toast(T.t('pos.noPayment','No payment entered'), 'warn');
        const rowsForValidate = effectiveRows.length ? effectiveRows : rows;
        /* method-wise validation (wallet txn id, cheque no/date, limits…) */
        const bad = await PayUI.validate(rowsForValidate.filter(p => Number(p.amount) > 0));
        validationErrors = {};
        bad.forEach(b => {
          const idx = rowsForValidate.findIndex(r => r.method === b.method);
          if (idx > -1) validationErrors[idx] = { errors: b.errors };
        });
        if (bad.length) {
          paint();
          const msg = bad[0].errors.map(e => e.message).join(' · ');
          return UI.toast(msg, 'err', 4200);
        }
        // sync dueDate to payments before submit
        try{
          const dv = promisedInput.value || '';
          if(dv) rowsForValidate.forEach(p=>{ if(String(p.method).toUpperCase()==='CREDIT') p.dueDate=dv; });
          /* v2.30.0 (N4) — ASLI MATH BUG FIX:
             * Pehle POINTS textbox ki value seedhi sale mein copy ho jati thi. User
             * cap se zyada likh deta to sale mein points 500 record hote aur
             * customer ke poore points kat jate, magar bill par sirf 89 points ki
             * value lagti thi (deduction ≠ value). Ab: amount authoritative hai,
             * points usi se derive hote hain, usablePoints par CAP, aur invoice se
             * zyada value kabhi nahi lagti. */
          const loyRow = rowsForValidate.find(p => String(p.method).toUpperCase() === 'LOYALTY');
          if (loyRow) {
            const rate = Number((loySum && loySum.rate) || App.state.settings['loyalty.rate'] || 1) || 1;
            const cap = loySum ? Number(loySum.usablePoints || 0) : 0;
            const typed = Number(pointsInput.value || 0);
            let pts = typed > 0 ? Math.floor(typed) : Math.floor(Number(loyRow.amount || 0) / rate);
            if (cap && pts > cap) { UI.toast(T.t('pos.pointsCap','Points cap: max on this bill ') + fmt.num(cap), 'warn', 2600); pts = cap; }
            if (pts < 0) pts = 0;
            const others = rowsForValidate.reduce((a, pp) => a + (String(pp.method).toUpperCase() === 'LOYALTY' ? 0 : Number(pp.amount || 0)), 0);
            const value = Math.max(0, Math.min(Math.round(pts * rate * 100) / 100, Math.max(0, total - Math.min(others, total))));
            loyRow.points = pts; loyRow.pointsRedeemed = pts;
            if (value > 0) loyRow.amount = value;
            if (pointsInput.value !== String(pts)) pointsInput.value = String(pts);
          }
        }catch(e){}
        c(); submit(rowsForValidate, noteInput.value.trim());
      } }
    ]
  });
  paint();
}

/* v2.16 — simple invoice confirmation: Print/Share/Send/Save/Create New Sale only (no design controls) */
function showInvoiceConfirmation(sale) {
  // v2.23.11 POLISH: Show polished 80mm thermal receipt preview (same as print), not plain invoice
  const invNo = sale.invoiceNo || sale.id || '—';
  const cust = sale.customerName || (S.customer ? S.customer.name : 'Walk-in');
  // robust payments: handles array, JSON string, paymentList / paymentSummary from Sales.get
  const paysArr = (function(s){
    var v = s.paymentList || s.payments || s.paymentSummary || [];
    if (Array.isArray(v)) return v;
    if (typeof v === 'string'){
      try { var p = JSON.parse(v); return Array.isArray(p) ? p : []; } catch(e){ return []; }
    }
    return [];
  })(sale);
  const totalVal = Number(sale.total || sale.grandTotal || (typeof grandTotal==='function'?grandTotal():0));
  const paidVal = paysArr.reduce((a,p)=>a+Number(p.amount||0),0);
  const loyPay = paysArr.find(p=>String(p.method||'').toUpperCase()==='LOYALTY');
  const loyPts = loyPay ? (Number(loyPay.points)||0) : Number(sale.loyaltyPointsUsed||sale.pointsRedeemed||0);
  const loyAmt = loyPay ? Number(loyPay.amount||0) : 0;
  const total = fmt.money(totalVal);
  const paid = fmt.money(paidVal);
  const due = fmt.money(Math.max(0, totalVal - paidVal));
  const ptsEarned = Number(sale.pointsEarned || sale.loyaltyEarned || sale.earnedPoints || 0);
  // Build polished 80mm thermal receipt preview (same as actual print — 58mm/80mm aware)
  const receiptPreviewHost = h('div', { class: 'receipt-preview', style: 'background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:46vh;overflow:auto;text-align:left' });
  try {
    // Prepare sale for receiptHtml: ensure fields expected by Print.receiptHtml
    const saleForPrint = Object.assign({}, sale, {
      total: totalVal, paid: paidVal, due: Math.max(0, totalVal - paidVal),
      subtotal: sale.subtotal || totalVal, discount: sale.discount || 0, tax: sale.tax || 0,
      prevBalance: sale.prevBalance || (S.customer ? Number(S.customer.balance||0) : 0),
      closingBalance: sale.closingBalance !== undefined ? sale.closingBalance : ((S.customer ? Number(S.customer.balance||0) : 0) + totalVal - paidVal),
      items: sale.items || S.cart.map(l=>({name:l.name, code:l.code, qty:l.qty, price:l.price, lineTotal:l.lineTotal||l.qty*l.price})),
      customerName: cust, customerPhone: (S.customer && S.customer.phone) || sale.customerPhone || '',
      paymentList: paysArr, paymentSummary: paysArr,
      loyaltyPointsUsed: loyPts, pointsRedeemed: loyPts
    });
    if (window.Print && Print.receiptHtml) {
      receiptPreviewHost.innerHTML = Print.receiptHtml(saleForPrint, App.state.settings || {}, App.state.branchName || '');
    } else if (window.Print2 && Print2.html) {
      receiptPreviewHost.innerHTML = Print2.html(saleForPrint, {paper:'80mm'});
    } else {
      receiptPreviewHost.innerHTML = '<div class="muted" style="font-size:12px;text-align:center">Preview: ' + total + ' · Paid ' + paid + ' · Due ' + due + '</div>';
    }
  } catch(e){ receiptPreviewHost.innerHTML = '<div class="muted">Preview failed — will print correctly</div>'; }
  const body = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },
    h('div', { style: { textAlign:'center' } },
      h('div', { style: { fontSize: '28px' } }, '✅'),
      h('div', { style: { fontSize: '16px', fontWeight: '800' } }, 'Sale complete — ' + invNo),
      h('div', { style: { fontSize: '12px', color: 'var(--muted)' } }, cust + ' · ' + (typeof DT !== 'undefined' ? DT.format(new Date(), 'datetime') : new Date().toLocaleString('en-PK')))
    ),
    receiptPreviewHost,
    h('div', { style: { display:'flex',gap:'6px',flexWrap:'wrap',fontSize:'11px' } },
      h('span', {class:'badge ok'}, 'Total: ' + total), h('span', {class:'badge '+(paidVal>=totalVal?'ok':'warn')}, 'Paid: ' + paid), h('span', {class:'badge '+(due==='Rs 0.00'?'ok':'warn')}, 'Due: ' + due)
    ),
    loyPay ? h('div', { class: 'loy-teaser host', style: { textAlign: 'left', borderColor: 'var(--brand)', fontSize:'11px' } }, 'Deduction: ' + fmt.money(loyAmt) + ' via ' + fmt.num(loyPts) + ' pts') : '',
    ptsEarned ? h('div', { class: 'loy-teaser host', style: { textAlign: 'left', fontSize:'11px' } }, 'Earned: ' + fmt.num(ptsEarned) + ' pts — next bill par use honge') : '',
    h('div', { style: { fontSize: '11px', color: 'var(--muted-2)', textAlign:'center' } }, '80mm thermal receipt preview — Print will use 80mm/58mm thermal size, not A4.'));
  const actions = [
    { label: '🖨 Print', cls: 'ok', onClick: c => {
        try {
          // fast print — pre-rendered receipt, no dialog delay
          const html = Print.receiptHtml(sale, App.state.settings, App.state.branchName);
          Print.open(html, 'Receipt ' + invNo, (App.state.settings || {})['pos.receiptPaper'] || '80mm');
          /* v2.30.5 (D25) — receipt = generated document → registry (fire-and-forget) */
          try { if (window.Docs) Docs.register({ docType: 'RECEIPT', entityType: 'sale',
            entityId: sale && sale.id, ref: invNo, module: 'pos', action: 'print',
            qr: 'HA:INV:' + invNo, meta: { total: total } }); } catch (e) { }
          UI.toast('Printing…', 'ok');
        } catch (e) { UI.toast(e.message, 'err'); }
      } },
    { label: '↗ Share', onClick: async c => {
        try {
          const txt = 'Invoice ' + invNo + ' · ' + cust + ' · Total ' + total + ' · Due ' + due;
          if (navigator.share) await navigator.share({ title: 'Invoice ' + invNo, text: txt });
          else if (navigator.clipboard) { await navigator.clipboard.writeText(txt); UI.toast('Copied to clipboard', 'ok'); }
          else UI.toast(txt, 'ok', 4000);
        } catch (e) { UI.toast(e.message, 'err'); }
      } },
    { label: '✉ Send', onClick: c => {
        try {
          const subj = encodeURIComponent('Invoice ' + invNo); const bodyTxt = encodeURIComponent('Invoice ' + invNo + ' for ' + cust + ' — Total ' + total);
          const mail = (sale.customerEmail || S.customer && S.customer.email || '');
          if (mail) window.open('mailto:' + mail + '?subject=' + subj + '&body=' + bodyTxt);
          else if (navigator.share) navigator.share({ title: 'Invoice ' + invNo, text: 'Total ' + total });
          else UI.toast(T.t('pos.sendVia','Send: share via WhatsApp / Email (') + invNo + ')', 'ok');
        } catch (e) { UI.toast(e.message, 'err'); }

async function submit(payments, note) {
  const t0 = performance.now();
  // enrich payments with dueDate from promised input if credit
  try{
    const pdEl = document.querySelector('#payDueDate') || document.getElementById('promisedInput');
    const dueDateVal = (pdEl && pdEl.value) ? pdEl.value : (typeof promisedInput!=='undefined' && promisedInput.value ? promisedInput.value : '');
    if(dueDateVal) payments.forEach(p=>{ if(String(p.method).toUpperCase()==='CREDIT') p.dueDate=dueDateVal; });
  }catch(e){}
  /* v2.30.0 (N4) — points ka EK hi source of truth: LOYALTY row.
     * (Pehle yahan textbox ki value dobara copy hoti thi — wahi bug dobara aa sakta tha.) */
  try{
    const rate0 = Number((loySum && loySum.rate) || App.state.settings['loyalty.rate'] || 1) || 1;
    const cap0 = loySum ? Number(loySum.usablePoints || 0) : 0;
    payments.forEach(p => {
      if (String(p.method).toUpperCase() !== 'LOYALTY') return;
      let pts = Number(p.points || 0) || Math.floor(Number(p.amount || 0) / rate0);
      if (cap0 && pts > cap0) pts = cap0;
      if (pts < 0) pts = 0;
      p.points = pts; p.pointsRedeemed = pts;
    });
  }catch(e){}
  const tDueDate = (function(){ try{ const el=document.getElementById('payDueDate')||document.querySelector('input[type="date"]'); return el? el.value : ''; }catch(e){ return ''; } })();
  const tLoyPts = payments.reduce((a, p) => a + (String(p.method).toUpperCase() === 'LOYALTY' ? Number(p.points || 0) : 0), 0);
  const payload = {
    locationId: App.state.locationId,
    customerId: S.customer ? S.customer.id : '',
    customerName: S.customer ? S.customer.name : 'Walk-in Customer',
    customerTypeId: S.customer ? (S.customer.typeId || S.customer.customerTypeId || '') : '',
    items: S.cart.map(l => ({ itemId: l.itemId, qty: l.qty, price: l.price, discount: l.discount || 0, foc: !!l.foc, salespersonId: App.sessionMeta().userId, notes: l.note || '' })),  /* v2.31.3 FOC */
    creditOverride: S.__creditOverride ? { byUserId: (App.state.session || {}).userId, note: 'POS owner override' } : undefined,  /* v2.31.3 (r15/F4) */
    discount: S.discount, discountCode: S.discountCode, payments,
    dueDate: tDueDate,
    loyaltyPointsUsed: tLoyPts, pointsRedeemed: tLoyPts,
    notes: note || '', source: navigator.onLine ? 'POS' : 'OFFLINE'
  };
  if (!navigator.onLine) payload.offlineId = uid('bill');
  try {
    const sale = await API.call('sales.create', { sale: payload });
    if (sale && sale.queued) { UI.toast(T.t('pos.offlineQueued','Offline — bill queued'), 'warn'); clearCart(true); return; }
    // v2.16 performance: measure bill generation
    const ms = Math.round(performance.now() - t0);
    UI.toast('Sale complete ✅ ' + (sale.invoiceNo || '') + (ms > 200 ? ' · ' + ms + 'ms' : ''), 'ok');
    // simple confirmation (no design controls)
    showInvoiceConfirmation(sale);
    // optional fast auto-print if setting still enabled (but dialog not shown here)
    if (String(App.state.settings.autoPrintReceipt) === 'true') {
      try { Print.open(Print.receiptHtml(sale, App.state.settings, App.state.branchName), 'Receipt ' + sale.invoiceNo, (App.state.settings || {})['pos.receiptPaper'] || '80mm'); } catch (e) { }
    }
  } catch (e) { UI.toast(e.message, 'err'); }
}

let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.frequency.value = 1180; o.type = 'square';
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.08, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.09);
    o.start(); o.stop(actx.currentTime + 0.1);
  } catch (e) { }
}

document.addEventListener('keydown', e => {
  // Global help: F1 or ? anywhere (when not typing) — show shortcuts
  if ((e.key==='F1' || (e.key==='?' && !e.ctrlKey && !e.metaKey)) && App.current==='pos'){
    const typingNow = /input|textarea|select/i.test((e.target||{}).tagName||'');
    if(!typingNow || e.key==='F1'){ e.preventDefault(); showShortcutsHelp(); return; }
  }
  if (App.current !== 'pos') return;
  const typing = /input|textarea|select/i.test((e.target || {}).tagName || '');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); UI2.palette(); return; }
  // Allow Esc and F-keys even when typing for quick exit, but block other F-keys when typing
  const isFKey = /^F\d+$/.test(e.key);
  if (typing && e.key !== 'Escape' && e.key !== 'F9' && e.key !== 'F1' && !isFKey) return;
  if (e.key === 'F2') { e.preventDefault(); const i = document.querySelector('.pos2-search input'); if (i) { i.focus(); i.select(); } }
  else if (e.key === 'F3') { e.preventDefault(); pickCustomer(); }
  else if (e.key === 'F4') { e.preventDefault(); pickCustomer(); }
  else if (e.key === 'F6') { e.preventDefault(); discountModal(); }
  else if (e.key === 'F8') { e.preventDefault(); holdBill(); }
  else if (e.key === 'F9') { e.preventDefault(); pay('CASH'); }
  else if (e.key === 'F10') { e.preventDefault(); pay('CARD'); }
  else if (e.key === 'Escape') { // close any open picker/modal first
    const host = POS2.pkHost;
    if(host && !host.hidden){ host.hidden=true; e.preventDefault(); return; }
  }
});

        btn.style.cssText = 'min-width:56px;min-height:28px';
        btn.onclick = function(){
          // try to find in catalog and add to cart
          var cat = (typeof S !== 'undefined' && S.catalog) ? S.catalog : [];
          var hit = cat.find(function(x){ return String(x.id)===String(d.itemId); });
          if (hit && d.canFulfill) {
            try { addToCart({ id: hit.id, code: hit.code, name: hit.name, retailPrice: hit.rp, wholesalePrice: hit.wp, costPrice: hit.cp, stock: hit.qty, imageUrl: hit.img }, Number(d.qty)||1); UI.toast('Added from demand: ' + hit.name, 'ok'); } catch(e){ UI.toast(e.message,'err'); }
          } else if (hit) { try { quickViewItem(hit); } catch(e){} }
          else { UI.toast('Product not in catalog: ' + d.itemName, 'warn'); }
        };
        row.appendChild(btn);
      } else {
        var noId = document.createElement('span');
        noId.style.cssText = 'font-size:11px;color:var(--muted)';
        noId.textContent = 'New product';
        row.appendChild(noId);
      }
      h.appendChild(row);
    });
    if (rec.related && rec.related.length) {
      var rel2 = document.createElement('div');
      rel2.style.cssText = 'font-size:12px;color:var(--muted)';
      rel2.textContent = '💡 You may also need: ' + rec.related.slice(0,3).map(function(x){return x.name + ' ('+ x.stock +')';}).join(', ');
      h.appendChild(rel2);
    }
  }
  function fetchRec(){
    var cust = (typeof S !== 'undefined' && S.customer) ? S.customer : null;
    var h = ensureHost();
    if (!h) return;
    if (!cust || !cust.id) { h.innerHTML=''; return; }
    if (!App || !App.can || !App.can('demand.view')) { h.innerHTML=''; return; }
    h.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:6px">⏳ Loading demands…</div>';
    try {
      API.call('demand.posRecommend', { customerId: cust.id, locationId: App.state.locationId, limit: 4 }, { offlineFallback: function(){ return { demands: [], related: [] }; } })
        .then(function(r){ try{ renderDemands(r); }catch(e){ h.innerHTML=''; } })
        .catch(function(){ h.innerHTML=''; });
    } catch(e){ h.innerHTML=''; }
  }
  // patch updateCustBar to also refresh demands
  var origUpdate = null;
  function patch(){
    if (typeof updateCustBar === 'function' && !updateCustBar._demPatched) {
      origUpdate = updateCustBar;
      window.updateCustBar = function(){
        var rv = origUpdate.apply(this, arguments);
        try { fetchRec(); } catch(e){}
        return rv;
      };
      window.updateCustBar._demPatched = true;
    }
  }
  patch();
  // after POS screen render, ensure host exists
  var origRenderTotals = null;
  // delayed patch after screen registered
  setTimeout(patch, 800);
  // also observe customer changes via interval (for quick buttons)
  setInterval(function(){ try{ if (S && S.customer && document.getElementById('custBar2') && !document.getElementById(hostId)) fetchRec(); }catch(e){} }, 1500);
})();

window.POS2 = { S, addToCart, pay, clearCart, pickCustomer, togglePicker, bulkFlow, ui: POS2 };
})();
</script>
