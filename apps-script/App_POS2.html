<script>
/* ==========================================================================
   * HASEEB AUTOS — POS v2
   * Product cards · category rail · as-you-type filter (har field) · quick keys
   * · cart (side panel / offcanvas) · qty pad · split payment · holds · scan
   * Sab kuch Settings ▸ POS se configurable (layout, cards per row, stock badge…)
   * ========================================================================== */
(function () {
'use strict';

const S = {
  cart: [], customer: null, discount: 0, discountCode: '', note: '',
  favorites: Store.get('fav_items', []), recent: Store.get('recent_items', []),
  view: 'all', category: '', subCategory: '', brand: '', stockFilter: '',
  results: [], catalog: [], facets: { categories: [], brands: [], makes: [] }, held: [],
  bulkGridMode: false, _bulkGridSel: new Set(), bulkCartMode: false, _bulkCartSel: new Set()
};

const cfg = k => (App.state.settings ? App.state.settings[k] : undefined);
/** fuzzy normaliser (shared with the UI kit) — spaces/dashes ignored */
const U_norm = s => (typeof window.__uNorm === 'function'
  ? window.__uNorm(s)
  : String(s === null || s === undefined ? '' : s).toLowerCase().replace(/[\s\-_\/\\.#]/g, ''));

function isFav(id) { return S.favorites.indexOf(id) > -1; }
function toggleFav(id) {
  S.favorites = isFav(id) ? S.favorites.filter(x => x !== id) : S.favorites.concat([id]);
  Store.set('fav_items', S.favorites);
  // poori screen dobara render karne se flash aata tha — sirf grid refresh karein
  try { if (POS2.renderGrid) { POS2.renderGrid(); return; } } catch (e) { }
  App.refresh();
}
function markRecent(id) {
  S.recent = [id].concat(S.recent.filter(x => x !== id)).slice(0, 24);
  Store.set('recent_items', S.recent);
}

/* ------------------------------- totals ---------------------------------- */
function subTotal() { return S.cart.reduce((a, l) => a + l.price * l.qty - (l.discount || 0), 0); }
function totalTax() { return S.cart.reduce((a, l) => a + (l.tax || 0), 0); }
function grandTotal() { return Math.max(0, subTotal() - Number(S.discount || 0) + totalTax()); }
function estProfit() {
  /* v2.28.0 (W5) — cost family band ho to ye estimate ghalat hota (cost 0),
     * is liye 0 return karo aur UI (showProfit) ise dikhata hi nahi. */
  if (!App.field('margin')) return 0;
  return S.cart.reduce((a, l) => a + (l.price - (l.cost || 0)) * l.qty - (l.discount || 0), 0);
}

/* --------------------------- shop gate (W7 v2.30.5) ------------------------
   * User-report: POS pehle action (cart add) par rok nahi lagta. Ab: pehla sale
   * action par hi check (30s cache) — band ho to popup + banner, cart me kuch
   * nahi jata. window.__shopSession loadShopState sab users ke liye set karta hai. */
let _posShopChk = { at: 0, open: true };
async function shopOpenOk() {
  try { if (String((App.state.settings || {})['shop.requireOpen']) === 'false') return true; } catch (e) { }
  if (window.__shopSession && window.__shopSession.id) return true;
  if (Date.now() - _posShopChk.at < 30000) return _posShopChk.open;
  try {
    const st = await API.call('shop.status', {}, { offlineFallback: () => null });
    _posShopChk = { at: Date.now(), open: !(st && st.open === false) };
  } catch (e) { _posShopChk = { at: Date.now(), open: true }; }
  return _posShopChk.open;
}
function shopBlockedPopup() {
  const canOpen = App.can('pos.cash.manage');
  try {
    UI2.modal({
      title: '🔒 Shop band hai', size: 'sm',
      body: h('div', null,
        h('p', { style: { margin: '0 0 8px' } }, T.t('pos.shopGateToast','Shop must be open before starting a sale — first action (item add) was blocked.')),
        h('p', { class: 'sub', style: { margin: 0 } }, canOpen ? T.t('pos.openShopHint','Tap "Open the shop" — the day starts with opening cash.') : T.t('pos.askManagerOpen','Please ask a manager/cashier to open the shop.'))),
      actions: [ { label: 'Close', onClick: c => c() },
        canOpen ? { label: T.t('pos.openShopBtn','🗪 Open the shop'), cls: 'ok', onClick: c => { c(); try { window.shopQuickDialog(); } catch (e) { UI.toast(T.t('pos.shopDialogFail','Shop dialog did not open'), 'err'); } } } : null
      ].filter(Boolean)
    });
  } catch (e) { }
  try { ShopUI.show(T.t('pos.shopClosedBanner','Shop is closed — sale actions are blocked. Open the shop first.'), 'block', { shop: canOpen }); } catch (e) { }
}
/* ------------------------------ add to cart ------------------------------- */
async function addToCart(item, qty) {
  if (!(await shopOpenOk())) { shopBlockedPopup(); return; }
  qty = qty || 1;
  const wholesale = S.customer && S.customer.typeId && /wholesale|corporate/i.test(S.customer.typeName || '');
  const price = wholesale && item.wholesalePrice ? item.wholesalePrice : item.retailPrice;
  const found = S.cart.find(l => l.itemId === item.id);
  if (found) { found.qty += qty; found.lineTotal = found.qty * found.price - (found.discount || 0); }
  else S.cart.push({
    itemId: item.id, code: item.code, name: item.name, qty: qty, price: price,
    retail: item.retailPrice, wholesale: item.wholesalePrice, minPrice: item.minPrice || 0,
    cost: item.costPrice || 0, stock: item.stock, taxRate: item.taxRate || 0,
    discount: 0, tax: 0, lineTotal: price * qty, imageUrl: item.imageUrl || ''
  });
  markRecent(item.id);
  renderCart(); renderTotals();
}

function removeLine(idx) { S.cart.splice(idx, 1); renderCart(); renderTotals(); }

/* GS1 + continuous scan helper — extracts last barcode, clears input, handles rapid wedge + GS1 AIs */
function extractBarcode(raw){
  raw = String(raw||'').trim();
  if(!raw) return '';
  // Clean single token (typed code, SKU, or a normal scanner payload ending in Enter) → use AS-IS.
  // This keeps alphanumeric codes like FL00000 intact instead of mangling them into "00000".
  if(/^[0-9A-Za-z\.\-]{3,40}$/.test(raw)) return raw;
  // Otherwise: scanner junk ("I98796 6959375198796 6959375198796" or GS1 AIs) —
  // take the LAST 8-14 digit run (duplicated scans resolve to the newest code).
  const all = raw.match(/\d{8,14}/g);
  if(all && all.length) return all[all.length-1];
  const tokens = raw.split(/\s+/);
  const last = tokens[tokens.length-1] || raw;
  return last.replace(/[^0-9A-Za-z\.\-]/g,'');
}
function findProductByBarcode(code){
  if(!code) return null;
  const raw = String(code).trim();
  const clean = raw.toLowerCase();
  // Candidates: the whole value plus any long numeric runs from a messy scan payload
  const cands = [clean];
  (raw.match(/\d{8,14}/g)||[]).forEach(n=>{ if(cands.indexOf(n)===-1) cands.push(n); });
  // 1) exact match on code or barcode for every candidate
  for(const c of cands){
    const hit = S.catalog.find(i => String(i.code||'').toLowerCase()===c || String(i.bc||'').toLowerCase()===c || String(i.barcode||'').toLowerCase()===c);
    if(hit) return hit;
  }
  // 2) EAN check-digit-tolerant match — ONLY for pure numeric 13-digit candidates
  for(const c of cands){
    if(/^\d{13}$/.test(c)){
      const hit = S.catalog.find(i => String(i.bc||'').slice(0,12)===c.slice(0,12));
      if(hit) return hit;
    }
  }
  // 3) numeric suffix match — ONLY pure numeric candidates (never for alnum SKUs like FL00000)
  for(const c of cands){
    if(/^\d{8,}$/.test(c)){
      const hit = S.catalog.find(i => String(i.bc||'').endsWith(c) || c.endsWith(String(i.bc||'')));
      if(hit) return hit;
    }
  }
  // 4) name/code substring (manual typing convenience)
  const hit4 = S.catalog.find(i => String(i.name||'').toLowerCase().indexOf(clean)>-1 && clean.length>=3);
  if(hit4) return hit4;
  return null;
}
function handleScanInput(rawValue, inputEl){
  const code = extractBarcode(rawValue);
  if(!code) { if(inputEl){ inputEl.value=''; try{inputEl.focus();}catch(e){} } return; }
  const hit = findProductByBarcode(code);
  if(hit){
    addToCart({ id: hit.id, code: hit.code, name: hit.name, retailPrice: hit.rp, wholesalePrice: hit.wp, costPrice: hit.cp, stock: hit.qty, imageUrl: hit.img }, 1);
    if(String(App.state.settings['pos.scanSound'])!=='false') try{beep();}catch(e){}
    UI.toast(T.t('pos.scanned','Scanned') + ': ' + hit.name + ' (' + code + ') — ' + T.t('pos.addedCart','Added to cart'),'ok');
    if(inputEl){ inputEl.value=''; S.q=''; if(typeof renderGrid==='function') try{renderGrid();}catch(e){} try{inputEl.focus();}catch(e){} }
    return true;
  } else {
    UI.toast(T.t('pos.codeNotFound','Code not found') + ': ' + code + ' — ' + T.t('pos.tryManual','try manual search (F2)'),'warn');
    if(inputEl){ inputEl.value=''; S.q=''; if(typeof renderGrid==='function') try{renderGrid();}catch(e){} try{inputEl.focus();}catch(e){} }
    return false;
  }
}


/* ═════════ v2.14.1 — MULTI-SELECT ADD (UI2.itemPicker, PO/GRN jaisa) + BULK SCAN ══════
 * togglePicker: cart ke andar inline picker (search + 📋 poori list + Multi-select
 *   checkbox + qty per item + Add bar). Add hone par addToCart merge karta hai —
 *   product pehle se cart mein ho to qty barhti hai, duplicate line nahi banti.
 * bulkFlow: HaScan.bulkScan (external scanner continuous `once=0`, ya in-app loop).
 *   Har code turant cart; badge live count; popup band / badge-tap / Close = session khatam. */
// Dedicated Bulk Add Modal — per spec: explicit user action → modal → scan/search/select → bulk list → Add All
// Normal Mode (bulk closed) → Scan → direct add to cart (no modal) — handled by handleScanInput
// Bulk Mode → dedicated modal with scan + search + checkboxes + bulk list
function openBulkAddModal(){
  try{
    if (typeof UI2 === 'undefined' || !UI2.itemPicker) { UI.toast(T.t('pos.pickerFail','Product picker did not load'), 'err'); return; }
    /* v2.24.0 — picker ab khud scan-first hai: mode:'multi' se scan block +
       * checkboxes + Bulk List foran taiyar. DOM ko poke karne ki zarurat nahi. */
    const picker = UI2.itemPicker({
      mode: 'multi',
      icon: '🛒',
      title: 'Bulk Add — Multi Select',
      hint: T.t('pos.bulkHint','Scan → Bulk List → Add All · or tick from search/📋 list'),
      commitLabel: 'Add Selected to Cart',
      placeholder: 'Search product — name / code / barcode…',
      map: (r, q) => ({ r: r, q: q }),
      sub: r => [r.code, r.barcode ? 'barcode '+r.barcode : '', r.category,
        r.stock !== undefined ? 'stock ' + fmt.num(r.stock) : '',
        (r.retailPrice || r.rp) ? fmt.money(r.retailPrice || r.rp) : ''].filter(Boolean).join(' · '),
      onAdd: line => {
        if (line && line.r){
          const r = line.r;
          addToCart({ id: r.id, code: r.code, name: r.name,
            retailPrice: r.retailPrice, wholesalePrice: r.wholesalePrice,
            costPrice: r.costPrice, stock: r.stock, taxRate: r.taxRate || 0,
            imageUrl: r.imageUrl || '' }, Number(line.q||1));
        }
      },
      lines: []
    });
    const modal = UI2.modal({
      title: '📦 Bulk Add — Multi Select Mode',
      subtitle: 'Scan → auto-add to Bulk List → field clears → next scan ready · or search + tick · then Add All',
      size: 'lg',
      body: picker,
      actions: [
        { label: 'Cancel', cls: 'ghost', onClick: c=> c() },
        { label: 'Add Selected to Cart', cls: 'ok', onClick: c=>{
            if(!(picker.api && picker.api.hasSel && picker.api.hasSel()))
              return UI.toast(T.t('pos.noSelect','No item selected — scan or tick checkboxes'),'warn');
            picker.api.commit();
            c();
          }
        }
      ]
    });
    /* picker ke andar wala apna "Add to list" bar bhi wrapper band kar de —
       * warna stale scrim POS ke upar reh jata hai. */
    const addBarEl = picker.querySelector('.po-addbar');
    if (addBarEl) addBarEl.addEventListener('click', e => {
      if (e.target && e.target.closest && e.target.closest('.btn.ok')) setTimeout(() => { try { modal.close(); } catch (err) {} }, 30);
    });
    return modal;
  }catch(e){ UI.toast(T.t('pos.bulkError','Bulk modal error') + ': ' + (e.message||e),'err'); }
}
function togglePicker() {
  // Now opens dedicated modal instead of inline toggle (per spec, prevents dropdown conflict)
  return openBulkAddModal();
}

function bulkFlow() {
  const badge = POS2.bulkBadge;
  if (POS2.bulkHandle) { const hd = POS2.bulkHandle; try { hd.cancel ? hd.cancel() : (hd.close && hd.close()); } catch (e) { } return; }
  let n = 0, miss = 0; const misses = []; let finished = false;
  const mark = () => {
    if (!badge) return;
    const txt = ' 🔁 Bulk ON · ' + n + (miss ? ' · unknown ' + miss : '') + T.t('pos.bulkBadgeEnd',' · close');
    // preserve ha-ico SVG if present (v2.16 premium toolbar)
    const ico = badge.querySelector('.ha-ico');
    if (ico) { badge.textContent = ''; badge.appendChild(ico); badge.append(document.createTextNode(txt)); }
    else badge.textContent = txt;
  };
  const onDetect = v => {
    const q = String(v || '').trim(); if (!q) return;
    const hit = S.catalog.find(i => String(i.bc).toLowerCase() === q.toLowerCase() || String(i.code).toLowerCase() === q.toLowerCase());
    if (hit) {
      addToCart({ id: hit.id, code: hit.code, name: hit.name, retailPrice: hit.rp, wholesalePrice: hit.wp, costPrice: hit.cp, stock: hit.qty, imageUrl: hit.img }, 1);
      n++; if (String(App.state.settings['pos.scanSound']) !== 'false') beep();
    } else { miss++; if (misses.length < 6) misses.push(q); }
    mark();
  };
  const onDone = () => {
    if (finished) return; finished = true;
    POS2.bulkHandle = null;
    if (badge) { badge.hidden = true; badge.classList.remove('on'); }
    UI.toast(T.t('pos.bulkScanDone','Bulk scan khatam — ') + n + ' item' + (n === 1 ? '' : 's') + ' add' +
      (miss ? ' · unknown: ' + misses.join(', ') + (miss > 6 ? '…' : '') : ''), n ? 'ok' : 'warn', 4200);
  };
  if (!(window.HaScan && HaScan.bulkScan)) {
    UI.toast(T.t('pos.bulkNeedsBridge','Scanner bridge required for bulk (run with App_QR partial)'), 'warn'); return;
  }
  if (badge) { badge.hidden = false; badge.classList.add('on'); mark(); }
  POS2.bulkHandle = HaScan.bulkScan({ onDetect: onDetect, onDone: onDone, allFormats: true }) || { cancel: onDone };
}

/* ============================== SCREEN ==================================== */
/* ======================= PRODUCT QUICK VIEW (v2.5) =======================
 * Card par ⓘ dabayein → poora record ek popup mein: supplier, rates, stock
 * har branch, rack/bin, barcode, last purchase. Bottom scroll nahi — modal.
 * ======================================================================== */
/* supplier ka naam — catalog (i.sup) ya App.state.suppliers se */
function posSupplierName(id) {
  if (!id) return '';
  const s = (App.state.suppliers || []).filter(x => x.id === id)[0];
  return s ? s.name : '';
}

function quickViewItem(i) {
  const name = i.name || i.n || i.code || i.c || 'Item';
  const body = h('div', { class: 'qv' },
    h('div', { class: 'qv-img' }, i.img ? h('img', { src: i.img, alt: name, loading: 'lazy', decoding: 'async' }) : h('span', { class: 'pc-noimg' }, '📦')),
    h('div', { class: 'qv-body' },
      h('div', { class: 'qv-title' }, name),
      h('div', { class: 'qv-sub' }, [i.code || i.c, i.barcode].filter(Boolean).join(' · ')),
      h('div', { class: 'empty', style: { padding: '10px' } }, 'Detail load ho rahi hai…')));

  UI2.modal({
    title: 'ⓘ ' + name, size: 'md', body,
    actions: [
      { label: '🛒 Cart mein daalein', cls: 'ok', onClick: c => { c(); addToCart({
        id: i.id, code: i.code || i.c, name: name, retailPrice: i.rp, wholesalePrice: i.wp,
        costPrice: i.cp, stock: i.qty, imageUrl: i.img }); } },
      { label: '📄 Full record', cls: 'sec', onClick: c => { c(); App.go('items', { open: i.id }); } },
      { label: 'Close', onClick: c => c() }
    ]
  });

  API.call('items.get', { id: i.id, withStock: true },
    { offlineFallback: () => ({ id: i.id, name: name, code: i.code, __offline: true }) })
    .then(d => renderQuickView(body, i, d))
    .catch(() => renderQuickView(body, i, { id: i.id, name: name, code: i.code }));
}

function renderQuickView(body, i, d) {
  d = d || {};
  const num = n => (n === '' || n === null || n === undefined) ? '—' : fmt.num(n);
  const money = n => (n === '' || n === null || n === undefined) ? '—' : fmt.money(n);
  const suppliers = App.state.suppliers || [];
  const supName = id => { const s2 = suppliers.find(x => x.id === id); return s2 ? s2.name : (id || '—'); };
  const locName = id => { const l = (App.state.locations || []).find(x => x.id === id); return l ? (l.code || l.name) : id; };

  body.innerHTML = '';
  /* v2.9 §6 — image click par enlarge (lightbox), cursor zoom-in */
  const qvImg = (d.imageUrl || i.img);
  body.appendChild(h('div', { class: 'qv-img' },
    qvImg ? h('img', { src: qvImg, alt: d.name || i.name, loading: 'lazy', decoding: 'async',
      title: 'Click to enlarge', style: { cursor: 'zoom-in' },
      onclick: () => UI.zoomImage(qvImg, d.name || i.name || 'Item') })
      : h('span', { class: 'pc-noimg' }, '📦')));

  const right = h('div', { class: 'qv-body' },
    h('div', { class: 'qv-title' }, d.name || i.name || 'Item'),
    /* v2.9 §6 — Category ab Product Code ke foran baad */
    h('div', { class: 'qv-sub' },
      [d.code || i.code, d.category, d.brand, d.subCategory,
       d.barcode ? 'Barcode ' + d.barcode : ''].filter(Boolean).join(' · ') || '—'));

  /* --- main numbers --- */
  right.appendChild(h('div', { class: 'qv-grid' },
    h('div', { class: 'qv-cell' }, h('span', null, 'Sale price'), h('b', null, money(d.retailPrice !== undefined ? d.retailPrice : i.rp))),
    h('div', { class: 'qv-cell' }, h('span', null, 'Wholesale'), h('b', null, money(d.wholesalePrice !== undefined ? d.wholesalePrice : i.wp))),
    /* v2.28.0 (W5) — Cost/Margin cells sirf jis ko family ki ijazat hai (spec §9) */
    App.field('cost') ? h('div', { class: 'qv-cell' }, h('span', null, 'Cost'), h('b', null, money(d.costPrice !== undefined ? d.costPrice : i.cp))) : null,
    h('div', { class: 'qv-cell' }, h('span', null, 'Stock (all)'), h('b', null, num(d.qty !== undefined ? d.qty : i.qty))),
    /* v2.9.1 §6 — margin real cost/sale se, data na ho to '—' */
    !App.field('margin') ? null : (function () {
      const cost = Number(d.costPrice !== undefined ? d.costPrice : i.cp) || 0;
      const sale = Number(d.retailPrice !== undefined ? d.retailPrice : i.rp) || 0;
      if (!cost || !sale) return h('div', { class: 'qv-cell' }, h('span', null, 'Margin'), h('b', null, '—'));
      const m = sale - cost, pct = Math.round((m / sale) * 1000) / 10;
      return h('div', { class: 'qv-cell' }, h('span', null, 'Margin'),
        h('b', { style: { color: m > 0 ? 'var(--ok)' : (m < 0 ? 'var(--err)' : '') } },
          fmt.money(m) + ' · ' + pct + '%'));
    })()));

  /* --- supplier / sourcing --- */
  right.appendChild(h('div', { class: 'qv-sec' }, 'Supplier & sourcing'));
  right.appendChild(h('div', { class: 'qv-grid' },
    h('div', { class: 'qv-cell' }, h('span', null, 'Primary supplier'),
      h('b', { style: { fontSize: 'var(--fs-sm)' } }, supName(d.primarySupplierId || i.supplierId))),
    h('div', { class: 'qv-cell' }, h('span', null, 'Rack / bin'),
      h('b', { style: { fontSize: 'var(--fs-sm)' } }, (d.rack || i.rack || '—') + (d.binId ? ' / ' + d.binId : ''))),
    h('div', { class: 'qv-cell' }, h('span', null, 'Reorder level'), h('b', null, num(d.reorderLevel))),
    h('div', { class: 'qv-cell' }, h('span', null, 'Unit'), h('b', null, d.unit || 'PCS'))));

  /* --- stock per branch --- */
  const rows = d.stockByLocation || [];
  right.appendChild(h('div', { class: 'qv-sec' }, 'Stock by branch'));
  right.appendChild(rows.length ? UI2.table({
    screen: 'qv_stock', height: '20vh', rows, exportName: 'item-stock',
    columns: [
      { key: 'locationId', label: 'Branch', render: r => locName(r.locationId) },
      { key: 'qty', label: 'Qty', num: true },
      { key: 'avgCost', label: 'Avg cost', num: true, render: r => fmt.money(r.avgCost) },
      { key: 'rack', label: 'Rack', render: r => r.rack || '—' }
    ]
  }) : h('div', { class: 'empty', style: { padding: '8px' } }, 'Sirf current branch ka stock available hai'));

  /* --- price tiers --- */
  if (d.prices && d.prices.length) {
    right.appendChild(h('div', { class: 'qv-sec' }, 'Price tiers'));
    right.appendChild(UI2.table({
      screen: 'qv_prices', height: '18vh', rows: d.prices, exportName: 'item-prices',
      columns: [
        { key: 'priceListId', label: 'List' },
        { key: 'price', label: 'Price', num: true, render: r => fmt.money(r.price) },
        { key: 'minQty', label: 'Min qty', num: true }
      ]
    }));
  }

  /* ── v2.9.1 §6/§11 — sales history + supplier price comparison ────────
   * Dono lazy-load: API call ke baad hi render; real data na ho to
   * section DOM se remove ho jata hai (fabricated 'no data' blocks nahi). */
  const itemId = d.id || i.id;
  const qvSec = (label) => h('div', { class: 'qv-sec' }, label);

  const actHost = h('div');
  actHost._sec = qvSec('Sales history · last 30 days');
  right.appendChild(actHost._sec); right.appendChild(actHost);
  API.call('sales.itemActivity', { itemId, days: 30 }, { offlineFallback: () => null })
    .then(a => {
      if (!a || (!a.qty && !a.lastSold)) { actHost.remove(); actHost._sec.remove(); return; }
      actHost.innerHTML = '';
      actHost.appendChild(h('div', { class: 'qv-grid' },
        h('div', { class: 'qv-cell' }, h('span', null, 'Sold (30d)'), h('b', null, fmt.num(a.qty))),
        h('div', { class: 'qv-cell' }, h('span', null, 'Revenue (30d)'), h('b', null, fmt.moneyCompact(a.revenue))),
        h('div', { class: 'qv-cell' }, h('span', null, 'Last sold'), h('b', { style: { fontSize: 'var(--fs-sm)' } }, a.lastSold || '—')),
        h('div', { class: 'qv-cell' }, h('span', null, 'Top buyers'),
          h('b', { style: { fontSize: 'var(--fs-sm)', fontWeight: 500 } },
            (a.topCustomers || []).map(t => t.name + ' ×' + fmt.num(t.qty)).join(', ') || '—'))));
      /* stock status note — available data se, quick decision ke liye */
      const stockN = Number(d.qty !== undefined ? d.qty : i.qty) || 0;
      const daysOut = Number(a.qty) > 0 ? Math.round((stockN / (Number(a.qty) / 30)) * 10) / 10 : null;

      const minW = Number(cfg('pos.cardMinWidth') || Math.max(110, Math.floor(150 - (perRow - 4) * 8)));
      const grid = h('div', { class: 'pgrid', style: {
        gridTemplateColumns: 'repeat(auto-fill,minmax(' + minW + 'px,1fr))', alignContent: 'start'
      } });

      const virtOn = cfg('pos.virtualScroll') !== 'false' &&
        list.length > Number(cfg('pos.virtualThreshold') || 80);

        list.slice(0, 120).forEach(i => grid.appendChild(card(i)));
        countChip(list.length, list.length);
        gridHost.onscroll = null;
        return;

      /* ---------- virtualised grid: sirf nazar aane walay cards DOM mein ---------- */
      const gap = 10;
      let cols = Math.max(1, Math.round((grid.clientWidth || gridHost.clientWidth || 900) / (minW + gap)));
      let rowH = Number(cfg('pos.cardHeight') || 0) || (minW + 62);   // estimate → pehle paint par measure
      let lastRange = '';

      function paint() {
        const w = (grid.clientWidth || gridHost.clientWidth || 900);
        cols = Math.max(1, Math.round(w / (minW + gap)));
        const totalRows = Math.ceil(list.length / cols);
        const top = gridHost.scrollTop || 0;
        // jsdom / hidden containers me clientHeight 0 hota hai → sensible fallback
        const viewH = gridHost.clientHeight || Math.round((window.innerHeight || 800) * 0.7) || 600;
        const buf = 2;
        const first = Math.max(0, Math.floor(top / rowH) - buf);
        const visible = Math.ceil(viewH / rowH) + buf * 2;
        const last = Math.min(totalRows, first + visible);
        const range = first + ':' + last + ':' + cols;
        if (range === lastRange) return;                       // same window → repaint zaroori nahi
        lastRange = range;

        grid.style.paddingTop = (first * rowH) + 'px';
        grid.style.paddingBottom = Math.max(0, (totalRows - last) * rowH) + 'px';
        grid.innerHTML = '';
        const frag = document.createDocumentFragment();
        for (let i = first * cols; i < Math.min(list.length, last * cols); i++) frag.appendChild(card(list[i]));
        grid.appendChild(frag);

        const c0 = grid.firstChild;                            // asli oonchai measure kar lein
        if (c0 && c0.offsetHeight > 20) rowH = c0.offsetHeight + gap;
        countChip(list.length, grid.childNodes.length);
      }

      gridHost.onscroll = () => { if (gridHost._raf) return; gridHost._raf = requestAnimationFrame(() => { gridHost._raf = 0; paint(); }); };
      gridHost._onResize = () => { lastRange = ''; paint(); };
      // resize listener ek hi dafa bind ho (har render par naya na jude)
      if (!gridHost._resizeBound) {
        gridHost._resizeBound = true;
        window.addEventListener('resize', () => { try { gridHost._onResize && gridHost._onResize(); } catch (e) { } });
      }
      paint();
    }

      }

/* ============================================================================
   * v2.6 QA — "product cards main double product name show ho raha hay"
   * ----------------------------------------------------------------------------
   * Misaal:  naam  = "FLAMINGO DASHBOARD POLISH 450ML"
            * card  = "FLAMINGO DASHBOARD POLISH 450ML"
                    * "FL00000 · Flamingo · DashBoard Polish Spray"   ← dohrao!
* 
   * Wajah: card brand + category bhi dikha raha tha, aur seed data mein
   * category ("DashBoard Polish Spray") naam ke lafz repeat karta hai.
* 
   * Hal: jo hissa (brand/category/sub-category) PEHLE HI naam mein maujood ho,
   * usay chhupao. Asal maloomat (code, supplier, price) waisi hi rahegi.
   * ========================================================================== */
function redundantWithName(name, part) {
  const norm = v => String(v || '').toUpperCase()
    .replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2);
  const nw = norm(name), pw = norm(part);
  if (!pw.length) return false;
  const hit = pw.filter(w => nw.some(x => x.indexOf(w) === 0 || w.indexOf(x) === 0)).length;
  /* >=60% lafz naam mein mil jayein to ye dohrao hai */
  return (hit / pw.length) >= 0.6;
}
/** brand · subCategory · category — sirf wohi jo naam mein pehle se na hon */
function cardSubParts(name, parts) {
  return (parts || []).filter(Boolean).filter(pt => !redundantWithName(name, pt));
}

    function card(i) {
      const showImg = cfg('pos.showImageOnCard') !== 'false';
      const showStock = cfg('pos.showStockOnCard') !== 'false';
      const showPrice = cfg('pos.showPriceOnCard') !== 'false';
      const lowBadge = cfg('pos.lowStockBadge') !== 'false';
      const showSup = cfg('pos.showSupplierOnCard') !== 'false';
      const hoverQV = cfg('pos.hoverQuickView') !== 'false';
      const stk = Number(i.qty || 0);
      const stkCls = stk <= 0 ? 'out' : (stk <= 5 ? 'low' : '');
      const wholesale = S.customer && S.customer.typeId &&
        /wholesale|corporate/i.test(S.customer.typeName || '');
      const price = (wholesale && i.wp) ? i.wp : i.rp;
      // naam hamesha nazar aaye — catalog me short keys ho to bhi
      const name = i.name || i.n || i.code || i.c || 'Item';
      const code = i.code || i.c || '';
      /* v2.6 QA — dedup: naam ke lafz dobara na dikhao (double-name wali shikayat) */
      const sub = cardSubParts(name, [i.brand, i.sub || i.subCategory, i.cat]).join(' · ');
      const supName = i.sup || posSupplierName(i.sp || i.supplierId || i.primarySupplierId);

      /* ---- hover quick-view: 350ms tak cursor ruke to detail chip dikhe ---- */
      let qvTimer = null, pop = null;
      const hidePop = () => { if (qvTimer) { clearTimeout(qvTimer); qvTimer = null; } if (pop) { pop.remove(); pop = null; } };
      const showPop = el => {
        if (!hoverQV || pop) return;
        qvTimer = setTimeout(() => {
          qvTimer = null;
          pop = h('div', { class: 'pc-pop', role: 'tooltip' },
            h('div', { class: 'pop-t' }, name),
            h('div', { class: 'pop-r' }, h('span', null, 'Code'), h('b', null, code || '—')),
            h('div', { class: 'pop-r' }, h('span', null, 'Supplier'), h('b', null, supName || '—')),
            h('div', { class: 'pop-r' }, h('span', null, 'Stock'),
              h('b', { class: stkCls ? 'bad' : 'good' }, fmt.num(stk) + ' ' + (i.unit || ''))),
            h('div', { class: 'pop-r' }, h('span', null, 'Retail'), h('b', null, fmt.money(i.rp))),
            i.wp ? h('div', { class: 'pop-r' }, h('span', null, 'Wholesale'), h('b', null, fmt.money(i.wp))) : '',
            h('div', { class: 'pop-r' }, h('span', null, 'Cost'), h('b', null, fmt.money(i.cp))),
            i.rack ? h('div', { class: 'pop-r' }, h('span', null, 'Rack'), h('b', null, i.rack)) : '',
            h('div', { class: 'pop-f' }, T.t('pos.quickViewHint','ⓘ click for more details')));
          el.appendChild(pop);
        }, 350);
      };

      const _gridSel = !!(S.bulkGridMode && S._bulkGridSel && S._bulkGridSel.has(String(i.id)));
      return h('button', { class: 'pcard' + (isFav(i.id) ? ' fav' : '') + (stk <= 0 ? ' oos' : '') + (_gridSel?' sel':''), 
        style: _gridSel?{ outline:'2px solid var(--accent)'}:{},
        title: name + (code ? ' · ' + code : '') + (sub ? ' · ' + sub : '') + (supName ? ' · ' + supName : ''),
        onclick: () => {
          if(S.bulkGridMode){
            const k=String(i.id); if(S._bulkGridSel.has(k)) S._bulkGridSel.delete(k); else S._bulkGridSel.add(k);
            renderGrid();
            // update bulk bar
            try{ const bar=document.getElementById('pos2BulkGridBar'); if(bar){ bar.querySelector('b').textContent = S._bulkGridSel.size+' selected'; bar.querySelector('button.ok').textContent='Add ('+S._bulkGridSel.size+')'; } }catch(e){}
            return;
          }
          onPick(i);
        }, oncontextmenu: e => { e.preventDefault(); toggleFav(i.id); },
        onmouseenter: e => showPop(e.currentTarget), onmouseleave: hidePop,
        onfocus: e => showPop(e.currentTarget), onblur: hidePop },
        showImg ? h('div', { class: 'pc-img' },
          i.img ? h('img', { src: i.img, alt: name, loading: 'lazy' })
            : h('span', { class: 'pc-noimg' }, '📦'),
          h('span', { class: 'pc-qv', role: 'button', tabindex: '0',
            title: 'Quick view — supplier, stock, rates', 'aria-label': 'Quick view ' + name,
            onclick: e => { e.stopPropagation(); quickViewItem(i); },
            onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); quickViewItem(i); } }
          }, 'ⓘ')) : '',
        h('span', { class: 'pc-fav', title: isFav(i.id) ? 'Favourite hatayein' : T.t('pos.makeFavourite','Make favourite'),
          onclick: e => { e.stopPropagation(); toggleFav(i.id); } }, isFav(i.id) ? '★' : '☆'),
        h('div', { class: 'pc-body' },
          h('div', { class: 'pc-name' }, name),
          h('div', { class: 'pc-code' }, code + (sub ? ' · ' + sub : '')),
          showSup && supName ? h('div', { class: 'pc-sup' }, '🏭 ' + supName) : '',
          h('div', { class: 'pc-row' },
            showPrice ? h('span', { class: 'pc-price' }, fmt.money(price)) : '',
            showStock ? h('span', { class: 'pc-stk ' + (lowBadge ? stkCls : '') },
              stk <= 0 ? 'Out of Stock' : (stk + (wholesale ? '' : ' left'))) : '')),
        h('span', { class: 'pc-add' }, '+'),
        ...(S.bulkGridMode ? [h('input', { type: 'checkbox', checked: _gridSel, style: { position: 'absolute', left: '8px', top: '8px', width: '20px', height: '20px', accentColor: 'var(--accent)', zIndex: '2' }, onclick: e=>{ e.stopPropagation(); const k=String(i.id); if(S._bulkGridSel.has(k)) S._bulkGridSel.delete(k); else S._bulkGridSel.add(k); renderGrid(); }})] : []));
    }

    function onPick(i) {
      if (cfg('pos.allowDirectQty') === true || String(cfg('pos.allowDirectQty')) === 'true') qtyPad(i);
      else addToCart({ id: i.id, code: i.code, name: i.name, retailPrice: i.rp, wholesalePrice: i.wp, costPrice: i.cp, stock: i.qty, imageUrl: i.img });
      if (cfg('pos.scanSound') !== 'false') beep();
    }

    /* ----------------------------- search — GS1 continuous scan: debounce + Enter + rapid wedge detection ------------------------------ */
    let scanTimer=null, lastScanTime=0;
    searchInput.addEventListener('input', debounce(() => {
      const raw = searchInput.value;
      // Detect rapid wedge: if input was typed very quickly (scanner), handle as barcode
      const now = Date.now();
      const isRapid = (now - lastScanTime < 80) && raw.length >= 6;
      lastScanTime = now;
      if(isRapid && raw.length >= 8){
        // Likely scanner: try immediate barcode handling after short delay
        clearTimeout(scanTimer);
        scanTimer = setTimeout(()=>{
          const code = extractBarcode(raw);
          if(code && code.length>=6){
            const hit = S.catalog.find(i => String(i.bc).toLowerCase()===code.toLowerCase() || String(i.code).toLowerCase()===code.toLowerCase());
            if(hit){ handleScanInput(code, searchInput); return; }
          }
          // Not a barcode, treat as normal search
          S.category = ''; S.subCategory = '';
          renderGrid();
        }, 120);
        return;
      }
      // Full standalone EAN typed/pasted (8-14 digits, nothing else) → auto-submit like Enter
      const auto = searchInput.value.trim();
      if(/^\d{8,14}$/.test(auto)){
        clearTimeout(scanTimer);
        scanTimer = setTimeout(()=>{ handleScanInput(auto, searchInput); }, 140);
        return;
      }
      S.category = ''; S.subCategory = '';
      renderGrid();
      // server side deep search for barcodes not in cache
      const q = searchInput.value.trim();
      if (q.length >= 3 && navigator.onLine) {
        Shared.items({ q, limit: 12 }).then(rows => {   /* v2.27.0 W3.T3 */
          if (!rows || !rows.length) return;
          const ids = {}; S.catalog.forEach(i => ids[i.id] = 1);
          rows.forEach(r => { if (!ids[r.id]) S.catalog.push(mapItem(r)); });
          renderGrid();
        }).catch(() => { });
      }
    }, 150));

    searchInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const raw = searchInput.value.trim();
      if (!raw) return;
      // Use robust handler that extracts last barcode and clears
      handleScanInput(raw, searchInput);
    });

    // bulk grid bar
    (function(){
      let bar=document.getElementById('pos2BulkGridBar');
      if(!S.bulkGridMode){ if(bar) bar.remove(); return; }
      if(!bar){
        bar=h('div', { id: 'pos2BulkGridBar', class: 'card', style: { display: 'flex', gap: '8px', alignItems: 'center', padding: '10px', marginTop: '10px', position: 'sticky', bottom: '8px', zIndex: '2', boxShadow: 'var(--shadow2)' } });
        gridHost.parentNode.insertBefore(bar, gridHost.nextSibling);
      }
      bar.innerHTML='';
      bar.appendChild(h('b', null, S._bulkGridSel.size+' selected'));
      bar.appendChild(h('button', { class: 'btn sm ghost', onclick: ()=>{ S._bulkGridSel.clear(); renderGrid(); }}, 'Clear'));
      bar.appendChild(h('button', { class: 'btn sm ok', onclick: ()=>{
        if(!S._bulkGridSel.size) return UI.toast(T.t('pos.nothingSelected','Nothing selected'),'warn');
        let n=0;
        S._bulkGridSel.forEach(k=>{
          const it=S.catalog.find(x=> String(x.id)===String(k));
          if(it) { addToCart({ id: it.id, code: it.code, name: it.name, retailPrice: it.rp, wholesalePrice: it.wp, costPrice: it.cp, stock: it.qty, imageUrl: it.img }, 1); n++; }
        });
        S._bulkGridSel.clear(); S.bulkGridMode=false;
        const b=document.getElementById('pos2BulkGridBar'); if(b) b.remove();
        renderGrid(); renderCart(); renderTotals();
        UI.toast(n+' items added','ok');
      }}, 'Add ('+S._bulkGridSel.size+')'));
      bar.appendChild(h('button', { class: 'btn sm ghost', onclick: ()=>{ S.bulkGridMode=false; S._bulkGridSel.clear(); const b=document.getElementById('pos2BulkGridBar'); if(b) b.remove(); renderGrid(); }}, '✕ Exit'));
    })();
    renderCart(); renderTotals();
    setTimeout(() => { if (window.innerWidth > 900 && cfg('pos.autoFocusSearch') !== 'false') searchInput.focus(); }, 150);

    /* --------------------------- held bills ---------------------------- */
    function renderHeld(c) {
      c.appendChild(h('div', { class: 'card' }, h('div', { class: 'card-body tight' },
        S.held.length ? S.held.map(hb => h('div', { class: 'list-item' },
          h('div', { class: 'li-main' }, h('b', null, hb.ref), h('span', null, (hb.items || 0) + ' items · ' + fmt.money(hb.total || 0) + ' · ' + fmt.rel(hb.createdAt))),
          h('button', { class: 'btn sm', onclick: () => resumeHeld(hb.id) }, 'Resume'),
          h('button', { class: 'btn sm danger', onclick: async () => { await API.call('sales.held.resume', { id: hb.id }); loadHeld(); App.refresh(); } }, '🗑')))
          : h('div', { class: 'empty' }, h('span', { class: 'big' }, '⏸'), h('div', null, T.t('pos.noHeldBills','No held bills'))))));
    }
  }
});

const POS2 = {};
function mapItem(r) {
  return { id: r.id, code: r.code, name: r.name, cat: r.category || '', sub: r.subCategory || '',
    brand: r.brand || '', bc: r.barcode || r.code, alt: r.altBarcodes || '', cp: r.costPrice,
    rp: r.retailPrice, wp: r.wholesalePrice, mp: r.minPrice, tx: r.taxRate, qty: r.stock,
    rack: r.rack || '', img: r.imageUrl || '' };
}

/* ============================== CART UI — v2.16 optimized (fragment + config-aware) =================================== */
function renderCart() {
  const body = POS2.cartBody; if (!body) return;
  // config toggles (admin can disable features)
  const showRate = cfg('pos.cartShowRate') !== false;
  const showQty = cfg('pos.cartShowQtyCtl') !== false;
  const showActs = cfg('pos.cartShowEditDelete') !== false;
  const showDiscount = cfg('pos.cartShowDiscount') !== false;
  const count = document.getElementById('cartCount2');
  if (count) count.textContent = S.cart.length + ' items';
  // fast clear
  body.textContent = '';
  if (!S.cart.length) {
    body.appendChild(h('div', { class: 'empty', style: { padding: '34px 12px' } },
      h('span', { class: 'big' }, '🧺'), h('div', null, 'Cart khali hai'),
      h('div', { style: { fontSize: 'var(--fs-xs)', color: 'var(--muted-2)', marginTop: '6px' } },
        T.t('pos.findItemHint','Search and tap an item, or scan a barcode'))));
    // also update drawer count if open
    try { if (POS2.drawerCust) POS2.drawerCust.querySelector('#custNameM'); } catch (e) { }
    return;
  }
  // header — hide rate column if disabled
  const cols = h('div', { class: 'cart2-cols', 'aria-hidden': 'true' },
    h('span', { class: 'cr-info' }, 'Item'),
    showQty ? h('span', { class: 'hc-qty' }, 'Qty') : '',
    showRate ? h('span', { class: 'cr-rate' }, 'Rate') : '',
    h('span', { class: 'cr-amt' }, 'Amount'),
    showActs ? h('span', { class: 'cr-acts' }, '') : '');
  body.appendChild(cols);
  // fragment = single reflow (performance: cart updates / invoice generate faster)
  const frag = document.createDocumentFragment();
  // bulk cart select header
  const _bulkMode = !!S.bulkCartMode;
  if(_bulkMode && S.cart.length){
    if(!S._bulkCartSel) S._bulkCartSel=new Set();
    const selAll = h('label', { class: 'chk', style: { display: 'flex', gap: '8px', alignItems: 'center', padding: '8px', background: 'var(--panel-2)', border: '1px solid var(--line)', borderRadius: '10px', fontSize: '12px', fontWeight: '800', marginBottom: '8px' } },
      h('input', { type: 'checkbox', checked: S.cart.every((_,i)=> S._bulkCartSel.has(i)), onchange: e=>{ if(e.target.checked) S.cart.forEach((_,i)=> S._bulkCartSel.add(i)); else S._bulkCartSel.clear(); renderCart(); }}), 'Select all ('+S.cart.length+')',
      h('button', { class: 'btn sm danger', style: { marginLeft: 'auto' }, onclick: ()=>{ if(!S._bulkCartSel.size) return UI.toast(T.t('pos.nothingSelected','Nothing selected'),'warn'); const sel=Array.from(S._bulkCartSel).sort((a,b)=>b-a); sel.forEach(i=> S.cart.splice(i,1)); S._bulkCartSel.clear(); renderCart(); renderTotals(); UI.toast(sel.length+' removed','ok'); }}, '🗑 Delete'),
      h('button', { class: 'btn sm ghost', onclick: ()=>{ S.bulkCartMode=false; S._bulkCartSel.clear(); renderCart(); }}, '✕')
    );
    body.appendChild(selAll);
  }
  S.cart.forEach((l, idx) => {
        const _isSel = !!(_bulkMode && S._bulkCartSel && S._bulkCartSel.has(idx));

    const over = (l.stock !== undefined && l.stock !== null) && l.qty > Number(l.stock);
    const meta = l.code + (showDiscount && l.discount ? ' · -' + fmt.money(l.discount) : '') + (l.foc ? ' · 🎁 FOC' : '') + (l.note ? ' · 📝 ' + l.note : '');  /* v2.31.3 FOC */
    const row = h('div', { class: 'cart2-row' + (over ? ' warn' : '') + (_isSel ? ' sel' : ''), style: _isSel?{ outline:'2px solid var(--accent)', borderRadius:'10px'}:{} },
      ...(_bulkMode ? [h('input', { type: 'checkbox', checked: _isSel, style: { width: '18px', height: '18px', margin: '8px', accentColor: 'var(--accent)' }, onchange: e=>{ if(!S._bulkCartSel) S._bulkCartSel=new Set(); if(e.target.checked) S._bulkCartSel.add(idx); else S._bulkCartSel.delete(idx); renderCart(); }})] : []),
      h('div', { class: 'cr-info' },
        h('div', { class: 'cr-name' }, l.name),
        (cfg('pos.cartShowCode') === false ? '' : h('div', { class: 'cr-meta' }, meta)),
        (over && String(App.state.settings.allowNegativeStock) !== 'true')
          ? h('div', { style: { fontSize: 'var(--fs-xs)', color: 'var(--warn)' } },
            '⚠ Stock ' + l.stock + ' hai') : ''),
      showQty ? h('div', { class: 'qty-ctl' },
        h('button', { title: T.t('pos.decrease','Decrease'), 'aria-label': 'Qty minus', onclick: () => { l.qty = Math.max(1, l.qty - 1); l.lineTotal = l.qty * l.price - (l.discount || 0); renderCart(); renderTotals(); } }, '−'),
        (function () {
          const inp = h('input', { type: 'number', value: l.qty, min: '1', style: { width: '42px', textAlign: 'center' }, 'aria-label': 'Qty', title: 'Qty' });
          inp.onchange = () => { const v = Number(inp.value) || 1; l.qty = Math.max(1, v); l.lineTotal = l.qty * l.price - (l.discount || 0); renderCart(); renderTotals(); };
          inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
          return inp;
        })(),
        h('button', { title: T.t('pos.increase','Increase'), 'aria-label': 'Qty plus', onclick: () => { l.qty += 1; l.lineTotal = l.qty * l.price - (l.discount || 0); renderCart(); renderTotals(); } }, '+')) : h('span', { class: 'cr-rate', style: { gridColumn: '2' } }, '×' + l.qty),
      showRate ? h('span', { class: 'cr-rate' }, fmt.money(l.price)) : '',
      h('b', { class: 'cr-amt' }, fmt.money(l.lineTotal)),
      showActs ? h('div', { class: 'cr-acts' },
        /* v2.31.3 (r15/F1) — FOC toggle (100% free line; pos.discount gated) */
        (App.can && App.can('pos.discount')) ? h('button', { class: 'btn sm ghost' + (l.foc ? ' ok' : ''), title: 'FOC — line FREE (100% discount)', 'aria-label': 'FOC toggle', onclick: () => { l.foc = !l.foc; l.discount = l.foc ? Math.round(l.qty * l.price * 100) / 100 : 0; l.lineTotal = l.qty * l.price - (l.discount || 0); renderCart(); renderTotals(); } }, '🎁') : '',
        h('button', { class: 'btn sm ghost', title: 'Edit price/discount/note', onclick: () => lineEdit(idx) },
          h('span', { class: 'ha-ico', html: '<svg viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7\"/><path d=\"M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z\"/></svg>', 'aria-hidden': 'true' })),
        h('button', { class: 'btn sm ghost', title: 'Line hatayein', onclick: () => removeLine(idx) },
          h('span', { class: 'ha-ico', html: '<svg viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"3 6 5 6 21 6\"/><path d=\"M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6\"/><path d=\"M10 11v6\"/><path d=\"M14 11v6\"/><path d=\"M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2\"/></svg>', 'aria-hidden': 'true' }))) : '');
    frag.appendChild(row);
  });
  body.appendChild(frag);
  // keep header sticky visible
  try { body.scrollTop = body.scrollHeight; } catch (e) { }
}

function renderTotals() {
  const foot = POS2.cartFoot;
  const sub = subTotal(), tot = grandTotal();
  if (POS2.cartBar) {   /* mobile summary bar — totals hamesha nazar mein */
    try { POS2.cartBar.querySelector('.pcb-count').textContent = '🛒 ' + S.cart.length + ' item' + (S.cart.length === 1 ? '' : 's'); POS2.cartBar.querySelector('.pcb-total').textContent = fmt.money(tot); } catch (e) { }
  }
  if (!foot) return;
  // respect admin toggles
  /* v2.28.0 (W5) — margin family bhi zaroori (backend cost/margin strip kar deta hai,
     * warna client-side estimate ghalat "munafa" dikhata) */
  const showProfit = cfg('pos.showProfit') !== false && App.can('reports.financial') && App.field('margin');
  const showTax = cfg('pos.showTax') !== false;
  const payBtnsCfg = String(cfg('pos.payButtons') || 'CASH,CARD,SPLIT,CREDIT').split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
  const btnMap = {
    CASH: { label: '💵 Cash (F9)', cls: 'ok', method: 'CASH' },
    CARD: { label: '💳 Card', cls: 'sec', method: 'CARD' },
    SPLIT: { label: '🔀 Split', cls: 'sec', method: 'SPLIT' },
    CREDIT: { label: T.t('pos.ledgerBtn','📒 Credit ledger'), cls: 'sec', method: 'CREDIT' }
  };
  const payBtns = payBtnsCfg.filter(k => btnMap[k]).map(k => h('button', { class: 'btn ' + btnMap[k].cls, onclick: () => pay(btnMap[k].method) }, btnMap[k].label));
  foot.textContent = '';
  const frag = document.createDocumentFragment();
  frag.appendChild(h('div', { class: 'tot2' }, h('span', null, 'Subtotal'), h('span', null, fmt.money(sub))));
  frag.appendChild(h('div', { class: 'tot2' }, h('span', null, 'Discount'),
    h('span', { style: { color: 'var(--err)', cursor: 'pointer' }, onclick: discountModal }, '-' + fmt.money(S.discount) + ' ✎')));
  if (showTax) frag.appendChild(h('div', { class: 'tot2' }, h('span', null, App.state.settings.taxLabel || 'GST'), h('span', null, fmt.money(totalTax()))));
  frag.appendChild(h('div', { class: 'tot2 big' }, h('span', null, 'TOTAL'), h('span', null, fmt.money(tot))));
  if (showProfit) frag.appendChild(h('div', { class: 'tot2', style: { fontSize: 'var(--fs-xs)', color: 'var(--ok)' } },
    h('span', null, 'Est. profit'), h('span', null, fmt.money(estProfit()))));
  if (payBtns.length) frag.appendChild(h('div', { class: 'pay-pad' }, ...payBtns));
  foot.appendChild(frag);
  // apply cart UI toggles (hide inline add / picker / bulk if admin disabled)
  try {
    if (POS2.sideInline) POS2.sideInline.style.display = cfg('pos.cartInlineAdd') === false ? 'none' : '';
    if (POS2.cartTools) {
      const addBtn = POS2.cartTools.children[0]; const bulkBtn = POS2.cartTools.children[1];
      if (addBtn) addBtn.style.display = cfg('pos.cartPicker') === false ? 'none' : '';
      if (bulkBtn) bulkBtn.style.display = cfg('pos.cartBulkScan') === false ? 'none' : '';
    }
    const custBar = document.getElementById('custBar2');
    if (custBar) custBar.style.display = cfg('pos.customerBar') === false ? 'none' : '';
  } catch (e) { }
  try { if (S.customer) updateLoyaltyTeaser(S.customer.id); else updateLoyaltyTeaser(null); } catch (e) {}
  try { updateCustBar(); } catch (e) {}
}

/* ============================ LINE EDIT =================================== */
function lineEdit(idx) {
  const l = S.cart[idx];
  const f = UI2.form({
    values: { price: l.price, discount: l.discount, qty: l.qty },
    fields: [
      { key: 'qty', label: 'Quantity', type: 'number' },
      { key: 'price', label: 'Unit price', type: 'number' },
      { key: 'discount', label: 'Line discount', type: 'number' },
      { key: 'note', label: 'Line note', value: l.note || '', full: true }
    ]
  });
  UI2.modal({
    title: l.name, size: 'sm', body: f.el,
    actions: [{ label: 'Apply', cls: 'ok', onClick: async (c) => {
      const v = f.values();
      if (l.minPrice && Number(v.price) < l.minPrice && !App.can('items.price.edit')) {
        return UI.toast('Min price ' + fmt.money(l.minPrice) + T.t('pos.minPriceTail',' — cannot be lower'), 'err');
      }
      l.qty = Math.max(1, Number(v.qty) || 1);
      l.price = Number(v.price); l.discount = Number(v.discount) || 0; l.note = v.note;
      l.lineTotal = l.qty * l.price - l.discount;
      c(); renderCart(); renderTotals();
    } }]
  });
}

function discountModal() {
  const f = UI2.form({
    values: { discount: S.discount, code: S.discountCode },
    fields: [
      { key: 'discount', label: 'Discount amount', type: 'number' },
      { key: 'code', label: 'Coupon code' }
    ]
  });
  UI2.modal({
    title: 'Bill discount', size: 'sm', body: f.el,
    actions: [{ label: 'Apply', onClick: c => {
      const v = f.values();
      const maxPct = Number(App.state.settings.maxDiscountPct || 30);
      const pct = subTotal() ? (Number(v.discount) / subTotal() * 100) : 0;
      if (pct > maxPct && !App.can('pos.discount') && !App.can('*')) {
        return UI.toast('Max ' + maxPct + '% discount allowed', 'err');
      }
      S.discount = Number(v.discount) || 0; S.discountCode = v.code || '';
      c(); renderTotals();
    } }]
  });
}

/* ============================== CUSTOMER ================================== */
function pickCustomer() {
  const q = h('input', { class: 'st2-q', type: 'search', placeholder: T.t('pos.custSearchPh','Name or phone… (type to filter instantly)'), autocomplete: 'off' });
  const list = h('div', { style: { maxHeight: '50vh', overflow: 'auto', marginTop: '8px' } });
  const recentCustomers = (App.state.catalog.customers || []).slice(0, 3);
  const quickHost = recentCustomers.length ? h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '8px' } },
    ...recentCustomers.map(c => h('button', { class: 'btn sm sec', type: 'button', onclick: () => { S.customer = c; updateCustBar(); try { m.close(); } catch(e){} applyCustomerPricing(); } }, '👤 ' + String(c.name||'').slice(0,14)))) : h('span');
  async function run(term) {
    list.innerHTML = '<div class="tbl-empty" style="padding:14px">Loading…</div>';
    /* v2.27.0 (W3.T3) — shared accessor (POS/POS2/Demand/Orders/Boot ek hi path) */
    const rows = await Shared.customers({ q: term, withBalance: true, limit: 40,
      offline: () => ({ rows: (App.state.catalog.customers || []).filter(c => !term || (c.name + c.phone).toLowerCase().includes(term.toLowerCase())) }) });
    list.innerHTML = '';
    if (!rows.length) list.appendChild(h('div', { class: 'tbl-empty' }, T.t('pos.noCustomer','No customer found')));
    rows.forEach(c => list.appendChild(h('div', { class: 'list-item', style: { cursor: 'pointer', padding: '8px 10px' }, onclick: () => {
      S.customer = c; updateCustBar(); m.close(); applyCustomerPricing();
    } },
      h('div', { class: 'avatar', style: { width: '28px', height: '28px', fontSize: '12px' } }, (c.name || '?').charAt(0).toUpperCase()),
      h('div', { class: 'li-main' }, h('b', { style: { fontSize: '13px' } }, c.name), h('span', { style: { fontSize: '11px' } }, (c.phone ? fmt.phone(c.phone) + ' · ' : '') + 'bal ' + fmt.money(c.balance ?? c.bal ?? 0))),
      h('span', { class: 'badge ' + ((c.balance ?? c.bal ?? 0) > 0 ? 'warn' : 'ok'), style: { fontSize: '11px' } }, fmt.money(c.balance ?? c.bal ?? 0)))));
  }
  q.addEventListener('input', debounce(() => run(q.value.trim()), 120));
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const first = list.querySelector('.list-item'); if (first) first.click(); } });
  const m = UI2.modal({
    title: T.t('pos.selectCustomer','Select a customer'), size: 'sm',
    body: h('div', null, q, quickHost, list,
      h('button', { class: 'btn sec block', style: { marginTop: '10px' }, onclick: () => newCustomer(() => run(q.value.trim()||'')) }, '➕ Naya customer')),
    actions: [{ label: 'Walk-in (no customer)', cls: 'ghost', onClick: c => { S.customer = null; updateCustBar(); c(); } }]
  });
  run('');
  setTimeout(() => { try { q.focus(); q.select(); } catch(e){} }, 80);
}
