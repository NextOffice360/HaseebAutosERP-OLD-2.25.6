  return row;
};

/* ============================== FORM BUILDER =============================== */
/**
 * UI2.form({ fields, values, sections:[{id,label,fields:[]}], tabs:[{id,label,fields:[]}], columns:2 })
 * Supports: text, number, textarea, select, multiselect, switch, date, color, image, tags, money
 */
UI2.form = function (cfg) {
  const refs = {};
  const groups = cfg.tabs && cfg.tabs.length ? cfg.tabs
    : (cfg.sections && cfg.sections.length ? cfg.sections
      : [{ id: 'main', label: '', fields: cfg.fields || [] }]);

  const host = h('div', { class: 'form2' });
  const panels = {};
  let apiRef = null;          // niche return wala api (handlers runtime par use karte hain)

  /* ==========================================================================
     v2.30.0 (N1) — DIRTY TRACKING
     --------------------------------------------------------------------------
     Aap ki shikayat: "A=ON, B=OFF, C=ON the; ek toggle badla aur Save dabaya —
     pehle se ON wale settings OFF ho gaye."
     Asli wajah: Save POORI sub-tab ke saare fields bhejta tha (dirty sirf ek).
     Jo field DOM mein stored value se mukhtalif render hui (purana/unknown
     select option, stale state, format farq) wo chupke se overwrite ho jati thi.
     Hal: har field par apna dirty flag. Save sirf wohi keys bhejta hai jo
     user ne ASAL mein badli. (API waisi hi rehti hai — sirf payload chhota
     aur safe hota hai.)
     ========================================================================== */
  const dirty = new Set();
  let dirtySuspended = false;      // setVal/rollback ke doran dirty NA lage
  function markDirty(k) { if (!dirtySuspended && k) dirty.add(k); }

  function vals(opts) {
    const dirtyOnly = !!(opts && opts.dirtyOnly);
    const out = {};
    Object.keys(refs).forEach(k => {
      if (dirtyOnly && !dirty.has(k)) return;
      const el = refs[k];
      if (!el) return;
      if (el.tagName === 'LABEL') {                       // purana switch wrapper (back-compat)
        const cb = el.querySelector('input[type=checkbox]');
        out[k] = cb ? cb.checked : false; return;
      }
      if (el.type === 'checkbox') out[k] = !!el.checked;
      else if (el.classList && el.classList.contains('f-search')) {
        /* search field: picked value (id) priority, warna likha hua text */
        out[k] = (el.dataset.value !== undefined && el.dataset.value !== '') ? el.dataset.value : el.value;
      }
      else if (el.type === 'number') out[k] = el.value === '' ? '' : Number(el.value);
      else out[k] = el.value;
    });
    return out;
  }
  function dirtyKeys() { return Array.from(dirty); }
  function isDirty(k) { return k === undefined ? dirty.size > 0 : dirty.has(k); }
  function clearDirty() { dirty.clear(); try { host.dispatchEvent(new CustomEvent('form:dirty', { bubbles: true, detail: { keys: [] } })); } catch (e) { } }
  /** sirf wahi keys jo dirty hain (Save/SAVE ALL ka safe payload) */
  function changed() { return vals({ dirtyOnly: true }); }
  function setVal(k, v, quiet) {
    const el = refs[k];
    if (!el) return false;
    /* programmatic set dirty NAHI karta (warna save-all bina wajah payload bhejta) */
    const prevSusp = dirtySuspended; dirtySuspended = true;
    try { return setValInner(k, v, quiet); } finally { dirtySuspended = prevSusp; }
  }
  function setValInner(k, v, quiet) {
    const el = refs[k];
    if (!el) return false;
    if (el.tagName === 'LABEL') { const cb = el.querySelector('input[type=checkbox]'); if (cb) cb.checked = !!v; }
    else if (el.type === 'checkbox') {
      el.checked = !!v;
      const sw = el.closest ? el.closest('.switch') : null;
      const sp = sw ? sw.querySelector('.sw-state') : null;
      if (sp) sp.textContent = el.checked ? 'On' : 'Off';
    } else if (el.classList && el.classList.contains('f-search')) {
      el.dataset.value = (v === undefined || v === null) ? '' : String(v);
      if (!quiet && (v === undefined || v === null)) el.value = '';
      else if (v) el.value = String(v);
    } else el.value = (v === undefined || v === null) ? '' : String(v);
    if (!quiet) { try { el.dispatchEvent(new Event('change', { bubbles: true })); } catch (e) { } }
    return true;
  }
  function showField(k, on) {
    const el = refs[k];
    const col = el && (el.__col || (el.closest ? el.closest('.f-col') : null));
    if (col) col.style.display = on ? '' : 'none';
  }

  /* ------------------------------------------------------------------------
     v2.6 QA — HINT DONO ZABANON MEIN + TOOLTIP (app-wide)
     Bilingual.gs har field par ye bhejta hai:
       urHint  asli Urdu/Roman-Urdu hint
       enHint  English hint
       tip     poora tooltip (English title · Urdu · dono hints)
     Pehle sirf Urdu hint dikhti thi; ab dono — English pehle (parhne mein
     aasan), Urdu us ke baad. Tooltip mouse rakhne par milti hai.
     Jis field par koi hint nahi, wahan kuch nahi badalta.
     ---------------------------------------------------------------------- */
  function hintNode(f) {
    const en = (f && f.enHint) || '';
    const ur = (f && (f.urHint || (f.hint && !f.enHint ? f.hint : ''))) || '';
    if (!en && !ur) return '';
    if (en && ur && en !== ur) {
      return h('div', { class: 'f-hint bi' },
        h('span', { class: 'hi-en', lang: 'en' }, en),
        h('span', { class: 'hi-ur', lang: 'ur', dir: 'rtl' }, ur));
    }
    return h('div', { class: 'f-hint bi' }, h('span', { class: 'hi-en' }, en || ur));
  }
  function tipOf(f) {
    if (f && f.tip) return f.tip;
    const bits = [];
    if (f && f.label) bits.push(f.label);
    if (f && f.ur && f.ur !== f.label) bits.push(f.ur);
    const en = (f && f.enHint) || '', ur = (f && f.urHint) || (f && f.hint) || '';
    if (en) bits.push(en);
    if (ur && ur !== en) bits.push(ur);
    return bits.join('  ·  ');
  }

  function buildField(f, values) {
    const id = 'f_' + f.key;
    let input;
    let switchWrap = null;
    const val = values[f.key] !== undefined ? values[f.key] : (f.value !== undefined ? f.value : '');
    /* v2.24.0 — section header row: { type:'sec', label, hint, icon, tone } */
    if (f.type === 'sec') {
      const node = h('div', { class: 'f-sec full ' + (f.tone || 'brand'), style: f.hidden ? { display: 'none' } : null },
        h('span', { class: 'f-sec-i' }, f.icon || '◆'),
        h('div', { class: 'f-sec-t' },
          h('b', null, f.label || ''),
          (f.hint || f.urHint) ? h('span', { class: 'bi' },
            f.hint ? h('span', { class: 'hi-en' }, f.hint) : '',
            f.urHint ? h('span', { class: 'hi-ur', lang: 'ur', dir: 'rtl' }, f.urHint) : '') : ''));
      if (f.key) { node.__col = node; refs[f.key] = node; }
      return node;
    }
    /* v2.24.0 — inline info/warning callout: { type:'note', label, text, tone } */
    if (f.type === 'note') {
      const nnode = h('div', { class: 'f-note full ' + (f.tone || 'info'), style: f.hidden ? { display: 'none' } : null },
        h('span', { class: 'f-note-i' }, f.icon || (f.tone === 'warn' ? '⚠' : (f.tone === 'ok' ? '✅' : '💡'))),
        h('div', { class: 'f-note-t' }, f.label ? h('b', null, f.label) : '', h('span', null, f.text || f.hint || '')));
      if (f.key) { nnode.__col = nnode; refs[f.key] = nnode; }
      return nnode;
    }
    /* v2.24.0 — live panel: host ka apna element (data-aware note/KPI) form grid mein */
    if (f.type === 'el') {
      const enode = h('div', { class: 'f-col full f-el-row', style: f.hidden ? { display: 'none' } : null }, f.el || '');
      /* v2.24.1 — wrapper bhi chhupe jab andar wala panel `hidden` ho.
         Warna khaali `.f-col` ka border/padding box form mein ek khaali strip
         ki tarah nazar aata tha (Demand form mein saaf dikh raha tha). */
      if (f.el && f.el.nodeType === 1) {
        const syncHidden = () => { enode.style.display = f.el.hidden ? 'none' : ''; };
        syncHidden();
        try { new MutationObserver(syncHidden).observe(f.el, { attributes: true, attributeFilter: ['hidden'] }); } catch (e) { }
      }
      if (f.key) { enode.__col = enode; refs[f.key] = enode; }
      return enode;
    }
    if (f.type === 'select') {
      input = h('select', { id, class: 'f-input' });
      const opts = (f.options || []).slice();
      /* v2.30.0 (N1) — stored value options mein na ho to usay ZAYA na karo.
         Pehle browser pehla option chun leta tha aur Save usay likh deta tha
         (yahi "purani setting khud badal gayi" ka ek asli sabab tha). */
      const hasVal = opts.some(o => String(typeof o === 'object' ? o.value : o) === String(val));
      if (!hasVal && val !== undefined && val !== null && String(val) !== '') {
        opts.unshift({ value: String(val), label: String(val) + '  (mojooda)' });
      }
      /* v2.30.0 (N7) — `optionLabels`: value → dikhne wala naam (masalan provider
         id 'MOCK' ka asli naam "Local Data Assistant"). Value waise hi rehti hai. */
      const lblMap = (f && f.optionLabels) || null;
      opts.forEach(o => {
        const v = typeof o === 'object' ? o.value : o;
        const l0 = typeof o === 'object' ? o.label : o;
        /* optionLabels wali value par curated naam JEETTA hai — string options ki
           tarah soort l0 (jo aksar value khud hoti hai) isay chhupa nahi sakta.
           (N7 pehla attempt: sirf khaali l0 par label — string options mein l0
           khali hota hi nahi, is liye map kabhi lagta hi nahi tha.) */
        const l = (lblMap && lblMap[String(v)] !== undefined) ? lblMap[String(v)]
          : (l0 === undefined || l0 === null || l0 === '') ? String(v) : l0;
        input.appendChild(h('option', { value: v, selected: String(val) === String(v) }, l));
      });
    } else if (f.type === 'textarea') {
      input = h('textarea', { id, class: 'f-input', rows: f.rows || 3, placeholder: f.placeholder || '' }, val);
    } else if (f.type === 'switch') {
      // IMPORTANT: refs[f.key] hamesha asli <input type=checkbox> hona chahiye
      // (pehle <label> wrapper store ho raha tha → switch ki value save hi nahi hoti thi)
      const cb = h('input', { type: 'checkbox', id, title: tipOf(f) });
      if (val === true || val === 'true' || val === 1 || val === '1') cb.checked = true;
      input = cb;
      /* v2.5 professional settings-row: label + hint baen taraf, switch daen taraf */
      const state = h('span', { class: 'sw-state' }, cb.checked ? 'On' : 'Off');
      cb.addEventListener('change', () => { state.textContent = cb.checked ? 'On' : 'Off'; });
      switchWrap = h('div', { class: 'f-row-switch' },
        h('div', { class: 'frs-text' },
          h('span', { class: 'frs-label', title: tipOf(f) }, f.label || f.hint || ''),
          hintNode(f) || (f.hint ? h('div', { class: 'f-hint' }, f.hint) : '')),
        h('label', { class: 'switch' }, cb, h('i'), state));
    } else if (f.type === 'color') {
      input = h('input', { id, class: 'f-input f-color', type: 'color', value: val || f.def || '#c2410c' });
    } else if (f.type === 'money' || f.type === 'number') {
      // v2.8 placeholder audit — if caller left value empty, show faint placeholder (0 / 0.00) so field looks clean
      // business defaults (e.g. tax 0) still show actual value; creation forms pass '' to get empty+hint
      const _ph = f.placeholder || (f.type === 'money' ? '0.00' : '0');
      input = h('input', { id, class: 'f-input', type: 'number', step: f.step || 'any', value: val, placeholder: _ph });
      input.addEventListener('focus', () => { try { if(input.value) input.select(); } catch(e){} });
    } else if (f.type === 'date') {
      input = h('input', { id, class: 'f-input', type: 'date', value: val });
    } else if (f.type === 'search') {
      /* v2.24.0 — ASLI async search / auto-complete field.
         Pehle `type:'search'` ek plain text box ban jata tha aur `load:` hook
         kabhi call hi nahi hota tha — isi liye Demand ke customer/product
         fields "wired" nahi lagte the. Ab: dropdown results + keyboard nav
         (upar/neeche/Enter) + 📋 poori list + ✓ pick badge + row.fill se baqi
         fields auto-fill + f.onPick/f.onChange hooks. */
      input = h('input', { id, class: 'f-input f-search', type: 'text', autocomplete: 'off',
        value: val, placeholder: f.placeholder || 'Search…', role: 'combobox',
        'aria-autocomplete': 'list', 'aria-expanded': 'false' });
      input.dataset.value = (val === undefined || val === null) ? '' : String(val);
      const listBox = h('div', { class: 'f-search-results', hidden: true, role: 'listbox' });
      const badge = h('div', { class: 'f-pick-badge', hidden: true });
      const listBtn = h('button', { class: 'f-search-btn', type: 'button', title: 'Poori list dekhein', 'aria-label': 'Open full list' }, '📋');
      const clearBtn = h('button', { class: 'f-search-btn x', type: 'button', title: 'Clear', 'aria-label': 'Clear selection' }, '✕');
      const scanBtn = f.scan ? h('button', { class: 'f-search-btn', type: 'button',
        title: 'Barcode / QR scan', 'aria-label': 'Scan barcode or QR' }, '📷') : null;
      const wrap = h('div', { class: 'f-search-wrap' }, input, listBtn, scanBtn || '', clearBtn);
      let rows = [], idx = -1, seq = 0, timer = null, lastQ = null;

      function fireSel() { try { input.dispatchEvent(new Event('haselect', { bubbles: true })); } catch (e) { } }
      function showBadge(row) {
        if (!row) { badge.hidden = true; badge.innerHTML = ''; clearBtn.hidden = !input.value; return; }
        badge.hidden = false; badge.innerHTML = '';
        badge.append(h('span', { class: 'fpb-i' }, '✓'), h('b', { title: row.sub || '' }, row.label || ''),
          row.sub ? h('span', { class: 'fpb-s' }, row.sub) : '');
      }
      function pick(row) {
        rows = []; idx = -1; listBox.hidden = true; listBox.innerHTML = '';
        input.setAttribute('aria-expanded', 'false');
        input.value = row.label || '';
        input.dataset.value = (row.value === undefined || row.value === null) ? '' : String(row.value);
        input.__row = row;
        showBadge(row);
        if (row.fill && typeof row.fill === 'object') Object.keys(row.fill).forEach(k => setVal(k, row.fill[k], true));
        if (typeof f.onPick === 'function') { try { f.onPick(row, apiRef, vals()); } catch (e) { } }
        input.dispatchEvent(new Event('change', { bubbles: true }));
        fireSel();
      }
      function paintList() {
        listBox.innerHTML = '';
        if (!rows.length) listBox.appendChild(h('div', { class: 'f-sr-empty' }, f.emptyText || 'Kuch nahi mila — dobara likh kar try karein'));
        else rows.forEach((row, i) => {
          const el = h('div', { class: 'f-sr' + (i === idx ? ' on' : ''), role: 'option' },
            h('b', null, row.label || ''), row.sub ? h('span', null, row.sub) : '',
            row.tag ? h('i', { class: 'f-sr-tag' }, row.tag) : '');
          el.onclick = () => pick(row);
          listBox.appendChild(el);
        });
        listBox.hidden = false;
        input.setAttribute('aria-expanded', 'true');
      }
      function fetch(q, force) {
        if (!f.load) { rows = []; paintList(); return; }
        if (!force && q === lastQ && rows.length) { paintList(); return; }
        lastQ = q;
        const my = ++seq;
        try {
          const maybe = f.load(q, r => { if (my === seq) { rows = Array.isArray(r) ? r : []; idx = -1; paintList(); } });
          if (maybe && typeof maybe.then === 'function') maybe.then(r => { if (my === seq) { rows = Array.isArray(r) ? r : []; idx = -1; paintList(); } });
        } catch (e) { rows = []; paintList(); }
      }
      input.addEventListener('input', () => {
        input.dataset.value = ''; input.__row = null; showBadge(null);
        clearTimeout(timer);
        timer = setTimeout(() => fetch(input.value.trim()), 200);
      });
      input.addEventListener('focus', () => fetch(input.value.trim()));
      /* field se bahar nikalne par list band (warna peechhe khuli list reh jati hai) */
      input.addEventListener('blur', () => setTimeout(() => { listBox.hidden = true; input.setAttribute('aria-expanded', 'false'); }, 180));
      input.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); if (!rows.length) fetch(input.value.trim()); idx = Math.min(rows.length - 1, idx + 1); paintList(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); paintList(); }
        else if (e.key === 'Enter') { if (rows.length || idx >= 0) { e.preventDefault(); pick(rows[Math.max(0, idx)]); } }
        else if (e.key === 'Escape') { e.stopPropagation(); listBox.hidden = true; input.setAttribute('aria-expanded', 'false'); }
      });
      listBtn.addEventListener('click', () => { input.value = ''; input.dataset.value = ''; lastQ = null; fetch('', true); input.focus(); });
      if (scanBtn) scanBtn.addEventListener('click', async () => {
        const doCode = code => {
          const clean = String(code || '').trim();
          if (!clean) return;
          f.load(clean, r => {
            const list = Array.isArray(r) ? r : [];
            const lc = clean.toLowerCase();
            const ex = list.filter(x => String(x.value).toLowerCase() === lc
              || String(x.sub || '').toLowerCase().indexOf(lc) > -1
              || String(x.label || '').toLowerCase().indexOf(lc) > -1)[0];
            if (ex) { pick(ex); UI.toast('Scan mil gaya: ' + (ex.label || clean), 'ok'); }
            else { input.value = clean; input.dataset.value = ''; rows = list; paintList(); UI.toast('Code ' + clean + ' — list se select karein', 'warn'); }
          });
        };
        if (window.HaScan && HaScan.scan) HaScan.scan({ onDetect: doCode });
        else if (window.PWA && PWA.scanWithCamera) PWA.scanWithCamera(doCode);
        else { const v = await UI2.askCode(); if (v) doCode(v); }
      });
      clearBtn.addEventListener('click', () => {
        input.value = ''; input.dataset.value = ''; input.__row = null; rows = []; listBox.hidden = true;
        showBadge(null); input.dispatchEvent(new Event('change', { bubbles: true })); fireSel(); input.focus();
      });
      if (f.displayValue || val) showBadge({ label: f.displayValue || val });
      refs[f.key] = input;
      return h('div', { class: 'f-col' + (f.full ? ' full' : '') },
        h('label', { for: id, class: f.required ? 'req' : '', title: tipOf(f) }, f.label),
        wrap, listBox, badge, hintNode(f));
    } else if (f.type === 'tags') {
      input = h('input', { id, class: 'f-input', type: 'text', value: val, placeholder: f.placeholder || 'comma separated' });
    } else if (f.type === 'image') {
      /* v2.23.17 — image field: URL box + preview + Upload/Camera.
         Chosen file is shrunk client-side and kept as PENDING data (never stuffed
         into the sheet value); the host form uploads it via items.uploadImage on Save. */
      input = h('input', { id, class: 'f-input', type: 'text', value: val, autocomplete: 'off',
        placeholder: f.placeholder || 'Image URL — https://… (ya neeche Upload/Photo dabayein)' });
      const prev = h('img', { alt: 'image preview', loading: 'lazy', decoding: 'async',
        style: 'width:76px;height:76px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff' + (val && /^(https?:|data:image)/.test(val) ? '' : ';display:none'),
        src: val && /^(https?:|data:image)/.test(val) ? val : '' });
      const hint = h('div', { class: 'f-hint' }, f.hint || 'JPG/PNG · auto-resize 900px · Save par upload ho jayega');
      const updPrev = () => { const v = input.value.trim();
        if (/^(https?:|data:image)/.test(v)) { prev.src = v; prev.style.display = ''; }
        else if (!input.__pendingData) prev.style.display = 'none'; };
      input.addEventListener('input', () => { input.__pendingData = null; updPrev(); });
      const doPick = (camera) => {
        const fi = h('input', { type: 'file', accept: 'image/*', style: 'display:none' });
        if (camera) fi.setAttribute('capture', 'environment');
        fi.onchange = async () => {
          const file = fi.files && fi.files[0]; if (!file) return;
          if (file.size > 6 * 1024 * 1024) { UI.toast('Image 6MB se bari hai — chhoti kar ke try karein', 'warn', 3600); return; }
          hint.textContent = '⏳ Image process ho rahi hai…';
          try {
            const dataUrl = await UI2.shrinkImage(file, 900);
            input.__pendingData = dataUrl;
            prev.src = dataUrl; prev.style.display = '';
            hint.textContent = '✅ Image taiyar — “Save” dabate hi upload ho jayegi';
          } catch (e) { hint.textContent = '❌ ' + (e.message || 'Image process fail'); UI.toast(e.message || 'Image fail', 'err'); }
        };
        document.body.appendChild(fi); fi.click();
        setTimeout(() => { try { fi.remove(); } catch (e) {} }, 5000);
      };
      const btns = h('div', { class: 'row', style: 'gap:6px;flex-wrap:wrap;margin-top:6px' },
        h('button', { type: 'button', class: 'btn sm sec', onclick: () => doPick(false) }, '📁 Upload image'),
        h('button', { type: 'button', class: 'btn sm sec', onclick: () => doPick(true) }, '📷 Camera / Photo'),
        h('button', { type: 'button', class: 'btn sm ghost', onclick: () => { input.value = ''; input.__pendingData = null; prev.style.display = 'none'; hint.textContent = 'Image hata di — Save karein to remove ho jayegi'; } }, '✕ Hataein'));
      refs[f.key] = input;
      return h('div', { class: 'f-col full' },
        h('label', { for: id }, f.label || 'Image'),
        h('div', { style: 'display:flex;gap:10px;align-items:flex-start;min-width:0' },
          prev, h('div', { style: 'flex:1;min-width:0' }, input)),
        btns, hint);
    } else {
      input = h('input', { id, class: 'f-input', type: f.type || 'text', value: val, placeholder: f.placeholder || '', autocomplete: 'off' });
    }
    refs[f.key] = input;
    const field = h('div', { class: 'f-col' + ((f.full || f.type === 'switch') ? ' full' : ''),
      'data-fk': f.key || '' ,
        style: f.hidden ? { display: 'none' } : null },
      (f.type !== 'switch') ? h('label', { for: id, class: f.required ? 'req' : '',
        title: tipOf(f) }, f.label) : '',
      switchWrap || input,
      (f.type !== 'switch') ? hintNode(f) : '');
    input.__col = field;
    /* v2.24.0 — per-field hook: f.onChange(value, api, allValues)
       v2.30.0 (N10) — BUG FIX: hook `apiRef` se value leta tha, magar `apiRef`
       sirf UI2.form ke AAKHIR mein assign hota hai. Jo forms UI.form (legacy
       wrapper) se banti hain un mein apiRef hamesha null rehta tha →
       `(apiRef ? apiRef.values() : {})[f.key]` = undefined → hook chup-chaap
       kuch nahi karta tha (GRN par supplier badalne se info card update na hone
       ki asli wajah yehi thi). Ab value seedha field element se bhi li jati hai. */
    if (typeof f.onChange === 'function') {
      const fire = () => {
        try {
          const vals = apiRef ? apiRef.values() : null;
          const v = vals ? vals[f.key] : ((f.type === 'switch') ? !!input.checked : input.value);
          f.onChange(v, apiRef, vals || {});
        } catch (e) { }
      };
      input.addEventListener(f.type === 'search' ? 'haselect' : 'change', fire);
      if (f.type !== 'select' && f.type !== 'switch' && f.type !== 'search') input.addEventListener('input', fire);
    }
    return field;
  }

  if (groups.length === 1 && !groups[0].label) {
    const grid = h('div', { class: 'f-grid' });
    /* v2.28.0 (W5) — field visibility (ek hi chhoot rahi thi: plain-grid layout) */
    groups[0].fields.filter(f => !f.family || App.field(f.family)).forEach(f => grid.appendChild(buildField(f, cfg.values || {})));
    host.appendChild(grid);
  } else {
    const bodyHost = h('div', { class: 'tabbody' });
    groups.forEach((g, i) => {
      const panel = h('div', { class: 'f-grid', hidden: i !== 0 });
      /* v2.28.0 (W5) — family band ho to field render hi na ho (section bhi khali na lage) */
      (g.fields || []).filter(f => !f.family || App.field(f.family)).forEach(f => panel.appendChild(buildField(f, cfg.values || {})));
      panels[g.id] = panel;
      bodyHost.appendChild(panel);
    });
    const bar = h('div', { class: 'tabbar-l2' });
    groups.forEach((g, i) => bar.appendChild(h('button', {
      class: 'tab' + (i === 0 ? ' on' : ''), onclick: e => {
        Array.from(bar.children).forEach(b => b.classList.remove('on'));
        e.currentTarget.classList.add('on');
        groups.forEach(gg => panels[gg.id].hidden = gg.id !== g.id);
      }
    }, g.icon ? g.icon + ' ' : '', g.label)));
    host.append(bar, bodyHost);
  }

  /* v2.30.0 (N1/N2) — user ki asli tabdeeli par dirty mark karo + form registry
     (SAVE ALL page ke saare dirty forms ek sath uthata hai) */
  const keyOf = el => el && (el.id || '').replace(/^f_/, '');
  const markFromEvent = ev => {
    const t = ev.target;
    if (!t || !t.nodeType) return;
    const col = t.closest ? (t.closest('[data-fk]') || t.closest('.f-col')) : null;
    const k = (col && col.dataset && col.dataset.fk) || keyOf(t);
    if (k && refs[k] !== undefined) {
      markDirty(k);
      try { host.dispatchEvent(new CustomEvent('form:dirty', { bubbles: true, detail: { keys: dirtyKeys() } })); } catch (e) { }
    }
  };
  host.addEventListener('input', markFromEvent, true);
  host.addEventListener('change', markFromEvent, true);

  apiRef = {
    el: host,
    values: vals,
    changed,                       /* sirf dirty keys ka payload */
    dirtyKeys,
    markDirty,                     /* public: programmatic re-apply ke baad dirty mark karna */
    isDirty,
    clearDirty,
    set: setVal,
    show: showField,
    /* v2.30.0 (N2) — page-level SAVE ALL ka fallback handler (screen `f.onSave`
       set kar de to yahi section apne aap SAVE ALL mein shamil ho jata hai) */
    onSave: (typeof cfg.onSave === 'function') ? cfg.onSave : null,
    saveLabel: cfg.saveLabel || cfg.title || '',
    _registered: true,
    field: k => refs[k],
    setOptions(k, opts) {                                 /* dependent dropdown */
      const el = refs[k];
      if (!el || el.tagName !== 'SELECT') return false;
      el.innerHTML = '';
      (opts || []).forEach(o => {
        const v = typeof o === 'object' ? o.value : o;
        const l = typeof o === 'object' ? o.label : o;
        el.appendChild(h('option', { value: v }, l));
      });
      return true;
    },
    refs
  };
  UI2._forms = UI2._forms || [];
  UI2._forms.push(apiRef);
  /* NOTE (v2.30.0): yahan prune NAHI karte — form abhi DOM se juda nahi hota
     (buildSections pehle form banata hai, baad mein append karta hai). Zinda
     forms ki chhantni query ke waqt hoti hai (UI2.formsDirty). Sirf cap lagao. */
  if (UI2._forms.length > 60) UI2._forms.splice(0, UI2._forms.length - 60);
  return apiRef;
};

/* ============================================================================
   v2.30.0 (N2) — GLOBAL "SAVE ALL"
   ----------------------------------------------------------------------------
   Aap ki shart: "Every editable page should have a consistent SAVE ALL action
   that saves all unsaved changes on that page, even when individual Save
   buttons exist."
   Yahan ek hi jagah: page ke SAARE dirty forms (settings ke sab sub-tabs,
   notifications prefs, koi bhi form) ka dirty payload jama karke EK save
   call bhejta hai. Unchanged fields payload mein aate hi nahi — is liye
   purani settings kabhi default par reset nahi hoti.
   ========================================================================== */
UI2.formsDirty = function (root) {
  const forms = (UI2._forms || []).filter(f => f && f.el && f.el.isConnected !== false &&
    (!root || root.contains(f.el)) && typeof f.dirtyKeys === 'function' && f.dirtyKeys().length);
  return forms;
};
/* Stash mein bache hue (jaane wale panel ke) edits bhi payload mein aate hain —
   warna SAVE ALL se poora kaam save hona reh jata. */
UI2.stashValues = function () {
  const out = {};
  const st = UI2._tabStash || {};
  Object.keys(st).forEach(k => {
    const e = st[k];
    if (e && (!e.__screen || e.__screen === App.current)) Object.assign(out, e);
  });
  return out;
};
UI2.dirtyPayload = function (root) {
  const out = {};
  let n = 0;
  UI2.formsDirty(root).forEach(f => { const v = f.changed ? f.changed() : {}; Object.assign(out, v); n += Object.keys(v).length; });
  const live = Object.keys(out);
  const stash = UI2.stashValues();
  Object.keys(stash).forEach(k => { if (live.indexOf(k) === -1) { out[k] = stash[k]; n++; } });
  return { values: out, keys: Object.keys(out), count: n, forms: UI2.formsDirty(root).length, stashed: Object.keys(stash).length };
};
UI2.clearAllDirty = function (root) {
  UI2.formsDirty(root).forEach(f => { try { f.clearDirty(); } catch (e) { } });
  const st = UI2._tabStash || {};
  Object.keys(st).forEach(k => { if (!st[k] || !st[k].__screen || st[k].__screen === App.current) delete st[k]; });
};

/* ============================================================================
   v2.30.0 (N2) — "SAVE ALL" (shared engine, app-wide)
   ----------------------------------------------------------------------------
   Aap ki shart: har editable page par ek hi, consistent SAVE ALL jo page ki
   SAARI unsaved tabdeeliyan save kare — chahe page par apne Save buttons
   mojood hon. Yahan sirf ek jagah likha logic:
     1) page bridge (screen apna save function `App.setSaveBridge()` se de)
        — isi payload se chalta hai jo nav-guard dikhata hai (forms + sub-tab
        stash), is liye jo UI par dikh raha hai wohi save hota hai.
     2) fallback: har dirty form ka apna `onSave` (agar screen ne diya ho).
     3) kuch bhi na ho to JHOOOT nahi bolte — saaf toast ke sath button bhi
        nazar nahi aata (`UI2.saveAllReady()`).
   Section fail ho to: sirf wohi section dirty rehta hai + Retry (poora page
   dobara nahi likha jata), duplicate submit blocked, progress 1/2, 2/2 …
   ========================================================================== */
UI2.runners = function (root) {
  const forms = UI2.formsDirty(root);
  const groups = [];                       /* ek save handler = ek section */
  const leftover = { values: {}, keys: [], forms: [] };
  forms.forEach(f => {
    let vals = {};
    try { vals = f.changed ? f.changed() : {}; } catch (e) { vals = {}; }
    const keys = Object.keys(vals);
    if (!keys.length) return;
    if (typeof f.onSave !== 'function') {
      Object.assign(leftover.values, vals);
      leftover.keys = leftover.keys.concat(keys);
      leftover.forms.push(f);
      return;
    }
    let g = null;
    for (let i = 0; i < groups.length; i++) if (groups[i].fn === f.onSave) { g = groups[i]; break; }
    if (!g) { g = { fn: f.onSave, label: f.saveLabel || ('Section ' + (groups.length + 1)),
      values: {}, keys: [], forms: [] }; groups.push(g); }
    Object.assign(g.values, vals);
    g.keys = g.keys.concat(keys);
    g.forms.push(f);
  });
  return { forms: forms, groups: groups, leftover: leftover,
    bridge: root ? null : (window.App && App.saveBridge ? App.saveBridge : null) };
};
/** SAVE ALL ka koi asli rasta mojood hai? (warna button dikhana = jhoot) */
UI2.saveAllReady = function (root) {
  try { const r = UI2.runners(root); return !!(r.bridge || r.groups.length); } catch (e) { return false; }
};
UI2._saBusy = false;
UI2.saveAll = async function (opts) {
  opts = opts || {};
  if (UI2._saBusy) { UI.toast('SAVE ALL pehle se chal raha hai — intezar karein', 'warn'); return { skipped: true }; }
  const pack = UI2.dirtyPayload(opts.root);
  const r = UI2.runners(opts.root);
  if (!pack.count) { UI.toast('Koi unsaved tabdeeli nahi — sab mehfooz hai', 'warn'); return { ok: true, count: 0 }; }
  if (!r.bridge && !r.groups.length) {
    UI.toast('Is page par SAVE ALL available nahi — apne Save button se save karein', 'warn', 4200);
    return { ok: false, count: pack.count, noRunner: true };
  }
  UI2._saBusy = true;
  const total = (r.bridge ? 1 : 0) + r.groups.length;
  const failed = [];
  let done = 0, saved = 0;
  const step = label => { done++; try { UI.toast('SAVE ALL ' + done + '/' + total + ' — ' + label + '…', 'info', 1500); } catch (e) { } };
  try {
    if (r.bridge) {
      step(r.bridge.label || App.current);
      try { await r.bridge.run(pack); saved += pack.count; }
      catch (e) { failed.push({ label: r.bridge.label || 'Page', message: (e && e.message) || String(e), bridge: true }); }
    }
    for (let i = 0; i < r.groups.length; i++) {
      const g = r.groups[i];
      step(g.label);
      try {
        await g.fn(g.values, g.keys);
        g.forms.forEach(f => { try { f.clearDirty(); } catch (e) { } });
        saved += g.keys.length;
      } catch (e) { failed.push({ label: g.label, message: (e && e.message) || String(e), group: g }); }
    }
  } finally { UI2._saBusy = false; }
  const left = UI2.dirtyPayload(opts.root);
  if (!failed.length) UI.toast(saved + ' tabdeeli save ho gayi (' + total + ' section)', 'ok', 3200);
  else UI.toast('SAVE ALL adhoora: ' + failed.length + '/' + total + ' section fail — ' +
    failed.map(f => f.label).join(', ') + ' baqi hai', 'err', 6000);
  if (failed.length && UI2.retryToast) {
    try { UI2.retryToast('SAVE ALL adhoora (' + failed.length + '/' + total + ')', failed[0].message,
      () => { UI2.saveAll(opts); }); } catch (e) { }
  }
  const out = { ok: !failed.length, saved: saved, failed: failed, remaining: left.count, total: total };
  try { if (opts.then) opts.then(out); } catch (e) { }
  return out;
};

/* ============================= COMMAND PALETTE ============================= */
UI2.palette = function () {
  const inp = h('input', { class: 'pal-q', type: 'text', placeholder: 'Item, customer, invoice ya screen dhoondain… (↑↓ Enter)' });
  const list = h('div', { class: 'pal-list' });
  let items = [], sel = 0;

  const screens = Object.keys(App.screens).filter(id => {
    const s = App.screens[id]; return !s.perm || App.can(s.perm);
  }).map(id => ({ type: 'screen', id, label: App.screens[id].title, sub: 'Screen', icon: App.screens[id].icon || '▣' }));

  async function run(q) {
    let results = screens.filter(s => s.label.toLowerCase().indexOf(q.toLowerCase()) > -1);
    if (q.length >= 2) {
      try {
        const its = await Shared.items({ q, limit: 6 });
        results = results.concat((its || []).map(i => ({ type: 'item', id: i.id, label: i.name,
          sub: i.code + ' · ' + fmt.money(i.retailPrice) + ' · stock ' + i.stock, icon: '📦', data: i })));
      } catch (e) { }
      try {
        const cs = await Shared.customers({ q, limit: 4, withBalance: true });
        results = results.concat((cs || []).map(c => ({ type: 'customer', id: c.id, label: c.name,
          sub: (c.phone || '') + ' · bal ' + fmt.money(c.balance ?? c.bal ?? 0), icon: '👤', data: c })));
      } catch (e) { }
      try {
        const ss = await Shared.sales({ q, pageSize: 4 });
        results = results.concat((ss || []).map(s => ({ type: 'sale', id: s.id, label: s.invoiceNo,
          sub: s.customerName + ' · ' + fmt.money(s.total), icon: '🧾', data: s })));
      } catch (e) { }
    }
    items = results; sel = 0; paint();
  }

  function paint() {
    list.innerHTML = '';
    if (!items.length) { list.appendChild(h('div', { class: 'tbl-empty' }, 'Kuch nahi mila')); return; }
    items.slice(0, 12).forEach((it, i) => {
      list.appendChild(h('div', { class: 'pal-item' + (i === sel ? ' sel' : ''),
        onclick: () => pick(it), onmouseenter: () => { sel = i; paint(); } },
        h('span', { class: 'pi' }, it.icon),
        h('div', { class: 'pt' }, h('b', null, it.label), h('span', null, it.sub))));
    });
  }

  function pick(it) {
    m.close();
    if (it.type === 'screen') App.go(it.id);
    else if (it.type === 'item') { App.go('items', { open: it.id }); }
    else if (it.type === 'customer') { App.go('parties', { open: it.id, tab: 'customers' }); }
    else if (it.type === 'sale') { App.go('sales', { open: it.id }); }
  }

  inp.addEventListener('input', debounce(() => run(inp.value.trim()), 160));
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); paint(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); paint(); e.preventDefault(); }
    if (e.key === 'Enter' && items[sel]) { pick(items[sel]); e.preventDefault(); }
  });

  const m = UI2.modal({
    title: '🔎 Quick find (Ctrl+K)', size: 'md',
    body: h('div', null, inp, list),
    actions: [{ label: 'Close', onClick: c => c() }]
  });
  setTimeout(() => inp.focus(), 60);
  run('');
};

/**
 * Section heading — v2.6 QA: ab color-coded (fin/inv/ok/warn/info/err).
 *   UI2.section('Payments')                     → default (brand)
 *   UI2.section('Payments', actions, 'fin')     → financial blue
 *   UI2.section('Stock',    actions, 'inv')     → inventory purple
 *
 * v2.8.3 — `opts.desc`: section ke neeche chhoti si wazahat (kya hai / kaise
 * kaam karta hai). User ne kha tha ke har section/block ka matlab samajh aaye,
 * is liye ye app-wide available hai — sirf AI panel ke liye nahi.
 *   UI2.section('AI setup', null, 'info', { desc: 'Pehle provider chunein…' })
 */
UI2.section = function (title, actions, tone, opts) {
  const tones = ['fin', 'inv', 'ok', 'warn', 'info', 'err'];
  const cls = 'sec-head' + (tone && tones.indexOf(tone) > -1 ? ' ' + tone : '');
  /* v2.6 QA — section heading: English title + Urdu tooltip (app-wide).
     Bilingual.gs (window.BILING_SEC) se Urdu title milti hai; nahi mili to
     asli heading waise hi rahegi — kabhi kuch nahi toota. */
  const en = (typeof Bilingual !== 'undefined' && Bilingual.secTitle) ? Bilingual.secTitle(title) : title;
  const ur = (opts && opts.urSec) || ((en !== title) ? title : '');
  const tip = ur ? (en + '  ·  ' + ur) : en;
  const desc = (opts && opts.desc) ? String(opts.desc) : '';
  return h('div', { class: cls + (desc ? ' has-desc' : '') },
    h('div', { class: 'sec-head-row' },
      h('h4', { title: tip, style: { cursor: 'help' } }, en),
      actions ? h('div', { class: 'sec-actions' }, actions) : ''),
    desc ? h('p', { class: 'sec-desc' }, desc) : '');
};

/** Shrink any picked image to a JPEG data-URL (keeps payloads small, offline-safe) */
UI2.shrinkImage = function (file, maxPx) {
  maxPx = maxPx || 900;
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type || '')) return reject(new Error('Sirf image files (JPG/PNG) chalein gi'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('File nahi parh sake'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Ye valid image nahi hai'));
      img.onload = () => {
        try {
          let w = img.width || maxPx, hh = img.height || maxPx;
          const k = Math.min(1, maxPx / Math.max(w, hh));
          w = Math.max(1, Math.round(w * k)); hh = Math.max(1, Math.round(hh * k));
          const cv = h('canvas'); cv.width = w; cv.height = hh;
          cv.getContext('2d').drawImage(img, 0, 0, w, hh);
          resolve(cv.toDataURL('image/jpeg', 0.85));
        } catch (e) { reject(e); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
};

 */

    onAdd: line => { added.push(line); if (cfg.onAdd) cfg.onAdd(line); }
  });
  const m = UI2.modal({
    title: cfg.modalTitle || ('📦 ' + (cfg.title || 'Bulk add')),

    size: 'lg', body: picker,

  return { modal: m, added: added };
