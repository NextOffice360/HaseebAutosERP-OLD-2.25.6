  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Haseeb Autos">
  <meta name="description" content="Haseeb Autos — ERP & POS for auto parts, car & bike decoration. Retail + wholesale, 3 branches.">
  <script>
    /* ==================================================================
       v2.8.1 — META TAG FIX (production outage)
       Apps Script HTML file ke andar likhe meta tags IGNORE karta hai aur
       server par sirf 4 tags allow hain (viewport, apple/mobile-web-app-
       capable, google-site-verification). Baqi (theme-color, status-bar-
       style, apple-mobile-web-app-title, description) yahan browser se
       lagate hain. Static hosting / demo mein upar wale tags pehle se
       maujood hain, is liye ye UPDATE karta hai — duplicate nahi banate.
       ================================================================== */
    (function () {
      try {
        var ex = {
          'theme-color': '#0b1220',
          'apple-mobile-web-app-status-bar-style': 'black-translucent',
          'apple-mobile-web-app-title': 'Haseeb Autos',
          'description': 'Haseeb Autos — ERP & POS for auto parts, car & bike decoration. Retail + wholesale, 3 branches.'
        };
        Object.keys(ex).forEach(function (k) {
          var m = document.querySelector('meta[name="' + k + '"]');
          if (!m) {
            m = document.createElement('meta');
            m.setAttribute('name', k);
            document.head.appendChild(m);
          }
          m.setAttribute('content', ex[k]);
        });
      } catch (e) { /* meta tag na bane to bhi app chalegi */ }
    })();
  </script>
  <title><?= title ?></title>

  <?!= include('Styles'); ?>
</head>
