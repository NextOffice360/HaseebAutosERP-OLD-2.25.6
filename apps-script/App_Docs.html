<script>
/* ==========================================================================
   HASEEB AUTOS — DOCUMENTS HUB (v2.30.5 D4, doc-intel spec §1/§3)
   --------------------------------------------------------------------------
   Document Registry par enterprise file-manager UX:
     • KPIs (total / invoices / labels / today)
     • Search + type-filter + Refresh
     • Scanner entries: Scan & Resolve (camera/external) + Manual code
     • Table: docNo · type · ref · entity-link (seedha record khulta hai) ·
       version · status · created · actions (Open resolve-chain se, Copy)
     • Row → detail modal: metadata + related documents + actions
   Data: docs.registry.* (D3). Engines reused — koi naya scan/storage system
   nahi (spec §13). Fire-and-forget actions; registry sirf index hai.
   Perm: reports.view (mojood perm — koi naya permission schema nahi).
   ========================================================================== */
(function () {
'use strict';

const TYPE_ICON = { INVOICE: '🧾', RECEIPT: '🧾', LABELS: '🏷', REPORT: '📈', EXPORT: '📤',
  LEDGER: '📖', PDF: '📕', IMAGE: '🖼', IMPORT: '📥', TESTDOC: '🧪' };

const ENTITY_MAP = {
  sale: ['sales', {}], invoice: ['sales', {}], item: ['items', {}],
  customer: ['parties', { tab: 'customers' }], supplier: ['parties', { tab: 'suppliers' }]
};

function typeChip(t) {
  return h('span', { class: 'chip', style: { fontWeight: '600' } }, (TYPE_ICON[t] || '📄') + ' ' + t);
}
function statusChip(s) {
  const c = s === 'GENERATED' ? 'var(--ok)' : (s === 'VOID' ? 'var(--err)' : 'var(--warn)');
  return h('span', { class: 'chip', style: { color: c, borderColor: c } }, s || '—');
}
function entityCell(r) {
  const m = ENTITY_MAP[(r.entityType || '').toLowerCase()];
  if (m && r.entityId) return UI2.entityLink(m[0], Object.assign({}, m[1], { open: r.entityId }), r.ref || r.entityId);
  return h('span', null, r.ref || r.entityId || '—');
}
function copyText(txt) {
  const done = () => UI.toast('Copy ho gaya', 'ok', 1800);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done);
    else done();
  } catch (e) { done(); }
}
function docSummary(r) {
  return ['Document: ' + (r.docNo || r.id), 'Type: ' + (r.docType || ''), 'Ref: ' + (r.ref || ''),
    'Entity: ' + (r.entityType || '') + ' ' + (r.entityId || ''), 'Module: ' + (r.module || ''),
    'Version: ' + (r.version || 1), 'Status: ' + (r.status || ''), 'Created: ' + fmt.date(r.createdAt, true)]
    .join('\n');
}

/* ============================================================================
 * v2.30.5 (D6, doc-intel §4) — CONTEXT-AWARE SHARE (WhatsApp/Share/Copy)
 * Invoice-type → mojooda poori Share.invoice engine (providers/Outbox/PDF).
 * Doosre types → structured message (summary + totals/status) + wa.me free-link
 * + Copy-Text fallback (jab file bare ya manual bhejna ho). Koi naya messaging
 * system nahi — Comms ke upar hi chalta hai.
 * ==========================================================================*/
async function docShare(r) {
  if (/^(INVOICE|RECEIPT)$/i.test(r.docType || '') && /^(sale|invoice)$/i.test(r.entityType || '') && window.Share) {
    try {
      const sale = await API.call('sales.get', { id: r.entityId }, { offlineFallback: () => null });
      if (sale && (sale.invoiceNo || sale.id)) return Share.invoice(sale.invoiceNo ? sale : Object.assign({}, sale, { invoiceNo: r.ref }));
      UI.toast('Invoice record nahi mila — text share khul raha hai', 'warn', 2600);
    } catch (e) { /* fall through to text share */ }
  }
  /* v2.30.5 (D19) — per-docType template (SETTINGS comms.docTemplate.<TYPE>) */
  const F = { docNo: r.docNo || r.id, ref: r.ref || '', type: r.docType || '', entityType: r.entityType || '',
    entityId: r.entityId || '', module: r.module || '', version: r.version || 1, status: r.status || '',
    created: fmt.date(r.createdAt, true), qr: r.qr || '', business: App.state.branchName || 'Haseeb Autos' };
  let _st = App.state.settings || {};
  try { _st = Object.assign({}, _st, await API.call('system.settings.get', {}, { offlineFallback: () => _st }) || {}); } catch (e) { }
  const tpl = _st['comms.docTemplate.' + (r.docType || '')];
  let msg;
  if (tpl) msg = '*' + F.business + '*\n' + String(tpl).replace(/\{\{?(\w+)\}?\}/g, (m, k) => (F[k] !== undefined ? String(F[k]) : m)); /* D19-fix: {{x}} dono braces */
  else msg = ['*' + F.business + '* — ' + (r.docType || 'Document'),
    docSummary(r), r.qr ? ('Scan code: ' + r.qr) : ''].filter(Boolean).join('\n');
  const box = h('textarea', { rows: 8, class: 'f-input', style: { width: '100%' } });
  box.value = msg;
  const st = h('div', { class: 'share-status' });
  UI2.modal({
    title: '💬 Share ' + (r.docType || 'doc') + ' — ' + (r.docNo || r.id), size: 'md',
    body: h('div', null,
      h('div', { class: 'f-hint', style: { marginBottom: '6px' } }, 'Message edit karke bhejein — WhatsApp app/web khulega (koi API key nahi). Copy-Text fallback bhi mojood.'),
      box, st),
    actions: [
      { label: 'Close', cls: 'ghost', onClick: c => c() },
      { label: '⧉ Copy text', onClick: () => { try { navigator.clipboard && navigator.clipboard.writeText(box.value); } catch (e) { } st.textContent = 'Copy ho gaya ✅'; UI.toast('Message copy ho gaya', 'ok'); } },
      { label: '💬 WhatsApp', cls: 'ok', onClick: () => {
        window.open('https://wa.me/?text=' + encodeURIComponent(box.value), '_blank');
        st.textContent = 'WhatsApp khul gaya ✅';
      } }
    ]
  });
}

function docDetail(r, reload) {
  const host = h('div');
  const meta = h('div', { class: 'f-grid', style: { marginBottom: '10px' } },
    h('div', { class: 'f-col' }, h('label', null, 'Document'), h('b', null, r.docNo || r.id), h('span', { class: 'muted' }, r.docType || '')),
    h('div', { class: 'f-col' }, h('label', null, 'Entity'), entityCell(r)),
    h('div', { class: 'f-col' }, h('label', null, 'Status'), statusChip(r.status), h('span', { class: 'muted' }, 'v' + (r.version || 1))),
    h('div', { class: 'f-col' }, h('label', null, 'Created'), h('b', null, fmt.date(r.createdAt, true)), h('span', { class: 'muted' }, r.action || '')));
  host.appendChild(meta);
  /* v2.30.5 (D10, doc-intel §10) — QR INSPECTION VIEW: bara QR + encoded value +
     scannability note (print se pehle parhne-qogal check) */
  if (r.qr) {
    const insp = h('div', { style: { display: 'flex', gap: '14px', alignItems: 'center', flexWrap: 'wrap',
      border: '1px solid var(--line)', borderRadius: '12px', padding: '12px', marginBottom: '10px', background: 'var(--panel-2)' } });
    const img = h('img', { 'data-qr-inspect': '1', alt: 'QR inspection — ' + (r.docNo || ''), width: '160', height: '160',
      style: { width: '160px', height: '160px', maxWidth: '100%', background: '#fff', padding: '8px', borderRadius: '8px' } });
    Promise.resolve(QR.dataUrl(r.qr, 220)).then(d => { if (d) img.src = d; }).catch(() => { });
    insp.append(img, h('div', { style: { flex: '1', minWidth: '200px' } },
      h('div', { class: 'f-hint', style: { marginBottom: '4px' } }, 'Encoded value:'),
      h('code', { style: { fontSize: 'var(--fs-xs)', wordBreak: 'break-all', display: 'block', marginBottom: '6px' } }, r.qr),
      h('div', { style: { fontSize: 'var(--fs-xs)', color: (r.qr.length > 900 ? 'var(--warn)' : 'var(--ok)'), fontWeight: '600' } },
        r.qr.length > 900 ? '⚠ Lambi value — QR version bara lagega, test-scan karein' : '✓ Scan-safe size (compact value + margin)')));
    host.appendChild(insp);
  }
  const rel = h('div');
  host.appendChild(h('div', { class: 'sb-group', style: { padding: '6px 0' } }, 'Related documents'));
  host.appendChild(rel);
  Docs.related({ entityId: r.entityId }).then(rows => {
    const list = (rows || []).filter(x => x.id !== r.id).slice(0, 8);
    rel.innerHTML = '';
    if (!list.length) { rel.appendChild(h('div', { class: 'muted' }, 'Koi doosra document nahi')); return; }
    list.forEach(x => rel.appendChild(h('div', { class: 'list-item' },
      h('div', { class: 'li-main' }, h('b', null, x.docNo || x.id), h('span', null, (TYPE_ICON[x.docType] || '📄') + ' ' + (x.docType || '') + ' · ' + (x.ref || ''))),
      UI2.entityLink('documents', { open: x.id }, 'Open'))));
  }).catch(() => { rel.innerHTML = ''; rel.appendChild(h('div', { class: 'muted' }, 'Related load nahi hue')); });
  UI2.modal({
    title: '📄 ' + (r.docNo || r.id), size: 'md', body: host,
    actions: [
      { label: 'Close', cls: 'ghost', onClick: c => c() },
      { label: '💬 WhatsApp', cls: 'ok', onClick: c => { c(); docShare(r); } },
      { label: '📋 Copy text', onClick: c => { copyText(docSummary(r)); } },
      { label: '↻ Refresh', onClick: c => { c(); if (reload) reload(); } }
    ]
  });
}

/* ============================================================================
 * v2.30.5 (D5) — Drive setup: root-tree create-OR-reuse + verify (doc-intel §5/§6).
 * Backend: GAS DocReg.gs (real) / mock docs.drive.* (demo). IDs config me persist
 * hote hain — dobara chalane par koi duplicate folder nahi banta.
 * ==========================================================================*/
function driveSetup() {
  const host = h('div');
  host.appendChild(h('div', { class: 'f-hint', style: { marginBottom: '8px' } },
    'Drive me application root + sub-folders (Documents/Media/Exports/Imports/Archive). IDs persist hoti hain — repeat par koi duplicate nahi.'));
  const tree = h('div');
  host.appendChild(tree);
  UI2.modal({ title: '☁ Google Drive setup', size: 'md', body: host,
    actions: [
      { label: 'Close', cls: 'ghost', onClick: c => c() },
      { label: 'Verify', onClick: async c => {
        try {
          const v = await API.call('docs.drive.verify', {});
          UI.toast(v.ok ? ('Drive OK — ' + v.checked + ' folders checked') : ('Masla: ' + (v.missing || []).join(', ')), v.ok ? 'ok' : 'err', 3400);
        } catch (e) { UI.toast(e.message, 'err'); }
      } }
    ] });
  API.call('docs.drive.setup', {}).then(res => {
    const f = (res && res.folders) || {};
    tree.innerHTML = '';
    const row = (label, id) => h('div', { class: 'list-item' },
      h('div', { class: 'li-main' }, h('b', null, label), h('span', { class: 'muted' }, id || '')));
    tree.appendChild(row('📁 ' + (f.root && f.root.name || 'root'), f.root && f.root.id));
    ['Project', 'Documents', 'Media', 'Exports', 'Imports', 'Archive'].forEach(g => {
      if (!f[g]) return;
      tree.appendChild(row('  📂 ' + g, f[g].id));
    });
    tree.appendChild(h('div', { class: 'muted', style: { marginTop: '6px' } },
      'Total ' + (res.folderCount || Object.keys(f).length) + ' folders · ' + (res.at || '')));
  }).catch(e => { tree.innerHTML = ''; tree.appendChild(h('div', { class: 'empty' }, '⚠ ' + e.message)); });
}

App.registerScreen('documents', {
  title: 'Documents', icon: '📄', perm: 'reports.view',
  subtitle: () => 'Registry · scan → resolve → history',
  actions() {
    return [
      { label: 'Manual code', icon: '⌨', onClick: () => { if (window.HaScan) HaScan.manual({}); } },
      { label: 'Scan & Resolve', icon: '📷', cls: 'ok', onClick: () => { if (window.App.scanResolve) App.scanResolve(); else if (window.HaScan) HaScan.manual({}); } },
      { label: 'Drive setup', icon: '☁', onClick: driveSetup },
      { label: 'Refresh', icon: '↻', onClick: () => App.refresh() }
    ];
  },
  onParams(p) {
    /* deep link: App.go('documents', { open:'DOC…' }) → detail modal */
    if (p && p.open) setTimeout(async () => {
      try { const r = await Docs.get(p.open); if (r) docDetail(r, () => App.refresh()); else UI.toast('Document nahi mila: ' + p.open, 'warn'); } catch (e) { UI.toast(e.message, 'err'); }
    }, 400);
  },
  render(body) {
    const host = h('div'); body.appendChild(host);
    const qInput = h('input', { class: 'f-input', placeholder: 'Search doc / ref / module…', type: 'search', 'aria-label': 'Search documents' });
    const typeSel = h('select', { class: 'f-input', 'aria-label': 'Document type' },
      h('option', { value: '' }, 'All types'),
      ['INVOICE', 'RECEIPT', 'LABELS', 'REPORT', 'EXPORT', 'IMPORT', 'LEDGER', 'PDF', 'IMAGE'].map(v => h('option', { value: v }, (TYPE_ICON[v] || '📄') + ' ' + v)));
    let tmr;
    [qInput, typeSel].forEach(el => el.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(load, 350); }));

    const bar = h('div', { class: 'f-grid', style: { marginBottom: '8px' } }, qInput, typeSel);
    const scans = h('div', { class: 'chips', style: { marginBottom: '8px' } });
    const kpis = h('div', { style: { marginBottom: '8px' } });
    const listHost = h('div');
    host.append(scans, bar, kpis, listHost);
    /* v2.30.5 (D18) — recent scans chips: click → dobara resolve */
    function paintScans() {
      scans.innerHTML = '';
      let hist = []; try { hist = Store.get('ha_scans', []) || []; } catch (e) { }
      if (!hist.length) return;
      scans.appendChild(h('span', { class: 'muted', style: { fontSize: 'var(--fs-xs)' } }, 'Recent scans:'));
      hist.slice(0, 5).forEach(x => scans.appendChild(h('button', {
        class: 'chip', title: 'Dobara resolve karein: ' + x.code,
        onclick: () => App.resolveCode(x.code)
      }, x.code.length > 22 ? x.code.slice(0, 22) + '…' : x.code)));
    }
    paintScans();

    function load() {
      listHost.innerHTML = '';
      listHost.appendChild(UI.skeleton(4));
      Docs.list({ q: qInput.value.trim(), docType: typeSel.value, pageSize: 100 }).then(res => {
        const rows = res.rows || [];
        const today = new Date().toISOString().slice(0, 10);
        const cnt = t => rows.filter(r => r.docType === t).length;
        kpis.innerHTML = '';
        kpis.appendChild(UI2.kpiGrid([
          { icon: '📄', label: 'Total documents', value: res.total != null ? res.total : rows.length, cls: 'brand' },
          { icon: '🧾', label: 'Invoices', value: cnt('INVOICE') },
          { icon: '🏷', label: 'Labels', value: cnt('LABELS') },
          { icon: '📅', label: 'Aaj generate', value: rows.filter(r => String(r.createdAt || '').slice(0, 10) === today).length, cls: 'ok' }
        ]));
        listHost.innerHTML = '';
        if (!rows.length) {
          listHost.appendChild(h('div', { class: 'empty' }, h('span', { class: 'big' }, '📄'),
            h('div', null, 'Registry me koi document nahi — koi invoice ya labels print karein, ya code scan karein'),
            h('button', { class: 'btn sm ok', style: { marginTop: '10px' }, onclick: () => App.scanResolve && App.scanResolve() }, '📷 Scan & Resolve')));
          return;
        }
        listHost.appendChild(UI2.table({
          screen: 'documents', rows: rows, height: '58vh', exportName: 'documents',
          columns: [
            { key: 'docNo', label: 'Doc no', render: r => h('b', null, r.docNo || r.id) },
            { key: 'docType', label: 'Type', render: r => typeChip(r.docType) },
            { key: 'ref', label: 'Entity', render: r => entityCell(r) },
            { key: 'module', label: 'Module' },
            { key: 'version', label: 'Ver', num: true, render: r => 'v' + (r.version || 1) },
            { key: 'status', label: 'Status', render: r => statusChip(r.status) },
            { key: 'createdAt', label: 'Created', render: r => fmt.date(r.createdAt, true) },
            { key: '_act', label: 'Actions', render: r => h('span', { style: { display: 'flex', gap: '6px' } },
              h('button', { class: 'btn sm ghost', title: 'Resolve + entity kholein', 'aria-label': 'Open ' + (r.docNo || ''), onclick: ev => { ev.stopPropagation(); App.resolveCode(r.qr || ('HA:DOC:' + r.id)); } }, '↗'),
              h('button', { class: 'btn sm ghost', title: 'Share (WhatsApp/Copy)', 'aria-label': 'Share ' + (r.docNo || ''), onclick: ev => { ev.stopPropagation(); docShare(r); } }, '💬'),
              h('button', { class: 'btn sm ghost', title: 'Copy document text', 'aria-label': 'Copy ' + (r.docNo || ''), onclick: ev => { ev.stopPropagation(); copyText(docSummary(r)); } }, '📋')) }
          ],
          onRow: r => docDetail(r, load)
        }));
      }).catch(e => {
        listHost.innerHTML = '';
        listHost.appendChild(h('div', { class: 'empty' }, '⚠ ' + e.message));
      });
    }
    load();
  }
});
})();
</script>
