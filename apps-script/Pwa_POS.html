<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title><?= title ?></title>
  <?!= include('Pwa_Shell'); ?>
  <script>
    var PWA_ICON_192 = '<?!= PWA_ICONS.i192 ?>';
    var PWA_ICON_512 = '<?!= PWA_ICONS.i512 ?>';
  </script>
  <script>HA_applyExtraMeta(<?!= extraMetaJson ?>);</script>
  <style>
    /* =============== HASEEB POS — Senior PWA Craft (Pwa_Shell vars, no external) =============== */
    /* Search */
    .pos-search{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow2);position:relative}
    .pos-search input{flex:1;border:0;background:transparent;min-height:40px;font-size:16px;outline:none;color:var(--ink)}
    .pos-search .act{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;cursor:pointer;font-size:17px;flex:0 0 auto}
    .pos-search .act.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    .pos-search .clear{position:absolute;right:92px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:999px;border:0;background:var(--card3);color:var(--muted);display:none;place-items:center;cursor:pointer;font-size:12px}
    .pos-search.has-value .clear{display:grid}
    /* Chips with count */
    .cat-chips{display:flex;gap:8px;overflow:auto;padding:8px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
    .cat-chips::-webkit-scrollbar{display:none}
    .chip{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card2);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center;gap:6px;scroll-snap-align:start}
    .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    .chip .cnt{font-size:11px;font-weight:800;padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.08);border:1px solid var(--line);min-width:18px;text-align:center}
    .chip.on .cnt{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.3);color:var(--accent-ink)}
    /* Grid */
    .pos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
    @media(min-width:520px){.pos-grid{grid-template-columns:repeat(3,1fr)}}
    @media(min-width:860px){.pos-grid{grid-template-columns:repeat(4,1fr)}}
    .p-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s, box-shadow .12s, border-color .12s;position:relative}
    .p-card:active{transform:scale(.97)}
    .p-card:hover{border-color:var(--line2);box-shadow:var(--shadow2)}
    .p-card.out{opacity:.72}
    .p-thumb{height:84px;background:linear-gradient(135deg,var(--card2),var(--card3));display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
    .p-thumb span{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:999px;box-shadow:var(--shadow2)}
    .p-thumb .add{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.18);cursor:pointer}
    .p-thumb .stock-dot{position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:999px;border:2px solid var(--card);background:var(--ok)}
    .p-thumb .stock-dot.low{background:var(--warn)} .p-thumb .stock-dot.out{background:var(--err)}
    .p-body{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
    .p-name{font-size:13px;font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
    .p-meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
    .p-meta .tier{font-size:11px;font-weight:800;padding:2px 6px;border-radius:999px;border:1px solid var(--line);background:var(--card2)}
    .p-price{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums}
    .p-price small{font-size:11px;color:var(--muted);font-weight:700}
    .p-stock{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--card2);display:inline-block}
    .p-stock.out{color:var(--err);border-color:rgba(239,68,68,.28);background:rgba(239,68,68,.10)}
    .p-stock.low{color:var(--warn);border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.12)}
    /* Cart line */
    .cart-line{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
    .cart-line:last-child{border-bottom:0}
    .cart-line .thumb{width:44px;height:44px;border-radius:10px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);flex:0 0 auto}
    .cart-line .nm{flex:1;min-width:0}
    .cart-line .nm b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cart-line .nm small{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cart-line .line-total{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;min-width:78px;text-align:right}
    .qty{display:flex;align-items:center;gap:6px}
    .qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:800;cursor:pointer;display:grid;place-items:center;font-size:14px}
    .qty button:active{transform:scale(.96)}
    .qty .n{min-width:28px;text-align:center;font-weight:900;font-size:14px}
    /* Demand */
    .demand-host:empty{display:none}
    .demand-host{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
    .demand-row{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:13px}
    .demand-row.arrived{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.08)}
    /* Totals */
    .tot-box{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
    .tot-line{display:flex;justify-content:space-between;align-items:center;font-size:13px}
    .tot-line.grand{font-weight:900;font-size:16px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
    .tot-line .hint{font-size:11px;color:var(--muted)}
    /* Customer */
    .card:has(.cust-field){overflow:visible}
    .cust-summary{display:flex;gap:12px;align-items:center;margin-top:10px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card2);transition:border-color .15s}
    .cust-summary.has-cust{border-color:var(--accent);background:linear-gradient(135deg, var(--card2), var(--card));box-shadow:var(--shadow2)}
    .pos-top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
    .pos-cart-btn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:18px}
    .pos-cart-btn .badge-count{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:900;display:grid;place-items:center;border:2px solid var(--card);line-height:1}
    .pos-cart-btn.has-items{border-color:var(--accent);box-shadow:0 2px 12px rgba(245,158,11,.22)}
    /* Layers */
    .pos-layer{position:fixed;inset:0;z-index:45;display:none}
    .pos-layer.open{display:block}
    .pos-scrim{position:absolute;inset:0;background:rgba(2,6,23,.52);backdrop-filter:blur(8px)}
    .pos-drawer{position:absolute;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-16px 0 40px rgba(0,0,0,.22);display:flex;flex-direction:column;max-height:100dvh}
    @media(max-width:640px){
      .pos-drawer{top:auto;right:0;left:0;bottom:0;width:auto;max-height:88dvh;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -16px 40px rgba(0,0,0,.24)}
    }
    .pos-drawer-head{padding:14px 14px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--card);position:sticky;top:0;z-index:1}
    .pos-drawer-head b{font-size:15px;font-weight:900;letter-spacing:-.2px}
    .pos-drawer-body{flex:1;overflow:auto;padding:12px;background:var(--bg)}
    .pos-drawer-foot{padding:12px;border-top:1px solid var(--line);background:var(--card);padding-bottom:calc(12px + var(--safe-b))}
    .pos-empty{text-align:center;padding:28px 12px;color:var(--muted)}
    .pos-empty .big{font-size:32px;display:block;margin-bottom:8px}
    .pwa-bar .cart-badge{position:absolute;top:4px;right:14px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:900;display:grid;place-items:center;line-height:1;border:2px solid var(--card2)}
    /* Pay sheet */
    .pay-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -16px 40px rgba(0,0,0,.24);padding:14px 14px calc(14px + var(--safe-b));display:flex;flex-direction:column;gap:12px;max-height:94dvh;overflow:auto}
    .pay-head{display:flex;align-items:flex-start;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1;margin:-14px -14px 0 -14px;padding:14px 14px 10px}
    .pay-head b{font-size:15px;font-weight:900;letter-spacing:-.2px}
    .pay-head .sub{font-size:12px;color:var(--muted)}
    .pay-summary-box{background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:6px}
    .pay-summary-box .row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
    .pay-summary-box .row small{color:var(--muted);font-size:11px}
    .pay-summary-box .row.total{font-weight:900;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
    .pay-summary-box .row.cash b{color:var(--ok)}
    .pay-summary-box .row.closing b{color:var(--err);font-size:14px}
    .pay-row{display:flex;gap:8px;align-items:center}
    .pay-row select,.pay-row input{height:44px;min-height:44px;border-radius:10px;font-size:14px}
    .pay-row .fill{background:var(--err);color:#fff;border-color:var(--err);font-weight:900;min-height:44px;min-width:52px}
    .pay-row .ghost{min-height:44px;min-width:44px}
    .pay-chips{display:flex;gap:8px;flex-wrap:wrap}
    .pay-chips .chip2{padding:10px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card2);font-size:12px;font-weight:800;cursor:pointer;min-height:44px}
    .pay-chips .chip2.on,.pay-chips .chip2:active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    .loy-card{background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
    .loy-card .t{font-weight:900;display:flex;align-items:center;gap:6px}
    .loy-card .sub{font-size:11px;color:var(--muted);line-height:1.4}
    .loy-actions{display:flex;gap:8px;align-items:center}
    .loy-actions input{width:110px;height:44px;min-height:44px;text-align:center;font-weight:800;border-radius:10px}
    .loy-actions .btn{min-height:44px}
    .pay-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;background:var(--card2);font-weight:800;font-size:13px}
    .pay-footer .due{color:var(--err)}
    .pay-footer .paidBy{color:var(--ok)}
    .pay-methods{display:flex;gap:8px;overflow:auto;padding-bottom:2px;scrollbar-width:none}
    .pay-methods::-webkit-scrollbar{display:none}
    .pay-methods .chip{padding:10px 14px;font-size:13px;min-height:42px}
    .pay-methods .chip small{font-size:11px;display:block;color:var(--muted)}
    /* Bulk mode */
    .p-card.bulk{border-color:var(--accent);box-shadow:0 0 0 2px rgba(245,158,11,.18)}
    .p-card .bulk-chk{position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;z-index:2}
    .p-card.bulk .bulk-chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
    .bulk-bar{position:sticky;bottom:0;left:0;right:0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center;margin-top:10px;box-shadow:var(--shadow2)}
    .bulk-bar b{font-size:13px;font-weight:900}
    .pos-search .act.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    /* Receipt */
    .receipt-preview{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;line-height:1.5;max-height:46dvh;overflow:auto}
    .receipt-preview b{font-size:13px}
    .receipt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    @media(min-width:520px){.receipt-actions{grid-template-columns:repeat(4,1fr)}}
    .kpi{display:flex;gap:8px;overflow:auto;padding:4px 0 8px;scrollbar-width:none}
    .kpi::-webkit-scrollbar{display:none}
    .kpi .k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:140px;flex:0 0 auto}
    .kpi .k b{display:block;font-size:16px;font-weight:900}
    .kpi .k small{color:var(--muted);font-size:11px}
  </style>
</head>
<body>
<div class="pwa-top">
  <div class="ttl" id="pwaTitle">🧾 POS</div>
  <div class="pos-top-actions">
    <div class="net" id="pwaNet">●</div>
    <button class="pos-cart-btn" id="posCartBtn" aria-label="Open cart" onclick="window.PosCart && window.PosCart.open()">
      🛒<span class="badge-count" id="posCartBadge" hidden>0</span>
    </button>
  </div>
</div>
<div class="pwa-wrap"><div id="pwaBody"></div></div>
<div class="pwa-bar" id="pwaBar"></div>

<!-- Cart drawer -->
<div class="pos-layer" id="posCartLayer" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="pos-scrim" onclick="window.PosCart && window.PosCart.close()"></div>
  <div class="pos-drawer" role="document">
    <div class="pos-drawer-head">
      <b id="posDrawerTitle">🛒 Cart</b>
      <span class="badge" id="posDrawerCount">0 items</span>
      <button class="pos-cart-btn" style="margin-left:auto;width:36px;height:36px;border-radius:10px" onclick="window.PosCart&&window.PosCart.close()" aria-label="Close">✕</button>
    </div>
    <div class="pos-drawer-body" id="posCartBody"></div>
    <div class="pos-drawer-foot" id="posCartFoot"></div>
  </div>
</div>

<!-- Pay sheet — polished to screenshot (Account ledger, CREDIT/LOYALTY, POINTS, chips, loyalty card, PAID BY) -->
<div class="pos-layer" id="posPayLayer" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="pos-scrim" onclick="window.PaySheet && window.PaySheet.close()"></div>
  <div class="pay-sheet" role="document">
    <div class="pay-head">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px"><b id="payHeadTitle">Payment — <span id="payTotalBadge">Rs 0</span></b></div>
        <div class="sub" id="paySubtitle">Walk-in · 0 items</div>
      </div>
      <button class="pos-cart-btn" style="width:36px;height:36px;border-radius:10px" onclick="window.PaySheet&&window.PaySheet.close()" aria-label="Close">✕</button>
    </div>

    <div id="paySummary" class="pay-summary-box"></div>

    <div style="display:flex;flex-direction:column;gap:6px;margin:0"><label style="font-size:11px;letter-spacing:.4px;font-weight:700;color:var(--muted)">PROMISED PAYMENT DATE</label><input id="payDueDate" type="date" style="min-height:44px;height:44px;border-radius:10px;width:100%"></div>

    <div id="payRowsHost" style="display:grid;gap:8px"></div>

    <div style="display:flex;gap:8px;align-items:center;margin:0"><label style="font-size:11px;font-weight:700;min-width:56px">POINTS</label><input id="payPoints" type="number" min="0" step="1" value="0" style="width:110px;min-height:44px;height:44px;font-weight:800;text-align:center;border-radius:10px"></div>

    <div id="payQuickChips" class="pay-chips"></div>

    <div id="payLoyaltyCard" class="loy-card"></div>

    <div style="display:flex;flex-direction:column;gap:6px;margin:0"><label style="font-size:11px;font-weight:700;color:var(--muted)">Note (optional)</label><input id="payNote" type="text" placeholder="Note (optional)" style="min-height:44px;height:44px;border-radius:10px;width:100%"></div>

    <div class="pay-footer" id="payFooter">
      <span class="paidBy">PAID BY Loyalty Points <b id="payLoyAmt">Rs 0</b></span>
      <span class="due">Current Due (udhaar) <b id="payDueVal">Rs 0</b></span>

    <div style="display:flex;gap:10px">
      <button class="btn ghost big" style="flex:1;min-height:48px" onclick="window.PaySheet&&window.PaySheet.close()">Cancel</button>
      <button class="btn primary big" id="payConfirmBtn" onclick="window.PaySheet && window.PaySheet.confirm()" style="flex:1.4;min-height:48px;background:var(--ok);border-color:var(--ok);color:#fff">✓ Complete</button>
    </div>
    <div class="muted" style="font-size:11px;text-align:center">Offline ho to queue me save hoga · Esc to close</div>
  </div>
</div>

<!-- Receipt -->
<div class="pos-layer" id="posReceiptLayer" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="pos-scrim" onclick="window.Receipt && window.Receipt.close()"></div>
  <div class="pay-sheet" role="document" style="max-height:94dvh">
    <div style="display:flex;align-items:center;gap:10px">
      <b style="font-size:15px">✅ Invoice ready</b>
      <span class="badge ok" id="receiptNoBadge">—</span>
      <button class="pos-cart-btn" style="margin-left:auto;width:36px;height:36px;border-radius:10px" onclick="window.Receipt&&window.Receipt.close()" aria-label="Close">✕</button>
    </div>
    <div id="receiptPreview" class="receipt-preview"></div>
    <div class="receipt-actions">
      <button class="btn primary" onclick="window.Receipt && window.Receipt.print()">🖨 Print</button>
      <button class="btn" onclick="window.Receipt && window.Receipt.share()">⤴ Share</button>
      <button class="btn" onclick="window.Receipt && window.Receipt.pdf()">⬇ PDF</button>
      <button class="btn ghost" onclick="window.Receipt && window.Receipt.wa()">💬 WhatsApp</button>
    </div>
    <button class="btn ok big block" onclick="window.Receipt && window.Receipt.newSale()">🛒 New sale</button>
  </div>
</div>

<script>
(function(){
  var TABS = [{id:'sell', label:'Sell', icon:'🧾'},{id:'held', label:'Held', icon:'⏸'},{id:'recent', label:'Recent', icon:'📁'}];
  var S = {q:'', cat:'', cart:[], customerId:'', customerName:'', discount:0, held:[], payMethod:'CASH', payAmount:0, _prevBal:0, _cust:null, bulkMode:false, bulkPicked:{}};
  try{ S.held = JSON.parse(localStorage.getItem('ha_pos_held')||'[]'); }catch(e){ S.held=[]; }
  var LAST_SALE = null; // for receipt actions

  function items(){ return (PWA.data && PWA.data.items) || []; }
  function customers(){ return (PWA.data && PWA.data.customers) || []; }
  function cats(){ return (PWA.data && PWA.data.cats) || []; }
  function catCounts(){
    var m={}; items().forEach(function(i){ var k=i.category||i.cat||'Other'; m[k]=(m[k]||0)+1; }); return m;
  }
  function priceFor(it, tier){
    var t = tier || currentTier();
    if(t==='WHOLESALE' && Number(it.wholesale)>0) return Number(it.wholesale);
    return Number(it.retail||it.price||0);
  }
  function currentTier(){
    var m = customers().filter(function(c){ return c.id===S.customerId; })[0];
    return (m && m.priceTier) || 'RETAIL';
  }
  function cartSubtotal(){ return S.cart.reduce(function(a,l){return a+Number(l.qty)*Number(l.price);},0); }
  function cartTotal(){ return Math.max(0, cartSubtotal() - Number(S.discount||0)); }
  function cartQty(){ return S.cart.reduce(function(a,l){return a+Number(l.qty||0)},0); }
  function saveHeld(){ try{ localStorage.setItem('ha_pos_held', JSON.stringify(S.held)); }catch(e){} }
  function filtered(){
    var q=String(S.q||'').trim().toLowerCase();
    var cat=S.cat;
    return items().filter(function(i){
      if(cat && i.category!==cat && i.cat!==cat) return false;
      if(!q) return true;

  function posTopLayer(){

            'aria-label':t.label,
            onclick:function(){ PWA.state.tab=t.id; render(t.id); }
          }, [PWA.el('i',{text:t.icon}), PWA.el('span',{text:t.label})]));
        });
      }catch(e){}
      var qty=cartQty(), tot=cartTotal();
      var main=PWA.el('button',{class:'btn primary pos-cart-main', style:'flex:1;position:relative;min-height:44px', onclick:function(){ window.PosCart && window.PosCart.open(); }}, '🛒 '+S.cart.length+' · '+PWA.money(tot));
      if(qty>0){
        var bd=PWA.el('span',{class:'cart-badge', text:String(qty)});
        main.appendChild(bd); main.style.paddingRight='12px';
      }
      b.appendChild(main);
      b.appendChild(PWA.el('button',{class:'btn ghost', onclick:function(){ window.PaySheet && window.PaySheet.open(); }, style:'min-height:44px'}, 'Pay'));
      try{
        var q=(PWA.queue && PWA.queue().length)||0;
        if(q) b.appendChild(PWA.el('button',{class:'b has-dot', onclick:function(){ PWA.sync && PWA.sync(); }}, [PWA.el('i',{text:'↻'}), PWA.el('span',{text:'Sync '+q})]));
      }catch(e){}
      window.PosCart && window.PosCart.updateBadge();
    }

    renderCart(); renderPay(); updateBar(); updateKpi();
    window._posRenderCart = renderCart;
    window._posRenderPay = renderPay;
    window._posUpdateBar = updateBar;
    window._posRenderGrid = renderGrid;
    window.__posS = S;
  }

  function viewHeld(body){
    var head=PWA.el('div',{class:'card'},[PWA.el('h3',{text:'Held bills ('+S.held.length+')'})]);
    body.appendChild(head);
    if(!S.held.length){
      body.appendChild(PWA.el('div',{class:'card'},[PWA.el('div',{class:'empty'},[PWA.el('span',{class:'big', text:'⏸'}),PWA.el('div',{text:'No held bills'}),PWA.el('small',{text:'Use Hold in cart to park a sale', style:'color:var(--muted)'})])]));
      return;
    }
    S.held.forEach(function(h, idx){
      var card=PWA.el('div',{class:'card', style:'padding:10px'});
      card.appendChild(PWA.el('div',{class:'task', onclick:function(){
        S.cart=JSON.parse(JSON.stringify(h.items||[])); S.customerName=h.customerName||''; S.customerId=h.customerId||'';
        S.held.splice(idx,1); saveHeld(); render('sell'); PWA.toast('Resumed '+h.id,'ok');
      }},[
        PWA.el('div',{class:'ico', text:'⏸'}),
        PWA.el('div',{class:'tx'},[PWA.el('b',{text:(h.customerName||'Walk-in')+' · '+PWA.money(h.total)}), PWA.el('small',{text:h.id+' · '+PWA.fmtDT(h.at)+' · '+(h.items||[]).length+' items'})]),
        PWA.el('span',{class:'badge', text: (h.items||[]).length+' items'})
      ]));
      card.appendChild(PWA.el('div',{style:'display:flex;gap:8px;margin-top:8px'},[
        PWA.el('button',{class:'btn sm primary', text:'Resume', onclick:function(){ S.cart=JSON.parse(JSON.stringify(h.items||[])); S.customerName=h.customerName||''; S.customerId=h.customerId||''; S.held.splice(idx,1); saveHeld(); render('sell'); }}),
        PWA.el('button',{class:'btn sm ghost', text:'Delete', onclick:function(){ PWA.confirm('Delete '+h.id+'?', { danger: true }).then(function(ok){ if(ok){ S.held.splice(idx,1); saveHeld(); render('held'); } }); }}),
        PWA.el('button',{class:'btn sm ghost', text:'Print held', onclick:function(){ PWA.toast('Hold printed','ok'); }})
      ]));
      body.appendChild(card);
    });
  }

  function viewRecent(body){
    var rows=(PWA.data && PWA.data.recent) || [];
    body.appendChild(PWA.el('div',{class:'card'},[PWA.el('h3',{text:'Recent sales ('+rows.length+')'})]));
    if(!rows.length){
      body.appendChild(PWA.el('div',{class:'card'},[PWA.el('div',{class:'empty'},[PWA.el('span',{class:'big', text:'📁'}),PWA.el('div',{text:'No recent sales'})])]));
      return;
    }
    rows.slice(0,40).forEach(function(s){
      var card=PWA.el('div',{class:'card', style:'padding:10px;margin-bottom:8px;cursor:pointer', onclick:function(){
        // quick reprint / share from recent
        var sale={invoiceNo:s.invoiceNo, date:s.date, customerName:s.customerName, total:s.total, items:[{name:'(Re-print via main app)', qty:1, price:s.total, code:s.invoiceNo}], subtotal:s.total, discount:0, prevBalance:0, closingBalance:s.total, payments:[{method:'—', amount:s.total}], salesman:''};
        LAST_SALE=sale; window.Receipt && window.Receipt.open(sale);
      }},[
        PWA.el('div',{style:'display:flex;justify-content:space-between;align-items:center'},[
          PWA.el('b',{text:s.invoiceNo, style:'font-size:13px'}),
          PWA.el('span',{class:'badge '+(s.status==='CANCELLED'?'err':'ok'), text:s.status})
        ]),
        PWA.el('div',{style:'font-size:12px;color:var(--muted)', text: s.customerName+' · '+s.date+' · '+PWA.money(s.total)})
      ]);
      body.appendChild(card);
    });
  }

  PWA.boot('pos', TABS, render);
})();
</script>
</body>
</html>
