<script>
/* ==========================================================================
   HASEEB AUTOS — MASTERS (Items · Customers · Suppliers)
   List + quick filter + row → OFFCANVAS with sub-tabs
   (General / Pricing / Stock / Barcode / Media / Custom fields / History / Audit)
   ========================================================================== */
(function () {
'use strict';

let CF = { ITEM: [], CUSTOMER: [], SUPPLIER: [] };
function loadCF() {
  const sessionToken = App.state.session && App.state.session.token;
  if (!App.state.booted || !sessionToken) return;
  API.call('config.fields.list', {}, { offlineFallback: () => [] })
    .then(rows => {
      if (!App.state.session || App.state.session.token !== sessionToken) return;
      CF = { ITEM: [], CUSTOMER: [], SUPPLIER: [] };
      (rows || []).forEach(f => { (CF[f.entity] = CF[f.entity] || []).push(f); });
    }).catch(() => { });
}
window.addEventListener('ha:authenticated', loadCF);
window.addEventListener('ha:logged-out', () => { CF = { ITEM: [], CUSTOMER: [], SUPPLIER: [] }; window.__suppliers = []; });

/* ============================== CUSTOM FIELDS =============================== */
function cfFields(entity, record) {
  const defs = CF[entity] || [];
  let vals = {};
  try { vals = JSON.parse((record && record.customFields) || '{}'); } catch (e) { vals = {}; }
  return defs.map(f => ({
    key: 'cf_' + f.key.replace(/^cf_/, ''), label: f.label, type:
      f.type === 'NUMBER' ? 'number' : f.type === 'TEXTAREA' ? 'textarea' :
      f.type === 'DATE' ? 'date' : f.type === 'SWITCH' ? 'switch' : f.type === 'SELECT' ? 'select' : 'text',
    options: f.type === 'SELECT' ? String(f.options || '').split(',') : null,
    value: vals[f.key] !== undefined ? vals[f.key] : (f.defaultValue || ''),
    full: f.type === 'TEXTAREA'
  }));
}

function cfValues(values) {
  const out = {};
  Object.keys(values).forEach(k => {
    if (k.indexOf('cf_') === 0) out['cf_' + k.slice(3)] = values[k];
  });
  return out;
}

/* ================================= ITEMS =================================== */
App.registerScreen('items', {
  title: 'Items / Products', icon: '📦', perm: 'items.view',
  subtitle: () => 'Catalog · pricing · stock — ' + App.state.branchName,
  actions() {
    const a = [{ label: 'Refresh', icon: '↻', onClick: () => App.refresh() }];
    if (App.can('items.create')) a.unshift({ label: 'New Item', icon: '➕', onClick: () => itemForm(null, () => App.refresh()) });
    a.push({ label: 'Import', icon: '⬆', onClick: importItems });
    return a;
  },
  /* deep link: App.go('items', { open:'ITM…' }) → detail offcanvas
              App.go('items', { import:true }) → import dialog */
  onParams(p) {
    if (p.import) setTimeout(() => importItems(), 400);
    if (p.open) setTimeout(() => itemDetail({ id: p.open }), 500);
  },
  render(body) {
    const host = h('div');
    const state = { filters: {} };
    body.appendChild(host);

    (async () => {
      let rows = [];
      /* v2.30.0 — pehle loading state, phir error/empty state (pehle error nigal
         jata tha aur safha khali dikhta tha — wohi asli blank-page bug tha). */
      Shared.paint(host, { kind: 'loading', label: 'Items load ho rahe hain…' });
      try {
        const cats = await API.call('config.list', { entity: 'categories' }, { offlineFallback: () => [] });
        App.state.categories = cats || [];
      } catch (e) { App.state.categories = []; }
      const fr = await Shared.fetchList('items.list', { pageSize: 0, withStock: true },   /* v2.27.0 W3.T3 */
        { offline: () => ({ rows: (App.state.catalog.items || []).map(mapCatItem) }) });
      if (!fr.ok) {
        return Shared.paint(host, { kind: 'error', error: fr.error, title: 'Items load nahi ho sake',
          retry: () => { App.refresh(); } });
      }
      rows = fr.rows || [];
      if (!rows.length) {
        return Shared.paint(host, {
          kind: 'empty', icon: '📦', title: 'Koi item nahi mila',
          hint: 'Naya item add karein ya Excel/CSV se import karein (Items ▸ Import).',
          action: App.can('items.create') ? { label: '➕ Naya item', onClick: () => itemForm(null, () => App.refresh()) } : null
        });
      }

      host.innerHTML = '';
      host.appendChild(UI2.table({
        screen: 'items', height: '60vh', exportName: 'items',
        rows: rows,
        filters: [
          { key: 'lineItem', label: 'Line item', type: 'select', options: Array.from(new Set(rows.map(r => r.lineItem).filter(Boolean))).sort() },
          { key: 'category', label: 'Category', type: 'select', options: (App.state.categories || []).map(c => c.name) },
          { key: 'brand', label: 'Brand', type: 'select', options: Array.from(new Set(rows.map(r => r.brand).filter(Boolean))) },
          { key: 'status', label: 'Status', type: 'select', options: ['ACTIVE', 'INACTIVE'] },
          { key: 'low', label: 'Low stock only', type: 'switch' }
        ],
        columns: [
          { key: 'code', label: 'Code' },
          { key: 'name', label: 'Item', render: r => h('div', null, h('b', null, r.name),
              h('div', { style: { fontSize: 'var(--fs-xs)', color: 'var(--muted)', overflow: 'hidden',
                textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '100%' },
                title: [r.brand, r.subCategory, r.size].filter(Boolean).join(' · ') },
                [r.brand, r.subCategory, r.size].filter(Boolean).join(' · '))) },
          { key: 'lineItem', label: 'Line item' },
          { key: 'category', label: 'Category' },
          { key: 'stock', label: 'Stock', num: true, render: r => { const q=Number(r.stock||0); const low=(q>0 && q <= (Number(r.reorderLevel||r.minStock||5))); if(q<=0) return h('span',{class:'badge err'},'Out of Stock'); if(low) return h('span',{class:'badge warn'},'LOW · '+q); return h('span',{class:'badge ok'},'In Stock · '+q); } },
          { key: 'retailPrice', label: 'Retail', num: true, render: r => fmt.money(r.retailPrice) },
          { key: 'wholesalePrice', label: 'Wholesale', num: true, render: r => fmt.money(r.wholesalePrice) },
          { key: 'costPrice', label: 'Cost', num: true, family: 'cost', render: r => fmt.money(r.costPrice) },
          { key: 'rack', label: 'Rack' },
          { key: 'status', label: 'Status', render: r => h('span', { class: 'badge ' + (r.status === 'ACTIVE' ? 'ok' : '') }, r.status) }
        ],
        rowActions: r => [
          { icon: '✎', label: 'Edit', onClick: () => itemForm(r, () => App.refresh()) },
          { icon: '🏷', label: 'Label', onClick: () => printLabels([r.id]) },
          { icon: '📋', label: 'Duplicate', onClick: () => duplicateItem(r) }
        ],
        onRow: r => itemDetail(r),
        emptyAction: App.can('items.create') ? { label: '➕ Naya item', onClick: () => itemForm(null, () => App.refresh()) } : null
      }));
    })();
  }
});

function printLabels(ids) {
  /* v2.23.20 — single shared label flow. The old code called Print.labelHtml
     (which never existed — TypeError, dead button). labelFlow resolves real
     item rows, offers the 6 GS1 templates + copies + live preview, prints A4. */
  return Print.labelFlow(ids);
}

function mapCatItem(i) {
  return { id: i.id, code: i.code, name: i.name, cat: i.cat, brand: i.brand,
    retailPrice: i.rp, wholesalePrice: i.wp, costPrice: i.cp, stock: i.qty, status: 'ACTIVE' };
}

/* --------------------------- item offcanvas ------------------------------- */
function itemDetail(item) {
  const oc = UI2.offcanvas({
    title: item.name, subtitle: item.code + ' · ' + (item.category || '—'),
    size: 'lg',
    actions: App.can('items.edit') ? [{ label: '✎ Edit', cls: '', onClick: () => { oc.close(); itemForm(item, () => App.refresh()); } }] : null,
    body: h('div', { class: 'empty' }, 'Loading…')
  });
  const bodyEl = oc.body;
  bodyEl.innerHTML = '';

  API.call('items.get', { id: item.id, withStock: true }).then(full => {
    bodyEl.innerHTML = '';
    UI2.tabs(bodyEl, {
      level: 2,
      tabs: [
        { id: 'general', label: 'General', icon: '📝', render: c => renderGeneral(c, full) },
        { id: 'pricing', label: 'Pricing & Tax', icon: '💰', render: c => renderPricing(c, full) },
        { id: 'stock', label: 'Stock', icon: '📦', render: c => renderStock(c, full) },
        { id: 'barcode', label: 'Barcode & Labels', icon: '🏷', render: c => renderBarcode(c, full) },
        { id: 'media', label: 'Media', icon: '🖼', render: c => renderMedia(c, full) },
        { id: 'custom', label: 'Extra fields', icon: '🧩', render: c => renderCustom(c, full, 'ITEM') },
        { id: 'history', label: 'History', icon: '🕓', render: c => renderHistory(c, full) }
      ]
    });
  }).catch(e => bodyEl.appendChild(h('div', { class: 'empty' }, '⚠ ' + e.message)));
}

function renderGeneral(c, it) {
  const r = it.raw || it;
  /* ------------------------------------------------------------------
     v2.23.17 — General tab, professional redesign (was a flat label grid):
       1. Hero card: image + identity + badges + quick actions
       2. Grouped info sections with icon tiles (UI2.section tone colors)
       3. Notes block
     Reuses existing tokens/classes only — no new CSS framework.
  ------------------------------------------------------------------ */
  const stock = Number(r.stock ?? it.stock ?? 0);
  const status = String(it.status || r.status || 'ACTIVE').toUpperCase();
  const price = (it.retailPrice ?? r.retailPrice) || 0;

  /* ---- 1) Hero summary ---- */
  const img = (r.imageUrl || it.imageUrl)
    ? h('img', { src: r.imageUrl || it.imageUrl, alt: it.name || 'product image', loading: 'lazy', decoding: 'async',
        style: 'width:88px;height:88px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:#fff',
        title: 'Click to enlarge', onclick: () => { try { UI.zoomImage(r.imageUrl || it.imageUrl, it.name); } catch (e) {} } })
    : h('button', { class: 'btn sec', title: 'Add product image', 'aria-label': 'Add product image',
        style: 'width:88px;height:88px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:var(--panel);border:1.5px dashed var(--line);cursor:pointer',
        onclick: () => { const inp = c.querySelector('input[data-quickimg]'); if (inp) inp.click(); } }, '🖼＋');
  const quickFile = h('input', { type: 'file', accept: 'image/*', 'data-quickimg': '1', style: 'display:none' });
  quickFile.onchange = async () => {
    const f = quickFile.files && quickFile.files[0]; if (!f) return;
    try {
      const dataUrl = await _shrinkImage(f, 900);
      await API.call('items.uploadImage', { itemId: it.id, data: dataUrl, mime: 'image/jpeg', slot: 'main' });
      UI.toast('Image upload ho gayi ✅ — refreshing', 'ok');
      const fresh = await API.call('items.get', { id: it.id, withStock: true });
      c.innerHTML = ''; renderGeneral(c, fresh);
    } catch (e) { UI.toast(e.message || 'Upload fail', 'err'); }
    quickFile.value = '';
  };
  const hero = h('div', { class: 'gi-hero' },
    h('div', { class: 'gi-hero-left' }, img, quickFile),
    h('div', { class: 'gi-hero-main' },
      h('div', { class: 'gi-hero-name' }, it.name || '—'),
      h('div', { class: 'gi-hero-badges' },
        h('span', { class: 'badge brand', title: 'SKU / Code' }, it.code || '—'),
        h('span', { class: 'badge ' + (status === 'ACTIVE' ? 'ok' : 'err'), title: 'Status' }, status),
        h('span', { class: 'badge ' + (stock <= 0 ? 'err' : (stock <= (Number(r.reorderLevel || r.minStock || 5)) ? 'warn' : 'ok')), title: 'Stock on hand' },
          stock <= 0 ? 'Out of stock' : 'Stock ' + fmt.num(stock)),
        h('span', { class: 'badge info', title: 'Retail price' }, fmt.money(price)),
        (r.barcode && r.barcode !== it.code) ? h('span', { class: 'badge', title: 'Barcode' }, 'BC ' + r.barcode) : ''),
      h('div', { class: 'gi-hero-actions' },
        App.can('items.edit') ? h('button', { class: 'btn sm sec', onclick: () => itemForm(it, () => App.refresh()) }, '✎ Edit') : '',
        h('button', { class: 'btn sm sec', title: 'Print barcode label', onclick: () => { try { printLabels([it.id]); } catch (e) { UI.toast('Print fail', 'err'); } } }, '🏷 Label'),
        h('button', { class: 'btn sm ghost', title: 'Copy product code', onclick: async () => {
          try { await navigator.clipboard.writeText(it.code || ''); UI.toast('Code copied — ' + it.code, 'ok'); } catch (e) { UI.toast(it.code || '', 'ok'); }
        } }, '⧉ Code'))));
  c.appendChild(hero);

  /* ---- grouped info sections ---- */
  const tile = (icon, label, value, hint) => h('div', { class: 'gi-tile', title: hint || '' },
    h('span', { class: 'gi-tile-ic', 'aria-hidden': 'true' }, icon),
    h('div', { class: 'gi-tile-body' },
      h('span', { class: 'gi-tile-lab' }, label),
      h('b', { class: 'gi-tile-val' }, (value === '' || value === null || value === undefined || value === '—') ? '—' : String(value))));
  const wrapTiles = tiles => h('div', { class: 'gi-grid' }, tiles);

  const veh = [r.make, r.model, r.yearFrom ? (r.yearFrom + (r.yearTo ? '–' + r.yearTo : '+')) : ''].filter(Boolean).join(' ');
  c.appendChild(UI2.section('Identity & classification', null, 'inv'));
  c.appendChild(wrapTiles([
    tile('🔖', 'SKU / Code', it.code),
    tile('▮▮', 'Barcode', r.barcode || it.code, 'Print label ke liye Barcode & Labels tab kholein'),
    tile('🗂', 'Category', it.category || '—'),
    tile('🏷', 'Sub category', r.subCategory || '—'),
    tile('🏭', 'Brand', r.brand || '—'),
    tile('⚙', 'Part type', (r.partType || '—').replace(/_/g, ' ')),
    tile('📏', 'Size / variant', r.size || '—'),
    tile('📦', 'Unit of measure', r.unit || 'PCS')
  ]));

  c.appendChild(UI2.section('Sourcing & stocking', null, 'fin'));
  c.appendChild(wrapTiles([
    tile('🚚', 'Primary supplier', supplierName(r.primarySupplierId) || '—'),
    tile('🗄', 'Rack / bin location', r.rack || '—'),
    tile('🏬', 'Default branch', (r.defaultLocationId ? (locNameOf(r.defaultLocationId)) : App.state.branchName) || '—'),
    tile('🧮', 'Min stock / reorder', [fmt.num(r.minStock || 0), fmt.num(r.reorderLevel || 0)].join(' / '), 'Reorder point'),
    r.conversionFactor && Number(r.conversionFactor) > 1 ? tile('📐', 'Pack conversion', '1 ' + (r.unit || 'PCS') + ' = ' + fmt.num(r.conversionFactor), 'Bulk units') : '',
    r.weight ? tile('⚖', 'Weight', fmt.num(r.weight) + ' kg') : ''
  ].filter(Boolean)));

  if (veh && veh.trim()) {
    c.appendChild(UI2.section('Vehicle fitment', null, 'ok'));
    c.appendChild(wrapTiles([
      tile('🚗', 'Make', r.make || '—'),
      tile('🧩', 'Model', r.model || '—'),
      tile('📅', 'Years', (r.yearFrom || '') + (r.yearTo ? '–' + r.yearTo : (r.yearFrom ? '+' : '')) || '—')
    ]));
  }

  /* notes + custom meta footer */
  const extras = [];
  if (r.origin) extras.push(tile('🌍', 'Origin', r.origin));
  if (r.warranty) extras.push(tile('🛡', 'Warranty', fmt.num(r.warranty) + ' months'));
  if (extras.length) c.appendChild(wrapTiles(extras));
  c.appendChild(h('div', { class: 'gi-notes' },
    h('span', { class: 'gi-tile-lab' }, '📝 Notes'),
    h('div', null, r.notes || 'Koi note nahi — Edit me add karein')));
}

function renderPricing(c, it) {
  const r = it.raw || it;
  const margin = r.costPrice ? ((r.retailPrice - r.costPrice) / r.costPrice * 100) : 0;
  /* v2.28.0 (W5) — cost/margin tiles sirf unko jin ko ye data milta hai
     (backend bhi in columns ko hata deta hai — Fields.gs) */
  const priceTiles = App.fieldFilter([
    { icon: '🏷', label: 'Retail', value: fmt.money(it.retailPrice), cls: 'brand' },
    { icon: '🤝', label: 'Wholesale', value: fmt.money(it.wholesalePrice) },
    { icon: '📥', label: 'Cost', value: fmt.money(it.costPrice), family: 'cost' },
    { icon: '📈', label: 'Margin', value: margin.toFixed(1) + '%', cls: margin > 20 ? 'ok' : 'warn', family: 'margin' }
  ]);
  c.append(
    UI2.kpiGrid(priceTiles, 2),
    /* v2.29.0 (W4) — record ke timestamps (spec: created/updated date+time) */
    UI2.stampRow(r),
    UI2.section('Customer-type / qty prices', App.can('items.price.edit') ?
      [h('button', { class: 'btn sm sec', onclick: () => priceEditor(it) }, '＋ Add rule')] : null));
  API.call('items.prices.get', { itemId: it.id }, { offlineFallback: () => [] }).then(rules => {
    if (!rules.length) { c.appendChild(h('div', { class: 'tbl-empty' }, 'Koi special price rule nahi')); return; }
    c.appendChild(UI2.table({
      screen: 'itemprices', rows: rules, height: '30vh', exportName: false,
      columns: [
        { key: 'customerTypeId', label: 'Customer type', render: r => typeName(r.customerTypeId) },
        { key: 'priceType', label: 'Type' },
        { key: 'minQty', label: 'Min qty', num: true },
        { key: 'price', label: 'Price', num: true, render: r => fmt.money(r.price) },
        { key: 'discountPct', label: 'Disc %', num: true }
      ],
      rowActions: App.can('items.price.edit') ? r => [{ icon: '🗑', onClick: () => { } }] : null
    }));
  }).catch(() => { });
}

function renderStock(c, it) {
  const host = h('div');
  c.appendChild(host);
  API.call('stock.levels', { locationId: '' }, { offlineFallback: () => [] }).then(levels => {
    const rows = (levels || []).filter(l => l.itemId === it.id);
    host.innerHTML = '';
    if (!rows.length) { host.appendChild(h('div', { class: 'tbl-empty' }, 'Stock record nahi mila')); return; }
    host.appendChild(UI2.table({
      screen: 'itemstock', rows, height: '34vh', exportName: false,
      columns: [
        { key: 'locationId', label: 'Branch', render: r => locNameOf(r.locationId) },
        { key: 'qty', label: 'Qty', num: true, render: r => { const q=Number(r.qty||0); if(q<=0) return h('span',{class:'badge err'},'Out of Stock'); if(q<=5) return h('span',{class:'badge warn'},'LOW · '+q); return h('span',{class:'badge ok'},'In Stock · '+q); } },
        { key: 'avgCost', label: 'Avg cost', num: true, render: r => fmt.money(r.avgCost) },
        { key: 'value', label: 'Value', num: true, render: r => fmt.money(r.value) },
        { key: 'rack', label: 'Rack' }
      ],
      rowActions: App.can('stock.adjust') ? r => [{ icon: '⚖', label: 'Count', onClick: () => quickCountItem(it, r) }] : null
    }));
  }).catch(e => host.appendChild(h('div', { class: 'empty' }, e.message)));
}

function renderBarcode(c, it) {
  const r = it.raw || it;
  const code = r.barcode || it.code;
  const svg = h('div', { style: { background: '#fff', padding: '12px', borderRadius: '12px', textAlign: 'center', border: '1px solid var(--line)' } });
  svg.innerHTML = Barcode.svg(code, { height: 56, module: 1.7 });
  c.append(
    svg,
    h('div', { style: { textAlign: 'center', fontWeight: '700', marginTop: '6px', letterSpacing: '2px' } }, code),
    h('div', { class: 'chips', style: { marginTop: '12px', justifyContent: 'center' } },
      h('button', { class: 'chip2', onclick: () => printLabels([it.id]) }, '🏷 Print label'),
      h('button', { class: 'chip2', onclick: async () => {
        const g = await API.call('barcode.generate', { value: '', type: 'CODE39' });
        await API.call('items.save', { item: { id: it.id, barcode: g.value } });
        UI.toast('New barcode assigned: ' + g.value, 'ok'); App.refresh();
      } }, '🎲 Generate new'),
      h('button', { class: 'chip2', onclick: () => {
        const w = window.open('', '_blank');
        w.document.write('<body style="text-align:center;font-family:monospace">' + Barcode.svg(code, { height: 80, module: 2.4 }) +
          '<div>' + code + '</div><script>window.print()</scr' + 'ipt></body>');
      } }, '🖨 Print'))
  );
}

/**
 * v2.6 QA — "koi option nahi hai product image upload ka".
 * Ab: 📁 File chunein · 📷 Camera (mobile par direct) · 🔗 URL paste.
 * File client par resize hoti hai (max 900px, JPEG 0.82) — chhoti image =
 * tez upload, aur Apps Script ki payload had ke andar.
 */
function _shrinkImage(file, maxPx) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('File parh nahi saka'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Ye image nahi hai'));
      img.onload = () => {
        let { width: w, height: hh } = img;
        const scale = Math.min(1, (maxPx || 900) / Math.max(w, hh));
        w = Math.round(w * scale); hh = Math.round(hh * scale);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = hh;
        cv.getContext('2d').drawImage(img, 0, 0, w, hh);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function _uploadItemImage(it, slot, file, statusEl) {
  statusEl.textContent = '⏳ Upload ho rahi hai…';
  try {
    const dataUrl = await _shrinkImage(file, 900);
    const r = await API.call('items.uploadImage', { itemId: it.id, data: dataUrl, mime: 'image/jpeg', slot: slot });
    statusEl.textContent = '✅ Upload ho gayi';
    UI.toast('Image upload ho gayi ✅', 'ok');
    return r;
  } catch (e) {
    statusEl.textContent = '❌ ' + (e.message || 'Upload fail');
    UI.toast(e.message || 'Upload fail', 'err');
    return null;
  }
}

function renderMedia(c, it) {
  const r = it.raw || it;
  const url = h('input', { class: 'f-input', type: 'text', value: r.imageUrl || '', placeholder: 'Image URL' });
  const gal = h('textarea', { class: 'f-input', rows: 3, placeholder: 'Gallery URLs (one per line)' }, (r.gallery || '').split('\n').join('\n'));
  const statusEl = h('div', { class: 'hint', style: { minHeight: '18px' } }, '');

  /* hidden file inputs — ek gallery se (desktop), ek camera se (mobile) */
  const filePick = h('input', { type: 'file', accept: 'image/*', style: { display: 'none' } });
  const camPick = h('input', { type: 'file', accept: 'image/*', capture: 'environment', style: { display: 'none' } });
  filePick.onchange = async () => { const f = filePick.files && filePick.files[0]; if (f) { const res = await _uploadItemImage(it, 'gallery', f, statusEl); if (res && res.url) gal.value = (gal.value ? gal.value + '\n' : '') + res.url; } filePick.value = ''; };
  camPick.onchange = async () => { const f = camPick.files && camPick.files[0]; if (f) { const res = await _uploadItemImage(it, 'main', f, statusEl); if (res && res.url) url.value = res.url; } camPick.value = ''; };

  const canEdit = App.can('items.edit');

                await API.call('items.save', { item: { id: saved.id, imageUrl: pendingImg } });

          }

      } }, '💾 Save'))

function importItems() {
  const ta = h('textarea', { rows: 8, placeholder: 'Paste CSV/TSV — header: code,name,category,brand,costPrice,retailPrice,wholesalePrice,barcode', style: { width: '100%' } });
  UI2.modal({
    title: '⬆ Import items', size: 'lg', body: h('div', null,
      h('p', { style: { fontSize: 'var(--fs-sm)', color: 'var(--muted)' } }, 'Excel/Sheet se copy kar ke paste karein. Existing code → update, naya → create.'), ta),
    actions: [{ label: 'Import', onClick: async c => {
      const text = ta.value.trim(); if (!text) return;
      const delim = text.indexOf('\t') > -1 ? '\t' : ',';
      const lines = text.split(/\r?\n/).filter(Boolean);
      const head = lines[0].split(delim).map(s => s.trim().replace(/^"|"$/g, ''));
      const rows = lines.slice(1).map(l => {
        const cells = l.split(delim).map(s => s.trim().replace(/^"|"$/g, ''));
        const o = {}; head.forEach((k, i) => o[k] = cells[i]); return o;
      });
      try {
        const r = await API.call('items.bulkSave', { items: rows });
        UI.toast('Created ' + r.created + ', updated ' + r.updated + (r.errors.length ? ', errors ' + r.errors.length : ''), 'ok');
        c(); App.refresh(); API.pullCatalog(true);
      } catch (e) { UI.toast(e.message, 'err'); }
    } }]
  });
}

        : (bal < 0 ? (type === 'CUSTOMER' ? 'Advance / credit balance' : 'Advance paid') : 'Balance clear'))),
    sumHost);
  paintSummary(null);
  API.call('parties.balance', { partyType: type, id: p.id }, { offlineFallback: () => null })
    .then(sm => { if (sm) paintSummary(sm); }).catch(() => { });

  const oc = UI2.offcanvas({
    title: p.name, subtitle: p.code + ' · ' + (type === 'CUSTOMER' ? 'Customer' : 'Supplier') + ' • ' + fmt.phone(p.phone),
    size: 'lg',
    actions: [{ label: '✎ Edit', onClick: () => { oc.close(); partyForm(type, p, () => App.refresh()); } }],
    body: h('div', { class: 'empty' }, 'Loading…')
  });
  const body = oc.body; body.innerHTML = '';
  API.call('customers.ledger', { id: p.id }, { offlineFallback: () => ({ rows: [], opening: 0, closing: 0 }) })
    .then(led => {
      UI2.tabs(body, {
        level: 2,
        tabs: [
          { id: 'profile', label: 'Profile', icon: '👤', render: c => {
            // Polished profile: 2-column cards with icons + full-width address
            const phoneCard = h('div', {class:'ui2-block', style:{padding:'12px', display:'flex', alignItems:'center', gap:'12px'}}, h('div', {style:{width:'42px',height:'42px',borderRadius:'12px',background:'var(--info-soft)',display:'grid',placeItems:'center',fontSize:'18px'}}, '📞'), h('div', null, h('div', {style:{fontSize:'11px',color:'var(--muted)',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px'}}, 'Phone'), h('div', {style:{fontWeight:'800',fontSize:'14px'}}, fmt.phone(p.phone)||'—')));
            const emailCard = h('div', {class:'ui2-block', style:{padding:'12px', display:'flex', alignItems:'center', gap:'12px'}}, h('div', {style:{width:'42px',height:'42px',borderRadius:'12px',background:'var(--panel-2)',display:'grid',placeItems:'center',fontSize:'18px'}}, '✉'), h('div', null, h('div', {style:{fontSize:'11px',color:'var(--muted)',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px'}}, 'Email'), h('div', {style:{fontWeight:'600',fontSize:'13px',wordBreak:'break-all'}}, p.email||'—')));
            const addrCard = h('div', {class:'ui2-block', style:{gridColumn:'1/-1', padding:'12px', display:'flex', alignItems:'flex-start', gap:'12px'}}, h('div', {style:{width:'42px',height:'42px',borderRadius:'12px',background:'var(--warn-soft)',display:'grid',placeItems:'center',fontSize:'18px'}}, '📍'), h('div', {style:{flex:'1'}}, h('div', {style:{fontSize:'11px',color:'var(--muted)',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px'}}, 'Address'), h('div', {style:{fontWeight:'600',fontSize:'13px',lineHeight:'1.4'}}, p.address||'—')));
            const typeCard = h('div', {class:'ui2-block', style:{padding:'12px'}}, h('div', {style:{fontSize:'11px',color:'var(--muted)',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px'}}, type==='CUSTOMER'?'Customer type':'Payment terms'), h('div', {style:{fontWeight:'700',marginTop:'4px'}}, type==='CUSTOMER'? typeName(p.customerTypeId): (p.paymentTerms||'—')));
            const creditCard = h('div', {class:'ui2-block', style:{padding:'12px'}}, h('div', {style:{fontSize:'11px',color:'var(--muted)',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px'}}, 'Credit limit'), h('div', {style:{fontWeight:'800',fontSize:'15px',color:'var(--info)'}}, fmt.money(p.creditLimit)));
            const balCard = h('div', {class:'ui2-block', style:{padding:'12px',borderLeft:'4px solid '+(Number(led.closing)>0?'var(--err)':'var(--ok)'),background: Number(led.closing)>0?'var(--err-soft)':'var(--ok-soft)'}}, h('div', {style:{fontSize:'11px',color:'var(--muted)',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px'}}, 'Current balance'), h('div', {style:{fontWeight:'800',fontSize:'15px'}}, fmt.money(led.closing)), h('div', {style:{fontSize:'11px',color:'var(--muted)'}}, Number(led.closing)>0? 'Receivable':'Clear'));
            const openCard = h('div', {class:'ui2-block', style:{padding:'12px'}}, h('div', {style:{fontSize:'11px',color:'var(--muted)',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px'}}, 'Opening balance'), h('div', {style:{fontWeight:'700',marginTop:'4px'}}, fmt.money(p.openingBalance)));
            const idCard = h('div', {class:'ui2-block', style:{padding:'12px'}}, h('div', {style:{fontSize:'11px',color:'var(--muted)',fontWeight:'700',textTransform:'uppercase',letterSpacing:'.5px'}}, 'NTN / CNIC'), h('div', {style:{fontWeight:'600',marginTop:'4px'}}, (p.ntn||p.cnic||'—')));
            c.appendChild(h('div', {style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:'10px'}}, phoneCard, emailCard, addrCard, typeCard, creditCard, balCard, openCard, idCard));
          }},
          { id: 'ledger', label: 'Ledger', icon: '📒', render: c => {
            c.append(
              UI2.kpiGrid([
                { icon: '📒', label: 'Opening balance', value: fmt.money(led.opening) },
                { icon: '➕', label: type === 'CUSTOMER' ? 'Billed' : 'Purchases',
                  value: fmt.money((led.rows || []).reduce((a, r) => a + Number(type === 'CUSTOMER' ? (r.debit || 0) : (r.credit || 0)), 0)) },
                { icon: '➖', label: type === 'CUSTOMER' ? 'Received' : 'Paid',
                  value: fmt.money((led.rows || []).reduce((a, r) => a + Number(type === 'CUSTOMER' ? (r.credit || 0) : (r.debit || 0)), 0)) },
                { icon: '💰', label: 'Closing', value: fmt.money(led.closing), cls: led.closing > 0 ? 'err' : 'ok' }
              ], 2),
              UI2.table({
                screen: 'ledger_' + p.id, rows: led.rows || [], height: '40vh', exportName: 'ledger',
                columns: [
                  { key: 'date', label: 'Date', render: r => fmt.date(r.date) },
                  { key: 'description', label: 'Description' },
                  { key: 'debit', label: 'Debit', num: true, render: r => r.debit ? fmt.money(r.debit) : '—' },
                  { key: 'credit', label: 'Credit', num: true, render: r => r.credit ? fmt.money(r.credit) : '—' },
                  { key: 'balance', label: 'Balance', num: true, render: r => h('b', null, fmt.money(r.balance)) }
                ]
              }));
          }},
          { id: 'custom', label: 'Extra fields', icon: '🧩', render: c => renderCustom(c, p, type) },
          { id: 'actions', label: 'Actions', icon: '⚡', render: c => {
            c.appendChild(h('div', { class: 'f-grid' },
              type === 'CUSTOMER'
                ? h('button', { class: 'btn ok full', onclick: () => receivePayment(p) }, '💰 Payment receive karein')
                : h('button', { class: 'btn full', onclick: () => paySupplier2(p) }, '💸 Supplier payment'),
              h('button', { class: 'btn sec full', onclick: () => { oc.close(); App.go('sales', { customerId: p.id }); } }, '🧾 Invoices dekhein')));
          }}
        ]
      });
    }).catch(e => body.appendChild(h('div', { class: 'empty' }, '⚠ ' + e.message)));
}

function partyForm(type, p, after) {
  const v = p || {};
  const fields = type === 'CUSTOMER' ? [
    { key: 'name', label: 'Name', required: true, full: true },
    { key: 'phone', label: 'Phone', family: 'contact' },
    { key: 'customerTypeId', label: 'Customer type', type: 'select', options: [{ value: '', label: '—' }].concat((App.state.customerTypes || []).map(t => ({ value: t.id, label: t.name }))) },
    { key: 'email', label: 'Email', family: 'contact' },
    { key: 'cnic', label: 'CNIC', family: 'contact' },
    { key: 'address', label: 'Address', full: true },
    { key: 'creditLimit', label: 'Credit limit', type: 'number' },
    { key: 'openingBalance', label: 'Opening udhaar', type: 'number' },
    { key: 'notes', label: 'Notes', type: 'textarea', full: true }
  ] : [
    { key: 'name', label: 'Supplier name', required: true, full: true },
    { key: 'phone', label: 'Phone' },
    { key: 'email', label: 'Email' },
    { key: 'paymentTerms', label: 'Payment terms' },
    { key: 'ntn', label: 'NTN' },
    { key: 'address', label: 'Address', full: true },
    { key: 'creditLimit', label: 'Supplier credit limit', type: 'number', hint: 'Supplier ne kitna udhaar diya hai' },
    { key: 'openingBalance', label: 'Opening balance (+ hum denay hain)', type: 'number' },
    { key: 'notes', label: 'Notes', type: 'textarea', full: true }
  ];
  const f = UI2.form({ values: v, fields });
  UI2.offcanvas({
    title: p ? '✏ ' + p.name : (type === 'CUSTOMER' ? '➕ Naya customer' : '➕ Naya supplier'),
    size: 'md', body: f.el,
    footer: h('div', null,
      h('button', { class: 'btn', onclick: async () => {
        const vals = f.values();
        if (!vals.name) return UI.toast('Name zaroori hai', 'err');
        if (p) vals.id = p.id;
        try {
          await API.call(type === 'CUSTOMER' ? 'customers.save' : 'suppliers.save',
            type === 'CUSTOMER' ? { customer: vals } : { supplier: vals });
          UI.toast('Saved ✅', 'ok');
          document.querySelectorAll('.offcanvas').forEach(o => o.remove());
          document.querySelectorAll('.oc-scrim').forEach(o => o.remove());
          after && after();
        } catch (e) { UI.toast(e.message, 'err'); }
      } }, '💾 Save'))
  });
}

function partyLedger(type, p) {
  UI2.offcanvas({ title: '📒 Ledger — ' + p.name, size: 'md', body: h('div', { class: 'empty' }, 'Loading…') });
  partyDetail(type, p);
}

function receivePayment(c) {
  const f = UI2.form({ values: { amount: Number(c.balance ?? c.bal ?? 0) },
    fields: [
      { key: 'amount', label: 'Amount', type: 'number' },
      { key: 'method', label: 'Method', type: 'select', options: ['CASH', 'BANK', 'JAZZCASH', 'EASYPAISA', 'CHEQUE', 'CARD'] },
      { key: 'reference', label: 'Reference' },
      { key: 'notes', label: 'Notes', full: true }
    ] });
  UI2.modal({
    title: '💰 Receive — ' + c.name, size: 'sm', body: f.el,
    actions: [{ label: 'Receive', cls: 'ok', onClick: async close => {
      const v = f.values();
      try {
        await API.call('payments.create', { payment: Object.assign(v, { type: 'RECEIPT', partyType: 'CUSTOMER', partyId: c.id, locationId: App.state.locationId }) });
        UI.toast('Payment received ✅', 'ok'); close(); App.refresh();
      } catch (e) { UI.toast(e.message, 'err'); }
    } }]
  });
}

function paySupplier2(s) {
  const f = UI2.form({ values: { amount: Math.abs(Number(s.balance || 0)) },
    fields: [
      { key: 'amount', label: 'Amount', type: 'number' },
      { key: 'method', label: 'Method', type: 'select', options: ['CASH', 'BANK', 'CHEQUE', 'JAZZCASH'] },
      { key: 'reference', label: 'Reference' },
      { key: 'notes', label: 'Notes', full: true }
    ] });
  UI2.modal({
    title: '💸 Pay — ' + s.name, size: 'sm', body: f.el,
    actions: [{ label: 'Pay', onClick: async close => {
      const v = f.values();
      try {
        await API.call('payments.create', { payment: Object.assign(v, { type: 'SUPPLIER_PAYMENT', partyType: 'SUPPLIER', partyId: s.id, locationId: App.state.locationId }) });
        UI.toast('Payment recorded ✅', 'ok'); close(); App.refresh();
      } catch (e) { UI.toast(e.message, 'err'); }
    } }]
  });
}

window.__printLabels = printLabels;  /* v2.23.20: canonical flow everywhere */
})();
</script>
