/* ======================= PERMISSIONS MATRIX (v2.5) =======================
 * Har permission × har role ke liye checkbox. Owner hamesha locked (full access).
 * Data backend (Auth.perms ▸ PERMISSION_CATALOG) se aata hai — koi hardcode nahi.
 * ======================================================================== */
function buildPermMatrix(meta) {
  const canEdit = App.can('users.manage');
  const roles = (meta.roles || []).map(r => typeof r === 'string' ? { id: r, label: r } : r);
  const roleList = roles.length ? roles : Object.keys(meta.matrix || {}).map(id => ({ id, label: id }));
  const locked = meta.locked || ['OWNER'];
  const matrix = meta.matrix || {};
  const dirty = {};                                   // role -> Set(permIds)

  const wrap = h('div', { class: 'perm-matrix' });

  /* ---------- toolbar ---------- */
  const search = h('input', { class: 'f-input', type: 'search',
    placeholder: 'Permission dhoondhein… (masalan discount, stock)', style: { flex: '1', minWidth: '180px' } });
  const lang = (App.state && App.state.lang) || 'en';
  const lbl = e => (lang === 'ur' && e.ur) ? e.ur : e.en;
  const gl = g => (lang === 'ur' && g.labelUr) ? g.labelUr : g.label;

  wrap.appendChild(h('div', { class: 'pm-tools' },
    search,
    h('span', { class: 'pm-count' }, (meta.catalog || []).length + ' permissions · ' + roleList.length + ' roles'),
    h('button', { class: 'btn sm sec', onclick: () => setAll(true) }, 'Sab ON'),
    h('button', { class: 'btn sm sec', onclick: () => setAll(false) }, 'Sab OFF'),
    h('button', { class: 'btn sm sec', onclick: () => resetAll() }, '↺ Defaults'),
    canEdit ? h('button', { class: 'btn sm ok', onclick: () => save() }, '💾 Save') : ''
  ));
  if (!canEdit) wrap.appendChild(h('div', { class: 'hint' }, 'Sirf dekh sakte hain — badalne ke liye users.manage chahiye.'));

  /* ---------- header row ---------- */
  function header() {
    return h('div', { class: 'pm-row pm-head' },
      h('div', { class: 'pm-perm' }, 'Permission'),
      ...roleList.map(r => h('div', { class: 'pm-cell' },
        h('span', { class: 'pm-role', title: r.label }, String(r.label).slice(0, 5)))));
  }
  wrap.appendChild(header());

  /* ---------- grouped body ---------- */
  const body = h('div', { class: 'pm-body' });
  wrap.appendChild(body);

  const boxes = [];   // { role, perm, cb }

  (meta.groups || []).forEach(g => {
    const perms = (meta.catalog || []).filter(x => x.group === g.id);
    if (!perms.length) return;
    const grp = h('div', { class: 'pm-group' });
    grp.appendChild(h('div', { class: 'pm-group-head' },
      h('span', null, (g.icon || '') + ' ' + gl(g)),
      h('span', { class: 'pm-group-count' }, perms.length)));
    perms.forEach(pe => {
      const row = h('div', { class: 'pm-row', dataset: { perm: pe.id, txt: (pe.en + ' ' + pe.ur + ' ' + pe.id).toLowerCase() } },
        h('div', { class: 'pm-perm' },
          h('b', null, lbl(pe)),
          h('span', { class: 'pm-desc' }, pe.desc || ''),
          h('code', { class: 'pm-code' }, pe.id)),
        ...roleList.map(r => {
          const isLocked = locked.indexOf(r.id) > -1;
          const on = isLocked || (matrix[r.id] || []).indexOf(pe.id) > -1;
          const cb = h('button', {
            class: 'pm-box' + (on ? ' on' : '') + (isLocked ? ' locked' : ''),
            type: 'button', disabled: !canEdit || isLocked,
            title: (isLocked ? 'Hamesha ON — ' : (on ? 'Allowed' : 'Blocked')) + ' · ' + r.label,
            'aria-pressed': on ? 'true' : 'false',
            onclick: () => {
              if (!canEdit || isLocked) return;
              const now = cb.classList.toggle('on');
              cb.setAttribute('aria-pressed', now ? 'true' : 'false');
              markDirty(r.id);
            }
          }, on ? '✓' : '');
          boxes.push({ role: r.id, perm: pe.id, cb, locked: isLocked });
          return h('div', { class: 'pm-cell' }, cb);
        }));
      grp.appendChild(row);
    });
    body.appendChild(grp);
  });

  /* ---------- helpers ---------- */
  function markDirty(role) {
    dirty[role] = true;
    const badge = wrap.querySelector('.pm-count');
    if (badge && !/•/.test(badge.textContent)) badge.textContent += ' • unsaved';
  }
  function setAll(on) {
    if (!canEdit) return;
    boxes.forEach(b => {
      if (b.locked) return;
      b.cb.classList.toggle('on', on);
      b.cb.textContent = on ? '✓' : '';
      b.cb.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    roleList.forEach(r => { if (locked.indexOf(r.id) === -1) dirty[r.id] = true; });
    const badge = wrap.querySelector('.pm-count');
    if (badge && !/•/.test(badge.textContent)) badge.textContent += ' • unsaved';
  }
  async function resetAll() {
    if (!canEdit) return UI.toast('Permission nahi', 'err');
    if (!(await UI.confirm('Saare roles ko default permissions par wapas karein?'))) return;
    try {
      const fresh = await API.call('users.perms', {});
      roleList.forEach(r => {
        const list = fresh.matrix[r.id] || [];
        boxes.filter(b => b.role === r.id && !b.locked).forEach(b => {
          const on = list.indexOf(b.perm) > -1;
          b.cb.classList.toggle('on', on); b.cb.textContent = on ? '✓' : '';
        });
      });
      Object.keys(dirty).forEach(k => delete dirty[k]);
      UI.toast('Defaults restore ho gaye (save karein)', 'ok', 2600);
    } catch (e) { UI.toast(e.message, 'err'); }
  }
  async function save() {
    const rolesToSave = Object.keys(dirty).filter(r => locked.indexOf(r) === -1);
    if (!rolesToSave.length) return UI.toast('Koi tabdeeli nahi', 'warn');
    /* W7 (v2.26.0) — pehle har role ka apna round-trip (sequential) aur pehli ghalti par
       baqi roles chhoot jate the. Ab parallel batches; sab errors jama ho kar batate hain. */
    const jobs = rolesToSave.map(role => ({
      role, fn: () => API.call('users.perms.save', { role, permissions:
        boxes.filter(b => b.role === role && !b.locked && b.cb.classList.contains('on')).map(b => b.perm) })
    }));
    const res = await API.parallel(jobs.map(j => j.fn), 4);
    const errs = [];
    res.forEach((r, i) => { if (r && r.__err) errs.push(jobs[i].role + ': ' + r.__err); });
    if (errs.length) { UI.toast(errs.length + ' role save nahi ho sake — ' + errs.slice(0, 2).join(' · '), 'err'); return; }
    Object.keys(dirty).forEach(k => delete dirty[k]);
    const badge = wrap.querySelector('.pm-count');
    if (badge) badge.textContent = badge.textContent.replace(' • unsaved', '');
    UI.toast('Permissions save ho gayeen ✅', 'ok');
    App.refresh();
  }

  /* ---------- as-you-type filter (no bottom scroll: fixed height body) ---------- */
  search.oninput = () => {
    const q = search.value.trim().toLowerCase();
    Array.from(body.querySelectorAll('.pm-row')).forEach(row => {
      row.style.display = !q || (row.dataset.txt || '').indexOf(q) > -1 ? '' : 'none';
    });
    Array.from(body.querySelectorAll('.pm-group')).forEach(g => {
      const vis = Array.from(g.querySelectorAll('.pm-row')).filter(r => r.style.display !== 'none').length;
      g.style.display = vis ? '' : 'none';
    });
  };

  return wrap;
}

/* ================== PER-USER RULES (v2.5) ==============================
 * Role ke baad har action ko Allow (extra) ya Deny (block) kiya ja sakta hai.
 * Tri-state: inherit (role jaisa) → allow → deny → inherit.
 * Catalog backend (Auth.perms ▸ PERMISSION_CATALOG) se — koi hardcode nahi.
 * ====================================================================== */
let __permMeta = null;
async function permMeta() {
  if (__permMeta) return __permMeta;
  try { __permMeta = await API.call('users.perms', {}, { offlineFallback: () => null }); } catch (e) { __permMeta = null; }
  return __permMeta;
}

function userRulesEditor(u, roleRef) {
  const extra = new Set(String((u && u.extraPermissions) || '').split(',').filter(Boolean));
  const denied = new Set(String((u && u.deniedPermissions) || '').split(',').filter(Boolean));
  const wrap = h('div', { class: 'rules-editor' });
  wrap.appendChild(h('div', { class: 'empty', style: { padding: '10px' } }, 'Rules load ho rahe hain…'));

  const stateOf = id => extra.has(id) ? 'allow' : (denied.has(id) ? 'deny' : 'inherit');
  const setState = (id, next) => {
    extra.delete(id); denied.delete(id);
    if (next === 'allow') extra.add(id);
    if (next === 'deny') denied.add(id);
  };

  permMeta().then(meta => {
    wrap.innerHTML = '';
    if (!meta || !(meta.catalog || []).length) {
      wrap.appendChild(h('div', { class: 'empty' }, 'Permission catalog load nahi hua'));
      return;
    }
    const lang = (App.state && App.state.lang) || 'en';
    const lbl = e => (lang === 'ur' && e.ur) ? e.ur : e.en;
    const gl = g => (lang === 'ur' && g.labelUr) ? g.labelUr : g.label;

    const search = h('input', { class: 'f-input', type: 'search', placeholder: '🔍 Action dhoondhein (masalan discount, return, delete)…' });
    const count = h('span', { class: 'pm-count' });
    const rows = [];
    wrap.append(h('div', { class: 're-tools' }, search, count,
      h('button', { class: 'btn sm sec', onclick: () => { extra.clear(); denied.clear(); paint(); } }, '↺ Sab inherit')));

    const body = h('div', { class: 're-body' });
    wrap.appendChild(body);

    (meta.groups || []).forEach(g => {
      const perms = (meta.catalog || []).filter(x => x.group === g.id);
      if (!perms.length) return;
      const grp = h('div', { class: 're-group' });
      grp.appendChild(h('div', { class: 're-group-head' }, (g.icon || '') + ' ' + gl(g),
        h('span', { class: 'pm-group-count' }, perms.length)));
      perms.forEach(pe => {
        const role = () => (roleRef && roleRef.value) ? roleRef.value : ((u && u.role) || 'OTHER');
        const roleOn = () => ((meta.matrix || {})[role()] || []).indexOf(pe.id) > -1 || role() === 'OWNER';
        const btn = h('button', { class: 're-box', type: 'button',
          title: 'Inherit (role) → Allow → Deny', onclick: () => {
            const order = ['inherit', 'allow', 'deny'];
            const next = order[(order.indexOf(stateOf(pe.id)) + 1) % 3];
            setState(pe.id, next); paint();
          } });
        const row = h('div', { class: 're-row', dataset: { txt: (pe.en + ' ' + (pe.ur || '') + ' ' + pe.id).toLowerCase() } },
          h('div', { class: 're-txt' }, h('b', null, lbl(pe)),
            h('span', { class: 're-desc' }, pe.desc || '')),
          h('span', { class: 're-role ' + (roleOn() ? 'on' : 'off') }, roleOn() ? 'role: ON' : 'role: OFF'),
          btn);
        rows.push({ pe, btn, row });
        grp.appendChild(row);
      });
      body.appendChild(grp);
    });

    function paint() {
      rows.forEach(({ pe, btn }) => {
        const st = stateOf(pe.id);
        btn.className = 're-box ' + st;
        btn.textContent = st === 'allow' ? '✓ Allow' : (st === 'deny' ? '⛔ Deny' : 'Inherit');
        btn.setAttribute('aria-pressed', st);
      });
      count.textContent = extra.size + ' allow · ' + denied.size + ' deny';
    }
    search.oninput = () => {
      const q = search.value.trim().toLowerCase();
      rows.forEach(({ row }) => { row.style.display = !q || (row.dataset.txt || '').indexOf(q) > -1 ? '' : 'none'; });
      Array.from(body.querySelectorAll('.re-group')).forEach(g => {
        const vis = Array.from(g.querySelectorAll('.re-row')).filter(r => r.style.display !== 'none').length;
        g.style.display = vis ? '' : 'none';
      });
    };
    paint();
  });

  return { el: wrap, values: () => ({ extraPermissions: Array.from(extra).join(','), deniedPermissions: Array.from(denied).join(',') }) };
}

function userForm(u) {
  const roles = ['OWNER', 'MANAGER', 'SALESMAN', 'CASHIER', 'PURCHASE', 'WAREHOUSE', 'ACCOUNTANT', 'DELIVERY', 'OTHER'];
  const f = UI.form([
    { key: 'username', label: 'Username', required: true },
    { key: 'fullName', label: 'Full name' },
    { key: 'password', label: u ? 'New password (optional)' : 'Password', type: 'password' },
    { key: 'role', label: 'Role', type: 'select', options: roles },
    { key: 'email', label: 'Email' },
    { key: 'phone', label: 'Phone' },
    { key: 'commissionRate', label: 'Commission %', type: 'number' },
    { key: 'discountLimit', label: 'Discount limit %', type: 'number' },
    { key: 'defaultLocationId', label: 'Default branch', type: 'select', options: App.state.locations.map(l => ({ value: l.id, label: l.name })) },
    { key: 'active', label: 'Active', type: 'switch', value: true }
  ], u || {});
  /* v2.6 QA — "Users & Security main Branch access main toggle button theek
     nahi hain". Wajah: ye raw <label class="switch"> haath se bana hua tha,
     shared UI2.toggle() (On/Off state + keyboard focus) use hi nahi hua tha.
     Ab har branch ek professional switch-row hai (§1/§17: EK hi component). */
  const locBox = h('div', { class: 'field full' }, h('label', null, 'Branch access'),
    h('div', { class: 'ui2-block', style: { padding: '10px 12px' } },
      App.state.locations.length
        ? App.state.locations.map(l => {
          const tg = UI2.toggle({
            row: true,
            label: l.name,
            hint: l.code || '',
            checked: !!(u && String(u.locationIds || '').indexOf(l.id) > -1)
          });
          tg.input.dataset.loc = l.id;      /* save() isi se padhta hai */
          return tg.el;
        })
        : h('div', { class: 'empty' }, 'Koi branch defined nahi')));
  f.el.appendChild(locBox);

  /* ---------- v2.5: per-user rules (allow / disallow actions) ---------- */
  const roleRef = Array.from(f.el.querySelectorAll('select'))
    .find(sel => Array.from(sel.options).some(o => o.value === 'OWNER')) || null;
  const rules = userRulesEditor(u, roleRef);
  const rulesHost = h('div', { class: 'field full' });
  rulesHost.appendChild(h('label', null, 'Rules — kaun se actions allow / disallow hain'));
  rulesHost.appendChild(h('div', { class: 'sub', style: { fontSize: 'var(--fs-xs)', color: 'var(--muted)', marginBottom: '6px' } },
    'Role ke baad “Allow” extra permission deta hai, “Deny” usay block kar deta hai. Har row par click karke Inherit → Allow → Deny badal dein.'));
  rulesHost.appendChild(rules.el);
  f.el.appendChild(rulesHost);

  UI.drawer({
    title: u ? '✏ ' + u.username : '➕ Naya user', body: f.el,
    actions: [{ label: 'Save', onClick: async (c) => {
      const v = Object.assign({}, f.values(), rules.values());
      v.locationIds = Array.from(locBox.querySelectorAll('input:checked')).map(i => i.dataset.loc);
      if (!v.username) return UI.toast('Username zaroori hai', 'err');
      try {
        if (u) await API.call('users.update', { id: u.id, patch: v });
        else await API.call('users.create', { user: v });
        UI.toast('Saved ✅', 'ok'); c(); App.refresh();
      } catch (e) { UI.toast(e.message, 'err'); }
    } }]
  });
}

    { key: 'saleReturnLimit', label: 'Sale return limit', type: 'number' },

      catch (e) { UI.toast(e.message, 'err'); }
    } }]
  });
}
