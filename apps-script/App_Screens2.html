<script>
/* ==========================================================================
   HASEEB AUTOS — SCREENS (Part 2)
   Purchase · Customers & Suppliers · Payments & Cash · Reports · Users · Settings
   ========================================================================== */
(function () {
'use strict';

const locName = id => { const l = (App.state.locations || []).find(x => x.id === id); return l ? l.name : id; };

/* helpers shared from Screens Part-1 */
const __ui = window.__ui || {};
const branchSelect = __ui.branchSelect || (() => h('select'));
const searchBox = __ui.searchBox || (() => h('input'));
const rangeBar = __ui.rangeBar || (() => ({ el: h('div'), values: () => ({}) }));
const exportBtn = __ui.exportBtn || (() => h('button'));
const itemForm = __ui.itemForm || (() => { });

function rangeBar2(onChange, defDays) {
  const from = h('input', { type: 'date', value: fmt.date(Date.now() - (defDays || 29) * 864e5), 'aria-label': 'From date', title: 'From date' });
  const to = h('input', { type: 'date', value: fmt.date(new Date()), 'aria-label': 'To date', title: 'To date' });
  const seg = h('div', { class: 'seg' },
    ...[['Today', 0], ['7d', 6], ['30d', 29], ['90d', 89]].map(([lbl, d], i) =>
      h('button', { class: i === 2 ? 'on' : '', onclick: e => {
        Array.from(seg.children).forEach(b => b.classList.remove('on')); e.target.classList.add('on');
        from.value = fmt.date(Date.now() - d * 864e5); to.value = fmt.date(new Date()); onChange(values());
      } }, lbl)));
  function values() { return { from: from.value, to: to.value }; }
  from.onchange = to.onchange = () => onChange(values());
  return { el: h('div', { class: 'filters' }, from, to, seg), values };
}

/* ================================ PURCHASE ================================ */
App.registerScreen('purchase', {
  title: 'Purchase', icon: '🚚', perm: 'purchase.view',
  subtitle: () => 'PO → GRN → Returns',
  /* deep link: App.go('purchase', { reorder:true }) → low-stock items se PO draft */
  onParams(p) {
    if (!p.reorder) return;
    setTimeout(async () => {
      try {
        const rows = await API.call('items.reorderSuggest', {}, { offlineFallback: () => [] });
        if (!rows || !rows.length) return UI.toast('Reorder ke liye koi item nahi', 'warn');
        poForm(null, rows.map(r => ({ itemId: r.id, code: r.code, name: r.name,
          qty: Math.max(1, (Number(r.reorderLevel) || Number(r.minStock) || 10) - Number(r.stock || 0)),
          rate: Number(r.costPrice) || 0 })));
      } catch (e) { UI.toast(e.message, 'err'); }
    }, 400);
  },
  actions() {
    const a = [{ label: 'Refresh', icon: '↻', onClick: () => App.refresh() }];
    if (App.can('purchase.po.create')) a.unshift({ label: 'New PO', icon: '➕', onClick: () => poForm() });
    if (App.can('purchase.grn')) a.push({ label: 'GRN', icon: '📥', onClick: () => grnForm() });
    a.push({ label: 'Price list', icon: '📥', onClick: () => window.PriceList && PriceList.open() });
    return a;
  },
  render(body) {
    let tab = 'po';
    const host = h('div');
    const seg = h('div', { class: 'seg' },
      ...[['po', 'Purchase Orders'], ['grn', 'GRN'], ['ret', 'Returns'], ['analysis', 'Supply Analysis']].map(([id, lbl]) =>
        h('button', { class: id === 'po' ? 'on' : '', onclick: e => {
          tab = id; Array.from(seg.children).forEach(b => b.classList.remove('on')); e.target.classList.add('on'); load();
        } }, lbl)));
    body.appendChild(h('div', { class: 'card' }, h('div', { class: 'filters' }, seg,
      branchSelect(v => { App.state.tmpLoc = v; load(); }, true)), host));

    async function load() {
      host.innerHTML = ''; host.appendChild(UI.skeleton(5));
      const loc = App.state.tmpLoc || '';
      try {
        if (tab === 'po') {
          const rows = await API.call('purchase.po.list', { locationId: loc });
          host.innerHTML = '';
          host.appendChild(UI.table({
            columns: [
              { key: 'poNo', label: 'PO No.' }, { key: 'date', label: 'Date', render: r => fmt.date(r.date) },
              { key: 'supplierName', label: 'Supplier' },
              { key: 'orderedQty', label: 'Ordered', num: true, render: r => h('b', null, fmt.num(r.orderedQty||0)) },
              { key: 'receivedQty', label: 'Received', num: true, render: r => fmt.num(r.receivedQty||0) },
              { key: 'pendingQty', label: 'Pending', num: true, render: r => h('span', {class:'badge '+(Number(r.pendingQty||0)>0?'warn':Number(r.pendingQty||0)<0?'err':'ok')}, fmt.num(r.pendingQty||0)) },
              { key: 'difference', label: 'Short', num: true, render: r => {
                var diff = Number(r.orderedQty||0) - Number(r.receivedQty||0);
                var over = diff < 0 ? Math.abs(diff) : 0;
                var short = diff > 0 ? diff : 0;
                if(over) return h('span', {class:'badge err'}, 'Over '+fmt.num(over));
                if(short) return h('span', {class:'badge warn'}, fmt.num(short));
                return h('span', {class:'badge ok'}, '0');
              }},
              { key: 'total', label: 'Total', num: true, render: r => fmt.money(r.total) },
              { key: 'status', label: 'Status', render: r => h('span', { class: 'badge ' + (r.status === 'RECEIVED' ? 'ok' : r.status === 'APPROVED' ? 'info' : 'warn') }, r.status) },
              { key: 'id', label: '', render: r => h('div', { style: { display: 'flex', gap: '4px' } },
                r.status === 'DRAFT' && App.can('purchase.po.approve') ? h('button', { class: 'btn sm sec', onclick: e => { e.stopPropagation(); approve(r.id); } }, 'Approve') : '',
                r.pendingQty > 0 && App.can('purchase.grn') ? h('button', { class: 'btn sm', onclick: e => { e.stopPropagation(); grnForm(r); } }, 'Receive') : '',
                h('button', { class: 'btn sm ghost', title: 'Print item label', onclick: e => { e.stopPropagation(); Print.labelFlow([r.itemId || r.id]); } }, '🏷')) }
            ], rows, emptyText: 'Koi PO nahi', onRow: r => poForm(r)
          }));
        } else if (tab === 'grn') {
          const rows = await API.call('purchase.grn.list', { locationId: loc });
          host.innerHTML = '';
          host.appendChild(UI.table({
            columns: [
              { key: 'grnNo', label: 'GRN' }, { key: 'date', label: 'Date', render: r => fmt.date(r.date) },
              { key: 'supplierId', label: 'Supplier', render: r => supplierName(r.supplierId) },
              { key: 'poNo', label: 'PO ref', render: r => r.poNo || r.poId || '—' },
              { key: 'invoiceNo', label: 'Supplier inv.' },
              { key: 'orderedQty', label: 'Ordered', num: true, render: r => r.orderedQty!==undefined ? fmt.num(r.orderedQty) : '—' },
              { key: 'receivedQty', label: 'Received', num: true, render: r => r.receivedQty!==undefined ? fmt.num(r.receivedQty) : fmt.num(r.qty||r.totalQty||0) },
              { key: 'difference', label: 'Short', num: true, render: r => {
                var ord = r.orderedQty, rec = r.receivedQty!==undefined ? r.receivedQty : (r.qty||0);
                if(ord===undefined) return h('span',{class:'muted'}, '—');
                var diff = Number(ord||0)-Number(rec||0);
                if(diff>0) return h('span',{class:'badge warn'}, fmt.num(diff));
                if(diff<0) return h('span',{class:'badge err'}, 'Over '+fmt.num(Math.abs(diff)));
                return h('span',{class:'badge ok'}, '0');
              }},
              { key: 'total', label: 'Total', num: true, render: r => fmt.money(r.total) },
              { key: 'status', label: 'Status', render: r => h('span', { class: 'badge ok' }, r.status) },
              /* v2.6 §4 — har GRN ko print / PDF / share */
              { key: '_doc', label: '', render: r => h('button', {
                class: 'icon-btn', title: 'Print / PDF / share', 'aria-label': 'Print GRN',
                onclick: (e) => { e.stopPropagation(); grnDocActions(r); }
              }, '🖨') }
            ], rows, emptyText: 'Koi GRN nahi', onRow: r => grnDetail(r)
          }));
        } else if (tab === 'ret') {
          /* v2.24.2 — Purchase ▸ Returns ka UI pehle MAUJOOD HI NAHI THA
             (backend par purchase.listReturns / purchase.saveReturn aur
             permission purchase.return tha, magar screen khaali). Ab poora
             flow: list + "New purchase return" form jisme wahi shared
             scan-first picker hai jo POS/PO/GRN mein hai. */
          let rows = [];
          try { rows = await API.call('purchase.listReturns', { limit: 100 }, { offlineFallback: () => [] }) || []; }
          catch (e) { rows = []; }   /* backend purana/unavailable ho to UI phir bhi khule */
          if (!Array.isArray(rows)) rows = rows.rows || [];
          host.innerHTML = '';
          host.appendChild(h('div', { class: 'filters', style: { marginBottom: '10px' } },
            h('button', { class: 'btn sm ok', onclick: () => purchaseReturnForm(() => load()) }, '↩ New purchase return'),
            h('span', { class: 'muted', style: { fontSize: 'var(--fs-xs)' } },
              'Supplier ko maal wapas — stock kam, ledger credit (purchase return).')));
          host.appendChild(UI.table({
            screen: 'purchase_returns',
            columns: [
              { key: 'returnNo', label: 'Return no.', render: r => h('b', null, r.returnNo || '—') },
              { key: 'date', label: 'Date', render: r => fmt.date(r.date) },
              { key: 'supplierId', label: 'Supplier', render: r => supplierName(r.supplierId) },
              { key: 'grnId', label: 'GRN ref', render: r => r.grnId || '—' },
              { key: 'reason', label: 'Reason', render: r => r.reason || '—' },
              { key: 'total', label: 'Total', num: true, render: r => fmt.money(r.total) },
              { key: 'status', label: 'Status', render: r => h('span', { class: 'badge ok' }, r.status || 'POSTED') }
            ],
            rows,
            emptyText: 'Koi purchase return nahi — "New purchase return" se banayein'
          }));
        } else if(tab==='analysis'){
          host.innerHTML=''; host.appendChild(UI.skeleton(5));
          try{
            var poRows = await API.call('purchase.po.list', {locationId: loc});
            var grnRows = await API.call('purchase.grn.list', {locationId: loc});
            // Aggregate per product and per supplier
            var prodMap={}; var supMap={};
            (poRows||[]).forEach(function(po){
              var sup=po.supplierName||supplierName(po.supplierId)||'—';
              if(!supMap[sup]) supMap[sup]={supplier:sup, ordered:0, received:0, pending:0, pos:0, shorts:0};
              supMap[sup].ordered+=Number(po.orderedQty||0); supMap[sup].received+=Number(po.receivedQty||0); supMap[sup].pending+=Number(po.pendingQty||0); supMap[sup].pos+=1;
              if(Number(po.pendingQty||0)>0) supMap[sup].shorts+=1;
            });
            // Per product from PO items if available via po.get for each PO (limit 6)
            var prodAlerts=[];
            // Use demo PO_ITEMS if available in mock, else approximate from poRows
            try{
              var allItems=[];
              /* W7 (v2.26.0) — 4 sequential po.get calls -> parallel (independent reads) */
              var _tops=poRows.slice(0,4);
              var _det=await API.parallel(_tops.map(function(pr){ return function(){
                return API.call('purchase.po.get', {id: pr.id}, {offlineFallback:function(){return null;}}); }; }), 4);
              for(var i=0;i<_det.length; i++){
                var d=_det[i]; if(d && d.__err) d=null;
                if(d && d.items) allItems=allItems.concat(d.items.map(function(it){ return {po:poRows[i], it:it}; }));
              }
              allItems.forEach(function(x){
                var key=x.it.code||x.it.name;
                if(!prodMap[key]) prodMap[key]={code:x.it.code, name:x.it.name, ordered:0, received:0, pending:0, suppliers:{}, pos:[]};
                prodMap[key].ordered+=Number(x.it.qty||0);
                prodMap[key].received+=Number(x.it.receivedQty||0);
                prodMap[key].pending+=Math.max(0, Number(x.it.qty||0)-Number(x.it.receivedQty||0));
                var supName=x.po.supplierName||'—';
                if(!prodMap[key].suppliers[supName]) prodMap[key].suppliers[supName]=0;
                prodMap[key].suppliers[supName]+=Number(x.it.qty||0)-Number(x.it.receivedQty||0);
                if(prodMap[key].po.indexOf(x.po.poNo)===-1) prodMap[key].po.push(x.po.poNo);
              });
            }catch(e){}
            host.innerHTML='';
            // Filters
            var fProd=h('input',{class:'f-input', placeholder:'Product search', style:'max-width:160px'});
            /* v2.24.2 — filter box scan-aware (shared): barcode scan = us product par filter */
            if (UI2.attachScan) UI2.attachScan(fProd, function(code){
              var lc=String(code).toLowerCase();
              var hit=Object.keys(prodMap).filter(function(k){ return String(prodMap[k].code||'').toLowerCase()===lc; })[0];
              fProd.value = hit ? prodMap[hit].code : code;
              fProd.dispatchEvent(new Event('input',{bubbles:true}));
              UI.toast(hit ? ('📷 ' + prodMap[hit].code + ' — ' + prodMap[hit].name) : ('Code nahi mila: ' + code), hit ? 'ok' : 'warn');
            });
            var fSup=h('select',{class:'f-input', style:'max-width:140px'}, h('option',{value:''},'All suppliers'));
            Object.keys(supMap).forEach(function(s){ fSup.appendChild(h('option',{value:s},s)); });
            var fShort=h('select',{class:'f-input', style:'max-width:120px'}, h('option',{value:''},'All'), h('option',{value:'short'},'Short only'), h('option',{value:'pending'},'Pending >0'));
            var fDateFrom=h('input',{type:'date', class:'f-input', style:'max-width:130px'});
            var fDateTo=h('input',{type:'date', class:'f-input', style:'max-width:130px'});
            var filterBar=h('div',{class:'filters', style:'flex-wrap:wrap'}, fProd, fSup, fShort, fDateFrom, fDateTo, h('button',{class:'btn sm sec', onclick:function(){ load(); }}, '↻ Refresh'));
            host.appendChild(h('div',{class:'card'}, h('div',{class:'card-head'}, h('h3',null,'🔍 Filters — Product, Supplier, Date, Status, Shortage'), filterBar)));
            // Summary KPIs
            var totalOrd=Object.values(supMap).reduce(function(a,x){return a+x.ordered;},0);
            var totalRec=Object.values(supMap).reduce(function(a,x){return a+x.received;},0);
            var totalPend=Object.values(supMap).reduce(function(a,x){return a+x.pending;},0);
            var shortProdCount=Object.values(prodMap).filter(function(p){return p.pending>0;}).length;
            // Guard: if no data, show empty
            if(!Object.keys(supMap).length && !Object.keys(prodMap).length){
              host.appendChild(h('div',{class:'empty'}, 'No PO/GRN data for this branch — create a PO to see supply analysis'));
            } else {
              host.appendChild(h('div',{class:'grid g4'}, UI.kpi('📦','Ordered', fmt.num(totalOrd)), UI.kpi('✅','Received', fmt.num(totalRec),'','ok'), UI.kpi('⚠','Pending/Short', fmt.num(totalPend),'','warn'), UI.kpi('🔥','Products with short', String(shortProdCount),'','err')));
            }
            // Supplier reliability table
            var supRows=Object.values(supMap).map(function(x){ var rate= x.ordered? Math.round((x.received/x.ordered)*100):100; return {supplier:x.supplier, ordered:x.ordered, received:x.received, pending:x.pending, rate:rate, pos:x.pos, reliability: rate>=90?'Good': rate>=70?'Partial':'Poor'}; });
            supRows.sort(function(a,b){ return a.rate - b.rate; });
            /* v2.24.2 — filters ko LIVE banaya (pehle bind hi nahi thay: type karne
               par kuch nahi hota tha, sirf Refresh kaam karta tha) + supplier table
               ko product query se filter honay ka bug hataya (product text supplier
               rows ko gira deta tha). Ab dono tables apne-apne filter se chalti hain. */
            var supTableWrap=h('div'), prodTableWrap=h('div');
            host.appendChild(h('div',{class:'card'}, h('div',{class:'card-head'}, h('h3',null,'🏭 Supplier reliability — Ordered vs Supplied')), h('div',{class:'card-body tight'}, supTableWrap)));
            function supFiltered(){ var s=(fSup.value||''); var sh=fShort.value; return supRows.filter(function(r){ if(s && r.supplier!==s) return false; if(sh==='short' && r.pending===0) return false; if(sh==='pending' && r.pending===0) return false; return true; }); }
            function drawSupTable(){ supTableWrap.innerHTML=''; supTableWrap.appendChild(UI2.table({screen:'sup_analysis', rows: supFiltered(), columns:[
              {key:'supplier', label:'Supplier'}, {key:'ordered', label:'Ordered', num:true, render:function(r){return fmt.num(r.ordered);}}, {key:'received', label:'Supplied', num:true, render:function(r){return fmt.num(r.received);}}, {key:'pending', label:'Short', num:true, render:function(r){return h('span',{class:'badge '+(r.pending>0?'warn':'ok')}, fmt.num(r.pending));}}, {key:'rate', label:'Fill %', num:true, render:function(r){return h('b',{style:{color: r.rate<70?'var(--err)': r.rate<90?'var(--warn)':'var(--ok)'}}, r.rate+'%');}}, {key:'reliability', label:'Status', render:function(r){return h('span',{class:'badge '+(r.reliability==='Good'?'ok': r.reliability==='Poor'?'err':'warn')}, r.reliability);}}
            ], height:'28vh'})); }
            drawSupTable();
            // Product hot/short analysis
            var prodRows=Object.values(prodMap).map(function(p){ var supList=Object.keys(p.suppliers).map(function(s){return s+'('+fmt.num(p.suppliers[s])+')';}).join(', '); return {code:p.code, name:p.name, ordered:p.ordered, received:p.received, pending:p.pending, suppliers: supList||'—', pos:(p.po||[]).join(', ')}; });
            prodRows.sort(function(a,b){ return b.pending - a.pending; });
            var hotRows=prodRows.filter(function(r){ return r.pending>0; }).slice(0,12);
            host.appendChild(h('div',{class:'card'}, h('div',{class:'card-head'}, h('h3',null,'🔥 Hot / Frequently short products — Ordered but not fully supplied')), h('div',{class:'card-body tight'}, hotRows.length? UI2.table({screen:'prod_hot', rows: hotRows, columns:[
              {key:'code', label:'Code'}, {key:'name', label:'Product'}, {key:'ordered', label:'Ordered', num:true}, {key:'received', label:'Received', num:true}, {key:'pending', label:'Short', num:true, render:function(r){return h('span',{class:'badge warn'}, fmt.num(r.pending));}}, {key:'suppliers', label:'Suppliers (short)'}, {key:'pos', label:'POs'}
            ], height:'30vh'}): h('div',{class:'empty'}, 'No shorts — all supplied ✅'))));
            // Full product table with filters (v2.24.2: live re-render)
            host.appendChild(h('div',{class:'card'}, h('div',{class:'card-head'}, h('h3',null,'📦 Product supply — Detailed')), h('div',{class:'card-body tight'}, prodTableWrap)));
            function prodFiltered(){ var q=(fProd.value||'').toLowerCase(); var s=(fSup.value||''); var sh=fShort.value; return prodRows.filter(function(r){ if(q && (String(r.code).toLowerCase().indexOf(q)===-1 && String(r.name).toLowerCase().indexOf(q)===-1)) return false; if(s && String(r.suppliers).indexOf(s)===-1) return false; if(sh==='short' && r.pending===0) return false; if(sh==='pending' && r.pending===0) return false; return true; }); }
            function drawProdTable(){ prodTableWrap.innerHTML=''; prodTableWrap.appendChild(UI2.table({screen:'prod_detail', rows: prodFiltered(), columns:[
              {key:'code', label:'Code'}, {key:'name', label:'Product'}, {key:'ordered', label:'Ordered', num:true}, {key:'received', label:'Received', num:true}, {key:'pending', label:'Pending/Short', num:true, render:function(r){ return h('span',{class:'badge '+(r.pending>0?'warn': r.pending<0?'err':'ok')}, r.pending>0? fmt.num(r.pending): r.pending<0? 'Over '+fmt.num(Math.abs(r.pending)) : '0'); }}, {key:'suppliers', label:'Supplier(s)'}
            ], height:'34vh'})); }
            drawProdTable();
            /* filter controls ko LIVE bind karein (pehle koi binding nahi thi) */
            [fProd, fSup, fShort] .forEach(function(el){
              el.addEventListener(el.tagName==='SELECT' ? 'change' : 'input', function(){ drawSupTable(); drawProdTable(); });
            });
            fDateFrom.addEventListener('change', function(){ drawSupTable(); drawProdTable(); });
            fDateTo.addEventListener('change', function(){ drawSupTable(); drawProdTable(); });
            // Workflow hint
            host.appendChild(h('div',{class:'card', style:'background:var(--info-soft);border-color:var(--info)'}, h('div',{class:'card-body'}, h('b',null,'Workflow: Demand → PO → Supplier → Ordered → GRN Received → Difference/Pending → Inventory → Supplier Performance'), h('div',{style:'font-size:12px;color:var(--muted);margin-top:4px'}, 'All values auto-calculated from actual PO and GRN — no manual difference. Use filters: Product, Supplier, Date, PO status, shortage, pending qty.'))));
          }catch(e){ host.innerHTML=''; host.appendChild(h('div',{class:'empty'}, '⚠ '+e.message)); }
        }
      } catch (e) { host.innerHTML = ''; host.appendChild(h('div', { class: 'empty' }, '⚠ ' + e.message)); }
    }
    async function approve(id) { await API.call('purchase.po.approve', { id }); UI.toast('Approved', 'ok'); load(); }

  /* v2.6 §4 — GRN ke liye print / PDF / share (row ke 🖨 button se) */
  function grnDocActions(r) {
    UI.modal({
      title: '📄 GRN ' + (r.grnNo || ''), size: 'sm',
      body: docActions('grn', r.id),
      actions: [
        { label: '🏷 Labels (received items)', cls: 'sec', onClick: async c => {
            c();
            try {
              const d = await API.call('purchase.grn.get', { id: r.id }, { offlineFallback: () => null });
              const ids = ((d && d.items) || []).map(x => x.itemId || x.id).filter(Boolean);
              if (!ids.length) { UI.toast('GRN me items nahi mile — pehle detail kholein', 'warn'); return; }
              Print.labelFlow(ids);
            } catch (e) { UI.toast('Labels fail: ' + (e.message || e), 'err'); }
          } },
        { label: 'Close', onClick: c => c() }
      ]
    });
  }

  /* ------------------- GRN detail — supplier balance ke sath ---------------- */
  async function grnDetail(row) {
    let d = null;
    try { d = await API.call('purchase.grn.get', { id: row.id }, { offlineFallback: () => null }); }
    catch (e) { UI.toast(e.message, 'err'); return; }
    if (!d) { UI.toast('Detail load nahi hui (offline)', 'warn'); return; }
    const sup = d.supplier || {};
    const body = h('div', null,
      h('div', { class: 'po-meta' },
        h('span', null, 'GRN: ' + (d.grnNo || '')),
        h('span', null, 'Date: ' + fmt.date(d.date, true)),      /* v2.29.0 (W4) — ab date + waqt */
        UI2.stampRow(d) ? h('span', { class: 'muted' }, UI2.stampRow(d).textContent) : '',
        h('span', null, 'Supplier: ' + (sup.name || supplierName(d.supplierId))),
        h('span', null, 'Invoice: ' + (d.invoiceNo || '—')),
        d.poNo ? h('span', null, 'Against PO: ' + d.poNo) : ''),
      /* ---- previous balance block (customer invoice jaisa) ---- */
      h('div', { class: 'bal-card' },
        h('div', { class: 'bal-title' }, '💰 Supplier balance'),
        h('div', { class: 'bal-row' }, h('span', null, 'Pichhla baqaya (previous payable)'),
          h('b', null, fmt.money(d.prevBalance || 0))),
        h('div', { class: 'bal-row' }, h('span', null, 'Is GRN ki mal'),
          h('b', null, fmt.money(d.total || 0))),
        h('div', { class: 'bal-row' }, h('span', null, 'Is GRN ke khilaf adaigi'),
          h('b', null, '− ' + fmt.money(d.paid || 0))),
        h('div', { class: 'bal-row grand' }, h('span', null, 'Total dena hai (closing payable)'),
          h('b', null, fmt.money(d.closingBalance || 0))),
        sup.paymentTerms ? h('div', { class: 'bal-note' }, 'Payment terms: ' + sup.paymentTerms) : ''),

/** Supplier balance card — PO / GRN form ke upar lagta hai.
 *  .refresh(id) call karain to supplier ka pichhla baqaya aa jata hai. */
function supplierBalanceCard() {
  const el = h('div', { class: 'party-bal', style: { display: 'none', marginBottom: '10px' } });
  el.refresh = async function (supId) {
    if (!supId) { el.style.display = 'none'; return; }
    try {
      const st = await API.call('purchase.supplierStatement', { supplierId: supId },
        { offlineFallback: () => null });
      if (!st) { el.style.display = 'none'; return; }
      el.innerHTML = ''; el.style.display = '';
      /* v2.6 QA — English titles (title attribute me Urdu hint), aur .pb-rows
         grid (auto-fit 120px) — ab ye 4 fields ek hi line me fit hote hain,
         truncate/overlap nahi hote. */
      const row = (en, ur, node, extra) => h('div',
        { class: 'pb-row' + (extra ? ' ' + extra : ''), title: ur },
        h('span', null, en), node);
      const rows = h('div', { class: 'pb-rows' });
      rows.appendChild(row('Supplier', 'سپلائر', h('b', null, st.supplier.name || '—')));
      /* v2.30.0 (N10) — supplier select karne par uski POORI configured maloomat
         (contact · address · tax/NTN · terms · credit limit) yahan live aati hain —
         PO aur GRN dono mein ek hi card (shared), taake dono ka behaviour same ho.
         Sirf woh rows dikhti hain jinki value mojood ho (khali noise nahi). */
      const sup = st.supplier || {};
      const info = (en, ur, val) => { if (val === undefined || val === null || String(val).trim() === '') return; rows.appendChild(row(en, ur, h('b', null, String(val)))); };
      info('Contact', 'رابطہ نمبر', sup.phone);
      info('Email', 'ای میل', sup.email);
      info('Address', 'پتہ', sup.address);
      info('Tax / NTN', 'ٹیکس نمبر (NTN)', sup.ntn);
      info('Payment terms', 'ادائیگی کی شرائط', sup.paymentTerms);
      const limit = Number(sup.creditLimit || 0);
      if (limit > 0) {
        const avail = Math.max(0, limit - Number(st.closingBalance || 0));
        rows.appendChild(row('Credit limit', 'ادھار کی حد', h('b', null, fmt.money(limit))));
        rows.appendChild(row('Available credit', 'باقی حد', h('b', { class: avail > 0 ? 'ok' : 'err' }, fmt.money(avail))));
      }
      rows.appendChild(row('Prev. balance', 'پچھلا بقایا (ادا کرنا ہے)',
        h('b', { class: (st.closingBalance || 0) > 0 ? 'err' : 'ok' }, fmt.money(st.closingBalance || 0))));
      rows.appendChild(row('Total purchases', 'کل خریداری', h('b', null, fmt.money(st.totalPurchased || 0))));
      rows.appendChild(row('Total paid', 'کل ادائیگی', h('b', null, fmt.money(st.totalPaid || 0))));
      el.appendChild(rows);
    } catch (e) { el.style.display = 'none'; }
  };
  return el;
}

      const hint = h('div', {style:{fontSize:'12px', color:'var(--muted)', marginBottom:'6px'}}, 'These are what customers are waiting for — add to this PO in one click. Top priority shown first.');

          it.itemName + ' ×' + it.totalQty + '  · ' + it.demandCount + ' req' + (it.topPriority==='URGENT'?' ⚠' : ''));
        chip.onclick = ()=>{

  // load after supplier list done
  setTimeout(loadDemandSuggest, 600);

  /* ---- v2.9 §7/§8 — product picker: multi-select (checkbox + qty per item),
     list bahar click tak khuli rehti hai, 📋 se poori list, search + add. ---- */
  /* v2.24.0 — PO form bhi ab WAHI shared scan-first picker use karta hai jo
     GRN/Stock Issue/POS par hai. Pehle yahan custom search tha: na scan, na
     bulk modal, na dup-merge/stock-cap — isi liye "PO par barcode kaam nahi
     karta" wali shikayat thi. */
  const r2q = n => Math.round(Number(n) * 1000) / 1000;   // qty 3-decimal helper (render/map dono use karte hain)
  const picker = UI2.itemPicker({
    lines: lines, after: render,
    icon: '🛒', title: 'PO items — scan ya search',
    hint: 'Scan → seedha PO line mein (qty merge + stock cap) · ya 📋 poori list se multi-select',
    commitLabel: 'Add to PO lines',
    placeholder: 'Item dhoondain (code / name / barcode)… ya 📋 poori list',
    sub: r => [r.code, r.category, (r.stock !== undefined ? 'stock ' + r.stock : ''),
      (r.costPrice ? 'cost ' + fmt.money(r.costPrice) : '')].filter(Boolean).join(' · '),
    map: (r, qty) => {
      const cat = catalogItem(r.id);
      return { itemId: r.id, code: r.code, name: r.name, qty: r2q(qty) || 1, rate: Number(r.costPrice) || 0,
        retailPrice: Number(r.retailPrice) || 0, wholesalePrice: Number(r.wholesalePrice) || 0,
        conv: Math.max(1, Number(r.conversionFactor || (cat && cat.cv) || 1)), mode: 'PCS',
        prevPrice: 0, prevDate: '', prevSource: '' };
    },
    onAdd: l => fetchPrev(l)
  });

  /* ---- v2.6 §3 — pichhli rate server se laayein (settings-driven) ---- */
  const r2 = n => Math.round(Number(n) * 100) / 100;
  async function fetchPrev(l) {
    try {
      const d = await API.call('purchase.priceInfo', {
        itemId: l.itemId,
        supplierId: (f && f.values ? (f.values().supplierId || '') : ''),
        rate: Number(l.rate !== undefined ? l.rate : l.cost) || 0
      }, { offlineFallback: () => null });
      if (!d) return;
      l.prevPrice = Number(d.prevPrice || 0);
      l.prevDate = d.prevDate || ''; l.prevSource = d.prevSource || ''; l.prevGrnNo = d.prevGrnNo || '';
      l.retailPrice = Number(d.retailPrice || l.retailPrice || 0);
      l.wholesalePrice = Number(d.wholesalePrice || l.wholesalePrice || 0);
      repaint(l);
    } catch (e) { }
  }
  /* v2.30.2 (W7.T2) — N lines ka price-history EK call me (pehle har line ka
     alag round-trip = waterfall). Single-line add wala fetchPrev qayam hai. */
  async function fetchPrevBatch(ls) {
    const list = (ls || []).filter(l => l && l.itemId);
    if (!list.length) return;
    try {
      const sup = (f && f.values ? (f.values().supplierId || '') : '');
      const r = await API.call('purchase.priceInfoBatch', {
        supplierId: sup,
        items: list.map(l => ({ itemId: l.itemId, rate: Number(l.rate !== undefined ? l.rate : l.cost) || 0 }))
      }, { offlineFallback: () => null });
      if (!r || !r.rows) return;
      r.rows.forEach(row => {
        const l = list.find(x => String(x.itemId) === String(row.itemId));
        if (!l || row.error) return;
        l.prevPrice = Number(row.prevPrice || 0);
        l.prevDate = row.prevDate || ''; l.prevSource = row.prevSource || ''; l.prevGrnNo = row.prevGrnNo || '';
        l.retailPrice = Number(row.retailPrice || l.retailPrice || 0);
        l.wholesalePrice = Number(row.wholesalePrice || l.wholesalePrice || 0);
        repaint(l);
      });
    } catch (e) { /* offline/parse — lines bina prev-price rehti hain (feature intact) */ }
  }

  /** Strip dobara banayein — poora list re-render nahi (taake input focus na toote).
   * v2.9 — guard: async fetchPrev modal close/re-render ke baad bhi aa sakta
   * hai; purane (detached) strip par replaceChild error hota tha. */
  const repaint = (l) => {
    try {
      if (!l._strip || !l._strip.isConnected || !l._strip.parentNode) {
        if (document.body.contains(l._strip)) return; // row render() se fresh ho gayi
        render(); return;
      }
      l._strip.parentNode.replaceChild(priceStrip(l), l._strip);
    } catch (e) { /* silent — strip sirf decorative hai */ }
  };
  /** Compact multi-column strip (§2 + §3): Previous · Current · Change + Retail/Wholesale */
  function priceStrip(l) {
    const strip = h('div', { class: 'pl-price' });
    l._strip = strip;
    if (String((App.state.settings || {}).purchasePriceCompare) === 'false') return strip;
    const cur = Number(l.rate !== undefined ? l.rate : l.cost) || 0;
    const prev = Number(l.prevPrice) || 0;
    if (l.retailPrice || l.wholesalePrice) {
      strip.appendChild(h('span', { class: 'pl-tag' },
        'Retail ' + fmt.money(l.retailPrice || 0) + ' · Wholesale ' + fmt.money(l.wholesalePrice || 0)));
    }
    if (!prev) { strip.appendChild(h('span', { class: 'pl-hint' }, 'Pichhli rate: record nahi')); return strip; }
    const chg = r2(cur - prev);
    const pct = prev ? r2((chg / prev) * 100) : 0;
    strip.append(
      h('span', null, 'Previous: ' + fmt.money(prev) + (l.prevDate ? ' (' + String(l.prevDate).slice(0, 10) + ')' : '')),
      h('span', null, 'Current: ' + fmt.money(cur)),
      h('span', { class: 'pl-chg ' + (chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat') },
        'Change: ' + (chg > 0 ? '+' : '') + fmt.money(chg) + ' (' + (pct > 0 ? '+' : '') + pct.toFixed(2) + '%)'));
    return strip;
  }

  /* catalog se stock / last cost — PO banate waqt nazar rahe */
  const catalogItem = id => {
    const list = ((App.state.catalog || {}).items) || [];
    return list.filter(x => x.id === id)[0] || null;
  };
  function render() {
    listEl.innerHTML = '';
    listEl.appendChild(h('div', { class: 'po-line-head' },
      h('span', { class: 'plh-name' }, 'Item'),
      h('span', { class: 'plh-num' }, 'Stock'),
      h('span', { class: 'plh-num' }, 'Qty'),
      h('span', { class: 'plh-num' }, 'Rate'),
      h('span', { class: 'plh-num' }, 'Amount'),
      h('span', { style: { width: '28px' } }, '')));
    lines.forEach((l, i) => {
      /* v2.9 §8 — pack conversion: 1 pack = N base units (e.g. BOX = 12 PCS).
         User pack mein qty/rate dekhta hai; line BASE units mein store hoti hai
         taake GRN/stock/ledger sab ek hi unit par rahein. */
      const cat0 = catalogItem(l.itemId);
      l.conv = Math.max(1, Number(l.conv || (cat0 && cat0.cv) || 1));
      if (l.conv <= 1) l.mode = 'PCS';
      const isBox = l.mode === 'BOX';
      const amt = h('b', { class: 'pl-num' }, fmt.money(Number(l.qty || 0) * Number(l.rate || 0)));
      const q = h('input', { type: 'number', value: isBox ? r2q(Number(l.qty || 0) / l.conv) : l.qty,
        'aria-label': 'Quantity', title: isBox ? 'Qty in packs (' + l.conv + ' pcs each)' : 'Quantity',
        class: 'f-input', style: { width: '72px', textAlign: 'right' } });
      q.oninput = () => { const v = Number(q.value) || 0; l.qty = isBox ? r2q(v * l.conv) : v;
        amt.textContent = fmt.money(Number(l.qty || 0) * Number(l.rate || 0)); renderTot(); };
      const rt = h('input', { type: 'number', value: isBox ? Math.round(Number(l.rate || 0) * l.conv * 100) / 100 : l.rate,
        'aria-label': 'Rate', title: isBox ? 'Rate per pack' : 'Rate',
        class: 'f-input', style: { width: '92px', textAlign: 'right' } });
      /* v2.6 §3 — rate badalte hi muqabla update (focus qaim rahe) */
      rt.oninput = () => { const v = Number(rt.value) || 0; l.rate = isBox ? Math.round((v / l.conv) * 100) / 100 : v;
        amt.textContent = fmt.money(Number(l.qty || 0) * Number(l.rate || 0)); repaint(l); renderTot(); };
      const rcv = Number(l.receivedQty || 0);
      const cat = cat0;
      const stock = l.stock !== undefined ? Number(l.stock) : (cat ? Number(cat.stock || 0) : null);
      const pending = Math.max(0, Number(l.qty || 0) - rcv);
      listEl.appendChild(h('div', { class: 'po-line' },
        h('div', { class: 'pl-name' },
          h('b', null, l.name || l.code || 'Item'),
          h('span', { class: 'pl-sub' },
            (l.code || '—') +
            (rcv ? ' · received ' + fmt.num(rcv) : '') +
            (rcv && pending > 0 ? ' · pending ' + fmt.num(pending) : '') +
            (cat && cat.unit ? ' · ' + cat.unit : ''),
            l.conv > 1 ? ' · pack ×' + l.conv : ''),
          l.conv > 1 ? h('button', { class: 'link-btn', type: 'button',
            title: 'Qty aur rate ko pack units mein dein/base units mein',
            onclick: () => { l.mode = l.mode === 'BOX' ? 'PCS' : 'BOX'; render(); } },
            l.mode === 'BOX' ? '↔ Switch to per-' + (cat && cat.unit ? cat.unit : 'pcs')
              : '↔ Buying per pack (rate auto ×' + l.conv + ')') : '',
          priceStrip(l)),
        h('span', { class: 'pl-num' + (stock !== null && stock <= 0 ? ' warn' : '') },
          stock === null ? '—' : fmt.num(stock)),
        q, rt,
        amt,
        h('button', { class: 'icon-btn', title: 'Line hata dein', 'aria-label': 'Remove line',
          style: { width: '28px', height: '28px', border: 0 }, onclick: () => { lines.splice(i, 1); render(); } }, '✕')));
    });
    if (!lines.length) listEl.appendChild(h('div', { class: 'tbl-empty' }, 'Items add karein'));
    renderTot();
  }
  const tot = h('div', { class: 'po-total' });
  function renderTot() {
    const qty = lines.reduce((a, l) => a + Number(l.qty || 0), 0);
    const val = lines.reduce((a, l) => a + Number(l.qty || 0) * Number(l.rate || 0), 0);
    tot.innerHTML = '';
    tot.append(h('span', null, 'Lines: ' + lines.length + ' · Qty: ' + fmt.num(qty)),
      h('b', null, 'Total: ' + fmt.money(val)));
  }

  const f = UI.form([
    /* v2.6 QA — English titles; Urdu sirf hint (neeche chhoti line) me.
       3-column grid: supplier 2 column leta hai (lambe naam ke liye),
       baqi 3 fields agle line me — koi truncation/overlap nahi. */
    { key: 'supplierId', label: 'Supplier', hint: 'سپلائر منتخب کریں', span: 2, type: 'select', options: [{ value: '', label: '— select —' }].concat(SUPPLIERS.map(s => ({ value: s.id, label: s.name }))), value: po ? po.supplierId : '' },
    { key: 'locationId', label: 'Deliver to', hint: 'کہاں ڈیلیور ہونا ہے', type: 'select', options: App.state.locations.map(l => ({ value: l.id, label: l.name })), value: po ? po.locationId : App.state.locationId },
    { key: 'date', label: 'PO date', hint: 'پی او کی تاریخ', type: 'date', value: po ? String(po.date || '').slice(0, 10) : '' },
    { key: 'expectedDate', label: 'Expected date', hint: 'متوقع آمد کی تاریخ', type: 'date', value: po ? String(po.expectedDate || '').slice(0, 10) : '' },
    { key: 'budgetLimit', label: 'Budget limit', hint: 'بجٹ کی حد (0 = کوئی حد نہیں)', type: 'number', value: po ? (po.budgetLimit || 0) : 0 },
    { key: 'notes', label: 'Notes', hint: 'نوٹس (اختیاری)', type: 'textarea', full: true, rows: 2, value: po ? (po.notes || '') : '' }
  ], null, { cols: 3 });
  render();

  /* ---- existing PO: asli lines + status backend se laayein ---- */
  if (po && po.id) {
    API.call('purchase.po.get', { id: po.id }, { offlineFallback: () => null })
      .then(d => {
        detail = d;
        if (!d) return;
        lines.length = 0;
        (d.items || []).forEach(l => lines.push({
          itemId: l.itemId, code: l.code, name: l.name, qty: Number(l.qty),
          rate: Number(l.rate), receivedQty: Number(l.receivedQty || 0)
        }));
        render();
        poMeta.innerHTML = '';
        poMeta.style.display = '';
        poMeta.appendChild(h('span', null, 'PO: ' + (d.poNo || '')));
        poMeta.appendChild(h('span', { class: 'badge ' + (d.status === 'RECEIVED' ? 'ok' : d.status === 'APPROVED' ? 'info' : 'warn') },
          'Status: ' + (d.status || 'DRAFT')));
        poMeta.appendChild(h('span', null, 'Lines: ' + ((d.items || []).length)));
        poMeta.appendChild(h('span', null, 'Ordered: ' + fmt.num(d.orderedQty || 0)));
        poMeta.appendChild(h('span', null, 'Received: ' + fmt.num(d.receivedQty || 0)));
        poMeta.appendChild(h('span', null, 'Pending: ' + fmt.num(d.pendingQty || 0)));
        poMeta.appendChild(h('span', null, 'Total: ' + fmt.money(d.total || 0)));
        if (d.budgetLimit) poMeta.appendChild(h('span', null, 'Budget: ' + fmt.money(d.budgetLimit)));
        /* is PO ke khilaf kitne GRN ho chuke — detail view ke liye */
        API.call('purchase.grn.list', { locationId: '' }, { offlineFallback: () => [] })
          .then(g => {
            const mine = (g || []).filter(x => x.poId === po.id || x.poNo === d.poNo);
            if (!mine.length) return;
            poMeta.appendChild(h('span', { class: 'ok' }, 'GRN received: ' + mine.length +
              ' (' + fmt.money(mine.reduce((a, x) => a + Number(x.total || 0), 0)) + ')'));
          }).catch(() => { });
        /* v2.6 §4 — print / PDF / duplicate / share */
        poMeta.appendChild(docActions('po', po.id, { onDone: () => { UI.toast('Nayi copy list mein hai', 'ok'); } }));
        if (d.supplier && d.supplier.name) supBal.refresh(d.supplierId);
      })
      .catch(() => { });
  }
  /* v2.6 QA — PO drawer 520px tha: 6-column items table usme kuchal raha tha
     (fields truncate + overlap). Ab chauda drawer — purani cheezein waisi hain,
     sirf jagah barhi hai. */
  UI.drawer({
    title: po ? 'PO ' + po.poNo : 'New purchase order',
    width: 'min(980px,96vw)',
    body: (function () {
      setTimeout(() => {
        const sel = f.el.querySelector('select');
        if (!sel) return;
        sel.addEventListener('change', () => supBal.refresh(sel.value));
        supBal.refresh(sel.value);
      }, 0);
      return h('div', null, poMeta, supBal, demandSuggestBox, f.el,
        UI2.section('🛒 Items — scan ya search', [poBulkBtn, poCustomBtn], 'inv'),
        h('div', { class: 'picker-field' }, picker),
        listEl, tot);
    })(),
    actions: [
      { label: 'Save PO', cls: 'ok', busyLabel: 'PO save ho raha hai', okLabel: 'Saved',
        write: true, writeLabel: 'PO save', onClick: async (c) => {
      const v = f.values();
      /* v2.30.2 (T7.3) — shared validate */
      const chk = UI2.validate([() => (lines.length ? '' : 'Items add karein')],
        { getValue: () => v, form: f, toastKey: 'po' });
      if (!chk.ok) return;
      /* v2.9 ka manual 'Saving…' + disabled hack HATA diya — v2.25.9 W2.T2 se
         busy state + double-submit guard shared UI.run deta hai (modal actions
         par khud-ba-khud lagta hai), is liye per-page patch ki zaroorat nahi. */
      try {
        /* status preserve karein — approved PO dobara DRAFT na ho */
        await API.call('purchase.po.save', { po: Object.assign({}, v, {
          items: lines.map(l => ({ itemId: l.itemId, qty: Number(l.qty), rate: Number(l.rate) })),
          id: po ? po.id : null,
          status: (detail && detail.status) ? detail.status : (po && po.status) ? po.status : 'DRAFT'
        }) });
        UI.toast('PO saved ✅', 'ok'); c(); App.refresh();
      } catch (e) { UI.toast(e.message, 'err'); }   /* busy state UI.run sambhalta hai */
    } },
      (po && po.id) ? { label: '📥 Receive (GRN)', cls: 'sec', onClick: c => { c(); grnForm(po); } } : null,
      (po && po.id && String(detail ? detail.status : po.status) === 'DRAFT' && App.can('purchase.po.approve'))
        ? { label: '✅ Approve', cls: 'sec', onClick: async c => {
            try {
              await API.call('purchase.po.approve', { id: po.id });
              UI.toast('PO approved ✅', 'ok'); c(); App.refresh();
            } catch (e) { UI.toast(e.message, 'err'); }
          } } : null
    ].filter(Boolean)
  });
}

/* --------------------------------------------------------------------------
 * v2.25.0 (requirement 2) — GRN drawer: POORA dobara design.
 *
 * Purane code ka audit (kya galat tha):
 *   · 8-column grid head + har row mein inline hardcoded (2 jagah) — mobile par
 *     toot jata tha, aur PO ke bina bhi "Ordered/Received/Short" ke khaali
 *     columns dikhte thay ("—" ka shor).
 *   · Saare fields (invoice, freight, switches) ek hi section mein the.
 *   · Freight total mein nazar nahi aata tha (sirf lines ka jama).
 *   · PO badalne par scanned lines KHAMOSHI se mit jati thin.
 *   · Ek hi select par do change-listeners + supplier sel[0]/sel[1] index se set
 *     (layout badalte hi tootne wala).
 *   · Koi validation nahi (qty 0, credit bina supplier), koi receive-all ya
 *     keyboard shortcut nahi.
 *
 * Naya: 4 saaf sections (Supplier & invoice → PO → Items → Charges), PO columns
 * sirf PO mode mein, responsive line grid (mobile par label ke saath stack),
 * live summary (Subtotal + Freight = Total), receive-all (line par aur F4),
 * F2 = scan focus, F9 = Post, validation ke saath. Scanning/bulk POS jaisa hi
 * (UI2.itemPicker — wahi scan → Found → Added → field clear behaviour).
 * -------------------------------------------------------------------------- */
function grnForm(po) {
  const lines = [];
  const r2 = n => Math.round(Number(n) * 100) / 100;
  let poCtx = (po && (po.id || po.poNo))
    ? { id: po.id || '', poNo: po.poNo || '', supplierId: po.supplierId || '' } : null;
  const isPO = () => !!(poCtx && poCtx.id);
  /* v2.25.0 — `picked` PO banner ke liye chahiye tha lekin declare nahi hua tha
     (ReferenceError: picked is not defined → PO load aur banner dono toot jate
     thay). Ab yahan declare hota hai. */
  let picked = { lines: 0, total: 0 };
  const supList = (typeof SUPPLIERS !== 'undefined' && SUPPLIERS) ? SUPPLIERS : [];

  /* ======================= 1) SUPPLIER & INVOICE ======================= */
  const supBal = supplierBalanceCard();
  const fTop = UI.form([
    { key: 'supplierId', label: 'Supplier *', type: 'select', required: true,
      options: [{ value: '', label: '— select supplier —' }].concat(supList.map(s => ({ value: s.id, label: s.name }))),
      /* v2.30.0 (N10) — PO jaisa behaviour: supplier select karte hi uski contact /
         address / tax / terms + pichhla baqaya upar card mein aa jata hai.
         (Pehle GRN par ye sirf ek dafa load hota tha — badalne par update nahi hota tha.) */
      onChange: (v) => { try { supBal.refresh(v); } catch (e) { } },
      hint: 'Credit (udhaar) ke liye supplier lazmi hai' },
    { key: 'invoiceNo', label: 'Supplier invoice no.', placeholder: 'INV-2291',
      hint: 'Bill number — audit aur search ke liye' },
    { key: 'locationId', label: 'Receive at (warehouse)', type: 'select',
      options: App.state.locations.map(l => ({ value: l.id, label: l.name })), value: App.state.locationId },
    { key: 'onCredit', label: 'On credit (supplier udhaar)', type: 'switch', value: true,
      hint: 'Off = cash purchase (supplier ka balance nahi barhega)' }
  ]);

  /* ======================= 2) PO CONTEXT ======================= */
  const poPick = h('select', { class: 'f-input', 'aria-label': 'Load pending lines from purchase order',
    title: 'Kisi bhi open PO ki pending lines yahan load karein' },
    h('option', { value: '' }, '— Direct purchase (bina PO) —'));
  const poBanner = h('div', { class: 'grn-banner', hidden: 'hidden' });
  const poWrap = h('div', { class: 'grn-po-pick' },
    h('label', { class: 'field' },
      h('span', null, 'Purchase order (optional)'), poPick), poBanner);

  async function loadPoList() {
    try {
      const rows = await API.call('purchase.po.list', {}, { offlineFallback: () => [] });
      const pend = r => Number(r.pendingQty !== undefined ? r.pendingQty
        : (Number(r.orderedQty || 0) - Number(r.receivedQty || 0)));
      const open = (rows || []).filter(r => {
        const st = String(r.status || '').toUpperCase();
        return st !== 'RECEIVED' && st !== 'CANCELLED' && pend(r) > 0;
      });
      poPick.innerHTML = '';
      poPick.appendChild(h('option', { value: '' }, '— Direct purchase (bina PO) —'));
      open.forEach(r => poPick.appendChild(h('option', { value: r.id },
        (r.poNo || r.id) + ' · ' + (r.supplierName || '—') + ' · ' + pend(r) + ' pending')));
      if (!open.length) poPick.appendChild(h('option', { value: '', disabled: 'disabled' }, 'Koi open PO nahi'));
      if (poCtx && poCtx.id) poPick.value = poCtx.id;
    } catch (e) { }
  }

  function poBannerPaint() {
    poBanner.innerHTML = '';
    if (typeof paintTitle === 'function') paintTitle();   /* title bhi sync rahe */
    if (!isPO()) { poBanner.hidden = true; return; }
    poBanner.hidden = false;
    poBanner.append(
      h('span', { class: 'gb-ico' }, '📄'),
      h('div', { class: 'gb-tx' },
        h('b', null, 'PO ' + (poCtx.poNo || poCtx.id) + ' ke khilaf receive ho raha hai'),
        h('span', null, 'Pending lines ' + lines.length + ' · PO total ' + fmt.money(picked.total || 0) +
          (poCtx.supplierName ? ' · ' + poCtx.supplierName : ''))),
      h('button', { class: 'btn sm ghost', type: 'button', title: 'PO hata dein — direct purchase par jayein',
        onclick: async () => {
          if (lines.length && !(await UI2.confirm('PO hata dein? Items list bhi khali ho jaye gi.', null, true))) return;
          poCtx = null; lines.length = 0; poPick.value = '';
          poBannerPaint(); render();
        } }, 'Clear PO'));
  }

  async function loadPoIntoGrn(d, poId) {
    const fresh = [];
    (d.items || []).forEach(l => {
      const pend = Math.max(0, Number(l.pendingQty !== undefined ? l.pendingQty
        : (Number(l.qty) - Number(l.receivedQty || 0))));
      if (pend <= 0) return;                 /* jo poori receive ho chuki, wo dubara na aaye */
      fresh.push({ itemId: l.itemId, code: l.code, name: l.name, qty: pend, unit: l.unit,
        cost: Number(l.rate) || 0, orderedQty: Number(l.qty), receivedQty: Number(l.receivedQty || 0) });
    });
    poCtx = { id: poId, poNo: d.poNo || '', supplierId: d.supplierId || '',
      supplierName: (d.supplier && d.supplier.name) || '' };
    picked = { lines: fresh.length, total: Number(d.total || 0) };
    lines.length = 0;
    fresh.forEach(l => lines.push(l));
    if (d.supplierId) fTop.set('supplierId', d.supplierId);
    if (d.locationId) fTop.set('locationId', d.locationId);
    supBal.refresh(d.supplierId);
    fetchPrevBatch(lines);
    poBannerPaint(); render();
    if (!lines.length) UI.toast('Is PO ki saari lines receive ho chuki hain', 'warn');
    else UI.toast(fresh.length + ' pending lines load ho gayin', 'ok');
  }

  poPick.onchange = async () => {
    if (!poPick.value) {
      if (lines.length && !(await UI2.confirm('PO hat jaye ga — items list khali ho jaye gi? Continue?', null, true))) {
        poPick.value = poCtx ? poCtx.id : ''; return;
      }
      poCtx = null; lines.length = 0; poBannerPaint(); render(); return;
    }
    if (lines.length && !(await UI2.confirm('PO load karne se maujooda ' + lines.length + ' lines badal jayengi. Continue?', null, true))) {
      poPick.value = poCtx ? poCtx.id : ''; return;
    }
    try {
      const d = await API.call('purchase.po.get', { id: poPick.value }, { offlineFallback: () => null });
      if (d) await loadPoIntoGrn(d, poPick.value);
    } catch (e) { UI.toast(e.message, 'err'); }
  };

  /* ======================= 3) ITEMS (scan-first, POS jaisa) ======================= */
  const listEl = h('div', { class: 'grn-lines' });
  const picker = UI2.itemPicker({ lines, after: render,
    icon: '📦', title: 'GRN items — scan ya search',
    hint: 'Scan → seedha GRN line mein (qty merge + stock cap) · ya 📋 poori list se multi-select',
    commitLabel: 'Add to GRN lines',
    sub: r => (r.code || '') + ' · stock ' + r.stock,
    map: (r, qty) => ({ itemId: r.id, code: r.code, name: r.name, unit: r.unit,
      /* v2.30.4 (W13/T13.1 · B§8) — pack conversion scan/pehli-add lines par bhi */
      conv: Math.max(1, Number(r.conversionFactor || 1)), mode: 'PCS',
      qty: Math.max(0, Number(qty) || 1), cost: Number(r.costPrice) || 0,
      retailPrice: Number(r.retailPrice) || 0, wholesalePrice: Number(r.wholesalePrice) || 0,
      prevPrice: 0, prevDate: '', prevSource: '' }),
    onAdd: l => fetchPrev(l) });

  function openCustomProduct() {
    const cf = UI2.form({
      values: { qty: 1, cost: 0 },
      fields: [
        { key: 'name', label: 'Product name *', required: true, placeholder: 'e.g. Flamingo Polish 450ML', full: true },
        { key: 'code', label: 'Part code / SKU', placeholder: 'FL-1003' },
        { key: 'category', label: 'Category', placeholder: 'Car Care' },
        { key: 'brand', label: 'Brand', placeholder: 'Flamingo' },
        { key: 'qty', label: 'Qty *', type: 'number', value: 1 },
        { key: 'cost', label: 'Cost per unit', type: 'number', value: 0 }
      ]
    });
    UI2.modal({
      title: '＋ Add custom product (not in store)', size: 'md', body: cf.el,
      actions: [{ label: 'Add to GRN', cls: 'ok', onClick: c => {
        const v = cf.values();
        if (!v.name) return UI.toast('Product name zaruri hai', 'err');
        const l = { itemId: '', code: v.code || 'CUSTOM', name: v.name, qty: Number(v.qty) || 1,
          cost: Number(v.cost) || 0, retailPrice: 0, wholesalePrice: 0, prevPrice: 0, prevDate: '', orderedQty: undefined };
        lines.push(l); render(); UI.toast('Custom item add ho gaya', 'ok'); c();
      } }, { label: 'Cancel', onClick: c => c() }]
    });
  }
  const customBtn = h('button', { class: 'btn sm sec', type: 'button',
    title: 'Naya product jo store mein nahi — manual entry', onclick: openCustomProduct }, '＋ Custom product');
  /* v2.25.0 (req 1) — POS wala hi dedicated Bulk Add modal (multi-select + Add All).
     Inline picker direct-scan mode mein hai (scan → line), bulk ke liye ye modal. */
  const grnMap = (r, qty) => ({ itemId: r.id, code: r.code, name: r.name, unit: r.unit,
    /* v2.30.4 (W13/T13.1 · B§8) — pack conversion direct GRN lines par bhi (PO v2.9 §8 jaisa):
       1 pack = N base units (1 BOX = 12 PCS). Line hamesha BASE units mein store hoti hai
       taake stock/cost/ledger sab ek hi unit par rahen. */
    conv: Math.max(1, Number(r.conversionFactor || 1)), mode: 'PCS',
    qty: Math.max(0, Number(qty) || 1), cost: Number(r.costPrice) || 0,
    retailPrice: Number(r.retailPrice) || 0, wholesalePrice: Number(r.wholesalePrice) || 0,
    prevPrice: 0, prevDate: '', prevSource: '' });
  const bulkBtn = h('button', { class: 'btn sm sec', type: 'button',
    title: 'Bulk Add — multi-select modal (POS jaisa): scan + tick + Add All',
    onclick: () => UI2.bulkAddModal({
      icon: '📦', title: 'Bulk Add — GRN', commitLabel: 'Add to GRN lines',
      modalTitle: '📦 Bulk Add — GRN Multi Select',
      sub: r => (r.code || '') + ' · stock ' + r.stock,
      map: grnMap,
      onAdd: l => { lines.push(l); fetchPrev(l); render(); }
    }) }, '📋 Bulk add');
  const allBtn = h('button', { class: 'btn sm sec', type: 'button',
    title: 'Har PO line ki poori pending qty bhar dein (F4)', onclick: () => receiveAllPending() }, '↧ Receive all');
  allBtn.hidden = true;

  /* ======================= 4) CHARGES & SUMMARY ======================= */
  const fCharges = UI.form([
    { key: 'freight', label: 'Freight / other charges', type: 'number', value: 0,
      hint: 'Total mein jud jayega (supplier bill ke mutabiq)' },
    { key: 'updateCost', label: 'Update item cost from GRN', type: 'switch', value: true,
      hint: 'On = item ki cost is GRN ki rate se update ho gi' }
  ]);
  /* v2.25.0 — freight badalte hi summary/total update (pehle sirf line qty/cost
     par hota tha, is liye freight total mein foran nazar nahi aata tha) */
  fCharges.el.addEventListener('change', () => rt());   /* lazy — rt neeche define hai */
  fCharges.el.addEventListener('input', () => rt());
  const sumEl = h('div', { class: 'grn-sum' });
  const tot = h('div', { class: 'po-total' });

  function totals() {
    const qty = lines.reduce((a, l) => a + Number(l.qty || 0), 0);
    const sub = r2(lines.reduce((a, l) => a + Number(l.qty || 0) * Number(l.cost || 0), 0));
    const fr = r2(Number(fCharges.values().freight || 0));
    return { qty: r2(qty), sub: sub, freight: fr, total: r2(sub + fr) };
  }
  const rt = () => {
    const t = totals();
    tot.innerHTML = '';
    tot.append(h('span', null, 'Lines: ' + lines.length + ' · Qty: ' + fmt.num(t.qty)),
      h('b', null, 'Total: ' + fmt.money(t.total)));
    sumEl.innerHTML = '';
    sumEl.append(
      h('span', { class: 'gs-i' }, 'Lines ', h('b', null, String(lines.length))),
      h('span', { class: 'gs-i' }, 'Qty ', h('b', null, fmt.num(t.qty))),
      h('span', { class: 'gs-i' }, 'Subtotal ', h('b', null, fmt.money(t.sub))),
      h('span', { class: 'gs-i' }, 'Freight ', h('b', null, fmt.money(t.freight))),
      h('span', { class: 'gs-i main' }, 'Total ', h('b', null, fmt.money(t.total))));
  };

  function receiveAllPending() {
    if (!lines.length) return UI.toast('Pehle PO load karein ya items add karein', 'warn');
    let n = 0;
    lines.forEach(l => {
      if (l.orderedQty !== undefined) {
        const pend = Math.max(0, Number(l.orderedQty || 0) - Number(l.receivedQty || 0));
        if (pend !== Number(l.qty || 0)) { l.qty = pend; n++; }
      }
    });
    render();
    UI.toast(n ? n + ' lines poori pending qty par set' : 'Sab lines pehle se pending qty par hain', n ? 'ok' : 'warn');
  }

  /* ---- previous rate context (PO/GRN pricing) — v2.6 §3 ka wahi view ---- */
  async function fetchPrev(l) {
    try {
      const d = await API.call('purchase.priceInfo', {
        itemId: l.itemId,
        supplierId: fTop.values().supplierId || (poCtx && poCtx.supplierId) || '',
        rate: Number(l.cost !== undefined ? l.cost : l.rate) || 0
      }, { offlineFallback: () => null });
      if (!d) return;
      l.prevPrice = Number(d.prevPrice || 0);
      l.prevDate = d.prevDate || ''; l.prevSource = d.prevSource || ''; l.prevGrnNo = d.prevGrnNo || '';
      l.retailPrice = Number(d.retailPrice || l.retailPrice || 0);
      l.wholesalePrice = Number(d.wholesalePrice || l.wholesalePrice || 0);
      repaint(l);
    } catch (e) { }
  }
  /* v2.25.0 — crash fix: pehle `l._strip.parentNode.replaceChild(priceStrip(l), l._strip)`
     tha, jismein `priceStrip(l)` PEHLE chalta hai (l._strip ko naya node bana deta hai)
     aur phir wahi naya node "purana" bana kar replaceChild ko diya jata tha →
     "The node to be replaced is not a child of this node" (do prev-rate calls
     sath sath aane par). Ab purana node pehle capture hota hai. */
  const repaint = (l) => {
    const old = l._strip;
    if (!old || !old.parentNode) { render(); return; }
    const fresh = priceStrip(l);
    old.parentNode.replaceChild(fresh, old);
  };
  function priceStrip(l) {
    const strip = h('div', { class: 'pl-price' });
    l._strip = strip;
    if (String((App.state.settings || {}).purchasePriceCompare) === 'false') return strip;
    const cur = Number(l.cost !== undefined ? l.cost : l.rate) || 0;
    const prev = Number(l.prevPrice) || 0;
    if (l.retailPrice || l.wholesalePrice) {
      strip.appendChild(h('span', { class: 'pl-tag' },
        'Retail ' + fmt.money(l.retailPrice || 0) + ' · Wholesale ' + fmt.money(l.wholesalePrice || 0)));
    }
    if (!prev) { strip.appendChild(h('span', { class: 'pl-hint' }, 'Pichhli rate: record nahi')); return strip; }
    const chg = r2(cur - prev);
    const pct = prev ? r2((chg / prev) * 100) : 0;
    strip.append(
      h('span', null, 'Previous: ' + fmt.money(prev) + (l.prevDate ? ' (' + String(l.prevDate).slice(0, 10) + ')' : '')),
      h('span', null, 'Current: ' + fmt.money(cur)),
      h('span', { class: 'pl-chg ' + (chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat') },
        'Change: ' + (chg > 0 ? '+' : '') + fmt.money(chg) + ' (' + (pct > 0 ? '+' : '') + pct.toFixed(2) + '%)'));
    return strip;
  }

  /* ---- line grid: PO mode = 8 columns, direct = 5 (khaali columns ka shor nahi) ---- */
  const cell = (label, node, cls) => h('span', { class: 'gl-cell ' + (cls || ''), 'data-l': label }, node);

  /* v2.25.0 — qty/cost badalte hi Short badge + Amount + "Receive all" button bhi
     update hon (pehle sirf poora render() par hota tha, is liye qty badalne par
     badge/amount purane value dikhate rehte thay — confusing). */
  function shortBadgeFor(l) {
    const s = (l.orderedQty !== undefined)
      ? (Number(l.orderedQty || 0) - Number(l.receivedQty || 0) - Number(l.qty || 0)) : null;
    if (s === null) return h('span', { class: 'pl-num muted' }, '—');
    if (s > 0) return h('span', { class: 'badge warn' }, 'Short ' + fmt.num(s));
    if (s < 0) return h('span', { class: 'badge err' }, 'Over ' + fmt.num(Math.abs(s)));
    return h('span', { class: 'badge ok' }, '0');
  }
  function paintLine(l) {
    const sc = l._shortCell;
    if (sc && sc.parentNode) {
      const old = sc.querySelector('.badge, .pl-num');
      const fresh = shortBadgeFor(l);
      if (old) sc.replaceChild(fresh, old); else sc.appendChild(fresh);
    }
    if (l._amt && l._amt.parentNode) l._amt.textContent = fmt.money(Number(l.qty || 0) * Number(l.cost || 0));
    if (l._fill) l._fill.hidden = !(l.orderedQty !== undefined &&
      (Number(l.orderedQty || 0) - Number(l.receivedQty || 0) - Number(l.qty || 0)) > 0);
  }
  function render() {
    listEl.innerHTML = '';
    listEl.className = 'grn-lines ' + (isPO() ? 'grn-po' : 'grn-direct');
    allBtn.hidden = !isPO();
    const head = isPO()
      ? ['Item', 'Ordered', 'Received', 'Now', 'Short', 'Cost', 'Amount', '']
      : ['Item', 'Now', 'Cost', 'Amount', ''];
    const hd = h('div', { class: 'grn-line-head' });
    head.forEach((t, i) => hd.appendChild(h('span', { class: i ? 'gl-h' : 'gl-h name' }, t)));
    listEl.appendChild(hd);

    if (!lines.length) {
      listEl.appendChild(h('div', { class: 'grn-empty' },
        h('b', null, 'Abhi koi line nahi'),
        h('span', null, isPO() ? 'PO load hone ka intezar… ya scan/search se items add karein'
          : 'Scan karein ya 📋 poori list se items add karein')));
      rt(); return;
    }

    lines.forEach((l, i) => {
      /* v2.30.4 (W13/T13.1 · B§8) — pack conversion (direct lines only; PO lines
         base units mein aati hain is liye unhein switch ki zaroorat nahi):
         BOX mode mein user pack-qty/pack-rate likhta hai → base qty (×conv) aur
         per-base cost (÷conv) AUTO calculate — "1 BOX = 12 PCS, rate Rs 3,000"
         → line base qty 12, cost 250, amount Rs 3,000. */
      l.conv = Math.max(1, Number(l.conv || 1));
      const canPack = !isPO() && l.conv > 1;
      const isBox = canPack && l.mode === 'BOX';
      const q = h('input', { type: 'number', class: 'f-input gl-input',
        value: isBox ? Math.round((Number(l.qty || 0) / l.conv) * 1000) / 1000 : l.qty, min: 0, step: 1,
        inputmode: 'numeric', 'aria-label': 'Receive qty — ' + (l.name || l.code || 'item'),
        title: isBox ? 'Qty in packs (' + l.conv + ' base each)' : 'Aaj kitni qty receive ho rahi hai' });
      q.onchange = () => { const v = Math.max(0, Number(q.value) || 0); l.qty = isBox ? Math.round(v * l.conv * 1000) / 1000 : v; q.value = isBox ? Math.round((l.qty / l.conv) * 1000) / 1000 : l.qty; paintLine(l); rt(); };
      const c = h('input', { type: 'number', class: 'f-input gl-input',
        value: isBox ? Math.round((Number(l.cost || 0) * l.conv) * 100) / 100 : l.cost, min: 0, step: 0.01,
        inputmode: 'decimal', 'aria-label': 'Unit cost — ' + (l.name || l.code || 'item'),
        title: isBox ? 'Rate per pack (per-base auto ÷' + l.conv + ')' : 'Unit cost (isi GRN ki rate)' });
      c.onchange = () => { const v = Math.max(0, Number(c.value) || 0); l.cost = isBox ? Math.round((v / l.conv) * 100) / 100 : v; c.value = isBox ? Math.round((l.cost * l.conv) * 100) / 100 : l.cost; paintLine(l); repaint(l); rt(); };

      const shortBadge = shortBadgeFor(l);
      const shortCell = cell('Short', shortBadge);
      l._shortCell = shortCell;

      const subBits = [(l.code || '—')];
      if (l.orderedQty !== undefined) subBits.push('ordered ' + fmt.num(l.orderedQty) + (l.unit ? ' ' + l.unit : ''));
      if (l.supplierName) subBits.push(l.supplierName);
      const nameCell = h('div', { class: 'pl-name' },
        h('b', null, l.name || l.code || 'Item'),
        h('span', { class: 'pl-sub' }, subBits.join(' · ')),
        canPack ? h('button', { class: 'link-btn', type: 'button',
          title: 'Qty aur rate ko pack units mein dein/base units mein',
          onclick: () => { l.mode = l.mode === 'BOX' ? 'PCS' : 'BOX'; render(); } },
          isBox ? '↔ Switch to per-base' : '↔ Buying per pack (auto ×' + l.conv + ')') : '',
        (function () {
          if (l.orderedQty === undefined) return '';
          const shortVal = Number(l.orderedQty || 0) - Number(l.receivedQty || 0) - Number(l.qty || 0);
          const btn = h('button', { class: 'btn xs ghost gl-fill', type: 'button',
            title: 'Is line ki poori pending qty bhar dein',
            onclick: () => { l.qty = Math.max(0, Number(l.orderedQty || 0) - Number(l.receivedQty || 0)); render(); } },
            '↧ Receive all');
          btn.hidden = !(shortVal > 0);
          l._fill = btn;
          return btn;
        })(),
        priceStrip(l));

      const row = h('div', { class: 'grn-line' }, nameCell);
      if (isPO()) {
        row.append(h('span', { class: 'gl-cell pl-num', 'data-l': 'Ordered' }, fmt.num(l.orderedQty || 0)),
          h('span', { class: 'gl-cell pl-num', 'data-l': 'Received' }, fmt.num(l.receivedQty || 0)));
      }
      const amtEl = h('b', { class: 'pl-num' }, fmt.money(Number(l.qty || 0) * Number(l.cost || 0)));
      l._amt = amtEl;
      row.append(cell('Now', q), shortCell,
        cell('Cost', c), cell('Amount', amtEl),
        h('button', { class: 'icon-btn gl-rm', type: 'button', title: 'Line hata dein',
          'aria-label': 'Remove line ' + (l.name || l.code || ''), onclick: () => { lines.splice(i, 1); render(); } }, '✕'));
      listEl.appendChild(row);
    });
    rt();
  }

  /* ======================= SAVE / VALIDATION ======================= */
  const values = () => Object.assign({}, fTop.values(), fCharges.values());
  async function post(c) {
    const v = values();
    /* v2.30.2 (T7.3) — shared validate (msg/order wahi, ab highlight + focus bhi) */
    const chk = UI2.validate([
      () => (lines.length ? '' : 'Pehle items add karein (scan ya poori list se)'),
      () => { const z = lines.filter(l => !(Number(l.qty) > 0)).length; return z ? z + ' line(s) ki qty 0 hai — theek karein' : ''; },
      { key: 'supplierId', test: vv => (vv.onCredit && !vv.supplierId ? 'Credit purchase ke liye supplier chunein' : ''), msg: 'Credit purchase ke liye supplier chunein' }
    ], { getValue: () => v, form: fTop, toastKey: 'grn' });
    if (!chk.ok) return;
    try {
      await API.call('purchase.grn.save', { grn: Object.assign({}, v, {
        items: lines.map(l => ({ itemId: l.itemId, qty: Number(l.qty), cost: Number(l.cost) })),
        poId: isPO() ? poCtx.id : '',
        freight: Number(v.freight) || 0
      }) });
      UI.toast('GRN posted — stock update ho gaya', 'ok');
      if (c) c();
      App.refresh(); API.pullCatalog(true);
    } catch (e) { UI.toast(e.message, 'err'); }
  }

  /* ======================= DRAWER ======================= */
  const body = h('div', { class: 'grn-wrap' },
    UI2.section('🏢 Supplier & invoice', null, 'fin',
      { desc: 'Kis supplier se maal aaya, bill number, aur kis warehouse mein jama hoga.' }),
    fTop.el, supBal,
    UI2.section('📄 Purchase order (optional)', null, 'info',
      { desc: 'PO chunein to uski pending lines khud aa jayengi. Bina PO = direct purchase.' }),
    poWrap,
    UI2.section('📦 Items — scan ya poori list se add', [allBtn, bulkBtn, customBtn], 'inv',
      { desc: 'Scanner se scan karein (POS jaisa): Found → Added → field khali. Ya 📋 list se multi-select.' }),
    h('div', { class: 'picker-field' }, picker),
    listEl, tot, sumEl,
    UI2.section('🧾 Charges & costing', null, 'warn',
      { desc: 'Freight total mein judta hai; cost update se item ki cost GRN rate se badal jati hai.' }),
    fCharges.el);

  const dr = UI.drawer({
    title: '📥 Goods Receipt Note' + (poCtx && poCtx.poNo ? ' — PO ' + poCtx.poNo
      : (poCtx && poCtx.id ? ' (PO)' : ' — Direct Purchase')),
    body: body,
    width: 'min(1100px, 96vw)',
    actions: [{ label: 'Post GRN (F9)', cls: 'ok', busyLabel: 'GRN post ho raha hai', okLabel: 'Posted',
      write: true, writeLabel: 'GRN post',
      onClick: (c) => post(c) },
      { label: 'Cancel', cls: 'ghost', onClick: (c) => c() }]
  });

  /* v2.25.0 (req 2) — title bhi PO context ke sath badalta rahe (pehle PO load
     karne par bhi "Direct Purchase" hi likha reh jata tha — confusing). */
  /* UI.drawer `{ close, body }` deta hai (`.el` nahi) — title body ke closest
     `.drawer` se nikalta hai. */
  const headTitle = (dr && dr.body && dr.body.closest) ? dr.body.closest('.drawer').querySelector('.modal-head h3') : null;
  paintTitle();
  function paintTitle() {
    if (!headTitle) return;
    headTitle.textContent = '📥 Goods Receipt Note' + (poCtx && poCtx.poNo ? ' — PO ' + poCtx.poNo
      : (poCtx && poCtx.id ? ' (PO)' : ' — Direct Purchase'));
  }

  /* F2 = scan field, F4 = receive all pending, F9 = post (drawer khula hone par) */
  function onKey(e) {
    if (!document.body.contains(dr.body)) { document.removeEventListener('keydown', onKey); return; }
    const k = e.key;
    if (k === 'F2') {
      e.preventDefault();
      const i = picker.querySelector('.ipk-q');
      if (i) { i.focus(); if (i.select) i.select(); }
    } else if (k === 'F4') { e.preventDefault(); receiveAllPending(); }
    else if (k === 'F9') { e.preventDefault(); post(dr.close); }
  }
  document.addEventListener('keydown', onKey);

  render();
  poBannerPaint();
  loadPoList();
  setTimeout(() => {
    supBal.refresh(fTop.values().supplierId);
    const q = picker.querySelector('.ipk-q'); if (q) q.focus();
  }, 60);
  /* PO screen se aaya hua PO: lines foran load karein */
  if (poCtx && poCtx.id) {
    API.call('purchase.po.get', { id: poCtx.id }, { offlineFallback: () => null })
      .then(d => { if (d) loadPoIntoGrn(d, poCtx.id); })
      .catch(() => { });
  }
}

App.registerScreen('money', {
  title: 'Payments & Cash', icon: '💰', perm: 'payments.view',
  actions() {
    const a = [{ label: 'Refresh', icon: '↻', onClick: () => App.refresh() }];
    if (App.can('payments.create')) a.unshift({ label: 'Receive', icon: '⬇', onClick: () => receivePay({ id: '', name: 'Walk-in', balance: 0 }) });
    if (App.can('expenses.create')) a.push({ label: 'Expense', icon: '⬆', onClick: expenseForm });
    return a;
  },
  render(body) {
    let tab = 'payments';
    const host = h('div');
    const rb = rangeBar2(() => load());
    const seg = h('div', { class: 'seg' },
      ...[['payments', 'Payments'], ['expenses', 'Expenses'], ['session', 'Cash Session']].map(([id, lbl]) =>
        h('button', { class: id === 'payments' ? 'on' : '', onclick: e => {
          tab = id; Array.from(seg.children).forEach(b => b.classList.remove('on')); e.target.classList.add('on'); load();
        } }, lbl)));
    body.appendChild(h('div', { class: 'card' }, h('div', { class: 'filters' }, seg, rb.el), host));

    async function load() {
      host.innerHTML = ''; host.appendChild(UI.skeleton(5));
      const params = Object.assign({ locationId: '' }, rb.values());
      try {
        if (tab === 'payments') {
          const rows = await API.call('payments.list', params);
          host.innerHTML = '';
          host.appendChild(UI.table({
            columns: [
              { key: 'voucherNo', label: 'Voucher' }, { key: 'date', label: 'Date', render: r => fmt.date(r.date, true) },

    async function openSession() {
      const f = UI.form([{ key: 'openingCash', label: 'Opening cash in drawer', type: 'number', value: 0 }]);
      UI.modal({
        title: '🏦 Open cash session', width: 'narrow', body: f.el,
        actions: [{ label: 'Open', cls: 'ok', onClick: async (c) => {
          await API.call('cash.session.open', { openingCash: f.values().openingCash, locationId: App.state.locationId });
          UI.toast('Session open ✅', 'ok'); c(); load();
        } }]
      });
    }
    async function closeSession() {
      const f = UI.form([{ key: 'closingCash', label: 'Counted cash in drawer', type: 'number' }, { key: 'notes', label: 'Notes', type: 'textarea' }]);
      UI.modal({
        title: '🔒 Close cash session', width: 'narrow', body: f.el,
        actions: [{ label: 'Close', cls: 'danger', onClick: async (c) => {
          const r = await API.call('cash.session.close', Object.assign(f.values(), { locationId: App.state.locationId }));
          const v = Number(r.variance);
          UI.toast('Session closed. Variance: ' + fmt.money(v), Math.abs(v) > 1 ? 'warn' : 'ok'); c(); load();
          /* v2.6 §7 — is raaste se report GHAIB thi (sirf toast aata tha).
             Ab yahan bhi wahi dayReportModal (print / PDF / WhatsApp / CSV). */
          try {
            const sid = (r && (r.id || r.sessionId)) || '';
            if (sid) setTimeout(() => dayReportModal(sid), 350);
          } catch (e) { /* report fail ho to close to ho chuka hai */ }
        } }]
      });
    }
    load();
  }
});

/* ==========================================================================
   v2.6 §4 — PO / GRN document actions: print · PDF · duplicate · share
   Ek hi helper, dono jagah (PO drawer + GRN drawer).
   ========================================================================== */
function docPrint(html, title) {
  const w = window.open('', '_blank');
  if (!w) { UI.toast('Popup blocked — print ke liye popups allow karein', 'warn'); return; }
  w.document.write(html); w.document.close();
  setTimeout(() => w.print(), 300);
}
function docActions(kind, id, extra) {
  const isPO = kind === 'po';
  const wrap = h('div', { class: 'actions', style: { marginTop: '8px', flexWrap: 'wrap', gap: '6px' } });
  const btn = (label, title, fn) => wrap.appendChild(
    h('button', { class: 'btn sm sec', title, onclick: fn }, label));

  btn('🖨 Print', 'Print / PDF', async () => {
    try {
      const d = await API.call('purchase.' + kind + '.html', { id });
      docPrint(ExportsWrap(d), (isPO ? 'PO ' : 'GRN ') + id);
    } catch (e) { UI.toast(e.message || 'Print nahi ho saka', 'err'); }
  });
  btn('📄 PDF', 'PDF download', async () => {
    try {
      const d = await API.call('purchase.' + kind + '.pdf', { id });
      if (d && d.url) window.open(d.url, '_blank');
      else UI.toast('PDF ban gayi', 'ok');
    } catch (e) { UI.toast(e.message || 'PDF nahi ban saki', 'err'); }
  });
  if (isPO) {
    btn('📋 Duplicate', 'Is PO ki copy → naya draft', async () => {
      try {
        const d = await API.call('purchase.po.duplicate', { id });
        UI.toast('Copy ban gayi: ' + (d.poNo || ''), 'ok');
        if (extra && extra.onDone) extra.onDone(d);
      } catch (e) { UI.toast(e.message || 'Copy nahi ban saki', 'err'); }
    });
  }
  btn('📤 Share', 'WhatsApp / share', async () => {
    try {
      const d = await API.call('purchase.' + kind + '.html', { id });
      const txt = (isPO ? 'Purchase Order ' : 'GRN ') + (d.poNo || d.grnNo || id);
      if (typeof Share !== 'undefined' && Share.text) Share.text(txt, txt);
      else UI.toast('Share unavailable', 'warn');
    } catch (e) { UI.toast(e.message || 'Share nahi ho saka', 'err'); }
  });
  return wrap;
}
/** Server se aya HTML fragment ho to use print-ready document bana de */
function ExportsWrap(html) {
  if (/<html/i.test(html || '')) return html;
  return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + (html || '') + '</body></html>';
}

App.registerScreen('reports', {
  title: 'Reports', icon: '📈', perm: 'reports.view',

    function zEsc(v) {
      return String(v === null || v === undefined ? '' : v)

    function zPrint(res) {
      const w = window.open('', '_blank');

        '<td>' + zEsc(c.money ? fmt.money(r[c.key]) : (r[c.key] === undefined || r[c.key] === null ? '' : r[c.key])) + '</td>').join('');
      w.document.write('<html><head><title>' + zEsc(res.meta.name) + '</title><style>' +
        'body{font-family:system-ui,Segoe UI,sans-serif;padding:16px;color:#111}' +
        'h2{margin:0 0 4px}p{margin:0 0 12px;color:#555;font-size:12px}' +

        '<table><thead><tr>' + res.cols.map(c => '<th>' + zEsc(c.label) + '</th>').join('') + '</tr></thead><tbody>' +

      if (res.totals) {
        w.document.write('<tfoot><tr>' + res.cols.map((c, i) =>
          '<td>' + (i === 0 ? 'TOTAL' : (res.totals[c.key] !== undefined ? zEsc(c.money ? fmt.money(res.totals[c.key]) : res.totals[c.key]) : '')) + '</td>'
        ).join('') + '</tr></tfoot>');

      w.document.write('</table></body></html>');
      w.document.close();
      setTimeout(() => w.print(), 250);

    async function runAll() {
      if (!zReport) return;

        }));
        const rows = res.rows.slice();
        if (res.totals) {
