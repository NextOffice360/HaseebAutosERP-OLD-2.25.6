<script>
/* ==========================================================================
   HASEEB AUTOS — OFFLINE QR ENGINE
   Pure-JS QR Code encoder (byte mode, versions 1–6, ECC level L/M).
   Koi internet/CDN zaroori nahi — PWA me offline bhi kaam karta hai.
   API:  QR.svg(text, {size, margin, dark, light, ecl})
         QR.canvas / QR.dataUrl / QR.matrix
   ========================================================================== */
(function () {
'use strict';

/* --------------------------- GF(256) arithmetic --------------------------- */
const EXP = new Array(512), LOG = new Array(256);
(function () {
  let x = 1;
  for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11d; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
})();
function mul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

function rsDivisor(degree) {
  let poly = [1];
  for (let i = 0; i < degree; i++) {
    const next = new Array(poly.length + 1).fill(0);
    for (let j = 0; j < poly.length; j++) {
      next[j] ^= poly[j];                       // multiply by (x - α^i)
      next[j + 1] ^= mul(poly[j], EXP[i]);
    }
    poly = next;
  }
  return poly;
}

function rsRemainder(data, divisor) {
  const res = new Array(divisor.length - 1).fill(0);
  data.forEach(b => {
    const factor = b ^ res[0];
    res.shift(); res.push(0);
    for (let i = 0; i < divisor.length - 1; i++) res[i] ^= mul(divisor[i + 1] || 0, factor);
  });
  return res;
}

/* ------------------------------ version data ----------------------------- */
// totalCodewords, ecPerBlock, blocks, capacity(byte mode), alignment centers
const VERSIONS = {
  1:  { L: { total: 26,  ec: 7,  blocks: 1 }, M: { total: 26,  ec: 10, blocks: 1 }, align: [] },
  2:  { L: { total: 44,  ec: 10, blocks: 1 }, M: { total: 44,  ec: 16, blocks: 1 }, align: [18] },
  3:  { L: { total: 70,  ec: 15, blocks: 1 }, M: { total: 70,  ec: 26, blocks: 1 }, align: [22] },
  4:  { L: { total: 100, ec: 20, blocks: 1 }, M: { total: 100, ec: 18, blocks: 2 }, align: [26] },
  5:  { L: { total: 134, ec: 26, blocks: 1 }, M: { total: 134, ec: 24, blocks: 2 }, align: [30] },
  6:  { L: { total: 172, ec: 18, blocks: 2 }, M: { total: 172, ec: 16, blocks: 4 }, align: [34] }
};

const ALIGN_CENTERS = { 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34] };

function pickVersion(bytes, ecl) {
  for (let v = 1; v <= 6; v++) {
    const cfg = VERSIONS[v][ecl];
    const dataCw = cfg.total - cfg.ec * cfg.blocks;
    if (bytes + 2 <= dataCw) return v;   // 2 = mode(4 bits) + length(8 bits) + padding slack
  }
  return 0;
}

/* ------------------------------- encoding --------------------------------- */
function toBytes(str) {
  const out = [];
  const enc = unescape(encodeURIComponent(str));
  for (let i = 0; i < enc.length; i++) out.push(enc.charCodeAt(i) & 0xff);
  return out;
}

function buildCodewords(text, version, ecl) {
  const cfg = VERSIONS[version][ecl];
  const dataCw = cfg.total - cfg.ec * cfg.blocks;
  const bytes = toBytes(text);

  // bit stream: mode 0100 (byte) + length (8 bits for v1-9) + data + terminator + pad
  const bits = [];
  const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
  push(4, 4); push(bytes.length, 8);
  bytes.forEach(b => push(b, 8));

  const capacityBits = dataCw * 8;
  const term = Math.min(4, capacityBits - bits.length);
  for (let i = 0; i < term; i++) bits.push(0);
  while (bits.length % 8) bits.push(0);

  const words = [];
  for (let i = 0; i < bits.length; i += 8) {
    let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
    words.push(b);
  }
  const PADS = [0xEC, 0x11];
  let p = 0;
  while (words.length < dataCw) words.push(PADS[p++ % 2]);
  return words.slice(0, dataCw);
}

function interleave(words, cfg) {
  const dataCw = cfg.total - cfg.ec * cfg.blocks;
  const shortLen = Math.floor(dataCw / cfg.blocks);
  const numLong = dataCw % cfg.blocks;
  const blocks = [];
  let idx = 0;
  for (let b = 0; b < cfg.blocks; b++) {
    const len = shortLen + (b >= cfg.blocks - numLong ? 1 : 0);
    const block = words.slice(idx, idx + len); idx += len;
    const ec = rsRemainder(block, rsDivisor(cfg.ec));
    blocks.push({ data: block, ec: ec });
  }
  const out = [];
  const maxLen = shortLen + (numLong ? 1 : 0);
  for (let i = 0; i < maxLen; i++) blocks.forEach(bl => { if (i < bl.data.length) out.push(bl.data[i]); });
  for (let i = 0; i < cfg.ec; i++) blocks.forEach(bl => out.push(bl.ec[i]));
  return out;
}

/* ------------------------------ module grid ------------------------------- */
function buildMatrix(text, ecl, forcedMask) {
  ecl = ecl || 'L';
  if (VERSIONS[1][ecl] === undefined) ecl = 'L';
  const bytes = toBytes(text);
  const version = pickVersion(bytes.length, ecl);
  if (!version) throw new Error('QR data too long (max ~134 bytes)');
  const cfg = VERSIONS[version][ecl];
  const size = version * 4 + 17;
  const mods = [];
  const isFn = [];
  for (let r = 0; r < size; r++) { mods.push(new Array(size).fill(0)); isFn.push(new Array(size).fill(false)); }

  const setFn = (r, c, v) => { if (r >= 0 && c >= 0 && r < size && c < size) { mods[r][c] = v; isFn[r][c] = true; } };

  // finder patterns + separators
  const finder = (r0, c0) => {
    for (let dr = -1; dr <= 7; dr++) for (let dc = -1; dc <= 7; dc++) {
      const r = r0 + dr, c = c0 + dc;
      if (r < 0 || c < 0 || r >= size || c >= size) continue;
      const inRing = (dr >= 0 && dr <= 6 && (dc === 0 || dc === 6)) || (dc >= 0 && dc <= 6 && (dr === 0 || dr === 6));
      const inCore = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
      setFn(r, c, (inRing || inCore) ? 1 : 0);
    }
  };
  finder(0, 0); finder(0, size - 7); finder(size - 7, 0);

  // timing patterns
  for (let i = 8; i < size - 8; i++) { const v = i % 2 === 0 ? 1 : 0; setFn(6, i, v); setFn(i, 6, v); }

  // alignment patterns
  const centers = ALIGN_CENTERS[version] || [];
  centers.forEach(r0 => centers.forEach(c0 => {
    if ((r0 === 6 && c0 === 6) || (r0 === 6 && c0 === size - 7) || (r0 === size - 7 && c0 === 6)) return;
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
      const v = (Math.abs(dr) === 2 || Math.abs(dc) === 2 || (dr === 0 && dc === 0)) ? 1 : 0;
      setFn(r0 + dr, c0 + dc, v);
    }
  }));

  // dark module + format/version reserved areas
  setFn(size - 8, 8, 1);
  for (let i = 0; i <= 8; i++) { if (!isFn[8][i]) setFn(8, i, 0); if (!isFn[i][8]) setFn(i, 8, 0); }
  for (let i = 0; i < 8; i++) { setFn(8, size - 1 - i, 0); setFn(size - 1 - i, 8, 0); }

  // data placement (zig-zag, skipping column 6)
  const codewords = interleave(buildCodewords(text, version, ecl), cfg);
  let bitIdx = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const col = right - j;
        const upward = ((right + 1) & 2) === 0;
        const row = upward ? size - 1 - vert : vert;
        if (isFn[row][col]) continue;
        let bit = 0;
        if (bitIdx < codewords.length * 8) {
          bit = (codewords[bitIdx >> 3] >>> (7 - (bitIdx & 7))) & 1;
        }
        bitIdx++;
        mods[row][col] = bit;
      }
    }
  }

  // masking: choose lowest penalty
  const list = forcedMask === undefined || forcedMask === null ? [0, 1, 2, 3, 4, 5, 6, 7] : [forcedMask];
  let best = null, bestScore = Infinity, bestMask = 0;
  list.forEach(mask => {
    const m = applyMask(mods, isFn, mask, size, ecl);
    const score = penalty(m, size);
    if (score < bestScore) { bestScore = score; best = m; bestMask = mask; }
  });
  best.mask = bestMask;
  return best;
}

const MASK_FN = [
  (r, c) => (r + c) % 2 === 0,
  (r, c) => r % 2 === 0,
  (r, c) => c % 3 === 0,
  (r, c) => (r + c) % 3 === 0,
  (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
  (r, c) => (r * c) % 2 + (r * c) % 3 === 0,
  (r, c) => ((r * c) % 2 + (r * c) % 3) % 2 === 0,
  (r, c) => ((r + c) % 2 + (r * c) % 3) % 2 === 0
];

function applyMask(mods, isFn, mask, size, ecl) {
  const out = mods.map(row => row.slice());
  const fn = MASK_FN[mask];
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    if (!isFn[r][c] && fn(r, c)) out[r][c] ^= 1;
  }
  // format info (2 copies)
  const fmt = (ecl === 'M' ? 0 : 1) << 3 | mask;   // EC indicator: L=01, M=00
  const rem = rsRemainder([fmt << 10], rsDivisor(10));
  let fmtBits = ((fmt << 10) | 0);
  for (let i = 0; i < 10; i++) fmtBits |= ((rem[9 - i] & 1) << i) === 0 ? 0 : 0; // placeholder
  // build proper 15-bit BCH
  let d = fmt << 10;
  let g = 0b10100110111;
  for (let i = 14; i >= 10; i--) if ((d >>> i) & 1) d ^= g << (i - 10);
  const bits15 = ((fmt << 10) | d) ^ 0b101010000010010;

  // copy 1 — around the top-left finder (NOTE: [row][col])
  for (let i = 0; i <= 5; i++) out[i][8] = (bits15 >>> i) & 1;
  out[7][8] = (bits15 >>> 6) & 1;
  out[8][8] = (bits15 >>> 7) & 1;
  out[8][7] = (bits15 >>> 8) & 1;
  for (let i = 9; i <= 14; i++) out[8][14 - i] = (bits15 >>> i) & 1;   // row 8, cols 5..0

  // copy 2 — bits 0..7 → row 8 (cols size-1 … size-8), bits 8..14 → column 8 (rows size-7 … size-1)
  for (let i = 0; i <= 7; i++) out[8][size - 1 - i] = (bits15 >>> i) & 1;
  for (let i = 8; i <= 14; i++) out[size - 15 + i][8] = (bits15 >>> i) & 1;
  out[size - 8][8] = 1;                       // always-dark module (row size-8, col 8)
  return out;
}

function penalty(m, size) {
  let score = 0;
  // rule 1: runs of 5+
  const lineScore = arr => {
    let s = 0, run = 1;
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] === arr[i - 1]) { run++; } else { if (run >= 5) s += 3 + (run - 5); run = 1; }
    }
    if (run >= 5) s += 3 + (run - 5);
    return s;
  };
  for (let r = 0; r < size; r++) score += lineScore(m[r]);
  for (let c = 0; c < size; c++) score += lineScore(m.map(row => row[c]));
  // rule 2: 2x2 blocks
  for (let r = 0; r < size - 1; r++) for (let c = 0; c < size - 1; c++) {
    if (m[r][c] === m[r][c + 1] && m[r][c] === m[r + 1][c] && m[r][c] === m[r + 1][c + 1]) score += 3;
  }
  // rule 3: finder-like patterns 1:1:3:1:1
  const PAT = [1, 0, 1, 1, 1, 0, 1];
  const hasPat = arr => {
    let s = 0;
    for (let i = 0; i + 7 <= arr.length; i++) {
      let fwd = true, bwd = true;
      for (let k = 0; k < 7; k++) { if (arr[i + k] !== PAT[k]) fwd = false; if (arr[i + k] !== PAT[6 - k]) bwd = false; }
      if (fwd) s++; if (bwd) s++;
    }
    return s * 40;
  };
  for (let r = 0; r < size; r++) score += hasPat(m[r]);
  for (let c = 0; c < size; c++) score += hasPat(m.map(row => row[c]));
  // rule 4: dark ratio
  let dark = 0;
  m.forEach(row => row.forEach(v => dark += v));
  const pct = dark * 100 / (size * size);
  score += Math.floor(Math.abs(pct - 50) / 5) * 10;
  return score;
}

/* -------------------------------- output ---------------------------------- */
function svg(text, opts) {
  opts = opts || {};
  const m = buildMatrix(text, opts.ecl || 'L', opts.mask);
  const size = m.length;
  const margin = opts.margin === undefined ? 2 : opts.margin;
  const px = opts.size || 160;
  const total = size + margin * 2;
  const dark = opts.dark || '#0b1220', light = opts.light || '#ffffff';
  let rects = '';
  for (let r = 0; r < size; r++) {
    let c = 0;
    while (c < size) {
      if (!m[r][c]) { c++; continue; }
      let run = 1;
      while (c + run < size && m[r][c + run]) run++;
      rects += '<rect x="' + (c + margin) + '" y="' + (r + margin) + '" width="' + run + '" height="1"/>';
      c += run;
    }
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + px + '" height="' + px +
    '" viewBox="0 0 ' + total + ' ' + total + '" shape-rendering="crispEdges">' +
    '<rect width="' + total + '" height="' + total + '" fill="' + light + '"/>' +
    '<g fill="' + dark + '">' + rects + '</g></svg>';
}

function dataUrl(text, opts) {
  opts = opts || {};
  const s = svg(text, opts);
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(s)));
}

const QR2 = { svg, dataUrl, matrix: buildMatrix, _internal: { mul, rsDivisor, rsRemainder, VERSIONS } };
window.QR2 = QR2;

// Upgrade the existing QR helper: offline-first, no CDN.
// Note: App_Barcode.html declares `const QR` at script top level, so it lives in the
// shared global *lexical* scope, not on `window` — patch both handles.
const _qrTargets = [];
if (window.QR) _qrTargets.push(window.QR);
try { if (typeof QR !== 'undefined' && QR && _qrTargets.indexOf(QR) < 0) _qrTargets.push(QR); } catch (e) {}
_qrTargets.forEach(function (Q) {
  Q.svg = svg;
  Q.dataUrl = function (text, size) { return dataUrl(text, { size: size || 120 }); };
  Q.offline = true;
});
})();

/* ==========================================================================
   HaScan — LIVE CAMERA SCAN BRIDGE (v2.14.0)
   --------------------------------------------------------------------------
   MASLA (research-verified, Feb-2026 se): Apps Script HTMLService apne page
   ko sandboxed iframe mein chalata hai jiska permissions-policy camera
   allow NAHI karti — isliye getUserMedia() "Permissions policy violation"
   deta hai, chahe library koi bhi ho (BarcodeDetector, html5-qrcode, jsQR).
   Google ki apni troubleshooting guidance: camera kaam ALAG domain par
   host karein aur result wapas bhejein.

   HAL: Settings ▸ Mobile apps (PWA) ▸ scanner.liveUrl mein hosted
   pwa/qr-scanner/ page ka https URL daalein. Flow:
     click (user gesture) → window.open(scanner) → camera sirf wahin
     → decode → postMessage({type,value,nonce}) → origin+nonce match
     → onDetect(value) → popup khud band.
   URL na ho to in-app attempt (scanner.inApp on) — mobile par aksar block
   hoga, is liye manual entry hamesha maujood. Koi data kahin upload nahi
   hota — value sirf opener ko milti hai.
   ========================================================================== */
window.HaScan = (function () {
  'use strict';
  var MSG_TYPE = 'HASEEB_QR_RESULT';
  var TIMEOUT_MS = 120000;
  var BULK_IDLE_MS = 150000;   /* bulk: per-code idle window, not a hard cap */

  function settings() { return (window.App && App.state && App.state.settings) || {}; }
  function liveUrl() { return String(settings()['scanner.liveUrl'] || '').trim(); }
  /* only https, no port/auth tricks; origin pinned for both open + reply check */
  function liveOrigin() {
    var u = liveUrl(); if (!u) return '';
    try {
      var x = new URL(u, location.href);
      if (x.protocol !== 'https:' || x.port || x.username || x.password) return '';
      return x.origin;
    } catch (e) { return ''; }
  }
  function nonce() {
    try {
      var a = new Uint8Array(16); crypto.getRandomValues(a);
      var o = ''; for (var i = 0; i < 16; i++) o += (a[i] + 256).toString(16).slice(1);
      return o;
    } catch (e) { return String(Date.now()) + Math.floor(Math.random() * 1e6); }
  }
  function feedback() {
    try { navigator.vibrate && navigator.vibrate(45); } catch (e) { }
    try {
      var actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination); o.frequency.value = 1420;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.09);
      o.start(); o.stop(actx.currentTime + 0.1);
    } catch (e) { }
  }

  function manual(opts) {
    opts = opts || {};
    /* v2.30.5 (D2) — onDetect na ho to universal resolver (additive fallback) */
    var handle = function (val) {
      if (opts.onDetect) opts.onDetect(val);
      else if (window.App && App.resolveCode) App.resolveCode(val);
    };
    var input = h('input', { class: 'f-input', type: 'text', placeholder: 'Code / QR value type karke Enter dabayein', autocomplete: 'off', autofocus: true });
    var m = UI2.modal({
      title: '⌨ Manual code entry', size: 'sm',
      body: h('div', null, h('div', { class: 'f-hint', style: { marginBottom: '8px' } },
        opts.note || 'Scanner open nahi ho saka — code neeche type karein.'), input),
      actions: [
        { label: 'Close', cls: 'ghost', onClick: function (c) { c(); } },
        { label: 'Add', cls: 'ok', onClick: function (c) { var v = input.value.trim(); c(); if (v && opts.onDetect) opts.onDetect(v); } }
      ]
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && input.value.trim()) { var v = input.value.trim(); m.close(); if (v) handle(v); }
    });
    try { input.focus(); } catch (e) { }
    return m;
  }

  /* ---- live external scanner (recommended; the only path that works
     reliably inside Apps Script on phones) ---- */
  function scanLive(opts, origin) {
    var sep = liveUrl().indexOf('?') > -1 ? '&' : '?';
    var n = nonce();
    var url = liveUrl() + sep + 'ret=' + encodeURIComponent(location.origin) +
      '&n=' + encodeURIComponent(n) + (opts.allFormats ? '&fmt=all' : '') + (opts.bulk ? '&once=0' : '');
    var w = null;
    try { w = window.open(url, 'ha_qr_scan', 'width=430,height=780,resizable=yes'); } catch (e) { w = null; }
    if (!w) {
      UI.toast('Popup block ho gaya — is site ke liye popups allow karein', 'warn', 3600);
      return manual(Object.assign({}, opts, { note: 'Popup block hua. Code type karein ya popup permission dein.' }));
    }
    var done = false, count = 0, timer = 0, poll = 0;
    function detach() { window.removeEventListener('message', onMsg); }
    function closePopup() { try { if (w && !w.closed) w.close(); } catch (e) { } }
    function stop() {                                  /* end session; onDone fires once */
      if (done) return; done = true;
      clearTimeout(timer); clearInterval(poll); detach(); closePopup();
      if (opts.onDone) { try { opts.onDone(count); } catch (e) { } }
    }
    function arm() {                                   /* idle timer — re-based on every code (bulk) */
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (done) return;
        var was = count; stop();
        if (opts.bulk) UI.toast('Bulk session band — ' + was + ' code ' + (was === 1 ? 'add hua' : 'add hue') + ' ✅', was ? 'ok' : 'warn', 3400);
        else {
          UI.toast('Scanner se result nahi aaya — manual entry', 'warn', 3400);
          manual(Object.assign({}, opts, { note: 'Scanner ne 2 minute mein result nahi bheja (camera permission ya network check karein).' }));
        }
      }, opts.bulk ? BULK_IDLE_MS : TIMEOUT_MS);
    }
    function onMsg(ev) {
      try {
        if (ev.origin !== origin) return;               /* exact origin pin */
        var d = ev && ev.data;
        if (!d || d.type !== MSG_TYPE || d.nonce !== n) return;   /* our request only */
        var v = String(d.value || '').trim();
        if (!v) return;
        if (opts.bulk) { count++; feedback(); arm(); if (opts.onDetect) opts.onDetect(v); return; }
        if (done) return;
        count = 1; stop();
        feedback();
        if (opts.onDetect) opts.onDetect(v);
      } catch (e) { }
    }
    window.addEventListener('message', onMsg);
    arm();
    /* cross-origin popup par sirf .closed safely parhne deta hai — isliye
       beforeunload (jo SecurityError deta cross-origin window par) hata kar
       poll kiya jata hai. Band window = session khatam. */
    poll = setInterval(function () {
      var c = true; try { c = !!w.closed; } catch (e) { c = true; }
      if (!c || done) return;
      var was = count; stop();
      if (!was && !opts.bulk) {
        UI.toast('Scanner window band ho gayi — manual entry', 'warn', 3200);
        manual(Object.assign({}, opts, { note: 'Scanner window band ho gayi. Code yahan type karke Enter dabayein.' }));
      }
    }, 700);
    return { cancel: stop, count: function () { return count; } };
  }

  /* ---- in-app attempt (works where the host does NOT block the camera:
     desktop Chrome panels, PWA/standalone builds). Photo fallback via
     input capture + BarcodeDetector decode; manual entry always present. ---- */
  function inApp(opts) {
    opts = opts || {};
    var video = h('video', { style: { width: '100%', borderRadius: '12px', background: '#000' }, playsinline: 'true', muted: 'true', autoplay: 'true' });
    var status = h('div', { class: 'f-hint', style: { marginTop: '8px', textAlign: 'center' } }, 'Camera start ho raha hai…');
    var manualBtn = h('button', { class: 'btn sec block', style: { marginTop: '10px' } }, '⌨ Manually type karein');
    var shot = h('input', { type: 'file', accept: 'image/*', capture: 'environment', style: { display: 'none' } });
    var shotBtn = h('button', { class: 'btn ghost block', style: { marginTop: '8px' } }, '📷 Photo kheench kar scan karein');
    var stream = null, detector = null, stopped = false, lastV = '', lastT = 0, count = 0;
    function stop() { stopped = true; if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); }
    var mm = UI2.modal({
      title: '📷 Scan barcode / QR', size: 'sm',
      body: h('div', null, video, status, shotBtn, manualBtn),
      actions: [{ label: opts.bulk ? '🔁 Bulk band karein' : 'Close', cls: 'ghost', onClick: function (c) { m.cancel(); } }]
    });
    manualBtn.onclick = function () { stop(); m.close(); manual(opts); };
    var m = mm;
    shotBtn.onclick = function () { shot.click(); };
    shot.onchange = function () {
      var f = shot.files && shot.files[0]; if (!f || !detector) { status.textContent = 'Is browser mein photo decode nahi — manual try karein'; return; }
      var img = new Image();
      img.onload = function () {
        detector.detect(img).then(function (codes) {
          if (codes && codes.length) { feedback(); stop(); m.close(); if (opts.onDetect) opts.onDetect(String(codes[0].rawValue)); }
          else status.textContent = 'Photo mein code nahi mila — dobara kheenchein ya type karein';
          URL.revokeObjectURL(img.src);
        }).catch(function () { status.textContent = 'Decode fail — manual try karein'; });
      };
      img.src = URL.createObjectURL(f);
    };
    (async function start() {
      if (!('BarcodeDetector' in window)) {
        status.textContent = '⚠ Is browser mein camera scan nahi chal sakta — mobile par Settings ▸ Mobile apps (PWA) mein scanner.liveUrl set karein, ya neeche type karein.';
        video.hidden = true; return;
      }
      if (String(settings()['scanner.inApp']) === 'false') {
        status.textContent = 'In-app camera Settings mein band hai — external scanner lagayein ya type karein.';
        video.hidden = true; return;
      }
      try { detector = new window.BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'qr_code'] }); }
      catch (e) { try { detector = new window.BarcodeDetector(); } catch (e2) { detector = null; } }
      if (!detector) { video.hidden = true; status.textContent = 'Detector available nahi — manual entry.'; return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream; await video.play();
        status.textContent = 'Barcode/QR camera ke samne layein…';
      } catch (e) {
        video.hidden = true;
        status.textContent = '⚠ Camera block hai (Apps Script sandbox ya permission) — photo/manual use karein, ya behtar hal: scanner.liveUrl set karein.';
        return;
      }
      (async function tick() {
        if (stopped) return;
        try {
          var codes = await detector.detect(video);
          if (codes && codes.length && codes[0].rawValue) {
            var v = String(codes[0].rawValue);
            if (opts.bulk) {                    /* bulk: modal khula rahe, har naya code add hota hai */
              var t = Date.now();
              if (v !== lastV || t - lastT > 1500) {
                lastV = v; lastT = t; feedback(); count++;
                status.textContent = '🔁 Bulk — ' + count + ' code scan hue (modal band karke rukwayein)';
                if (opts.onDetect) opts.onDetect(v);
              }
            } else { feedback(); stop(); m.close(); if (opts.onDetect) opts.onDetect(v); return; }
          }
        } catch (e) { }
        setTimeout(tick, 300);
      })();
    })();
    m.cancel = function () { stop(); try { m.close(); } catch (e) { } if (opts.onDone) { try { opts.onDone(count); } catch (e) { } } };
    return m;
  }

  function scan(opts) {
    opts = opts || {};
    var origin = liveOrigin();
    if (origin) { try { return scanLive(opts, origin); } catch (e) { } }
    return inApp(opts);
  }
  function bulkScan(opts) { opts = opts || {}; opts.bulk = true; return scan(opts); }
  return { scan: scan, bulkScan: bulkScan, manual: manual, inApp: inApp, liveConfigured: function () { return !!liveOrigin(); }, MSG_TYPE: MSG_TYPE };
})();

/* ============================================================================
 * v2.30.5 (D2) — UNIVERSAL CODE RESOLVER (doc-intel spec §1)
 * ----------------------------------------------------------------------------
 * QR/barcode ab sirf decorative output nahi — bidirectional navigation keys.
 * Har scan/manual code resolve hota hai → entity → screen deep-link:
 *   HA:INV:<invoiceNo|id> → sales invoice drawer
 *   HA:ITM:<itemId>       → items detail offcanvas
 *   HA:CUS:<customerId>   → parties (customers tab) detail
 *   HA:SUP:<supplierId>   → parties (suppliers tab) detail
 *   HA:DOC:… / HA:PAY:…   → document registry (D3) — abhi graceful warn
 * Legacy payloads bhi resolve hote hain (purane printed QRs kaam karte rahen):
 *   {"inv":"INV-…","total":…} (App_Print purana JSON) · CODE:<code>;SKU:<id>
 *   (App_Barcode labels) · raw code/EAN → items.list code-search
 * Additive: koi mojood scan-caller (onDetect walay) change nahi hota.
 * ==========================================================================*/
App.resolveCode = function (raw) {
  var v = String(raw || '').trim();
  if (!v) return Promise.resolve(null);
  var go = function (screen, params, label) {
    UI.toast('Khul raha hai: ' + label, 'ok', 2200);
    App.go(screen, params);
    return { ok: true, screen: screen, params: params, label: label };
  };
  var m = /^HA:(INV|ITM|CUS|SUP|DOC|PAY):(.+)$/i.exec(v);
  if (m) {
    var kind = m[1].toUpperCase(), val = m[2].trim();
    if (kind === 'INV') {
      return API.call('sales.list', { q: val, pageSize: 50 }, { offlineFallback: function () { return { rows: [] }; } })
        .then(function (r) {
          var row = (r.rows || []).find(function (x) { return x.invoiceNo === val || x.id === val; });
          if (row) return go('sales', { open: row.id }, 'Invoice ' + (row.invoiceNo || val));
          UI.toast('Invoice nahi mili: ' + val, 'warn', 3200);
          return { ok: false, kind: kind, val: val };
        })
        .catch(function (e) { UI.toast(e.message, 'err'); return { ok: false, kind: kind, err: String(e.message) }; });
    }
    if (kind === 'ITM') return Promise.resolve(go('items', { open: val }, 'Item ' + val));
    if (kind === 'CUS') return Promise.resolve(go('parties', { tab: 'customers', open: val }, 'Customer ' + val));
    if (kind === 'SUP') return Promise.resolve(go('parties', { tab: 'suppliers', open: val }, 'Supplier ' + val));
    /* v2.30.5 (D3) — HA:DOC → registry lookup → related entity khule */
    if (kind === 'DOC' && window.Docs) {
      return Docs.get(val).then(function (rec) {
        if (!rec) { UI.toast('Document registry me nahi mila: ' + val, 'warn', 3200); return { ok: false, kind: kind, val: val }; }
        var map = { sale: ['sales', { open: rec.entityId }], invoice: ['sales', { open: rec.entityId }],
          item: ['items', { open: rec.entityId }], customer: ['parties', { tab: 'customers', open: rec.entityId }],
          supplier: ['parties', { tab: 'suppliers', open: rec.entityId }] };
        var t = map[(rec.entityType || '').toLowerCase()];
        if (t) return go(t[0], t[1], 'Doc ' + (rec.docNo || rec.id) + ' → ' + (rec.ref || rec.entityType));
        UI.toast('Doc mila (' + (rec.docType || '?') + ') — is entity ka screen link abhi nahi', 'warn', 3200);
        return { ok: false, kind: kind, doc: rec };
      }).catch(function (e) { UI.toast(e.message, 'err'); return { ok: false, kind: kind, err: String(e.message) }; });
    }
    UI.toast('Yeh code document registry ke baad khulega (D3): ' + kind, 'warn', 3200);
    return Promise.resolve({ ok: false, kind: kind });
  }
  if (v.charAt(0) === '{') {
    try { var o = JSON.parse(v); if (o && o.inv) return App.resolveCode('HA:INV:' + o.inv); } catch (e) { }
  }
  m = /^CODE:([^;]*);SKU:(.+)$/i.exec(v);
  if (m) return Promise.resolve(go('items', { open: m[2].trim() }, 'Item ' + m[2].trim()));
  /* raw code/EAN → items me code/barcode se talash */
  return API.call('items.list', { q: v, pageSize: 25 }, { offlineFallback: function () { return { rows: [] }; } })
    .then(function (r) {
      var rows = r.rows || r || [];
      var row = rows.find(function (x) { return String(x.code || '').toLowerCase() === v.toLowerCase() || String(x.barcode || '') === v; });
      if (row) return go('items', { open: row.id }, 'Item ' + row.code);
      UI.toast('Code resolve nahi hua: ' + v.slice(0, 40), 'warn', 3200);
      return { ok: false, raw: v };
    })
    .catch(function (e) { UI.toast(e.message, 'err'); return { ok: false, err: String(e.message) }; });
};
/* universal scan entry: onDetect ke bagair — result seedha resolve hota hai */
App.scanResolve = function (opts) {
  opts = opts || {};
  return window.HaScan && HaScan.scan(Object.assign({}, opts, { onDetect: function (v) { App.resolveCode(v); } }));
};

/* ============================================================================
 * v2.30.5 (D3) — Docs helper: DOCUMENT REGISTRY write/read (doc-intel §2)
 * Har generated document (invoice print, labels batch, exports) apni registry
 * entry banata hai — scan/resolver isi se record tak wapas pahunchta hai.
 * Fire-and-forget (print/share flows kabhi registry-fail se na rukein).
 * ==========================================================================*/
window.Docs = {
  register: function (entry) {
    if (!window.API) return Promise.resolve(null);
    return API.call('docs.registry.save', { doc: entry || {} }, { offlineFallback: function () { return null; } })
      .catch(function () { return null; });
  },
  list: function (p) { return API.call('docs.registry.list', p || {}, { offlineFallback: function () { return { rows: [], total: 0 }; } }); },
  get: function (id) { return API.call('docs.registry.get', { id: id }, { offlineFallback: function () { return null; } }); },
  related: function (p) { return API.call('docs.registry.related', p || {}, { offlineFallback: function () { return []; } }); }
};
</script>
