<script>
/* =============================================================================
   HASEEB AUTOS — v2.9.2 SALESMAN — 8 TAB OVERHAUL
   ------------------------------------------------------------------
   Tabs:
    1) Stock Issued          — issue list + new enriched issue (reason/purpose/tour/area/customer/reference + lines)
    2) Current Stock         — salesman on-hand stock, value, retail, filterable
    3) Tours / Routes        — route mgmt (name/salesman/customers/days/target)
    4) Cust/Area Alloc       — allocation grouped by customer/area/route
    5) Sales / Delivery      — salesman sales history (source=SALESMAN)
    6) Returns               — return via original issue (remaining guard)
    7) Ledger / History      — unified timeline + Wasooli payments + collect
    8) Performance           — metrics + rating + breakdown

   Dark-mode safe, responsive (390/1024/1440), no truncation, tactile 44/48px,
   bilingual hints, traceability issued→sold→returned→remaining throughout.
   ============================================================================= */

function smEsc(v){ return String(v==null?'':v).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function smEmpty(m){ return h('div',{class:'tbl-empty'}, m); }
/* v2.27.0 (W3.T3) — jo routes poore app mein share hote hain (customers/items/sales/
   suppliers) woh Shared.raw se guzarte hain: same query = 1 request + write par
   auto-invalidate. Salesman-specific routes (salesman.*) seedha API par rehte hain
   (unka data screen-specific hai — cache ka faida nahi, stale ka risk hai). */
var SM_SHARED_ROUTES = { 'customers.list': 1, 'items.search': 1, 'sales.list': 1, 'suppliers.list': 1 };
async function smCall(action, payload, fallback){
  try{
    var r = SM_SHARED_ROUTES[action]
      ? await Shared.raw(action, payload || {}, { offline: function(){ return fallback; } })
      : await API.call(action, payload, {offlineFallback:function(){return fallback;}});
    return r==null?fallback:r;
  }catch(e){ return fallback; }
}
function smBranchSelect(onChange, includeAll){
  var sel=h('select',{class:'st2-f', onchange:function(){ onChange(sel.value); }, 'aria-label':'Branch'});
  if(includeAll) sel.appendChild(h('option',{value:''},'All branches'));
  (App.state.locations||[]).forEach(function(l){ sel.appendChild(h('option',{value:l.id}, l.name)); });
  sel.value=App.state.locationId||'';
  try{ sel.value=App.state.tmpLoc||App.state.locationId||''; }catch(e){}
  return sel;
}
function smDebounce(fn, ms){ var t; return function(){ var a=arguments,ctx=this; clearTimeout(t); t=setTimeout(function(){fn.apply(ctx,a);}, ms); }; }
function smSeg(items, cur, onPick){
  // Senior: horizontally scrollable, 48px min tap, no truncation, keyboard nav
  return h('div',{class:'tabbar-l1 sm-tabbar', style:{flexWrap:'nowrap', overflowX:'auto', scrollbarWidth:'thin', WebkitOverflowScrolling:'touch', gap:'6px', paddingBottom:'2px'}},
    ...items.map(function(it){
      return h('button',{
        class:'tab'+(it.id===cur?' on':''),
        title: it.label,
        'aria-label': it.label,
        'aria-selected': String(it.id===cur),
        role:'tab',
        style:{minHeight:'48px', whiteSpace:'nowrap', flex:'0 0 auto'},
        onclick:function(){onPick(it.id);}
      },
        h('span',{class:'ti', 'aria-hidden':'true'}, it.icon||''), h('span',null,it.label));
    }));
}

/* === SENIOR PHASE2 v2.9.4 — remaining tabs ERP polish === */
/* === SENIOR POLISH v2.9.3 — injected style (390/1024/1440, dark-safe, no truncation) === */
(function injectSalesmanStyle(){
  if(document.getElementById('sm-senior-style')) return;
  var css = `
  .sm-tabbar{ scrollbar-width:thin; }
  .sm-tabbar::-webkit-scrollbar{ height:6px; }
  .sm-hero{ display:flex; gap:10px; flex-wrap:wrap; align-items:stretch; }
  .sm-hero .kpi{ min-height:92px; }
  .sm-filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
  .sm-filters .f-col{ min-width:180px; flex:1 1 180px; }
  @media (max-width:480px){
    .sm-filters .f-col{ min-width:100%; flex:1 1 100%; }
    .grid.g4{ grid-template-columns:1fr 1fr !important; }
    .grid.g3{ grid-template-columns:1fr !important; }
    .grid.g2{ grid-template-columns:1fr !important; }
  }
  .sm-badge{ font-variant-numeric:tabular-nums; }
  .sm-empty{ padding:28px 18px; text-align:center; background:var(--panel-2, #f8fafc); border:1px dashed var(--line); border-radius:14px; }
  .sm-empty b{ display:block; font-size:var(--fs-md); margin-bottom:6px; }
  .sm-empty p{ color:var(--muted); font-size:var(--fs-sm); line-height:1.5; margin:0; }
  .sm-card-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .sm-card-head h3{ margin:0; font-size:var(--fs-md); display:flex; align-items:center; gap:8px; }
  .sm-hint{ font-size:11px; color:var(--muted); background:var(--panel-2); padding:6px 10px; border-radius:10px; }
  `;
  var el=document.createElement('style'); el.id='sm-senior-style'; el.textContent=css; document.head.appendChild(el);
})();
App.registerScreen('salesman',{
  title:'Salesman Stock', icon:'🧑', perm:'sales.view',
  subtitle:function(){ return 'Issue → Tour/Area/Customer → Sale → Collection → Return → Stock → Ledger → Rating'; },
  actions:function(){ return [{label:'Refresh', icon:'↻', onClick:function(){ App.refresh(); }}]; },

  render:function(body){
    var TABS=[
      {id:'issued', icon:'📦', label:'Stock Issued'},
      {id:'stock', icon:'📊', label:'Current Stock'},
      {id:'tours', icon:'🗺', label:'Tours / Routes'},
      {id:'alloc', icon:'🗂', label:'Cust / Area Alloc'},
      {id:'sales', icon:'🧾', label:'Sales / Delivery'},
      {id:'returns', icon:'📥', label:'Returns'},
      {id:'ledger', icon:'📒', label:'Ledger / History'},
      {id:'perf', icon:'⭐', label:'Performance'}
    ];
    var tab='issued';
    var salesmen=[]; var smId=''; var locTmp='';
    var host=h('div',{class:'fade-in'});
    var tabsBar=h('div');
    var topFilters=h('div',{class:'sm-filters', style:{padding:'12px', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:'12px'}});
    var selSm=h('select',{class:'f-input', 'aria-label':'Salesman — salesman select karein', title:'Salesman select karein', style:{minHeight:'44px'}, onchange:function(e){ smId=e.target.value; draw(); }});
    var selLoc=smBranchSelect(function(v){ locTmp=v; App.state.tmpLoc=v; draw(); }, true);
    // ensure branch select also meets 44px
    try{ selLoc.style.minHeight='44px'; selLoc.classList.add('f-input'); }catch(e){}
    selSm.appendChild(h('option',{value:''},'— Salesman select karein —'));
    var refreshBtn=h('button',{class:'btn sm sec', title:'Refresh data', 'aria-label':'Refresh', style:{minHeight:'44px', minWidth:'48px'}},'↻ Refresh');
    refreshBtn.onclick=function(){ draw(); };
    var ctxChip=h('span',{class:'badge brand sm-badge', style:{display:'none'}});
    // Build labelled filters for a11y + senior clarity
    var colSm=h('div',{class:'f-col'}, h('label',null,'Salesman *'), selSm, h('div',{class:'hint', style:{fontSize:'11px'}},'Field / van salesman — har tab isi salesman ka data dikhayega'));
    var colLoc=h('div',{class:'f-col'}, h('label',null,'Branch / Location'), selLoc, h('div',{class:'hint', style:{fontSize:'11px'}},'Branch filter — empty = all'));
    var colAct=h('div',{class:'f-col', style:{minWidth:'auto', flex:'0 0 auto', justifyContent:'flex-end'}}, h('label',null,' '), h('div',{style:{display:'flex', gap:'8px', alignItems:'center'}}, refreshBtn, ctxChip));
    topFilters.appendChild(colSm); topFilters.appendChild(colLoc); topFilters.appendChild(colAct);

    // KPI strip for salesman overview (always visible below filters)
    var kpiHost=h('div',{style:{marginTop:'12px'}});

    body.appendChild(h('div',null, tabsBar, h('div',{class:'card', style:{marginTop:'10px'}}, topFilters, h('div',{style:{padding:'10px'}},kpiHost)), host));
    // role-aware lock: salesman can only see self
    function applyRoleLock(){
      try{
        var me=App.state.session && App.state.session.userId;
        var myRole=(App.state.session && App.state.session.role)||'';
        var isSalesman=(myRole==='salesman'|| myRole==='SALESMAN');
        if(isSalesman && me){
          // lock salesman picker to self
          selSm.value=me; smId=me; selSm.disabled=true; selSm.title='Aap salesman hain — sirf apna data';
          ctxChip.textContent='👤 '+ (curSalesmanName()||me) + ' · salesman view (locked)';
          ctxChip.style.display='inline-flex';
        } else {
          selSm.disabled=false; ctxChip.style.display='none';
        }
      }catch(e){}
    }

    function loc(){ return locTmp || ''; }
    function curSalesmanName(){ var f=salesmen.filter(function(x){return x.id===smId;})[0]; return f?f.name:''; }

    function drawTabs(){
      tabsBar.innerHTML='';
      tabsBar.appendChild(smSeg(TABS, tab, function(t){ tab=t; drawTabs(); draw(); }));
    }
    function requireSm(){
      if(!smId){
        host.innerHTML='';
        var emp=h('div',{class:'sm-empty'},
          h('b',null,'👤 Salesman select karna zaruri hai'),
          h('p',null,'Pehle upar se salesman choose karein — phir har tab (Issued / Stock / Tours / Ledger …) ka data nazar aayega. / Select a salesman above to view Stock, Issues, Tours and Ledger.'),
          h('div',{style:{marginTop:'12px', display:'flex', gap:'8px', justifyContent:'center', flexWrap:'wrap'}},
            h('button',{class:'btn sm', style:{minHeight:'44px'}, onclick:function(){ selSm.focus(); try{selSm.showPicker&&selSm.showPicker();}catch(e){} }},'Salesman choose karein →'),
            h('button',{class:'btn sm sec', style:{minHeight:'44px'}, onclick:function(){ App.refresh(); }},'↻ Refresh')
          )
        );
        host.appendChild(emp);
        return false;
      }
      return true;
    }

    /* -------------------- KPI overview (issued/sold/returned/remaining) -------------------- */
    async function refreshKpi(){
      if(!smId){ kpiHost.innerHTML=''; return; }
      try{
        var perf=await smCall('salesman.performance',{salesmanId:smId, locationId:loc()}, null);
        if(!perf || !perf.totals){ kpiHost.innerHTML=''; return; }
        var t=perf.totals;
        kpiHost.innerHTML='';
        kpiHost.appendChild(h('div',{class:'grid g4 sm-hero'},
          h('div',{class:'kpi', title:'Total issued qty/value (period)'}, h('div',{class:'k-label'},'📦 Issued'), h('div',{class:'k-value'}, fmt.num(t.issuedQty)), h('div',{class:'k-exact'}, fmt.money(t.issuedValue))),
          h('div',{class:'kpi ok', title:'Sold / delivered'}, h('div',{class:'k-label'},'✅ Sold'), h('div',{class:'k-value'}, fmt.num(t.soldQty)), h('div',{class:'k-exact'}, fmt.money(t.soldValue))),
          h('div',{class:'kpi warn', title:'Returned to stock'}, h('div',{class:'k-label'},'↩ Returned'), h('div',{class:'k-value'}, fmt.num(t.returnedQty)), h('div',{class:'k-exact'}, fmt.money(t.returnedValue))),
          h('div',{class:'kpi info', title:'Remaining in hand (issued - sold - returned)'}, h('div',{class:'k-label'},'📊 In hand'), h('div',{class:'k-value'}, fmt.num(t.remainingQty)), h('div',{class:'k-exact'}, fmt.money(t.remainingValue)))
        ));
        kpiHost.appendChild(h('div',{style:{marginTop:'8px', display:'flex',gap:'6px',flexWrap:'wrap', alignItems:'center'}},
          h('span',{class:'badge brand sm-badge', title:'Salesman rating'},'⭐ '+perf.rating.score+'/5 · '+perf.rating.label),
          h('span',{class:'badge sm-badge', title:'Collection rate'},'💵 Collection '+perf.collection.rate+'%'),
          h('span',{class:'badge sm-badge', title:'Return rate — lower is better'},'↩ Return '+perf.returns.rate+'%'),
          h('span',{class:'badge sm-badge', title:'Invoices in period'},'🧾 '+perf.totals.invoices+' inv · Avg '+fmt.money(perf.totals.avgInvoice))
        ));
      }catch(e){ kpiHost.innerHTML=''; }
    }

    /* ========================= SHARED PICKERS & FORMS ========================= */

    // Customer picker with search (returns id + name)
    function customerPicker(initialId, onPick){
      var inp=h('input',{class:'f-input', placeholder:'Search customer (name/phone)…'});
      var resBox=h('div',{style:{maxHeight:'160px',overflow:'auto',border:'1px solid var(--line)',borderRadius:'10px',marginTop:'6px', display:'none'}});
      var selId=initialId||''; var selName='';
      var wrap=h('div',null, inp, resBox);
      var debounce=smDebounce(function(){
        var q=inp.value.trim(); if(q.length<1){ resBox.style.display='none'; return; }
        resBox.innerHTML=''; resBox.style.display='block'; resBox.appendChild(h('div',{style:{padding:'8px',color:'var(--muted)'}},'Searching…'));
        smCall('customers.list',{q:q, limit:10},{rows:[]}).then(function(r){
          var rows=(r&&r.rows)||r||[];
          resBox.innerHTML='';
          if(!rows.length){ resBox.appendChild(h('div',{style:{padding:'8px',color:'var(--muted)'}},'No match')); return; }
          rows.slice(0,10).forEach(function(c){
            var row=h('div',{class:'gs-item', style:{cursor:'pointer'}, onclick:function(){
              selId=c.id; selName=c.name; inp.value=c.name+(c.phone?' · '+c.phone:'');
              resBox.style.display='none'; onPick&&onPick(selId, selName);
            }}, h('span',null,'👤'), h('div',{class:'t'}, h('b',null,c.name), h('span',null,(c.phone||'')+' · '+fmt.money(c.balance||c.bal||0))));
            resBox.appendChild(row);
          });
        });
      },300);
      inp.addEventListener('input',debounce);
      // if initial id, preload name
      if(initialId){
        smCall('customers.list',{q:'', limit:1}, {rows:[]}).then(function(){ /* keep */ });
      }
      return { el:wrap, input:inp, get:function(){return {id:selId,name:selName||inp.value};}, set:function(id,name){ selId=id; selName=name; inp.value=name||''; } };
    }

    // Route dropdown loader
    async function loadRoutesForSelect(sel){
      sel.innerHTML=''; sel.appendChild(h('option',{value:''},'— No tour/route —'));
      var routes=await smCall('salesman.routes',{locationId: loc(), activeOnly:true}, []);
      routes=(routes&&routes.rows)||routes||[];   /* v2.30.6: {rows:[...]} wrap bhi */
      (routes||[]).forEach(function(r){ sel.appendChild(h('option',{value:r.id}, r.name+' · '+r.salesman)); });
      return routes;
    }
    // Area datalist (from issues distinct)
    async function loadAreas(){
      var issues=await smCall('salesman.issues',{salesmanId:smId, locationId:loc(), limit:200}, []);
      var s=new Set(); (issues||[]).forEach(function(r){ if(r.area) s.add(r.area); });
      return Array.from(s);
    }

    /* -------------------- ITEM LINE EDITOR (with per-line allocation) -------------------- */
    function lineEditor(lines, onChange){
      var listEl=h('div');
      var totalEl=h('div',{class:'po-total'});
      function updateTotal(){
        var qty=lines.reduce(function(a,l){return a+Number(l.qty||0);},0);
        var val=lines.reduce(function(a,l){return a+Number(l.qty||0)*Number(l.cost||0);},0);
        totalEl.innerHTML=''; totalEl.appendChild(h('span',null,'Lines: '+lines.length+' · Qty: '+fmt.num(qty)));
        totalEl.appendChild(h('b',null,'Value: '+fmt.money(val)));
      }
      var customBtn=h('button',{class:'btn sm sec', onclick:function(){ openCustom(); }},'＋ Custom');
      function openCustom(){
        var cf=UI2.form({values:{qty:1,cost:0}, fields:[
          {key:'name', label:'Product name *', required:true, placeholder:'Product ka naam', full:true},
          {key:'code', label:'Code', placeholder:'Code'},
          {key:'qty', label:'Qty *', type:'number', value:1},
          {key:'cost', label:'Cost', type:'number', value:0}
        ]});
        UI2.modal({title:'＋ Custom product', size:'sm', body:cf.el,
          actions:[{label:'Add',cls:'ok',onClick:function(c){
            var v=cf.values(); if(!v.name) return UI.toast('Name zaruri','err');
            lines.push({itemId:'', code:v.code||'CUSTOM', name:v.name, qty:Number(v.qty)||1, cost:Number(v.cost)||0});
            paint(); c(); UI.toast('Custom add ✅','ok');
          }},{label:'Cancel',onClick:function(c){c();}}]});
      }
      var picker=UI2.itemPicker({lines: lines, after:function(){ paint(); onChange&&onChange();},
        icon:'📦', title:'Issue lines — scan ya search',
        hint:'Scan → seedha line mein add (qty merge, stock cap) · ya 📋 list se multi-select',
        commitLabel:'Add to issue lines',
        sub:function(r){ return (r.code||'')+' · cost '+fmt.money(r.costPrice)+' · stock '+fmt.num(r.stock||0); },
        search:function(q){ return smCall('items.search',{q:q, limit: q?12:40},[]); },
        map:function(r, qty){ return {itemId:r.id, code:r.code, name:r.name, qty:Math.max(0,Number(qty)||1), cost:Number(r.costPrice)||0}; }
      });
      var pickerWrap=h('div',{class:'picker-field'}, picker);
      function paint(){
        listEl.innerHTML='';
        lines.forEach(function(l,i){
          var q=h('input',{type:'number', value:l.qty, class:'f-input', style:{width:'78px', textAlign:'right'}, onchange:function(e){ l.qty=Number(e.target.value); updateTotal(); onChange&&onChange(); }});
          var c=h('input',{type:'number', value:l.cost, class:'f-input', style:{width:'92px', textAlign:'right'}, onchange:function(e){ l.cost=Number(e.target.value); updateTotal(); onChange&&onChange(); }});
          var row=h('div',{class:'po-line'},
            h('div',{class:'pl-name'}, h('b',null,l.name||l.code||'Item'), h('span',{class:'pl-sub'}, l.code||'—')),
            q, c,
            h('b',{class:'pl-num'}, fmt.money(Number(l.qty||0)*Number(l.cost||0))),
            h('button',{class:'icon-btn', style:{width:'28px',height:'28px',border:'0'}, onclick:function(){ lines.splice(i,1); paint(); updateTotal(); onChange&&onChange(); }},'✕')
          );
          listEl.appendChild(row);
        });
        if(!lines.length) listEl.appendChild(smEmpty('Items add karein — search upar + qty/cost set karein'));
        updateTotal();
      }
      paint();
      return { el:h('div',null, pickerWrap, listEl, totalEl), refresh:paint, pickerWrap:pickerWrap, customBtn:customBtn };
    }

    /* ========================= TAB: STOCK ISSUED ========================= */
    async function drawIssued(){
      if(!requireSm()) return;
      host.innerHTML=''; host.appendChild(UI.skeleton(4));
      var filters={ salesmanId:smId, locationId:loc() };
      var rows=await smCall('salesman.issues', filters, []);
      host.innerHTML='';
      var searchInp=h('input',{class:'st2-q', placeholder:'Search issueNo / ref / customer / area…', style:{minWidth:'180px'}});
      var purposeSel=h('select',{class:'st2-f'}, h('option',{value:''},'All purposes'), ...['TOUR_SUPPLY','AREA_SUPPLY','CUSTOMER_ORDER','SAMPLE','REPLENISHMENT','OTHER'].map(function(p){ return h('option',{value:p}, p); }));
      var dateFrom=h('input',{type:'date', class:'st2-f'}); var dateTo=h('input',{type:'date', class:'st2-f'});
      var filterBar=h('div',{class:'st2-bar', style:{flexWrap:'wrap', gap:'8px', padding:'10px'}},
        h('div',{style:{display:'flex', gap:'8px', flexWrap:'wrap', flex:'1 1 auto'}},
          (function(){ searchInp.className='f-input'; searchInp.style.minHeight='44px'; searchInp.style.minWidth='200px'; searchInp.title='Search issue'; return searchInp; })(),
          (function(){ purposeSel.className='f-input'; purposeSel.style.minHeight='44px'; purposeSel.title='Filter by purpose'; return purposeSel; })(),
          (function(){ dateFrom.className='f-input'; dateFrom.style.minHeight='44px'; dateFrom.title='From date'; return dateFrom; })(),
          (function(){ dateTo.className='f-input'; dateTo.style.minHeight='44px'; dateTo.title='To date'; return dateTo; })(),
          h('button',{class:'btn sm', title:'Apply filters', style:{minHeight:'44px'}, onclick:function(){ doFilter(); }},'🔍 Filter')
        ),
        h('span',{class:'sp', style:{display:'flex', gap:'8px'}},
          h('button',{class:'btn sm sec', title:'Export list', style:{minHeight:'44px'}, onclick:function(){ exportIssued(rows); }},'⬇ Export'),
          h('button',{class:'btn sm ok', title:'Create new stock issue', style:{minHeight:'44px'}, onclick:function(){ openIssueModal(); }},'＋ New Issue')
        )
      );
      var tableWrap=h('div');
      host.appendChild(h('div',{class:'st2'},
        h('div',{class:'st2-bar', style:{background:'var(--panel)',borderBottom:'1px solid var(--line)', flexWrap:'wrap', gap:'8px'}},
          h('div',{class:'sm-card-head'}, h('b',null,'📦 Stock Issued — '+curSalesmanName()), h('span',{class:'badge brand sm-badge', title:'Total issues'}, (rows||[]).length+' docs')),
          h('span',{class:'hint', style:{fontSize:'11px'}},'Issue → Tour/Area/Customer traceable — har issue ka sold/returned Trace se dekhein'),
          h('span',{class:'sp'}, h('span',{class:'hint', style:{fontSize:'11px'}},'Use filters below ↔'))
        ),
        filterBar, tableWrap
      ));
      function renderRows(list){
        tableWrap.innerHTML='';
        if(!list.length){ tableWrap.appendChild(smEmpty('No issues for this salesman / filter')); return; }
        tableWrap.appendChild(UI2.table({
          screen:'salesman-issued', pageSize:25, exportName:'salesman-issued',
          columns:[
            {key:'issueNo', label:'Issue No', render:function(r){ return h('b',null,r.issueNo); }},
            {key:'date', label:'Date', render:function(r){ return fmt.date(r.date); }},
            {key:'purpose', label:'Purpose', render:function(r){ return h('span',{class:'badge brand'}, r.purpose||'—'); }},
            {key:'routeName', label:'Tour/Route', render:function(r){ return r.routeName||'—'; }},
            {key:'area', label:'Area', render:function(r){ return r.area||'—'; }},
            {key:'customerName', label:'Customer', render:function(r){ return r.customerName? h('span',null, r.customerName, h('div',{class:'cell-sub'}, r.customerId||'')) : '—'; }},
            {key:'reference', label:'Ref', render:function(r){ return r.reference||'—'; }},
            {key:'total', label:'Value', num:true, render:function(r){ return fmt.money(r.total); }},
            {key:'lines', label:'Lines', num:true},
            {key:'x', label:'', nos:true, render:function(r){
              return h('div',{style:{display:'flex',gap:'6px'}},
                h('button',{class:'btn sm sec', onclick:function(){ viewIssueTrace(r.id); }},'Trace'),
                h('button',{class:'btn sm', onclick:function(){ viewIssueDetail(r.id); }},'View')
              );
            }}
          ], rows: list
        }));
      }
      function doFilter(){
        var q=searchInp.value.trim().toLowerCase(); var purp=purposeSel.value; var f=dateFrom.value, t=dateTo.value;
        var filtered=(rows||[]).filter(function(r){
          if(purp && r.purpose!==purp) return false;
          if(f && r.date < f) return false;
          if(t && r.date > t) return false;
          if(q){
            var hay=(r.issueNo+' '+(r.reference||'')+' '+(r.customerName||'')+' '+(r.area||'')+' '+(r.routeName||'')+' '+(r.purpose||'')).toLowerCase();
            if(hay.indexOf(q)<0) return false;
          }
          return true;
        });
        renderRows(filtered);
      }
      searchInp.oninput=smDebounce(doFilter,300);
      renderRows(rows||[]);

      // issue trace modal
      async function viewIssueTrace(issueId){
        var box=h('div',null, UI.skeleton(3));
        var m=UI2.modal({title:'🔍 Issue trace — issued → sold → returned → remaining', size:'lg', body:box,
          actions:[{label:'Close',onClick:function(c){c();}}]});

          }));
        } else if(mode==='payments'){
          var pays=await smCall('salesman.payments',{salesmanId:smId, locationId:loc(), from:dateFrom.value, to:dateTo.value, q:qInp.value.trim(), limit:200}, []);
          container.innerHTML='';
          var list=pays||[];
          if(!list.length){ container.appendChild(smEmpty('No collection payments — use “Record Collection” to add Wasooli')); return; }
          container.appendChild(UI2.table({screen:'ledger-payments', pageSize:25, exportName:'payments',
            columns:[
              {key:'voucherNo',label:'Voucher'}, {key:'date',label:'Date', render:function(r){return fmt.date(r.date);}},
              {key:'partyName',label:'Customer'},
              {key:'amount',label:'Amount',num:true,render:function(r){return fmt.money(r.amount);}},
              {key:'method',label:'Method', render:function(r){return h('span',{class:'badge brand'}, r.method||'CASH');}},
              {key:'reference',label:'Bank/Txn/Ref', render:function(r){ return (r.reference||r.txnId||'') + (r.bankName? ' · '+r.bankName:''); }},
              {key:'prevBalance',label:'Prev Bal',num:true,render:function(r){return fmt.money(r.prevBalance);} },
              {key:'newBalance',label:'New Bal',num:true,render:function(r){return fmt.money(r.newBalance);} },
              {key:'collectorName',label:'Collector'},
              {key:'invoiceNos',label:'Invoices'}
            ], rows:list
          }));
        } else if(mode==='visits'){
          var visits=await smCall('salesman.visits',{salesmanId:smId, from:dateFrom.value, to:dateTo.value, limit:200}, []);
          container.innerHTML='';
          var vrows=visits||[];
          if(!vrows.length){ container.appendChild(smEmpty('No visits')); return; }
          container.appendChild(UI2.table({screen:'ledger-visits', pageSize:25,
            columns:[
              {key:'date',label:'Date'}, {key:'customerName',label:'Shop / Customer'}, {key:'purpose',label:'Purpose'}, {key:'outcome',label:'Outcome'},
              {key:'orderValue',label:'Order',num:true,render:function(r){return fmt.money(r.orderValue);}},
              {key:'collected',label:'Collected',num:true,render:function(r){return fmt.money(r.collected);}}
            ], rows:vrows
          }));
        }
      }
      function exportLedger(){
        UI.toast('Export: use table ▸ Export','ok');
      }
      // Wasooli collect modal
      async function openCollectModal(){
        var custPick=customerPicker('', async function(id,name){
          // auto fetch prev balance
          if(!id) return;
          prevEl.value='…';
          try{
            var cr=await smCall('customers.ledger',{id:id},{});
            // Not; use party balance API
          }catch(e){}
          try{
            var balRes=await smCall('parties.balance',{partyType:'CUSTOMER', id:id},{});
            var bal=balRes && (balRes.balance!=null?balRes.balance: balRes.bal);
            if(bal!=null) prevEl.value=String(Math.round(Number(bal)*100)/100);
            else prevEl.value='';
            calcNew();
          }catch(e){ prevEl.value=''; }
        });
        var prevEl=h('input',{type:'number', class:'f-input', placeholder:'Auto from customer ledger'});
        var amtEl=h('input',{type:'number', class:'f-input', placeholder:'e.g. 5000'});
        var newEl=h('input',{type:'number', class:'f-input', placeholder:'Auto = prev - amt', readonly:true, style:{background:'var(--panel-2)'}});
        var methodEl=h('select',{class:'f-input'},
          h('option',{value:'CASH'},'CASH'),
          h('option',{value:'BANK'},'BANK'), h('option',{value:'JAZZCASH'},'JAZZCASH'), h('option',{value:'EASYPAISA'},'EASYPAISA'),
          h('option',{value:'RAAST'},'RAAST'), h('option',{value:'CHEQUE'},'CHEQUE'), h('option',{value:'CARD'},'CARD')
        );
        var bankEl=h('input',{class:'f-input', placeholder:'Bank name (if BANK/CHEQUE)'});
        var accEl=h('input',{class:'f-input', placeholder:'Account / Wallet number'});
        var txnEl=h('input',{class:'f-input', placeholder:'Txn ID / Cheque No.'});
        var dateEl=h('input',{type:'date', class:'f-input', value:new Date().toISOString().slice(0,10)});
        var invEl=h('input',{class:'f-input', placeholder:'Related invoice nos (comma, optional)'});
        var notesEl=h('input',{class:'f-input', placeholder:'Notes (optional)'});
        function calcNew(){ var p=Number(prevEl.value||0), a=Number(amtEl.value||0); var n=Math.max(0, p-a); newEl.value=String(Math.round(n*100)/100); }
        prevEl.addEventListener('input',calcNew); amtEl.addEventListener('input',calcNew);
        var form=h('div',{class:'f-grid'},
          h('div',{class:'f-col full'}, h('label',null,'Customer *'), custPick.el),
          h('div',{class:'f-col'}, h('label',null,'Previous balance'), prevEl),
          h('div',{class:'f-col'}, h('label',null,'Amount received *'), amtEl),
          h('div',{class:'f-col'}, h('label',null,'Balance after (auto)'), newEl),
          h('div',{class:'f-col'}, h('label',null,'Payment method'), methodEl),
          h('div',{class:'f-col'}, h('label',null,'Bank / Wallet'), bankEl),
          h('div',{class:'f-col'}, h('label',null,'Account / Wallet No.'), accEl),
          h('div',{class:'f-col'}, h('label',null,'Txn / Cheque No.'), txnEl),
          h('div',{class:'f-col'}, h('label',null,'Receipt date'), dateEl),
          h('div',{class:'f-col full'}, h('label',null,'Related invoices'), invEl),
          h('div',{class:'f-col full'}, h('label',null,'Notes'), notesEl)
        );
        UI2.modal({title:'💵 Udhar Wasooli — Record Collection (ledger auto-update)', size:'lg', body:form,
          actions:[
            {label:'Save Collection',cls:'ok', onClick:async function(c){
              var cust=custPick.get();
              if(!cust.id) return UI.toast('Customer select karein','warn');
              if(!(Number(amtEl.value)>0)) return UI.toast('Amount >0','warn');
              var payload={
                customerId: cust.id, customerName: cust.name,
                amount: Number(amtEl.value), prevBalance: Number(prevEl.value||0), newBalance: Number(newEl.value||0),
                method: methodEl.value, bankName: bankEl.value.trim(), accountNo: accEl.value.trim(), txnId: txnEl.value.trim(),
                date: dateEl.value, invoiceNos: invEl.value.trim(), notes: notesEl.value.trim(),
                collectorId: smId || (App.state.session&&App.state.session.userId)||'', locationId: loc()
              };
              try{
                await API.call('salesman.collect',{payment:payload});
                UI.toast('Collection saved ✅ — ledger updated','ok'); c(); refreshKpi(); refresh();
              }catch(e){ UI.toast(e.message,'err'); }
            }},
            {label:'Close',onClick:function(c){c();}}
          ]});
      }
      // initial
      refresh();
      qInp.addEventListener('input', smDebounce(refresh,400));
    }

    /* ========================= TAB: PERFORMANCE ========================= */
    async function drawPerf(){
      if(!requireSm()) return;
      host.innerHTML=''; host.appendChild(UI.skeleton(4));
      var fromEl=h('input',{type:'date',class:'f-input', title:'From date', style:{minHeight:'44px'}}); var toEl=h('input',{type:'date',class:'f-input', title:'To date', style:{minHeight:'44px'}, value:new Date().toISOString().slice(0,10)});
      try{ var d=new Date(); d.setDate(d.getDate()-30); fromEl.value=d.toISOString().slice(0,10); }catch(e){}
      var perf=await smCall('salesman.performance',{salesmanId:smId, locationId:loc(), from:fromEl.value, to:toEl.value}, null);
      host.innerHTML='';
      host.appendChild(h('div',{class:'sm-hint', style:{marginBottom:'10px'}},'Performance rating: issued/sold/returned/remaining + collection % + return % + sales avg — period filter se compare karein.'));
      host.appendChild(h('div',{class:'st2-bar', style:{flexWrap:'wrap', gap:'8px'}},
        h('div',{class:'sm-card-head'}, h('b',null,'⭐ Performance — '+curSalesmanName()), h('span',{class:'badge brand sm-badge', title:'Overall rating'}, perf? perf.rating.label+' · '+perf.rating.score+'/5' : '—'), h('span',{class:'badge sm-badge'}, perf? perf.rating.percent+'%' : '')),
        h('span',{class:'sp', style:{display:'flex', gap:'8px', flexWrap:'wrap', alignItems:'center'}},
          h('span',{style:{fontSize:'11px', color:'var(--muted)'}},'Period:'), fromEl, toEl,
          h('button',{class:'btn sm', title:'Apply period', style:{minHeight:'44px'}, onclick:function(){ drawPerf(); }},'Apply')
        )
      ));
      if(!perf){ host.appendChild(smEmpty('No performance data — issue/sale karein')); return; }
      var t=perf.totals;
      host.appendChild(h('div',{class:'grid g4', style:{marginBottom:'12px'}},
        h('div',{class:'kpi'}, h('div',{class:'k-label'},'Issued (period)'), h('div',{class:'k-value'}, fmt.num(t.issuedQty)), h('div',{class:'k-exact'}, fmt.money(t.issuedValue))),
        h('div',{class:'kpi ok'}, h('div',{class:'k-label'},'Sold'), h('div',{class:'k-value'}, fmt.num(t.soldQty)), h('div',{class:'k-exact'}, fmt.money(t.soldValue))),
        h('div',{class:'kpi warn'}, h('div',{class:'k-label'},'Returned'), h('div',{class:'k-value'}, fmt.num(t.returnedQty)), h('div',{class:'k-exact'}, fmt.money(t.returnedValue))),
        h('div',{class:'kpi info'}, h('div',{class:'k-label'},'Remaining'), h('div',{class:'k-value'}, fmt.num(t.remainingQty)), h('div',{class:'k-exact'}, fmt.money(t.remainingValue)))
      ));
      // rating + collection bar
      var ratingBar=h('div',{class:'card', style:{marginBottom:'12px'}},
        h('div',{class:'card-body'},
          h('div',{style:{display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap'}},
            h('span',{class:'badge brand', style:{fontSize:'14px',padding:'6px 12px'}}, '⭐ '+perf.rating.score+'/5 — '+perf.rating.label+' ('+perf.rating.percent+'%)'),
            h('span',null, 'Collection '+perf.collection.rate+'% · Paid '+fmt.money(perf.collection.collected)+' · Due '+fmt.money(perf.collection.due)),
            h('span',null, 'Return '+perf.returns.rate+'%')
          ),
          h('div',{class:'prog-track', style:{marginTop:'8px',height:'10px'}},
            h('div',{class:'prog-fill', style:{width:perf.rating.percent+'%', background: perf.rating.percent>=70?'var(--ok)': perf.rating.percent>=40?'var(--warn)':'var(--err)'}}, perf.rating.percent+'%')
          )
        )
      );
      host.appendChild(ratingBar);
      // Sales performance
      host.appendChild(h('div',{class:'grid g2'},
        h('div',{class:'card'},
          h('div',{class:'card-head'}, h('h3',null,'Sales Performance')),
          h('div',{class:'card-body'},
            h('div',{class:'kv-strip'},
              h('span',{class:'kv'}, h('b',{class:'k'},'Invoices'), h('b',{class:'v'}, fmt.num(perf.sales.invoices))),
              h('span',{class:'kv'}, h('b',{class:'k'},'Avg Invoice'), h('b',{class:'v'}, fmt.money(perf.sales.avgInvoice))),
              h('span',{class:'kv'}, h('b',{class:'k'},'Cash'), h('b',{class:'v'}, fmt.money(perf.sales.cashCollected))),
              h('span',{class:'kv'}, h('b',{class:'k'},'Due'), h('b',{class:'v err'}, fmt.money(perf.sales.due)))
            ),
            h('div',{style:{marginTop:'10px'}},
              (perf.sales.topItems&&perf.sales.topItems.length)? UI2.table({screen:'perf-top', pageSize:5, columns:[
                {key:'code',label:'Code'},{key:'name',label:'Top Items'},{key:'qty',label:'Qty',num:true},{key:'value',label:'Value',num:true,render:function(r){return fmt.money(r.value);}}
              ], rows:perf.sales.topItems}) : smEmpty('No top items')
            )
          )
        ),
        h('div',{class:'card'},
          h('div',{class:'card-head'}, h('h3',null,'Collection Performance')),
          h('div',{class:'card-body'},
            h('div',{class:'kv-strip'},
              h('span',{class:'kv'}, h('b',{class:'k'},'Collected'), h('b',{class:'v ok'}, fmt.money(perf.collection.collected))),
              h('span',{class:'kv'}, h('b',{class:'k'},'Due'), h('b',{class:'v err'}, fmt.money(perf.collection.due))),
              h('span',{class:'kv'}, h('b',{class:'k'},'Rate'), h('b',{class:'v'}, perf.collection.rate+'%'))
            ),
            h('div',{style:{marginTop:'10px'}},
              h('div',{class:'prog-track'}, h('div',{class:'prog-fill', style:{width:perf.collection.rate+'%', background:'var(--ok)'}}, perf.collection.rate+'%')),
              h('div',{style:{marginTop:'8px',fontSize:'var(--fs-xs)',color:'var(--muted)'}}, perf.collection.payments+' payments in period')
            ),
            h('div',{style:{marginTop:'12px'}},
              h('b',null,'Returns'), h('span',{style:{marginLeft:'8px'}}, fmt.num(perf.returns.qty)+' qty · '+fmt.money(perf.returns.value)+' · '+perf.returns.rate+'%'),
              h('div',{class:'prog-track', style:{marginTop:'6px'}}, h('div',{class:'prog-fill', style:{width: Math.min(100, perf.returns.rate*2)+'%', background:'var(--warn)'}}, perf.returns.rate+'%'))
            )
          )
        )
      ));
      // By customer/route/area breakdown already shown in alloc tab but repeat compact
      host.appendChild(h('div',{class:'grid g3', style:{marginTop:'12px'}},
        h('div',{class:'card'},
          h('div',{class:'card-head'}, h('h3',null,'By Customer')),
          h('div',{class:'card-body tight'},
            (perf.byCustomer&&perf.byCustomer.length)? UI2.table({screen:'perf-cust', pageSize:6, columns:[{key:'label',label:'Customer'},{key:'issuedValue',label:'Issued',num:true,render:function(r){return fmt.money(r.issuedValue);}}], rows:perf.byCustomer}) : smEmpty('No data')
          )
        ),
        h('div',{class:'card'},
          h('div',{class:'card-head'}, h('h3',null,'By Tour / Route')),
          h('div',{class:'card-body tight'},
            (perf.byRoute&&perf.byRoute.length)? UI2.table({screen:'perf-route', pageSize:6, columns:[{key:'label',label:'Route'},{key:'issuedValue',label:'Issued',num:true,render:function(r){return fmt.money(r.issuedValue);}}], rows:perf.byRoute}) : smEmpty('No data')
          )
        ),
        h('div',{class:'card'},
          h('div',{class:'card-head'}, h('h3',null,'By Area')),
          h('div',{class:'card-body tight'},
            (perf.byArea&&perf.byArea.length)? UI2.table({screen:'perf-area', pageSize:6, columns:[{key:'label',label:'Area'},{key:'issuedValue',label:'Issued',num:true,render:function(r){return fmt.money(r.issuedValue);}}], rows:perf.byArea}) : smEmpty('No data')
          )
        )
      ));
    }

    /* ========================= MAIN DRAW ========================= */
    async function draw(){
      try{ if(smId && ctxChip){ ctxChip.textContent='👤 '+curSalesmanName(); ctxChip.style.display='inline-flex'; } }catch(e){}
      refreshKpi();
      if(tab==='issued') return drawIssued();
      if(tab==='stock') return drawStock();
      if(tab==='tours') return drawTours();
      if(tab==='alloc') return drawAlloc();
      if(tab==='sales') return drawSales();
      if(tab==='returns') return drawReturns();
      if(tab==='ledger') return drawLedger();
      if(tab==='perf') return drawPerf();
    }

    // init salesmen
    (async function init(){
      drawTabs();
      try{
        salesmen=await smCall('salesman.list',{},[]);
        if(!Array.isArray(salesmen)) salesmen=[];
        // also fallback to App.state.salesmen?
        selSm.innerHTML=''; selSm.appendChild(h('option',{value:''},'— Salesman select karein —'));
        salesmen.forEach(function(u){
          selSm.appendChild(h('option',{value:u.id}, u.name+' ('+u.role+')'));
        });
        // default pick first salesman or current user if salesman
        if(!smId){
          var me=App.state.session&&App.state.session.userId;
          var meIsSalesman=salesmen.some(function(x){return x.id===me;});
          if(meIsSalesman){ smId=me; selSm.value=me; }
          else if(salesmen.length){ smId=salesmen[0].id; selSm.value=smId; }
        }
        applyRoleLock();
        // reflect current salesman in chip
        try{ if(smId){ ctxChip.textContent='👤 '+curSalesmanName(); ctxChip.style.display='inline-flex'; }}catch(e){}
      }catch(e){ salesmen=[]; }
      draw();
    })();
  }
});
</script>
