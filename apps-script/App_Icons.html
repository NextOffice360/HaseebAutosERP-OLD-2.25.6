    '\uD83E\uDDEE': 'calc', '\uD83D\uDD22': 'hash', '\uD83D\uDD13': 'unlock',
    '\uD83D\uDC64': 'user', '\uD83C\uDFF7': 'tag', '\uD83C\uDFED': 'factory',
    '\uD83C\uDFEC': 'store', '\uD83C\uDFE6': 'bank', '\u23F3': 'clock',
    '\u26A0': 'alert',
    /* v2.10 — AI Agent screen */
    '\u2728': 'bot', '\uD83D\uDCAC': 'chat', '\uD83D\uDD27': 'wrench',
    '\uD83D\uDD11': 'lock', '\uD83D\uDDD1': 'trash', '\uD83D\uDCE1': 'upload',
    '\u26A1': 'zap',
    /* U+2795 = ➕ (heavy plus), U+1F4BC = 💼 (briefcase) */
    '\u2795': 'plus', '\uD83D\uDCBC': 'briefcase',
    /* aam amal */
    '\u21BB': 'refresh', '\u21A9': 'undo', '\u23F1': 'clock', '\u23F8': 'pause',
    '\u2696': 'scale', '\u26A1': 'zap', '\u2139': 'info', '\u0069': 'info',
    '\u270E': 'pencil', '\u2713': 'check', '\u2715': 'ban', '\u2796': 'chart',
    /* v2.14.1 — POS multi-select toolbar (☑ = U+2611 BALLOT BOX WITH CHECK) */
    '\u2611': 'check', '\u2610': 'clipboard',
    /* v2.24.0 — keyboard glyph (POS Help / shortcuts) bhi SVG ho jaye */
    '\u2328': 'tag',
    '\uD83C\uDF81': 'gift', '\uD83C\uDFAF': 'target', '\uD83C\uDFDB': 'bank',
    '\uD83C\uDFE0': 'home', '\uD83D\uDCB3': 'card', '\uD83D\uDCB8': 'coins',
    '\uD83D\uDCBE': 'save', '\uD83D\uDCC4': 'file', '\uD83D\uDCC9': 'trendDown',
    '\uD83D\uDCCB': 'clipboard', '\uD83D\uDCCD': 'target', '\uD83D\uDD0D': 'search',
    '\uD83D\uDD10': 'lock', '\uD83D\uDD14': 'bell', '\uD83D\uDD17': 'wrench',
    '\uD83D\uDCE4': 'upload', '\uD83D\uDCE5': 'download', '\uD83D\uDCF2': 'phone',
    '\uD83D\uDD04': 'refresh', '\uD83D\uDD01': 'refresh', '\uD83D\uDD53': 'clock',
    '\uD83D\uDDA8': 'printer', '\uD83D\uDDBC': 'file', '\uD83D\uDDC2': 'archive',
    '\uD83D\uDDC3': 'files', '\uD83D\uDDC4': 'archive', '\uD83D\uDDD1': 'trash',
    '\uD83D\uDEAB': 'ban', '\uD83D\uDEE0': 'wrench', '\uD83E\uDD1D': 'users',
    '\uD83E\uDDE9': 'puzzle', '\uD83E\uDDF9': 'trash', '\uD83D\uDC41': 'eye',
    '\uD83D\uDCDD': 'edit', '\u2191': 'arrowUp', '\u2193': 'arrowDown',
    '\u2194': 'refresh', '\u26D4': 'ban', '\u2728': 'zap',
    '\uD83E\uDD16': 'bot', '\u25B8': 'chevron', '\u2B50': 'star', '\uD83C\uDF1F': 'star',
    '\uD83D\uDCAC': 'chat', '\uD83D\uDCF7': 'camera', '\uD83D\uDD00': 'shuffle',
    '\uD83D\uDCD6': 'bookOpen', '\uD83D\uDCDA': 'books',
    '\uD83D\uDD58': 'clock', '\u267B': 'recycle', '\uD83D\uDD12': 'lock',
    '\uD83D\uDCD1': 'bookmark', '\uD83D\uDDFA': 'map'
  };

  function svg(name, size, color) {
    var d = P[name];
    if (!d) return '';
    var s = size || 24;
    return '<svg class="ha-ico" viewBox="0 0 24 24" width="' + s + '" height="' + s +
      '" fill="none" stroke="' + (color || 'currentColor') +
      '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ' +
      'aria-hidden="true" focusable="false">' + d + '</svg>';
  }

  /* screen id ya emoji se icon — na mile to PURANA emoji wapas (kuch delete nahi) */
  function forScreen(id, emoji, size) {
    var n = BY_SCREEN[id] || BY_EMOJI[emoji];
    return n ? svg(n, size || 24) : (emoji || '▸');
  }

  /* ---- global helpers ----
     Ye DONO yahan is liye hain ke App_Icons.html sab se PEHLE load hoti hai.
     Agar inhen App_Core/App_UI2 me rakha to load-order ke sabab
     "tabIcon is not defined" aata hai aur poora app mar jata hai. */
  function kpiIcon(emoji, size) {
    try {
      var n = BY_EMOJI[emoji];
      if (n) return svg(n, size || 28);
    } catch (e) { }
    return String(emoji == null ? '' : emoji);
  }
  function tabIcon(emoji, size) {
    try {
      var n = BY_EMOJI[emoji];
      if (n) return svg(n, size || 20);
    } catch (e) { }
    return String(emoji == null ? '' : emoji);
  }
  /* ======================================================================
     INLINE ICON UPGRADE — buttons / headings (v2.6 QA)
     ----------------------------------------------------------------------
     Buttons aise bante hain:  h('button', ..., '⏸ Hold')
     yani emoji TEXT ke andar hai. Har jagah ja kar badalna mumkin nahi
     (1000+ jagah). Is liye render ke BAAD DOM par aik pass chalate hain:
     shuru ka emoji nikal kar uski jagah SVG rakh dete hain.

     Surakshit is liye hai ke:
       • sirf pehla text-node badalta hai (baqi HTML ko haath nahi lagaya)
       • jis emoji ka icon library me na ho, woh WAISA HI rehta hai
       • element khali ho jaye to kuch nahi bigarta
     ====================================================================== */
  var EMOJI_RE = null;
  try { EMOJI_RE = new RegExp('^(\\p{Extended_Pictographic}(?:\\u200D\\p{Extended_Pictographic}|\\uFE0F)*)\\s*', 'u'); } catch (e) { EMOJI_RE = null; }

  function leadingEmoji(txt) {
    if (!EMOJI_RE || !txt) return null;
    var m = txt.match(EMOJI_RE);
    return m ? m[1] : null;
  }

  /** aik element ke shuru ke emoji ko SVG se badlo */
  function upgradeOne(el, size) {
    if (!el || el.dataset.icoDone === '1') return false;
    var first = el.firstChild;
    if (!first || first.nodeType !== 3) return false;      /* sirf text node */
    var txt = first.nodeValue || '';
    var em = leadingEmoji(txt);
    if (!em) return false;
    var name = BY_EMOJI[em];
    if (!name) return false;                                /* mapping nahi → chhor do */
    var span = document.createElement('span');
    span.className = 'bi';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML = svg(name, size || 18);
    el.insertBefore(span, first);
    first.nodeValue = txt.slice(em.length).replace(/^\s+/, '');
    el.dataset.icoDone = '1';
    return true;
  }

  /** poori branch par chalao */
  var UPGRADE_SEL = '.btn, .sec-head h4, .card-head h3, .card-head h4, .page-head h2, .empty .big';
  function upgrade(root) {
    if (!root || !root.querySelectorAll) return 0;
    var n = 0, list;
    try { list = root.querySelectorAll(UPGRADE_SEL); } catch (e) { return 0; }
    for (var i = 0; i < list.length; i++) {
      var el = list[i];
      var size = el.classList && el.classList.contains('btn') ? 18 : 20;
      try { if (upgradeOne(el, size)) n++; } catch (e) { /* aik element fail ho to baqi chalte rahein */ }
    }
    return n;
  }

  /* har screen render ke baad khud chal jaye (async render bhi cover ho) */
  var upTimer = null;
  function upgradeSoon(root) {
    if (upTimer) clearTimeout(upTimer);
    upTimer = setTimeout(function () {
      upTimer = null;
      try { upgrade(root || document.getElementById('view') || document.body); } catch (e) { }
    }, 60);
  }
  function watch(root) {
    try {
      if (!window.MutationObserver) return;
      var t = null;
      new MutationObserver(function () {
        if (t) clearTimeout(t);
        t = setTimeout(function () {
          try { upgrade(root); } catch (e) { }
        }, 120);
      }).observe(root, { childList: true, subtree: true });
    } catch (e) { }
  }

  window.upgradeIcons = upgrade;
  window.upgradeIconsSoon = upgradeSoon;

  window.kpiIcon = kpiIcon;
  window.tabIcon = tabIcon;

  window.HA_ICONS = {
    paths: P, byScreen: BY_SCREEN, byEmoji: BY_EMOJI,
    svg: svg, get: svg, forScreen: forScreen, kpiIcon: kpiIcon, tabIcon: tabIcon,
    upgrade: upgrade, upgradeSoon: upgradeSoon, watch: watch,
    has: function (id) { return !!BY_SCREEN[id]; },
    count: Object.keys(P).length,
    screens: Object.keys(BY_SCREEN).length
  };
})();
</script>
